groups:
  - name: ファイルの種類
    items:
      - en: Slot
        desc: どのプロジェクトにもある問いに、決まった形で答えるファイル（Slot ファイル）。docv が問いと形を決める。`docv/` に `<まとまり>/<ID>.<拡張子>` の名前で置く。16 の Slot がある
      - en: Free
        desc: プロジェクトが問いと形を決める Markdown のファイル（Free ファイル）。AI Agent が読み書きし、詳細を記録する。`docs/` に置き、`docv.yaml` の `docs` に当てはまるファイル
      - en: ADR
        desc: 決めたこと 1 つを、背景、選ばなかった案と一緒に残す記録。`docv/adr/` に 1 つの Markdown で置き、決めた後は書き換えない
  - name: ファイルの分類
    items:
      - ja: 管理対象
        desc: "`docv.yaml` の `docs` に当てはまる Markdown。YAML front matter に `mission` が要り、check の対象になる"
      - ja: 管理外
        desc: "`docs` にも `ignore` にも当てはまらない Markdown。docv は中身を見ない"
  - name: 書き方
    items:
      - ja: ミッション
        en: Mission
        desc: Free ファイルが答えること。YAML front matter に 1 文で書き、中身をその答えだけにする
      - ja: タグ
        en: Tags
        desc: Free ファイルに付ける分類。1 つのファイルに任意の数を付けられ、タグにルールを付けられる
      - ja: 埋め込み
        en: Include
        desc: Slot に、既にある Markdown のファイルや章を埋め込む指定。Slot の項目の名前は `include`。Free ファイルの中身を 1 か所に保ったまま Slot に載せられる
