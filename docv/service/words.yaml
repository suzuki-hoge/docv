groups:
  - name: ファイルの種類
    items:
      - en: Slot
        desc: どのプロジェクトにも要るドキュメントを書くファイル（Slot ファイル）。docv がミッションと形を決める。`docv/` に `<まとまり>/<ID>.<拡張子>` の名前で置く。17 の Slot がある
      - en: Free
        desc: プロジェクトがミッションと形を決める Markdown のファイル（Free ファイル）。AI Agent が読み書きし、詳細を記録する。`docs/` に置き、`docv.yaml` の `docs` に当てはまるファイル
      - en: ADR
        desc: 決めたこと 1 つを、背景、選ばなかった案と一緒に残す記録。`docv/adr/` に 1 つの Markdown で置き、決めた後は書き換えない
  - name: 決まりの種類
    items:
      - ja: ルール
        en: Rule
        desc: docv の仕組みが決める決まり。Slot と `docv.yaml` のスキーマ、YAML front matter の key、check が確かめることなど。利用側は変えられず、`docv desc` と `docv slot schema` で見る
      - ja: ガイドライン
        en: Guideline
        desc: 利用側がドキュメントを書くときの方針。調整の余地があり、利用側が自由に直す。Slot の Doc ガイドに書き、`docv slot gen doc-guide` で雛形を作る
      - ja: 設定
        en: Config
        desc: "`docv.yaml` で切り替えること。check のルールや textlint を使うか、出力を git で管理するかなど。`docv init --print` で見る"
  - name: ファイルの分類
    items:
      - ja: 管理対象
        desc: "`docv.yaml` の `docs` に当てはまる Markdown。YAML front matter に `mission` が要り、check の対象になる"
      - ja: 管理外
        desc: "`docs` にも `ignore` にも当てはまらない Markdown。docv は中身を見ない"
  - name: 書き方
    items:
      - ja: ミッション
        en: Mission
        desc: そのファイルを読むと何が分かるか。Slot のミッションは docv が決め、Free ファイルのミッションは YAML front matter の `mission` に 1 文で書く。中身は、ミッションに収まることだけにする
      - ja: タグ
        en: Tags
        desc: Free ファイルに付ける分類。1 つのファイルに任意の数を付けられ、タグにルールを付けられる
      - ja: 埋め込み
        en: Include
        desc: Slot に、既にある Markdown のファイルや章を埋め込む指定。Slot の項目の名前は `include`。Free ファイルの中身を 1 か所に保ったまま Slot に載せられる
