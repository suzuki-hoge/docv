# yaml-language-server: $schema=../../assets/schema/words.schema.json
groups:
  - name: ファイルの種類
    items:
      - en: Slot
        desc_markdown: |
          どのプロジェクトにも要るドキュメントを書くファイル（Slot ファイル）。docv がミッションと形を決める。`docv/` に `<まとまり>/<ID>.<拡張子>` の名前で置く。18 の Slot がある
      - en: Free
        desc_markdown: |
          プロジェクトがミッションと形を決める Markdown のファイル（Free ファイル）。AI Agent が読み書きし、詳細を記録する。`docv.yaml` の `dir.free` のディレクトリ（既定は `docs/`）に置く
      - en: ADR
        desc_markdown: |
          決めたこと 1 つを、背景、選ばなかった案と一緒に残す記録。`docv/adr/` に 1 つの Markdown で置き、決めた後は書き換えない
  - name: 決まりの種類
    items:
      - ja: ルール
        en: Rule
        desc_markdown: |
          docv の仕組みが決める決まり。Slot と `docv.yaml` のスキーマ、YAML front matter の key、check が確かめることなど。利用側は変えられず、`docv desc` と `docv slot schema` で見る
      - ja: ガイドライン
        en: Guideline
        desc_markdown: |
          利用側がドキュメントを書くときの方針。調整の余地があり、利用側が自由に直す。Slot の Doc ガイドに書き、`docv slot gen doc-guide` で雛形を作る
      - ja: 設定
        en: Config
        desc_markdown: |
          `docv.yaml` で切り替えること。check のルールや textlint を使うか、出力を git で管理するかなど。`docv init --print` で見る
  - name: ファイルの分類
    items:
      - ja: 管理対象
        desc_markdown: |
          `docv.yaml` の `dir.free` のディレクトリの下の Markdown。YAML front matter に `mission` が要り、check の対象になる
      - ja: 管理外
        desc_markdown: |
          `dir.free` の外にあり、`ignore` にも当てはまらない Markdown。docv は中身を見ない
  - name: 書き方
    items:
      - ja: ミッション
        en: Mission
        desc_markdown: |
          そのファイルを読むと何が分かるか。Slot のミッションは docv が決め、Free ファイルのミッションは YAML front matter の `mission` に 1 文で書く。中身は、ミッションに収まることだけにする
      - ja: タグ
        en: Tags
        desc_markdown: |
          Free ファイルに付ける分類。1 つのファイルに任意の数を付けられ、タグにルールを付けられる
