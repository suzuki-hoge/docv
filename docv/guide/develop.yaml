steps:
  - id: check-code
    name: コミットの前にコードを確かめる
    items:
      markdown: |
        ```sh
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
        cargo test
        ```
  - id: check-docs
    name: ドキュメントを変えたら確かめる
    items:
      markdown: |
        ```sh
        ./target/release/docv fix
        ./target/release/docv check
        ```

        Node.js がないときは、`--no-textlint` を付ける。
  - id: build
    name: HTML と JPG を作って見る
    items:
      markdown: |
        `docv.yaml` の `dir.html` で、HTML を `output/docv/html/` に出す。`dir.image` で JPG を `output/docv/image/` に出すので、Chrome が要る。`output/` は `.gitignore` に入れてあり、コミットしない。

        ```sh
        ./target/release/docv build
        ```
