# yaml-language-server: $schema=../../assets/schema/directory-tree.schema.json
entries:
  - path: docv.yaml
    desc_markdown: |
      このリポジトリの docv の設定
  - path: src/
    desc_markdown: |
      CLI のソースコード。コマンドごとにファイルを分ける
  - path: assets/
    desc_markdown: |
      実装から参照して出力するもの。バイナリに埋め込む
  - path: assets/template/
    desc_markdown: |
      docv slot gen が書く Slot のテンプレ（YAML の Slot の項目のサンプルと、ドキュメントのガイドラインの雛形）
  - path: assets/schema/
    desc_markdown: |
      YAML の Slot と `docv.yaml` の JSON Schema。`docv slot schema` で出す。公開して、エディタの補完に使う
  - path: assets/desc.md
    desc_markdown: |
      docv desc が出す docv の概要。Slot のサービス仕様と同じファイル
  - path: assets/style.css
    desc_markdown: |
      HTML の CSS
  - path: assets/search.js
    desc_markdown: |
      HTML の検索のページの JS
  - path: docs/
    desc_markdown: |
      このリポジトリのドキュメント。docv 自身で管理する
  - path: docv/
    desc_markdown: |
      このリポジトリの Slot ファイル
  - path: docv/adr/
    desc_markdown: |
      決めた経緯（ADR）
  - path: docs/spec/
    desc_markdown: |
      docv のルールの詳細（Slot、Free ファイル、ADR、`docv.yaml`）
  - path: docs/schema/
    desc_markdown: |
      `docv.yaml` と YAML の Slot のスキーマの写し。HTML で公開する
