# yaml-language-server: $schema=../../assets/schema/directory-tree.schema.json
entries:
  - path: docv.yaml
    desc_markdown: |
      このリポジトリの docv の設定
  - path: docv-index.md
    desc_markdown: |
      docv build が書くインデックス。GitHub で Slot ファイルと JPG を辿る入り口で、README からリンクする
  - path: src/
    desc_markdown: |
      CLI のソースコード。コマンドごとにファイルを分ける
  - path: assets/
    desc_markdown: |
      実装から参照して出力するもの。バイナリに埋め込む
  - path: assets/template/
    desc_markdown: |
      docv slot gen が書く Slot のテンプレ（YAML の Slot の項目のサンプルと、ドキュメントのガイドラインの雛形）
  - path: assets/schema/
    desc_markdown: |
      YAML の Slot と `docv.yaml` の JSON Schema。`docv slot schema` で出す。公開して、エディタの補完に使う
  - path: assets/desc.md
    desc_markdown: |
      docv desc が出す docv の概要。Slot のサービス仕様の 1 ページ目と同じファイル
  - path: assets/docv.css
    desc_markdown: |
      HTML の CSS。build が出力先の直下に書き、すべてのページが読む
  - path: assets/update-guide.yaml
    desc_markdown: |
      docv update-guide が出す、版ごとの変更点と対応。版を上げるときに、その版の分を足す
  - path: assets/docv.js
    desc_markdown: |
      HTML の JS（パスのコピー、決定のページのカーソルキーでの移動、タグのトグル、検索）。build が出力先の直下に書き、すべてのページが読む
  - path: docs/
    desc_markdown: |
      このリポジトリの Free ファイル（スキーマの写し）と図。docv 自身で管理する
  - path: docv/
    desc_markdown: |
      このリポジトリの Slot ファイル
  - path: docv/adr/
    desc_markdown: |
      技術の決定の経緯（ADR）
  - path: docv/pdr/
    desc_markdown: |
      docv の機能と決まりの変更の経緯（PDR）
  - path: docs/schema/
    desc_markdown: |
      `docv.yaml` と YAML の Slot のスキーマの写し。HTML で公開する
  - path: docs/figure/
    desc_markdown: |
      ドキュメントに載せる図（SVG）。`docv/` には Slot のほかのファイルを置けないので、ここに置く
  - path: output/
    desc_markdown: |
      docv build の出力（HTML と JPG）。コミットする
