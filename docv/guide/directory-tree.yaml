entries:
  - path: docv.yaml
    description: このリポジトリの docv の設定
  - path: src/
    description: CLI のソースコード。コマンドごとにファイルを分ける
  - path: templates/
    description: docv add が YAML の Slot に書くサンプル。バイナリに埋め込む
  - path: templates/slot/
    description: Slot のテンプレ
  - path: assets/
    description: HTML の CSS、docv desc が出す docv の概要（Slot のサービス仕様と同じファイル）、YAML の Slot のスキーマ。バイナリに埋め込む
  - path: assets/schema/
    description: YAML の Slot のスキーマ。`docv schema <slot>` で出す
  - path: schema/
    description: "`docv.yaml` の JSON Schema。公開して、エディタの補完に使う"
  - path: docs/
    description: このリポジトリのドキュメント。docv 自身で管理する
  - path: docv/
    description: このリポジトリの Slot ファイル
  - path: docv/adr/
    description: 決めた経緯（ADR）
  - path: docs/spec/
    description: docv の規格の詳細（Slot、ADR、`docv.yaml`）
  - path: docs/schema/
    description: "`docv.yaml` と YAML の Slot のスキーマの写し。HTML で公開する"
  - path: docs/rule/
    description: このリポジトリのドキュメントの書式
  - path: docs/rule/docs/guideline.md
    description: Free ファイルの書き方
  - path: docs/fixme/
    description: まだ決まっていないこと
