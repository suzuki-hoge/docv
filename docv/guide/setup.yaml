requirements:
  - name: Rust
    version: stable（2024 edition が使えるもの）
    purpose: ビルドとテスト
    url: https://rustup.rs/
  - name: Node.js
    purpose: make fix で textlint をかける
  - name: Google Chrome
    purpose: make fix で JPG を作る
steps:
  - id: install
    name: ビルドして手元に入れる
    items:
      markdown: |
        ```sh
        make install
        ```

        このリポジトリのドキュメントは docv 自身で管理している。コードかドキュメントを変えたら、開発コマンドの `make fix` で確かめる。
