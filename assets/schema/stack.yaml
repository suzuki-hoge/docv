$schema: https://json-schema.org/draft/2020-12/schema
title: 技術スタック（system/stack.yaml）
description: 何で作られているか
type: object
additionalProperties: false
properties:
  stack:
    description: 層の配列。書いた順に出す
    type: array
    items:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group:
          description: 層の名前（フロントエンド、バックエンドなど）
          type: string
        image:
          description: 図の、ルートからの相対パス。あれば出す
          type: string
        items:
          description: 使っているものの配列
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                description: 名前
                type: string
              version:
                description: 版
                type: string
              purpose:
                description: 何に使うか
                type: string
              url:
                description: 詳しく書いてあるページの URL
                type: string
  body:
    description: Slot のページの最後に出す Markdown
    type: string
  include:
    description: ページに埋め込む Markdown の、ルートからの相対パスの配列。`パス` はファイル全体を（YAML front matter と h1 を除く）、`パス#見出し` はその見出しの章を埋め込む
    type: array
    items:
      type: string
