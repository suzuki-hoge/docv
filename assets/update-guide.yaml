# docv update-guide が出す、版ごとの変更点と対応。新しい版を先頭に書く
# 版を上げるときに、その版の変更点を足す。対応のない版も書く
# change は何が変わったか、action はそれへの対応。対応は、要る（〜する）、選ぶ（〜なら〜できる）、要らない（対応は要らない）のどれかで書く
# docv update-guide が出す 1 行（「- change: action」）は 100 文字以内にする。収まらなければ、変更を分ける。cargo test で確かめる

- version: 2.1.0
  changes:
    - change: ディレクトリの Slot（guide/directory-tree.yaml）を廃止
      action: 残したい決まりは設計・実装（guide/design.md）に移し、ファイルを消す
    - change: 開発者向けガイドに、アーキテクチャ、設計・実装、テスト方針の Slot を追加
      action: ミッションに当たる Free ファイルがあるなら、Slot に移せる
    - change: サービスと開発者向けガイドの Slot の並びを変更
      action: 対応は要らない
    - change: システム仕様のミッションを変更（部品をまたいで守る決まりは、アーキテクチャへ）
      action: docv check の slot-mission に従い、mission を書き換える
    - change: インストールと技術スタックのミッションの文を変更
      action: 対応は要らない
    - change: ページに分けられる Slot のカードに、ページの数を出すように変更
      action: 対応は要らない
    - change: Slot のページに、Slot のミッションを出すように変更
      action: 対応は要らない
    - change: Doc ガイドの雛形の言葉の使い分けに、アーキテクチャと実装の決まりを追加
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ

- version: 2.0.0
  changes:
    - change: dir の項目を、dir.document_root（既定 docv）と dir.output（既定 output/docv）に変更
      action: 古い dir の項目を消す
    - change: Free ファイルを document_root/free/ に置くように変更
      action: git mv で移し、docv check の link-broken に従ってリンクを直す
    - change: Slot ファイルを document_root/slot/ に置くように変更
      action: git mv で移し、docv check の link-broken に従ってリンクとシンボリックリンクを直す
    - change: ADR と PDR を document_root/adr/ と document_root/pdr/ に置くように変更
      action: 古い dir.slot と違えば、git mv で移す
    - change: document_root の直下に、決まったもの以外を置くと error（root-unknown）に変更
      action: free/ などに移すか、docv_exclude に書く
    - change: dir.output を document_root の中に置けないように変更
      action: document_root の外にする。古い出力先が残っていれば消す
    - change: インデックスを document_root/README.md に変更し、build のたびに作る
      action: docv-index.md を消し、ルートの README などからのリンクを直す
    - change: JPG を作るかを、dir.image ではなく generate.image で決めるように変更
      action: dir.image を書いていたなら、generate.image に true を書く
    - change: ignore を docv_exclude に名前を変更
      action: 書き換え、移したファイルのパスに合わせて glob を直す
    - change: 画像に同じディレクトリの持ち主がなければ error（image-owner）に変更
      action: 使うファイルの隣に、{使うファイルの名前}_{画像の名前}.{拡張子} の名前で移す
    - change: ADR と PDR から外の画像を参照すると error（adr-image、pdr-image）に変更
      action: adr/ か pdr/ に写しを置いて参照を直す
    - change: HTML の左のサイドバーの一番下に、作った docv の版を出すように変更
      action: 対応は要らない
    - change: HTML のサイドバーとトップのページの名前を変え、Index のページを追加
      action: 対応は要らない

- version: 1.8.0
  changes:
    - change: docv update-guide を追加
      action: docv を更新したら、docv check の案内に従い、docv update-guide で変更点と対応を確かめる
    - change: docv.yaml に docv_version を追加し、docv の版と違えば docv check の error にするように変更
      action: 下の案内に従って、docv_version を書く
    - change: docv.yaml と YAML の Slot の 1 行目にあるスキーマの URL の版を、docv check で確かめるように変更
      action: 下の案内に従って、URL の版を上げる

- version: 1.7.0
  changes:
    - change: PDR の選ばなかった案を任意に変更
      action: 案を比べずに決めた変更も、PDR に残せる。すでにある PDR の対応は要らない
    - change: Doc ガイドの雛形に、ADR と PDR に書くものと書かないものを追加
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ

- version: 1.6.0
  changes:
    - change: PDR を追加
      action: プロダクトやサービスの仕様の変更を、docv/pdr/ に残せる。ADR に仕様の変更を書いていれば、PDR に移すかを選ぶ
    - change: ADR の本文の章に、決めないことと参考を追加
      action: これから書く ADR は、docv desc の「ADR」の章立てに従う。章は check で確かめないので、すでにある ADR は直さなくてよい
    - change: Doc ガイドの雛形に、ADR と PDR の作成基準を追加
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ

- version: 1.5.0
  changes:
    - change: 開発コマンドとインフラと環境のページ分けを追加
      action: 長いなら、docv desc の「ページ分け」に従って分けられる。開発コマンドのページには order と title を書く
    - change: HTML の CSS と JS を、出力先の docv.css と docv.js に分けるように変更
      action: 出力を git で管理しているなら、増えた 2 つのファイルもコミットする
    - change: インストールと環境構築の手順を、h3 の見出しで出すように変更
      action: 対応は要らない
    - change: 分けたページの order と h1 の重なりを、同じ Slot のページどうしでだけ確かめるように変更
      action: 対応は要らない
    - change: Doc ガイドの雛形で、ページに分けられる Slot を更新
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ

- version: 1.4.0
  changes:
    - change: 出力する HTML と JPG のファイルの名前から、空白を除くように変更
      action: README などから出力にリンクしていれば直す。docv-index.md は docv build で作り直される
    - change: HTML のデザインを調整
      action: 対応は要らない

- version: 1.3.0
  changes:
    - change: docv.yaml に dir.index を追加
      action: GitHub で Slot ファイルを読ませたいなら . を書く。YAML の Slot には dir.image も要る
    - change: ルートの README.md を、HTML のサイドバーの先頭に置くように変更
      action: 対応は要らない

