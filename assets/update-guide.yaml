# docv update-guide が出す、版ごとの変更点と対応。新しい版を先頭に書く
# 版を上げるときに、その版の変更点を足す。対応のない版も書く
# change は何が変わったか、action はそれへの対応。対応は、要る（〜する）、選ぶ（〜なら〜できる）、要らない（対応は要らない）のどれかで書く
# docv update-guide が出す 1 行（「- change: action」）は 100 文字以内にする。収まらなければ、変更を分ける。cargo test で確かめる

- version: 1.8.0
  changes:
    - change: docv update-guide を追加
      action: docv を更新したら、docv check の案内に従い、docv update-guide で変更点と対応を確かめる
    - change: docv.yaml に docv_version を追加し、docv の版と違えば docv check の error にするように変更
      action: 下の案内に従って、docv_version を書く
    - change: docv.yaml と YAML の Slot の 1 行目にあるスキーマの URL の版を、docv check で確かめるように変更
      action: 下の案内に従って、URL の版を上げる

- version: 1.7.0
  changes:
    - change: PDR の選ばなかった案を任意に変更
      action: 案を比べずに決めた変更も、PDR に残せる。すでにある PDR の対応は要らない
    - change: Doc ガイドの雛形に、ADR と PDR に書くものと書かないものを追加
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ

- version: 1.6.0
  changes:
    - change: PDR を追加
      action: プロダクトやサービスの仕様の変更を、docv/pdr/ に残せる。ADR に仕様の変更を書いていれば、PDR に移すかを選ぶ
    - change: ADR の本文の章に、決めないことと参考を追加
      action: これから書く ADR は、docv desc の「ADR」の章立てに従う。章は check で確かめないので、すでにある ADR は直さなくてよい
    - change: Doc ガイドの雛形に、ADR と PDR の作成基準を追加
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ

- version: 1.5.0
  changes:
    - change: 開発コマンドとインフラと環境のページ分けを追加
      action: 長いなら、docv desc の「ページ分け」に従って分けられる。開発コマンドのページには order と title を書く
    - change: HTML の CSS と JS を、出力先の docv.css と docv.js に分けるように変更
      action: 出力を git で管理しているなら、増えた 2 つのファイルもコミットする
    - change: インストールと環境構築の手順を、h3 の見出しで出すように変更
      action: 対応は要らない
    - change: 分けたページの order と h1 の重なりを、同じ Slot のページどうしでだけ確かめるように変更
      action: 対応は要らない
    - change: Doc ガイドの雛形で、ページに分けられる Slot を更新
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ

- version: 1.4.0
  changes:
    - change: 出力する HTML と JPG のファイルの名前から、空白を除くように変更
      action: README などから出力にリンクしていれば直す。docv-index.md は docv build で作り直される
    - change: HTML のデザインを調整
      action: 対応は要らない

- version: 1.3.0
  changes:
    - change: docv.yaml に dir.index を追加
      action: GitHub で Slot ファイルを読ませたいなら . を書く。YAML の Slot には dir.image も要る
    - change: ルートの README.md を、HTML のサイドバーの先頭に置くように変更
      action: 対応は要らない

- version: 1.2.1
  changes:
    - change: docv desc のコマンドとスキーマの章を、確かめ方の案内だけに変更
      action: 対応は要らない
    - change: Doc ガイドの雛形に、Slot に当たる内容を Free ファイルに置かない案内を追加
      action: docv slot gen doc-guide --print と見比べ、取り入れるものを選ぶ

- version: 1.2.0
  changes:
    - change: Slot のまとまりの名前を、サービスとシステムに変更
      action: HTML と JPG のパスが変わる（サービス仕様/ がサービス/ に）。README などから出力にリンクしていれば直す
    - change: システム概要の Slot（system-overview）を追加
      action: システム仕様に全体像を書いていれば、docv slot gen system-overview で作って移す
    - change: システム仕様のミッションを変更
      action: docv check の slot-mission の指摘に従い、システム仕様の mission を直す
    - change: システム仕様のページ分けを追加
      action: システム仕様が長いなら、docv desc の「ページ分け」に従って分けられる
    - change: Doc ガイドの雛形に、サービス説明の言葉とページの分け方を追加
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ

- version: 1.1.1
  changes:
    - change: md の Slot の YAML front matter の mission を必須に変更
      action: docv check の slot-mission の指摘に従い、mission を書く
    - change: Doc ガイドの雛形に、言葉の使い分けを追加
      action: docv slot gen doc-guide --print と今の Doc ガイドを見比べ、取り入れるものを選ぶ
    - change: 本文にそのまま書いた URL を、HTML でリンクにするように変更
      action: 対応は要らない
    - change: 目次のないページにも、目次の幅を空けるように変更
      action: 対応は要らない

- version: 1.1.0
  changes:
    - change: docv open を追加
      action: build した HTML を、docv open でブラウザで開ける
    - change: サービス概要の Slot（overview）を追加
      action: サービス仕様にサービスの説明を書いていれば、docv slot gen overview で作って移す
    - change: サービス仕様のページ分けを追加
      action: サービス仕様が長いなら、docv desc の「ページ分け」に従って分けられる

- version: 1.0.1
  changes:
    - change: docv.yaml の dir.slots を dir.slot に変更
      action: dir.slots を書いていれば、dir.slot に直す
    - change: dir.html の既定を output/docv/html に変更
      action: 書いていなければ出力先が変わる。古い docv/build を消し、.gitignore を直す
    - change: dir の 4 つのディレクトリを、互いに重ねられないように変更
      action: docv.yaml のエラーになったら、ディレクトリを互いに離す
    - change: YAML の Slot の body と include を削除
      action: 書いていれば、短い補足は appendix_markdown に移し、長い文章は Free ファイルに移してリンクする
    - change: YAML の Slot の Markdown の項目を、_markdown で終わる名前に変更（desc を desc_markdown に）
      action: 名前を直し、値を | のブロックで書く
    - change: YAML の Slot に appendix_markdown を追加
      action: 項目に収まらない短い補足を、Slot の中に書ける
    - change: md の Slot と ADR にも、Free ファイルと同じ検査をかけるように変更
      action: docv check の指摘（リンク切れ、見出しの章番号、書式）を直す
    - change: リンクの表示文字の規則を削除
      action: 対応は要らない
    - change: check にパスを渡しても、かける検査を変えないように変更
      action: 対応は要らない
    - change: HTML に検索のページを追加
      action: 対応は要らない
