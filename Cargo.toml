[package]
name = "docv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
jsonschema = { version = "0.58.6", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
serde_yaml_ng = "0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
