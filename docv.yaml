# yaml-language-server: $schema=./schema/docv.schema.json
title: docv

docs:
  - docs/**/*.md

ignore:
  - docs/tmp/**
  - docs/plan/**
  - templates/**
  - assets/**
  - CLAUDE.md
  - tmp/**

tags: [仕様, 規約, 未決, ルール, 設定, 出力]

slots:
  dir: docv

output:
  dir: tmp/html
  commit: false

lint:
  tags:
    仕様: [no-past-wording]
    規約: [no-past-wording]
  style:
    bold: deny
    dollar: deny
    heading_number: require
    section_separator: require
    link_text: { base: docs }
  textlint:
    enabled: true
    presets: [ja-technical-writing, ja-spacing]
    rules:
      ja-technical-writing/no-exclamation-question-mark: false
      ja-spacing/ja-space-between-half-and-full-width: { space: always }
      ja-spacing/ja-space-around-code: { before: true, after: true }
      ja-spacing/ja-space-around-link: { before: true, after: true }
      ja-spacing/ja-no-space-around-slash: false

format:
  enabled: true
