# yaml-language-server: $schema=./assets/schema/docv.schema.json
title: docv

dir:
  free: docs
  slot: docv
  html: output/docv/html
  image: output/docv/image

ignore:
  - docs/tmp/**
  - docs/plan/**

tags:
  - name: 仕様
    color: blue
  - name: ルール
    color: green
  - name: 設定
    color: yellow
  - name: 出力
    color: purple

lint:
  bold: deny
  italic: deny
  dollar: deny
  textlint: enable

format:
  enabled: true
