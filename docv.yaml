# yaml-language-server: $schema=./assets/schema/docv.schema.json
docv_version: 2.1.0
title: docv

dir:
  document_root: docv
  output: output/docv

docv_exclude:
  - docv/free/tmp/**
  - docv/free/plan/**

generate:
  image: true

tags:
  - name: スキーマ
    color: blue

lint:
  bold: deny
  italic: deny
  dollar: deny
  textlint: enable

format:
  enabled: true
