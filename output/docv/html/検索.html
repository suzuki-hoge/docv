<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検索 - docv</title>
<style>
/* docv build の HTML の見た目。中身を読めることだけを考え、飾らない。 */

body { margin: 0; color: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; line-height: 1.7; }
body { display: flex; align-items: flex-start; }
main { flex: 1; min-width: 0; max-width: 1040px; margin: 0 auto; padding: 32px 40px 80px; }
/* トップの 5 ページを行き来するサイドバー。印刷の表示（JPG）では出さない */
.sidebar { position: sticky; top: 0; flex: none; width: 200px; height: 100vh; box-sizing: border-box; padding: 32px 16px; border-right: 1px solid #d8dee4; background: #f6f8fa; }
.sidebar .project { margin: 0 0 12px; font-weight: 600; }
.sidebar ul { list-style: none; margin: 0; padding: 0; }
.sidebar a { display: block; padding: 4px 10px; border-radius: 6px; color: #1f2328; }
.sidebar a:hover { color: #0b6bcb; }
.sidebar a[aria-current="page"] { background: #fff; color: #0b6bcb; font-weight: 600; }
@media (max-width: 760px) {
  body { display: block; }
  .sidebar { position: static; width: auto; height: auto; padding: 12px 16px; border-right: none; border-bottom: 1px solid #d8dee4; }
  .sidebar ul { display: flex; gap: 8px; }
}
/* 右の目次。見出しのないページにも同じ幅の空の枠を置き、ページを移っても本文の位置を変えない。幅が足りないときと、印刷の表示では出さない */
.outline { position: sticky; top: 0; flex: none; width: 220px; max-height: 100vh; overflow-y: auto; box-sizing: border-box; padding: 32px 16px; font-size: 0.85em; }
.outline .outline-title { margin: 0 0 8px; font-weight: 600; color: #656d76; }
.outline ul { list-style: none; margin: 0; padding: 0 0 0 10px; border-left: 1px solid #d8dee4; }
.outline li { margin: 4px 0; }
.outline li.h3 { padding-left: 1em; }
.outline a { color: #3d444d; }
.outline a:hover { color: #0b6bcb; }
@media (max-width: 1200px) { .outline { display: none; } }
@media print { body { display: block; } .sidebar, .outline { display: none; } }
a { color: #0b6bcb; text-decoration: none; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
:not(pre) > code { background: #f6f8fa; padding: 0.1em 0.3em; border-radius: 4px; }
pre { background: #f6f8fa; padding: 10px 12px; border-radius: 6px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 0.93em; }
th, td { border: 1px solid #d8dee4; padding: 5px 9px; text-align: left; vertical-align: top; }
th { background: #f6f8fa; white-space: nowrap; }
td code { white-space: nowrap; }
img { max-width: 100%; }

h1 { font-size: 2em; margin: 0 0 8px; }
h2.group { font-size: 1.5em; margin: 28px 0 0; padding-bottom: 4px; border-bottom: 2px solid #1f2328; }
main > h2.group:first-child { margin-top: 0; }
h3 { font-size: 1.25em; margin: 32px 0 0; padding-bottom: 2px; border-bottom: 1px solid #d8dee4; }
h4 { font-size: 1.02em; margin: 20px 0 4px; }
/* index.html の Slot のカード。まとまりの中で横に並べる。幅は名前の 7 文字が収まる固定で、はみ出たら横にスクロールする */
.cards { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 8px; }
.card { flex: none; box-sizing: border-box; width: 170px; display: flex; align-items: center; gap: 6px; padding: 12px 8px; border: 1px solid #d8dee4; border-radius: 8px; color: #1f2328; font-weight: 600; white-space: nowrap; }
.card .icon { width: 24px; height: 24px; flex: none; color: #0b6bcb; }
.slot > h1 { display: flex; align-items: center; gap: 12px; }
.slot > h1 .icon { width: 32px; height: 32px; flex: none; color: #0b6bcb; }
a.card:hover { border-color: #0b6bcb; color: #0b6bcb; }
/* ファイルのない Slot のカード。リンクにしない */
.card.missing { color: #8c959f; background: #f6f8fa; cursor: default; user-select: none; }
.card.missing .icon { color: #afb8c1; }
.note, .from { color: #656d76; font-size: 0.85em; }
.summary { font-size: 1.1em; }
/* 開発コマンドの先頭の目次 */
ul.toc { margin: 8px 0 16px; padding-left: 1.2em; }
ul.toc li { margin: 2px 0; }
/* 用語集の表。まとまりの表どうしで、列の幅をそろえる */
table.words { table-layout: fixed; }
table.words th:nth-child(1), table.words th:nth-child(2) { width: 9em; }
table.words td:nth-child(1), table.words td:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h2 { font-size: 1.25em; margin: 28px 0 4px; padding-bottom: 2px; border-bottom: 1px solid #d8dee4; }
.tag { display: inline-block; border: 1px solid #d8dee4; border-radius: 10px; padding: 0 7px; margin: 0 3px 2px 0; font-size: 0.8em; color: #3d444d; }
/* タグの色。淡い 8 色を、出てきた順に割り当てる */
.tag.c0 { background: #ddf4ff; border-color: #b6e3ff; }
.tag.c1 { background: #dafbe1; border-color: #aceebb; }
.tag.c2 { background: #fff8c5; border-color: #f5e08a; }
.tag.c3 { background: #ffebe9; border-color: #ffcecb; }
.tag.c4 { background: #fbefff; border-color: #ecd8ff; }
.tag.c5 { background: #fff1e5; border-color: #ffd8b5; }
.tag.c6 { background: #e6fbf7; border-color: #b3ece2; }
.tag.c7 { background: #ffeff7; border-color: #ffd3eb; }
/* Free ファイルのツリー。ディレクトリの行は薄い水色で、ファイルの行と見分ける */
/* プロジェクト詳細のタグのトグル。選んでいないタグは薄くする */
.tag-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.tag-filter button { font-family: inherit; font-size: 0.85em; line-height: 1.6; padding: 1px 10px; margin: 0; cursor: pointer; }
.tag-filter button[aria-pressed="false"] { opacity: 0.35; }
.tag-filter .count { margin-left: 6px; font-weight: 600; }
/* Free ファイルのツリーの列。ファイルとタグは中身の幅で折り返さず、ミッションは残りの幅に 1 行で収め、はみ出たら … にする */
table.docs td:nth-child(1), table.docs td:nth-child(3) { white-space: nowrap; }
table.docs td:nth-child(2) { width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.docs tr.dir td { padding: 0; }
table.docs tr.dir div { padding: 5px 9px; background: #eef7fc; color: #3d444d; font-weight: 600; }
/* ディレクトリの表。表どうしで、名前の列の幅をそろえる。収まらない名前は折り返す */
table.tree { table-layout: fixed; }
table.tree th:nth-child(1) { width: 14em; }
table.tree td:nth-child(1) { overflow-wrap: anywhere; }
/* 現在の設定の表。選ぶ項目は候補を横に並べ、選んでいる候補に色を付ける */
table.config td:nth-child(1), table.textlint td:nth-child(1) { width: 14em; white-space: nowrap; }
table.config ul { margin: 0; padding-left: 1.2em; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { padding: 0 8px; border: 1px solid #d8dee4; border-radius: 6px; color: #8c959f; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
.choice.on { border-color: #9fcff5; background: #ddf0fd; color: #0a5aa8; font-weight: 600; }
.num { text-align: right; white-space: nowrap; }
.step-name { font-weight: 600; margin: 0 0 4px; }
.steps > li { margin-bottom: 12px; }

/* 検索のページ。結果はファイルごとに、パス、タグ、ヒットした行の前後のプレビューを並べる。プレビューの長い行は折り返さず、横にスクロールする */
form.search input { width: 100%; box-sizing: border-box; margin: 12px 0 4px; padding: 8px 12px; border: 1px solid #d8dee4; border-radius: 6px; font: inherit; }
form.search input:focus { outline: none; border-color: #0b6bcb; }
.hit { margin: 20px 0 0; }
.hit-file { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 4px; }
.hit-file a { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
pre.preview { margin: 4px 0; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
pre.preview .ln { display: inline-block; width: 3em; margin-right: 12px; text-align: right; color: #8c959f; user-select: none; }
mark { background: #fff8c5; color: inherit; }

/* 分けた Slot のページのタブ。ページへのリンクで、JS は使わない。開いているページのタブは、下の線とつなげる */
.page-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 12px 0 20px; border-bottom: 1px solid #d8dee4; }
.page-tabs a { margin-bottom: -1px; padding: 4px 14px; border: 1px solid transparent; border-radius: 6px 6px 0 0; color: #656d76; }
.page-tabs a:hover { color: #0b6bcb; }
.page-tabs a[aria-current="page"] { border-color: #d8dee4; border-bottom-color: #fff; background: #fff; color: #1f2328; font-weight: 600; }

/* OS ごとの手順のタブ。JS は使わない。印刷の表示（JPG）では、すべての OS を並べる */
.tabs > input { position: absolute; opacity: 0; pointer-events: none; }
.tabs > label { display: inline-block; padding: 2px 12px; margin-right: 4px; border: 1px solid #d8dee4; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; color: #656d76; }
.tabs > input:checked + label { background: #f6f8fa; color: #1f2328; font-weight: 600; }
.tabs > .panel { display: none; border: 1px solid #d8dee4; padding: 8px 12px; }
.tabs > input:nth-of-type(1):checked ~ .panel:nth-of-type(1),
.tabs > input:nth-of-type(2):checked ~ .panel:nth-of-type(2),
.tabs > input:nth-of-type(3):checked ~ .panel:nth-of-type(3),
.tabs > input:nth-of-type(4):checked ~ .panel:nth-of-type(4),
.tabs > input:nth-of-type(5):checked ~ .panel:nth-of-type(5),
.tabs > input:nth-of-type(6):checked ~ .panel:nth-of-type(6) { display: block; }
.panel-os { display: none; }
@media print {
  .tabs > label { display: none; }
  .tabs > .panel { display: block; margin-bottom: 8px; }
  .panel-os { display: block; margin: 0 0 4px; font-weight: 600; color: #656d76; }
}

/* ADR。まとまりごとに、決定のつながりを過去から未来へ左から右に並べる。カードの幅は固定して題を折り返し、並びきらなければ横にスクロールする */
.lanes { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 20px; }
.lane { display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.adr-box { flex: none; box-sizing: border-box; width: 220px; display: flex; flex-direction: column; overflow-wrap: anywhere; padding: 8px 14px; border: 1px solid #1f2328; border-radius: 6px; color: #1f2328; font-weight: 600; }
.adr-box.superseded { border-style: dashed; border-color: #8c959f; color: #656d76; background: #f6f8fa; }
.arrow { flex: none; align-self: center; color: #656d76; font-size: 1.2em; }
/* 決定のページの下の、前後の決定のカード */
.adr-nav { display: flex; justify-content: space-between; gap: 16px; margin: 40px 0 0; padding-top: 16px; border-top: 1px solid #d8dee4; }
.adr-nav > div { display: flex; align-items: stretch; gap: 8px; }
.label { font-weight: 600; margin: 12px 0 2px; }
</style>
</head>

<script>var DOCV_SEARCH=[{"path":"docv/service/overview.md","href":"サービス/サービス概要.html","tags":[],"lines":["---","mission: 利用者に向けた、これが何で、誰の何を解決し、何ができるかの説明","---","","# サービス概要","","docv はプロジェクトドキュメントのためのフレームワークである。","","## 解決すること","","AI Agent と開発すると、コードと一緒にドキュメントも高速に増える。docv は、そのときに起きる次の課題を解決する。","","### 単一プロジェクトにおける課題","","- AI Agent の生成する詳細な情報を人間が把握しきれない","- AI Agent がドキュメントを決まりなく書き足し、一瞬で肥大化させる","","### 複数プロジェクトにおける課題","","- 乱立する大量のプロダクトそれぞれでドキュメントルールを定義するのが面倒","- とにかくさっと概要を把握したいのに、閲覧方法が定まっておらずなにから見ればいいかすぐ判別できない","","## できること","","- 詳細は `docv desc` もしくは https://github.com/suzuki-hoge/docv/blob/main/assets/desc.md を参照 ( 内容は同じ )","","## しないこと","","- テンプレートやチェッカー・ビジュアライザなどは提供するが、具体的な執筆方式には関与しない","  - そのため、docv そのものには LLM を含まない","  - そのため、図や API 仕様書などの書式やツールを指定しない"]},{"path":"docv/service/service/desc.md","href":"サービス/サービス仕様/概要.html","tags":[],"lines":["---","order: 1","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# 概要","","docv の解決したいこと","","- AI Agent の開発速度に人間の理解がついていけるように、ドキュメントの構造化ルールを提供し人間用のビジュアライズを行う","- AI Agent が無秩序にドキュメントを肥大化させないように、薄いガイドラインを提供する","","docv の提供するもの","","- およそ普遍的に必要になるドキュメントのテンプレート","- Free ファイル（`docs/` の Markdown）の YAML front matter","- それらのビジュアライズ HTML 生成","- AI Agent に伝えるドキュメント管理のガイドラインの雛形","","このツールそのものには LLM は含まない","","## 1. コンセプト","","### `docv/`","","`docv/` 配下のファイルを Slot ファイルと呼ぶ","","- プロジェクトの `docv/` ディレクトリに docv 指定のファイルを配置するとビジュアライズされ HTML で閲覧できる","- 環境構築や用語集などそれぞれのページを Slot といい、Slot ごとに所定の書式がある","- 設定すれば、HTML に加え JPG 画像も出力する","    - GitHub で直接ドキュメントを閲覧できるようにするため","- `docv/` は `docv.yaml` で変更可能","- Slot ファイルは複数プロジェクトのドキュメントルールや閲覧方法を統一する目的のために存在するため、強制力が強い","    - ミッションの変更やファイル名の変更は不可能","","### `docs/`","","`docs/` 配下のファイルを Free ファイルと呼ぶ","","- `docv/` 以外のドキュメントは、Free ファイルとして `docs/` に Markdown で置く","- ビジュアライズ時は、ファイルは通常の Markdown → HTML 変換のほか、リンク切れチェックや textlint / format ( 設定次第 ) も行われる","- YAML front matter でタグなどをつけ管理する","- `docs/` は `docv.yaml` で変更可能","- Free ファイルは docv でサポートしないプロジェクト固有の情報を任意の構造で管理するためのもので、強制力は低い","    - ミッションの決定は利用者側に委ねられている","    - docv はタグ付けとビジュアライズ HTML への組み込み程度を提供する","","## 2. Slot","","`docv slot list` で一覧と、それぞれの Slot のミッションを確認でき、作成したい場合は `docv slot gen \u003cslot>` で作成する","","md の Slot には、YAML front matter の `mission` に、その Slot のミッションを `docv slot list` のとおりに書く","","- ミッションは docv が決めるもので、プロジェクトでは変えられない","- `mission` がないか、ミッションと違えば、`docv check` が error にする。docv の版を上げてミッションが変わったときも、check で気づいて直す","","```markdown","---","mission: 利用者の使い方（CLI のコマンド、GUI の操作など）","---","","# 利用マニュアル","```","","### ページ分け","","サービス仕様とシステム仕様は、ページに分けられる","","- 分けるときは、1 つのファイルの代わりに、次のディレクトリの直下に 1 ページ 1 ファイルで Markdown を置く","    - サービス仕様: `docv/service/service.md` の代わりに `docv/service/service/`","    - システム仕様: `docv/system/system.md` の代わりに `docv/system/system/`","- どのページにも、YAML front matter に `order`（整数）と `mission` を書く。ページは `order` の順に並ぶ。`order` は重ねない。`mission` は、分けないときと同じ、その Slot のミッション","- 本文の h1 が、ページの名前になる。HTML では、ページを切り替えるタブの名前になる。h1 は重ねない","- 分けないときは 1 つのファイル（`docv/service/service.md` か `docv/system/system.md`）に書き、YAML front matter には `mission` だけを書く","","```markdown","---","order: 1","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# 利用者向け機能","```","","## 3. YAML front matter","","`docs/` の Markdown ファイルを管理するための YAML front matter","","```yaml","---","mission: 注文を確定するタイミングと、失敗したときの扱い","tags: [ 仕様, 注文 ]","---","```","","### `mission`","","必須","","HTML にインデックスするときに添える","また AI Agent が適切にメンテできるようにするための目印","","### `tags`","","任意 / リスト形式","","HTML にインデックスするときに組み込まれる","","## 4. ADR","","決めたこと 1 つを、背景や選ばなかった案と一緒に残す記録","","- `docv/adr/\u003cid>.md` に、決定 1 つを 1 ファイルで置く ( ファイル名から `.md` を除いたものが id )","- ファイルは手で作る","- 本文は、h1 に題を書き、`## 背景`、`## 決めたこと`、`## 結果`、`## 選ばなかった案` の章で書く","- 決めた後は書き換えない","    - 決定を変えるときは、新しい ADR を書き、その `supersedes` で過去の決定の id を指す","- HTML では、`group` ごとに決定のつながりを図にする","","```markdown","---","group: 言語","date: 2026-03-01","supersedes: [ go ]","---","","# Rust で書く","","## 背景","","配布するバイナリを 1 つにしたい","","## 決めたこと","","CLI は Rust で書く","","## 結果","","利用者は Rust の環境なしで使える","","## 選ばなかった案","","| 案         | 選ばなかった理由 |","| ---------- | ---------------- |","| Zig で書く | 情報が少ない     |","```","","### `group`","","任意","","決定のまとまりの名前","省略すると「その他」","","### `date`","","必須 / YYYY-MM-DD","","決めた日","決定を並べる順に使う","","### `supersedes`","","任意 / リスト形式","","打ち消す過去の決定の id","","## 5. コマンド","","すべてのコマンドは `docv --help` と `docv \u003csub-command> --help` で確認する","","新たに導入する場合は `docv init` し、`docv slot gen doc-guide` でガイドラインを作り、`docv slot gen` と `docv check` で作成・調整を進める","","## 6. スキーマ ( 設定ファイル )","","設定ファイル ( `docv.yaml` ) の項目は `docv init --print` で確認する","","すべての項目が、既定の値でコメントとして載っている","","## 7. スキーマ ( docv ファイル )","","YAML の Slot は `docv slot list` で確認し、そのスキーマは `docv slot schema \u003cslot>` で確認する","","## 8. ルール、ガイドライン、設定","","docv の決まりは、次の 3 つに分かれる","","- ルール: docv の仕組みが決める決まり。Slot と `docv.yaml` のスキーマ、YAML front matter の key、check が確かめることなど。利用側は変えられない。この概要と `docv slot schema \u003cslot>` で確認する","- ガイドライン: ドキュメントを書くときの方針。`docv slot gen doc-guide` で Doc ガイド（`docv/guide/doc-guide.md`）に雛形を作り、プロジェクトに合わせて自由に直す","- 設定: `docv.yaml` で切り替えること。check のルールや textlint を使うか、出力を git で管理するかなど。`docv init --print` で確認する"]},{"path":"docv/service/service/slot.md","href":"サービス/サービス仕様/Slot.html","tags":[],"lines":["---","order: 2","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# Slot","","どのプロジェクトにも要るドキュメントを、docv が決めたミッションと形で書くファイルの規格。Slot を置く理由は [概要](desc.md) のページに、HTML の全体は [ビジュアライズ](html.md) のページに書く。","","---","","## 1. 置き場所と書き方","","- Slot ファイルは、`docv.yaml` の `dir.slot`（既定は `docv`）に、`\u003cまとまり>/\u003cSlot>.\u003c拡張子>` の名前で置く。まとまりのディレクトリは `service`（サービス）、`system`（システム）、`guide`（開発者向けガイド）、`operation`（運用）。`docs/` には Free ファイルを、`docv/` には Slot ファイルを置く","- 拡張子は Slot ごとに決まる。YAML の Slot は決まった項目で書き、md の Slot は中身の形を決めず、そのまま HTML に出す","- サービス仕様とシステム仕様だけは、ページに分けて `service/service/` と `system/system/` に置ける（「md の Slot」の章）","- `docv/adr/` は ADR の置き場所で、Slot としては読まない（[ADR](adr.md) のページ）","- `dir.slot` の中でも、除外に当たるファイル（[設定ファイル](config.md) のページの「管理対象と管理外」の章）と、名前がドットで始まるファイルとディレクトリ（`.DS_Store` など）は読まない。それ以外で Slot の名前でないファイルは、check が slot-unknown の error にする","- Slot を置くかどうかは任意。プロジェクトに当てはまらない Slot は作らない（例: 利用者の手元に入れるものがなければ、インストールの Slot はいらない）","- Slot のミッションに当たる詳しいことも、Slot の中に書く。Free ファイルへのリンクで済ませない","- ファイルの中のパスは、すべてルートからの相対パスで書く。md の Slot の中のリンクは、ほかの Markdown と同じく、ファイルの場所からの相対パスで書く","- YAML の文字列の項目には Markdown を書ける","- `docv slot gen \u003cslot>` で、Slot ファイルを決まったパスに作れる。YAML の Slot には項目のサンプルを書き、md の Slot には YAML front matter の `mission` だけを書く（`docv slot list` で一覧とミッションを出す）","","---","","## 2. 一覧","","HTML には、この表の順に、まとまりごとに並べる。","","| ファイル                      | Slot           | まとまり         | ミッション                                                       |","| ----------------------------- | -------------- | ---------------- | ---------------------------------------------------------------- |","| `service/overview.md`         | サービス概要   | サービス         | 利用者に向けた、これが何で、誰の何を解決し、何ができるかの説明   |","| `service/service.md`          | サービス仕様   | サービス         | 外から見た機能と、それぞれの振る舞いと決まり                     |","| `service/manual.md`           | 利用マニュアル | サービス         | 利用者の使い方（CLI のコマンド、GUI の操作など）                 |","| `service/install.yaml`        | インストール   | サービス         | 利用者がこれを入れる手順                                         |","| `service/words.yaml`          | 用語集         | サービス         | このプロジェクトの言葉の意味                                     |","| `system/system-overview.md`   | システム概要   | システム         | 開発者に向けた、システムを作る部品と、そのつながりの全体像       |","| `system/system.md`            | システム仕様   | システム         | 部品ごとの振る舞いと、部品の間の流れと、部品をまたいで守る決まり |","| `system/stack.yaml`           | 技術スタック   | システム         | 作るのに使っている言語、ライブラリ、サービス                     |","| `system/api.md`               | API 仕様書     | システム         | API の一覧と、それぞれが受け取るものと返すもの                   |","| `system/db.md`                | DB 仕様書      | システム         | 保存しているデータと、その保存先と形                             |","| `guide/directory-tree.yaml`   | ディレクトリ   | 開発者向けガイド | ディレクトリごとの役割                                           |","| `guide/setup.yaml`            | 環境構築       | 開発者向けガイド | 開発を始めるのに用意するものと、実行するコマンド                 |","| `guide/env.yaml`              | 環境変数       | 開発者向けガイド | システムを動かすのに要る環境変数と、それぞれを設定している場所   |","| `guide/develop.yaml`          | 開発コマンド   | 開発者向けガイド | テストやビルドなど、開発者が実行するコマンド                     |","| `guide/doc-guide.md`          | Doc ガイド     | 開発者向けガイド | このプロジェクトのドキュメントの置き場所と書き方                 |","| `operation/infrastructure.md` | インフラと環境 | 運用             | 環境（本番、ステージング、開発など）の一覧と、それぞれの用途     |","| `operation/deploy.md`         | デプロイ       | 運用             | 作ったものを環境に反映する手順                                   |","| `operation/release.md`        | リリース       | 運用             | 版の決め方と、利用者への届け方                                   |","| `operation/cost.yaml`         | 費用           | 運用             | かかっている費用と、費用を理由にやっていないこと                 |","","- Slot の名前に近いパスで置くと、check が slot-unknown で正しいパスを示す。たとえば、まとまりのディレクトリが違う `words.yaml`、番号を付けた `service/03-words.yaml`、拡張子が違う `service/service.yaml`","- 利用マニュアル（manual）と開発コマンド（develop）を分けるのは、使う人と目的が違うため。利用マニュアルは、リポジトリが CLI や GUI のときの、利用者向けの使い方","- サービス概要には、これは何で、何に使えるかを、利用者に向けて書く。サービス仕様には、外から見た機能と、それぞれがどう振る舞うかを詳しく書く。実装をそっくり差し替えても変わらないことが、サービス仕様になる","- システム概要には、どんな部品からなり、どうつながっているかを、開発者に向けて図で書く。システム仕様には、部品ごとの振る舞いと、部品をまたいで守る決まりを詳しく書く。部品を作る言語やライブラリは、技術スタックに書く","- インフラと環境には、ある環境だけでなく、ない環境も書く（例: ステージングと本番があり、開発サーバーはない）","- デプロイは環境に反映すること、リリースは利用者に届けることで、どちらかしかないプロジェクトもある（例: サーバーを持たない CLI はリリースだけ）。どちらも、環境ごとの違い、承認、切り戻しなど、手順の形に収まらないことを書くので md にする","","---","","## 3. YAML の Slot の項目","","- 項目の形と意味は、Slot ごとのスキーマ（JSON Schema）で決める。`docv slot schema \u003cslot>` で出す。元のファイルは `assets/schema/\u003cID>.schema.json` で、`docs/schema/` に写しを置く","- `docv slot gen` は、YAML の Slot の 1 行目に、yaml-language-server の書式でスキーマの URL を書く。URL は、実行した CLI の版のタグの `assets/schema/` を指す。エディタで項目の補完と検証が効く","- 名前が `_markdown` で終わる項目は Markdown。値は、1 行でも必ず `|` のブロックで書く。`|-`、`|+`、字下げの数を付けた `|2` などは使わない。それ以外の文字列の項目は、Markdown として扱わず、1 行で書く","- Markdown の項目の中のリンクは、ルートからの相対パスで書く","- どの YAML の Slot にも、`appendix_markdown` を書ける。項目に収まらない補足を書く","","```yaml","groups:","  - name: ファイルの種類","    items:","      - en: Slot","        desc_markdown: |","          どのプロジェクトにも要るドキュメントを書くファイル。`docv/` に置く","```","","---","","## 4. md の Slot","","- 中身の形は決めない","- YAML front matter には `mission` だけを書き、`docv slot list` のミッションと同じ文にする。ミッションは docv が決めるもので、プロジェクトでは変えない。ないか違えば、check が slot-mission の error にする。docv の版を上げてミッションが変わったときも、check で気づいて直す。ファイルを開けば、何を書く Slot かが分かるようにするため","- `mission` がないか違っても、HTML には本文を出す","- `docv slot gen` は、YAML front matter の `mission` だけを書いたファイルを作り、中身の形は自由だと表示する。Doc ガイド（`guide/doc-guide.md`）だけは、docv が勧めるガイドラインを書いた雛形を作る。雛形にも `mission` を書いてある。作った雛形はプロジェクトのもので、自由に直してよい。docv の版を上げても書き換えない","","サービス仕様とシステム仕様は、ページに分けられる。1 つのページが長くならないようにするため。読む人ごとに仕様が分かれるサービス（利用者向けの機能と管理者向けの機能など）や、部品の多いシステム（画面、サーバ、バッチなど）で分ける。","","- 分けるときは、1 つのファイルの代わりに、ページのディレクトリの直下に 1 ページ 1 つの Markdown で置く。サービス仕様は `service/service/`、システム仕様は `system/system/` に置く。ファイル名は自由。両方に置くと check の error になる","- どのページにも、YAML front matter に `order`（整数）と `mission` を書く。ページは `order` の順に並べる。`order` は重ねない。`mission` は、分けないときと同じく、その Slot のミッションと同じ文にする","- 本文の h1 が、ページの名前になる。h1 は重ねない","- 分けないときは、今までどおり `service/service.md` か `system/system.md` に書く","","```markdown","---","order: 2","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# 管理者向け機能","```","","---","","## 5. check","","| ID                  | 内容                                                                                                                              |","| ------------------- | --------------------------------------------------------------------------------------------------------------------------------- |","| slot-unknown        | Slot のディレクトリに、Slot の名前でないファイルがある                                                                            |","| slot-invalid        | YAML の Slot の形に合わない。知らない項目、手順の `id` や `os` の重なり、`os` のない `item`、`ja` も `en` もない用語も含む        |","|                     | 分けたサービス仕様とシステム仕様のページの形に合わない。YAML front matter の `order` がない、知らない項目、`order` や h1 の重なり |","|                     | md の Slot の YAML front matter に、知らない項目がある。閉じる `---` がない                                                       |","|                     | 同じ Slot が、1 つのファイル（`service/service.md` など）と、ページのディレクトリ（`service/service/` など）の両方にある          |","| slot-mission        | md の Slot の YAML front matter に `mission` がないか、`docv slot list` のミッションと違う                                        |","| slot-path-missing   | パスの先がない                                                                                                                    |","| slot-markdown-style | `_markdown` で終わる項目を、`\\|` のブロックで書いていない                                                                         |","| slot-text-multiline | `_markdown` で終わらない文字列の項目が、複数行になっている                                                                        |","","- md の Slot には、YAML front matter のほかは、Free ファイルと同じ検査（[Free](free.md) のページの「check のルール」の章）をかける","- YAML の Slot の Markdown の項目には、リンク、書式の規則、整形、textlint の検査をかける。見出しの検査はかけない。項目の中に h1 はなく、HTML では見出しの段を付け直すため。指摘の行番号は、YAML の行番号で出す","","- directory-tree の `path` の先がなくなったら、ディレクトリの Slot が実装からずれたということ。実装とずれたことに気づけるのは、ここだけ"]},{"path":"docv/service/service/free.md","href":"サービス/サービス仕様/Free.html","tags":[],"lines":["---","order: 3","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# Free","","docv が管理する Free ファイル（`docv.yaml` の `dir.free` のディレクトリの下の Markdown）のルール。何をどう書くかはガイドライン（Slot の Doc ガイド、`guide/doc-guide.md`）で、プロジェクトが決める。Slot のルールは [Slot](slot.md)、ADR のルールは [ADR](adr.md)、`docv.yaml` は [設定ファイル](config.md) のページに書く。","","---","","## 1. YAML front matter","","| key       | 必須 | 中身                                                 |","| --------- | ---- | ---------------------------------------------------- |","| `mission` | 必須 | ミッション。このファイルを読むと何が分かるか（1 文） |","| `tags`    | 任意 | タグの配列（「タグ」の章）                           |","","```yaml","---","mission: 注文を確定するタイミングと、失敗したときの扱い","tags: [仕様, 注文]","---","```","","- `mission` は 1 行で書く","- ファイルごとの設定は、すべて YAML front matter に書き、`docv.yaml` には書かない。ファイルを動かしても設定がずれず、AI Agent はファイルを読むだけで、そのファイルの扱いが分かる","- docv が知らない key は、そのまま残し、check もしない。作成者の記録（`created` / `updated` など）のように、プロジェクトが決めた key を書いてよい","- HTML は、`mission` をファイルの説明として表示する","","---","","## 2. タグ","","- Free ファイルの分類は、YAML front matter の `tags` に書くタグで行う。1 つのファイルにいくつでも付けられる","- docv はタグの意味を決めない。どんなタグを使うかは、プロジェクトが決める","- 使うタグは、すべて `docv.yaml` の `tags` に書く。`tags` にないタグを付けると、check が error にする","- `tags` には、タグごとに名前（`name`）と色（`color`）を書く。色は HTML でタグを見分けるためのもので、blue、green、yellow、red、purple、orange、teal、pink から選ぶ","","```yaml","tags:","  - name: 仕様","    color: blue","  - name: 計画","    color: green","```","","---","","## 3. check のルール","","`docv check` が Free ファイルで確かめるルール。`docv.yaml` で使うと決めたときだけ確かめるもの（太字などの書式の規則、整形、textlint）は [設定ファイル](config.md) のページに書く。","","### YAML front matter","","| ID                  | 内容                                                       |","| ------------------- | ---------------------------------------------------------- |","| frontmatter-invalid | YAML front matter が読めない。`mission`、`tags` の型が違う |","| mission-missing     | `mission` がない                                           |","| mission-multiline   | `mission` が複数行                                         |","| tag-unknown         | `docv.yaml` の `tags` にないタグがある                     |","","### 構造とリンク","","| ID             | 内容                                                                     |","| -------------- | ------------------------------------------------------------------------ |","| title-count    | h1 が 1 つでない                                                         |","| heading-number | 章番号で始まる h2 があるのに、h2 が `1. ` から順に章番号で始まっていない |","| link-broken    | ルートの中を指す相対リンクの先にファイルがない                           |","| link-anchor    | リンクのアンカー（`#` 以降）が指す見出しが、リンク先の Markdown にない   |","","- 章番号は、h2 のどれかが `1. ` のような章番号で始まっているファイルでだけ確かめる。章番号を使わないファイルでは確かめない","- アンカーは、HTML の見出しと同じく GitHub と同じ形で作る。同じ見出しが続けば `-1`、`-2` を付ける。`#` だけのページ内リンクは、そのファイルの見出しと比べる。Markdown でないファイルへのリンクのアンカーは確かめない"]},{"path":"docv/service/service/adr.md","href":"サービス/サービス仕様/ADR.html","tags":[],"lines":["---","order: 4","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# ADR","","決めたこと 1 つを、背景、選ばなかった案、結論と一緒に残す記録。`docs/` と Slot には今の姿だけを書き、どう決めてきたかは ADR に残す。docv が形を決めるファイルの 1 つで、置き場所は Slot と同じ `docv/` の下。","","---","","## 1. 置き場所と書き方","","- `dir.slot`（既定は `docv`）の下の `adr/` に、決定 1 つを 1 つの Markdown で置く。ファイル名は `\u003cid>.md` で、`.md` を除いた名前が決定を指す id になる","- システムが使う項目（`group`、`date`、`supersedes`）は YAML front matter に書く。決定の中身は本文に書き、本文の h1 を題にする","- 状態（採用、却下など）は持たない。ADR に残すのは決めたことだけで、打ち消されたかどうかは、新しい決定の `supersedes` から指されているかでわかる。打ち消されていない決定が、今の決定","- 本文は、背景、決めたこと、結果、選ばなかった案の章で書く","- 決めた後は書き換えない。決定を変えるときは、新しい ADR を書き、その `supersedes` から過去の決定の id を指す（未来から過去を参照する）","- 過去の決定から新しい決定へのつながりは、docv が `supersedes` を逆にたどって組み立てる。過去の ADR には書き足さない","- 用語を変えても、過去の ADR は書き換えない。過去の ADR が今の用語で読めなくなることは許す。用語集の Slot には今の用語だけを書き、昔の用語との対応は残さない","","---","","## 2. YAML front matter の項目","","| 項目         | 必須 | 中身                                                                                    |","| ------------ | ---- | --------------------------------------------------------------------------------------- |","| `group`      | 任意 | まとまりの名前。同じ `group` の決定を、HTML で 1 つの図にまとめる。省略すると「その他」 |","| `date`       | 必須 | 決めた日（YYYY-MM-DD）。決定を並べる順と、`supersedes` が過去を指しているかに使う       |","| `supersedes` | 任意 | 打ち消す過去の決定の id の配列                                                          |","","```markdown","---","group: 言語","date: 2026-03-01","supersedes: [go]","---","","# Rust で書く","","## 決めたこと","","CLI は Rust で書き、単一のバイナリにして配る。","","## 選ばなかった案","","| 案         | 選ばなかった理由 |","| ---------- | ---------------- |","| Zig で書く | 情報が少ない     |","```","","---","","## 3. check","","| ID              | 内容                                                                                         |","| --------------- | -------------------------------------------------------------------------------------------- |","| adr-invalid     | YAML front matter が ADR の形に合わない（知らない項目、`date` の形も含む）。本文に h1 がない |","| adr-unknown-ref | `supersedes` の先の ADR がない。または、その決定より後の決定を指している                     |","","- 本文には、YAML front matter のほかは、Free ファイルと同じ検査（[Free](free.md) のページの「check のルール」の章）をかける","","---","","## 4. AI Agent","","- AI Agent が ADR を読むのは、決めた理由を聞かれたときだけ。今の姿は `docs/` と Slot を読む"]},{"path":"docv/service/service/config.md","href":"サービス/サービス仕様/設定ファイル.html","tags":[],"lines":["---","order: 5","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# 設定ファイル","","リポジトリのルートに置く設定ファイル（`docv.yaml`）。型は [`assets/schema/docv.schema.json`](../../../assets/schema/docv.schema.json) が正本。最初の章で項目を一覧にし、続く章で、一覧に書ききれない解釈の決まりと、`docv.yaml` で使うと決めたときだけ動く道具（書式の規則、textlint、整形）を書く。","","---","","## 1. 例","","```yaml","# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-hoge/docv/v1.2.1/assets/schema/docv.schema.json","title: shop-app","","dir:","  free: docs","  image: output/docv/image","  index: .","ignore:","  - docs/tmp/**","","tags:","  - name: 仕様","    color: blue","  - name: 手順","    color: green","  - name: 規約","    color: yellow","","lint:","  bold: deny","  textlint: enable","format:","  enabled: true","```","","| 項目             | 必須 | 既定               | 意味                                                                                                            |","| ---------------- | ---- | ------------------ | --------------------------------------------------------------------------------------------------------------- |","| `title`          |      | ルートの名前       | HTML に出すプロジェクト名                                                                                       |","| `dir.free`       |      | `docs`             | 管理対象の Markdown（Free ファイル）を置くディレクトリ（「管理対象と管理外」の章）                              |","| `dir.slot`       |      | `docv`             | Slot ファイルを置くディレクトリ                                                                                 |","| `dir.html`       |      | `output/docv/html` | docv build が HTML を出すディレクトリ                                                                           |","| `dir.image`      |      |                    | docv build が Slot のページの JPG を出すディレクトリ。書かなければ JPG を作らない。JPG を作るには Chrome が要る |","| `dir.index`      |      |                    | docv build がインデックス（`docv-index.md`）を書くディレクトリ。`.`（ルート）だけを書ける。書かなければ作らない |","| `ignore`         |      |                    | 管理対象にも管理外にもしないファイルの glob の配列                                                              |","| `tags`           |      |                    | 使うタグの一覧。タグごとに `name` と、HTML の色の `color` を書く（[Free](free.md) のページの「タグ」の章）      |","| `lint.bold`      |      | allow              | 太字を使ってよいか（「書式の規則」の章）                                                                        |","| `lint.italic`    |      | allow              | 斜体を使ってよいか（「書式の規則」の章）                                                                        |","| `lint.dollar`    |      | allow              | コードの外の 1 行に `$` を 2 つ以上書いてよいか（「書式の規則」の章）                                           |","| `lint.textlint`  |      | disable            | textlint で文章を校正するか（「textlint」の章）                                                                 |","| `format.enabled` |      | false              | check で、整形が要るファイルを error にするか（「整形との連動」の章）                                           |","","---","","## 2. 書くことと書かないこと","","- `docv.yaml` には、ツールの設定（`lint`、整形、出力）と、プロジェクト全体で共有する語彙（管理対象の範囲、タグの一覧、Slot の置き場所）だけを書く","- ファイルごとの設定（ミッション、タグ）は、そのファイルの YAML front matter に書く（[Free](free.md) のページの「YAML front matter」の章）","","---","","## 3. 管理対象と管理外","","- `dir.free` に書いたディレクトリの下の `.md` のファイルが、管理対象になる。check、fix、HTML の対象になる。`dir.free` は 1 つだけ書け、ルートは書けない","- `dir.free`、`dir.slot`、`dir.html`、`dir.image`（書いたとき）は、どの 2 つも同じディレクトリにできず、一方が他方を含むこともできない。ルートも書けない。違反すると、`docv.yaml` が正しくないとして、check、fix、build などの `docv.yaml` を読むコマンドが、何もせずに終了コード 2 で終わる","- `dir.free` の外にあり、`ignore` にも当てはまらない `.md` のファイルは管理外になる。中身は見ない","- `ignore` に当てはまるファイルは、check と HTML のどちらにも出さない","- `dir.index` は、`.`（ルート）だけを書ける。キーだけを書いて値を書かないこともできない。ほかの dir とは比べない","- `.gitignore` に書かれたファイルと、`dir.html` と `dir.image` の中は、`ignore` に書かなくても常に除く","- docv build の出力を git で管理するかは、プロジェクトの `.gitignore` で決める。docv は `.gitignore` を書かない","- パスと glob は、すべてルートからの相対パスで書く。`*` は `/` をまたがず、`**` はまたぐ","","---","","## 4. 書式の規則（`lint.bold`、`lint.italic`、`lint.dollar`）","","太字などを使ってよいかを、プロジェクトごとに決める。`deny` にした書き方を、管理対象のファイルで error にする。","","| キー     | ルール ID    | `deny` のとき確かめること                                                                   |","| -------- | ------------ | ------------------------------------------------------------------------------------------- |","| `bold`   | style-bold   | 太字（`**`、`__`）を使っていない                                                            |","| `italic` | style-italic | 斜体（`*`、`_`）を使っていない                                                              |","| `dollar` | style-dollar | コードの外の 1 行に `$` が 2 つ以上ない。GitHub は `$` で挟んだ部分を数式として表示するため |","","- 既定はどれも `allow`（確かめない）","- コードブロックとインラインコードの中は見ない","- 章番号は、設定によらず常に確かめる（[Free](free.md) のページの「check のルール」の章）","- 管理対象のファイルのほか、md の Slot、ADR、YAML の Slot の Markdown の項目にもかける","","---","","## 5. textlint（`lint.textlint`）","","文章の校正に textlint を使う仕組み。AI Agent が書く文章のぶれをなくすのが目的なので、使うルールとその値は docv が決める。利用者は、使うかどうか（`enable`、`disable`）だけを決める。","","- 既定では使わない。`enable` にしたときだけ、`docv check` が textlint をかけ、`docv fix` が自動修正できるところを直す。かけるのは、管理対象のファイル、`dir.slot` の中の Markdown（md の Slot と ADR）、YAML の Slot の Markdown の項目","- YAML の Slot の Markdown の項目には、`ja-no-mixed-period`（文末を「。」で終える）をかけない。項目の多くは HTML で表のセルに出す短い説明で、textlint が段落として扱わない Free ファイルの表のセルと、扱いを揃えるため","- textlint は Node.js で動くので、使うときだけ Node.js（npx）が必要になる。`enable` なのに Node.js が見つからないときは、終了コード 2 で終わる","- 結果は、ほかのルールと同じ形の error で出す。ルール ID は `textlint/\u003cプリセット>/\u003cルール>`（例: textlint/ja-technical-writing/sentence-length）。下の表では、プリセットごとにルールの名前だけを書く","- `--no-textlint` で、textlint だけを飛ばせる","- プロジェクトに `package.json` はいらない。初めて実行するときは、textlint を取ってくるのにネットワークが必要","- 使うルールとその値は、docv の版ごとに固定する。同じ docv なら同じ結果になる","- docv が textlint をどう動かすかは、[システム仕様](../../system/system.md) の「textlint とのやりとり」の章に書く","","### 検査項目","","#### ja-technical-writing","","| ルール                               | 確かめること                             |","| ------------------------------------ | ---------------------------------------- |","| `sentence-length`                    | 一文を 100 文字以内にする                |","| `max-comma`                          | 一文のカンマ（,）を 3 つまでにする       |","| `max-ten`                            | 一文の読点（、）を 3 つまでにする        |","| `no-mix-dearu-desumasu`              | 「である」と「ですます」を混ぜない       |","| `ja-no-mixed-period`                 | 文末を「。」で終える                     |","| `arabic-kanji-numbers`               | 算用数字と漢数字を使い分ける             |","| `no-doubled-conjunction`             | 同じ接続詞を続けない                     |","| `no-doubled-conjunctive-particle-ga` | 逆接の「が」を一文に 2 回使わない        |","| `no-double-negative-ja`              | 二重否定を使わない                       |","| `no-doubled-joshi`                   | 同じ助詞を続けない                       |","| `no-dropping-the-ra`                 | ら抜き言葉を使わない                     |","| `no-nfd`                             | UTF8-MAC の濁点を使わない                |","| `no-zero-width-spaces`               | ゼロ幅スペースを使わない                 |","| `ja-no-abusage`                      | よくある誤用を避ける                     |","| `ja-no-redundant-expression`         | 冗長な表現を避ける                       |","| `ja-unnatural-alphabet`              | 入力ミスで紛れたアルファベットを残さない |","| `no-unmatched-pair`                  | 括弧を対にする                           |","","#### ja-spacing","","| ルール                                 | 確かめること                                      |","| -------------------------------------- | ------------------------------------------------- |","| `ja-space-between-half-and-full-width` | 半角の文字と全角の文字の間にスペースを入れる      |","| `ja-space-around-code`                 | インラインコードの前後にスペースを入れる          |","| `ja-space-around-link`                 | リンクの前後にスペースを入れる                    |","| `ja-space-around-emphasis`             | 斜体の前後にスペースを入れる                      |","| `ja-space-around-strong`               | 太字の前後にスペースを入れる                      |","| `ja-no-space-around-parentheses`       | 全角の括弧と [ ] の内側と外側にスペースを入れない |","","### 非検査項目","","docv は、次のルールを使わない。","","#### ja-technical-writing","","| ルール                         | 確かめないこと                 |","| ------------------------------ | ------------------------------ |","| `max-kanji-continuous-len`     | 漢字が続く長さ                 |","| `no-invalid-control-character` | 制御文字                       |","| `no-exclamation-question-mark` | 感嘆符と疑問符を使うこと       |","| `no-hankaku-kana`              | 半角カナ                       |","| `ja-no-weak-phrase`            | 「かもしれない」などの弱い表現 |","| `ja-no-successive-word`        | 同じ語の連続                   |","","#### ja-spacing","","| ルール                                            | 確かめないこと                 |","| ------------------------------------------------- | ------------------------------ |","| `ja-no-space-around-slash`                        | スラッシュの前後のスペース     |","| `ja-no-space-between-full-width`                  | 全角の文字どうしの間のスペース |","| `ja-nakaguro-or-halfwidth-space-between-katakana` | カタカナ語の区切りの文字       |","| `ja-space-after-exclamation`                      | 文末の感嘆符の後のスペース     |","| `ja-space-after-question`                         | 文末の疑問符の後のスペース     |","","---","","## 6. 整形との連動（`format.enabled`）","","整形の形は docv が決め、設定では変えない。設定で決めるのは、check を整形と連動させるかだけ。整形は、管理対象のファイル、`dir.slot` の中の Markdown（md の Slot と ADR）、YAML の Slot の Markdown の項目にかける。YAML の Slot は、Markdown の項目の中身を整形し、字下げを付け直して書き戻す。`docv.yaml` と YAML の Slot の末尾の改行は、1 つに整える。","","- 表は、列ごとに縦の線の位置を揃える。幅は、全角の文字（Unicode の East Asian Width が W か F の文字）を 2、それ以外の文字を 1 と数える","- エディタの表の揃え方は、この数え方と違うことがある。手で揃えず、`docv fix` の結果を正とする","- 整形の形は docv の版ごとに固定する。同じ docv なら、同じ入力から同じ結果になる","","| コマンド     | `format.enabled` が true のときの動き                             |","| ------------ | ----------------------------------------------------------------- |","| `docv check` | 整形が必要なファイルを、ルール ID format-diff の error として出す |","","- format-diff には、整形した結果と最初に違う行を出す","- false でも、`docv fix` を直接実行すれば整形できる","","---","","## 7. 推奨する配置","","新しく始めるプロジェクトでは、次の配置をすすめる。`docv init` は、この配置を前提にした `docv.yaml` を作る。","","```","README.md        # 管理外。HTML では README のページにする。docv-index.md へリンクする","docv-index.md    # docv build が作るインデックス（dir.index）","docs/            # Free ファイル","  *.md           # 分類はディレクトリではなくタグで行う","  tmp/           # メモを置く。ignore に入れる","docv/            # Slot ファイル","  service/       # サービス。ほかに system/、guide/、operation/","    service.md","  adr/           # ADR","output/docv/     # docv build の出力","  html/","```","","- `docs/` と `docv/` を分けるのは、プロジェクトがミッションと形を決める Free ファイルと、docv が決める Slot ファイルを、置き場所で見分けられるようにするため","","配置はプロジェクトが決める。既存のディレクトリに合わせて `dir` を書けばよい。","","---","","## 8. スキーマの参照","","- `docv.yaml` の先頭に、yaml-language-server の書式でスキーマの URL を書くと、エディタで補完と検証が効く","- URL には docv の版を含める。`docv init` は、実行した CLI の版の URL を書く","- `docv init --print` で、すべての項目を既定の値でコメントにした `docv.yaml` を出す。スキーマの写しは `docs/schema/config.md` に置く"]},{"path":"docv/service/service/cli.md","href":"サービス/サービス仕様/コマンド.html","tags":[],"lines":["---","order: 6","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# コマンド","","どのコマンドにも共通する決まり。コマンドごとの使い方は、[利用マニュアル](../manual.md)。","","---","","## 1. ルートと出力","","- docv ルートで実行するコマンド（利用マニュアルのコマンド一覧）は、カレントディレクトリをルートにし、そこにある `docv.yaml` を読む。親のディレクトリは探さない","- 結果は標準出力に、エラーは標準エラーに出す","","---","","## 2. ファイルを書くコマンド","","| コマンド | 書くもの                                                                                                                                                                                                                           |","| -------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| init     | `docv.yaml` だけ。`--print` のときは書かない                                                                                                                                                                                       |","| slot gen | 指定した Slot ファイルだけ。`--print` のときは書かない                                                                                                                                                                             |","| fix      | 管理対象のファイル、`dir.slot` の中の Markdown（md の Slot と ADR）、YAML の Slot だけ。整形と textlint の自動修正だけをする。YAML の Slot は、Markdown の項目の中身だけを直す。`docv.yaml` と YAML の Slot は、末尾の改行も整える |","| build    | `dir.html` と `dir.image` の中と、`dir.index` を書いたときの `docv-index.md` だけ。出力先は、目印の `.docv` を残して中を消し、作り直す。`--no-image` のときは `dir.image` に触れない                                               |","","- ほかのコマンドは、ファイルを書かない","- `CLAUDE.md`、リポジトリのルートの `.gitignore`、hook の設定は、どのコマンドも書かない","- build は、出力先に `.docv`（docv が作った目印）がなく、空でもないときは、何も書かずにエラーで終わる。`dir.html` や `dir.image` を間違えて既存のディレクトリを指しても消さないため","- build は、すでにある `docv-index.md` の 1 行目に docv の印のコメントがないときも、何も書かずにエラーで終わる。手で書いた同じ名前のファイルを消さないため","- `dir.index` を消しても、build は `docv-index.md` を消さない","","---","","## 3. 終了コード","","| コード | 意味                                                                                         |","| ------ | -------------------------------------------------------------------------------------------- |","| 0      | 成功。check で指摘が 1 件もない                                                              |","| 1      | check で指摘（error）が 1 件以上ある。fix で直せないファイルがある。open に対応していない OS |","| 2      | `docv.yaml` がスキーマに合わない、引数が正しくない、など実行できない                         |","","---","","## 4. 言語","","CLI のメッセージ、ヘルプ、docv の概要、テンプレは、日本語だけで書く。切り替えはできない。英語に訳した版を持つと、同じことを 2 か所で揃え続けることになるため。"]},{"path":"docv/service/service/html.md","href":"サービス/サービス仕様/ビジュアライズ.html","tags":[],"lines":["---","order: 7","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# ビジュアライズ","","`docv build` が作る HTML、JPG、インデックスの作り。","","---","","## 1. HTML の作り","","- CSS は各ページの中に書く。外部の CDN は使わない。file:// で開いても、そのままホスティングしても見られる","- JS は、決定のページのカーソルキーでの移動、プロジェクト詳細のタグのトグル、検索のページにだけ使い、ページの中に書く。どれも JPG にしないページで、JS が動かなくても、すべての中身は読め、リンクから辿れる。OS ごとの手順のタブは、JS を使わず CSS で切り替える。分けたサービス仕様とシステム仕様のタブは、ページへのリンクにする","- すべてのページの左に、README とトップの 5 ページ（プロジェクト概要、ADR、プロジェクト詳細、現在の設定、検索）へのサイドバーを、右に、そのページの h2 と h3 の目次を置く。README は、そのページがあるときだけ先頭に出す。見出しのないページでは、目次の代わりに同じ幅の空きを置き、ページを移っても本文の位置を変えない。印刷の表示（JPG）では、どちらのサイドバーも出さない","- 検索のページは、Slot ファイル、ADR、Free ファイルの中身を行ごとに並べた索引を、ページの中に書く。入力した文字列をそのまま含む行を探し、入力欄の下に、ファイルごとにパス、タグ、ヒットした行の前後 2 行を並べる。プレビューの長い行は、折り返さずに横へスクロールする。入力欄は、JS が動くときだけ出す","- フェンスのコードブロックは、フェンスに書いた言語（`yaml` など）に合わせて、build のときに色を付ける。色は HTML の中に埋め込み、JS は使わない。言語がないか、docv が知らない言語なら、色を付けずに出す","- リンクは、README、Free ファイル、Slot ファイル、ADR のページにだけ、出力先の中の相対パスで張る（ツリー、Slot ファイルや Free ファイルの本文の中のリンク）。file:// で開けば file:// のまま、ホスティングすればその中で辿れる。`docv.yaml` へのリンクは、現在の設定のページに向ける。HTML は clone したリポジトリで見るので、ほかのファイル（コード、管理外のファイルなど）はエディタで開けばよく、リンクにせず文字だけを出す","- 本文の中の http:// と https:// で始まる URL は、`[文字](URL)` の形で書いていなくてもリンクにする。URL は、空白、`\u003c`、`>`、ASCII でない文字の前で終わり、末尾の句読点と、対になっていない `)` は含めない。日本語の文と続けて書いても、後ろの文を URL に含めないため。リンク、画像、コードの中の URL は変えない","- 画像は、元のファイルを出力先から辿れる相対パスで読む","- 表のセルの中のインラインコードは、折り返さない。コマンドやパスが途中で切れないようにするため","","---","","## 2. README のページ","","- ルートの `README.md` を、`README.html` のページにする。`README.md` がないか、`ignore` に当てはまるときは作らない","- `README.md` の h1 をページの h1 にし、本文の見出しは h2 から始まるように段を付け直す。見出しには、GitHub と同じ形のアンカーを付ける","- `README.md` は管理外のままにする。check と fix はかけず、検索の索引にも入れない","- README のページは JPG にしない。Markdown なので、GitHub でそのまま見られる","","---","","## 3. Slot のページ","","- Slot は 1 つずつ独立したページ（`\u003cまとまり>/\u003cSlot>.html`）にする。`index.html`（プロジェクト概要）には、まとまりの見出しの下に、[Slot](slot.md) のページの「一覧」の章の順で、すべての Slot のカードを横に並べる。画面の幅に収まらなければ折り返す。紙面を縦に使いすぎず、画像にしてもすべてのカードが写るため。置いていない Slot のカードは、グレーにしてリンクにしない。どのミッションのドキュメントがないかを見せるため。カードの幅は固定し、画面の幅に合わせない。幅は、いちばん長い Slot の名前（7 文字）が折り返さない大きさ","- Slot のカードと、Slot のページの見出しには、Slot ごとのアイコンを付ける。アイコンは、docv が Slot ごとに持つ線画の SVG で、外部の素材を使わない","- Slot のページには、Slot の名前の見出しを出す。Slot のミッションは HTML には出さない。ミッションは、AI Agent がどの Slot に書くかを決める手がかりにする","- 折りたたみは使わない。`details` も、Markdown の中の `\u003cdetails>` も、開いて出す。画像にしても、すべての中身が読めるようにするため","- 開閉するのは、OS ごとの手順のタブだけ。手順の中身が 1 つならタブにせず、複数なら書いた順にタブを並べる。JPG では、すべての OS の手順を並べて写す","- 分けたサービス仕様とシステム仕様は、ページを 1 つずつ `サービス/サービス仕様/\u003ch1>.html` と `システム/システム仕様/\u003ch1>.html` にする。Slot の名前の見出しの下に、すべてのページへのリンクを `order` の順にタブとして並べ、開いているページのタブに印を付ける。カードは、先頭のページを開く","- 用語集は、まとまりごとに `name` を h2 にし、`items` を「日本語 | 英語 | 意味」の表にする","- 見た目に凝らない。見出し、段落、箇条書き、表だけで出す","- ディレクトリは、1 つの表に 1 段だけを「名前 | 説明」で出し、入れ子は表を分けて出す。いちばん上の段の表を先に置き、下の段を持つディレクトリごとに、そのパスの h2 と、その下の 1 段の表を後ろに並べる。並びは、親の次にその子の順。下の段を持つディレクトリの名前は、その表へのページ内リンクにする。表の名前はコードの書式にし、h2 のパスはコードの書式にしない。名前の列の幅は、表どうしで揃える。入れ子を折りたたみで見せないのは、画像にしても読めるようにするため。`entries` に書いていない途中のディレクトリは、説明なしで出す","- 見出しは、ページの先頭の h1（Slot の名前）が 1 つだけで、その下に h2 を並べる。段は飛ばさない（h1 の次に h3 や h4 を置かない）","  - Markdown（md の Slot、`appendix_markdown`、`details`、手順の中身）の見出しは、置く場所に合わせて段を付け直す。md の Slot と `appendix_markdown` は h2 から、`details` と手順の中身は h3 から","- 手順（インストール、環境構築）は、「手順」の h2 の下に番号付きで並べる","- 開発コマンドは、順番のない項目なので番号を付けない。先頭に目次（項目へのページ内リンク）を置き、各項目を h2 で始める","- YAML の Slot の `appendix_markdown` は、スキーマで決めた項目のあとに続けて出す","- md の Slot の見出しには、Free ファイルのページと同じく、GitHub と同じ形のアンカーを付ける。`[docv init](#docv-init)` のようなページ内リンクが HTML でも GitHub でも飛べる","- md の Slot のページは JPG にしない。md は GitHub でそのままプレビューできるため","","---","","## 4. ADR のページ","","- `ADR.html` に、`group` ごとに h2 を置き、決定のつながりを、過去から未来へ左から右に箱と矢印で並べる。打ち消された決定の箱は、破線で薄く出す","- 箱の幅はそろえ、題は箱の中で折り返す。1 列に並びきらないときは、その列を横にスクロールする","- 箱は決定のカードで、クリックすると決定 1 つのページ（`ADR/\u003cgroup>/\u003ctitle>.html`）を開く。決定 1 つを 1 ページにする","- 決定のページには、題を h1 にし、本文を出す。本文の見出しは h2 から始まるように段を付け直す。id と日付は出さない","- ADR のページは JPG にしない。ADR は Markdown なので、GitHub でそのまま見られる","- 決定のページの下に、前後の決定をカードで出す。打ち消した過去の決定は ← を付けて左に、この決定を打ち消した新しい決定は → を付けて右に置く。新しい決定へのつながりは、生成するときに `supersedes` を逆にたどって組み立てる","- カーソルキーの ← と → で、前後の決定のページに移れる。前後に決定が複数あるときは、先頭のカードのページに移る","","```","言語","+-----------+   +-------------+","| Go にする | → | Rust にする |","+-----------+   +-------------+","+--------------+","| React にする |","+--------------+","```","","---","","## 5. 現在の設定のページ","","`docv build` は、HTML の「現在の設定」のページに、`docv.yaml` のすべての項目と今の値を 1 つの表で並べる。何を設定でき、どれが効いているかを、スキーマを読まずに見るためのページ。","","- 項目は、`dir.html` のように、キーを `.` でつないだ名前で出す。並びは、スキーマの順","- 書いていない項目は、既定の値で出す。値のない項目は `-` を出す","- 配列の項目は、要素を箇条書きにする","- 選ぶ項目（true か false、allow か deny など）は、候補を横に並べ、選んでいる候補に色を付ける","- 表の後に、textlint の検査項目と非検査項目（[設定ファイル](config.md) のページの「textlint」の章）を、それぞれ表で並べる","- Slot ファイルや Free ファイルから `docv.yaml` へのリンクは、HTML ではこのページに向ける","","---","","## 6. 毎回同じ出力にする決まり","","- 生成日時、実行したマシンのパス、乱数を出力に入れない","- 並び順を固定する。Slot は規格の順（分けたサービス仕様とシステム仕様のページは `order` とパスの順）、Free ファイルはディレクトリのツリーの順、Slot の中の項目は書いた順、ADR は日付と id の順。検索の索引は、Slot ファイル、ADR、Free ファイルの順","- 入力（管理対象のファイル、`README.md`、Slot、ADR、`docv.yaml`、docv の版）が同じなら、HTML とインデックスはバイト単位で同じになる","- JPG は、同じマシン・同じ Chrome・同じフォントなら同じになる。違うマシンで同じにすることはしない。チームで JPG を共有するなら、GitHub Actions などの決まった環境で作る","","---","","## 7. JPG","","- `dir.image` を書いたときだけ、build の最後に作る。`--no-image` を付けると作らない","- Slot のページを 1 枚ずつ、`dir.image` に `\u003cまとまり>/\u003cSlot>.jpg` の名前で置く","- 幅は 1280 CSS ピクセル、画質は 80。印刷の表示で、ページ全体を 1 枚に写す","- Chrome は、環境変数 DOCV_CHROME、OS ごとの標準のインストール先、PATH にある chrome と chromium の順に探す。見つからなければ error で終わる","","---","","## 8. インデックス","","`dir.index` を書いたときだけ、build が `docv-index.md` を書く。GitHub でリポジトリを開いた人が、clone しなくても Slot ファイルを読めるようにするためのリンク集。README からリンクして使う。","","- Slot を、HTML のプロジェクト概要と同じく、まとまりごとに規格の順で、リンクの箇条書きにして並べる。分けたサービス仕様とシステム仕様は、Slot の名前の下に、ページを `order` の順に入れ子で並べる。置いていない Slot は出さない","- md の Slot は、元のファイルへリンクする。GitHub で Markdown のまま読めるため。ファイルがシンボリックリンクなら、ルートの中にある先のファイルへリンクする。GitHub は、シンボリックリンクを開いても先の中身を出さないため","- YAML の Slot は、`dir.image` を書いていれば JPG へリンクし、書いていなければ出さない。JPG へリンクするかは `dir.image` を書いたかで決め、`--no-image` を付けても同じインデックスにする","- Free ファイルと ADR は、それぞれの章に、置いているディレクトリへのリンクだけを出す。どちらも詳細やプロジェクト固有の情報で、知りたくなった人は clone すると考えるため。検索とタグでの絞り込みはプロジェクト詳細のページで、ADR のつながりの図は ADR のページで見られると、`docv open` と、そのページの `dir.html` の中のパスで案内する","- リンクは、`docv-index.md` の場所からの相対パスで、`[名前](\u003cパス>)` の形で書く。パスに空白や日本語が入っても、GitHub で辿れるようにするため","- 1 行目に、docv が作ったことを示すコメントを書く。build は、このコメントで始まらない `docv-index.md` を書き換えない（[コマンド](cli.md) のページの「ファイルを書くコマンド」の章）","- インデックスが古いままかは、check で確かめない。Slot を変えたら build で作り直す","- エイリアス（シンボリックリンク）やコピーを並べたディレクトリは作らない。GitHub はシンボリックリンクの先を出さず、コピーは同じ中身を 2 か所で持つことになり、md の中の相対リンクも壊れるため"]},{"path":"docv/service/manual.md","href":"サービス/利用マニュアル.html","tags":[],"lines":["---","mission: 利用者の使い方（CLI のコマンド、GUI の操作など）","---","","# 利用マニュアル","","## コマンド一覧","","| コマンド                                       | 説明                                 | 実行ディレクトリ |","| ---------------------------------------------- | ------------------------------------ | ---------------- |","| [`docv init`](#docv-init)                      | `docv.yaml` を作る                   | 任意             |","| [`docv desc`](#docv-desc)                      | docv の概要を出す                    | 任意             |","| [`docv check [path...]`](#docv-check)          | 管理対象のチェックを行う             | docv ルート      |","| [`docv fix [path...]`](#docv-fix)              | 管理対象のフォーマットとリントを行う | docv ルート      |","| [`docv build`](#docv-build)                    | 人間向けの HTML を作る               | docv ルート      |","| [`docv open`](#docv-open)                      | 作った HTML をブラウザで開く         | docv ルート      |","| [`docv slot list`](#docv-slot-list)            | Slot の一覧を出す                    | 任意             |","| [`docv slot schema \u003cslot>`](#docv-slot-schema) | YAML の Slot のスキーマを出す        | 任意             |","| [`docv slot gen \u003cslot>`](#docv-slot-gen)       | Slot ファイルを、決まったパスに作る  | docv ルート      |","","docv ルート: `docv.yaml` のあるディレクトリ。","","## コマンド詳細","","### docv init","","`docv.yaml` を作る。","","| オプション | 意味                                   |","| ---------- | -------------------------------------- |","| `--print`  | `docv.yaml` を作らずに、書く中身を出す |","| `--force`  | `docv.yaml` がすでにあっても書き直す   |","","### docv desc","","docv の概要を表示する。","","AI Agent にはこれを入力にして進めさせる。","","### docv check","","ドキュメントファイルを検査する。","","| オプション      | 意味                                                                         |","| --------------- | ---------------------------------------------------------------------------- |","| `--no-textlint` | textlint だけを飛ばす ( 設定で textlint を有効化している場合のみ意味がある ) |","","```sh","docv check","docv check docs/spec/order.md","```","","対象ファイルと主な検査内容は次のとおり。","","| 検査内容                                  | Slot ( md ) | Slot ( yaml )          | Free ( md ) | ADR ( md ) |","| ----------------------------------------- | ----------- | ---------------------- | ----------- | ---------- |","| YAML front matter およびタグ              | ✅          |                        | ✅          | ✅         |","| ドキュメントのリンク切れ                  | ✅          | ✅ ( markdown 部のみ ) | ✅          | ✅         |","| 見出しの数と章番号                        | ✅          |                        | ✅          | ✅         |","| Slot ファイルの名前とスキーマ             | ✅          | ✅                     |             |            |","| 太字、斜体、ドルマークの利用 ( 設定次第 ) | ✅          | ✅ ( markdown 部のみ ) | ✅          | ✅         |","| format ( 設定次第 )                       | ✅          | ✅ ( markdown 部のみ ) | ✅          | ✅         |","| textlint ( 設定次第 )                     | ✅          | ✅ ( markdown 部のみ ) | ✅          | ✅         |","","Slot ( md ) の YAML front matter は、`mission` が `docv slot list` のミッションと同じかを検査する。ページに分けたサービス仕様とシステム仕様は、YAML front matter の `order` と、ページどうしの `order` と h1 の重なりも検査する。","","Slot ( yaml ) の markdown 部は、名前が `_markdown` で終わる項目。値は `|` のブロックで書く。`|` で書いていない項目と、それ以外の項目を複数行で書いたものは、スキーマの検査で error にする。","","パスを渡しても、検査するファイルが絞られるだけで、検査内容は変わらない。","","現在の設定は [現在の設定](../../docv.yaml) を参照。","","### docv fix","","ドキュメントファイルの自動修正できるところを変更する。","","修正内容は次のとおり。","","- format ( 設定次第 )","- textlint が自動修正できる箇所 ( 設定次第 )","","### docv build","","人間向けの HTML を生成する。","","- 出力先は `docv.yaml` で指定された `dir.html`","- `docv.yaml` で `dir.image` を指定すると、Slot のページを JPG にしてそこに出す","  - 要 Google Chrome または Chromium","  - JPG はマシンのフォントで変わる。チームで共有するなら、GitHub Actions などの決まった環境で作る","- `docv.yaml` で `dir.index` を指定すると、Slot ファイルへのリンクを並べた `docv-index.md` を書く","  - README からリンクすると、GitHub でリポジトリを開いた人が、clone しなくても Slot ファイルを読める","  - YAML の Slot は JPG へリンクするので、`dir.image` も指定し、JPG を git で管理する","","| オプション   | 意味                                                         |","| ------------ | ------------------------------------------------------------ |","| `--no-image` | `dir.image` を指定していても JPG を作らない。HTML だけを作る |","","### docv open","","`docv build` が `dir.html` に作ったプロジェクト概要（`index.html`）を、既定のブラウザで開く。","","- macOS は `open`、Windows は `explorer` で開く","- ほかの OS には対応しない。対応していないと表示し、終了コード 1 で終わる","- まだ `docv build` していなければ、何も開かずにエラーで終わる","","### docv slot list","","Slot の名前、作るファイル、ミッションの一覧を表示する。","","### docv slot gen","","Slot ファイルを、決まったパスに作る。","","YAML の Slot には、1 行目にスキーマの URL を書く。yaml-language-server に対応したエディタ（VS Code の YAML の拡張など）で、項目の補完と検証が効く。","","md の Slot には、YAML front matter の `mission` にミッションを書く。","","| オプション | 意味                                    |","| ---------- | --------------------------------------- |","| `--print`  | Slot ファイルを作らずに、書く中身を出す |","| `--force`  | Slot ファイルがすでにあっても書き直す   |","","```sh","docv slot gen manual               # docv/service/manual.md を作る","docv slot gen doc-guide            # docv/guide/doc-guide.md に、ガイドラインの雛形を作る","docv slot gen doc-guide --print    # 運用中のファイルと雛形を見比べる","```","","サービス仕様とシステム仕様をページに分けるときは、`docv/service/service/` か `docv/system/system/` の下にページを手で置く（[ページ分け](service/desc.md#ページ分け)）。ページがあるときは、`docv slot gen service` と `docv slot gen system` は、1 つのファイルを作らずにエラーで終わる。","","### docv slot schema","","YAML の Slot のスキーマ（JSON Schema）を表示する。","","```sh","docv slot schema words # 用語集のスキーマを表示","```","","## スキーマ一覧","","- [`docv.yaml`](../../docs/schema/config.md)","- [インストール](../../docs/schema/install.md)","- [用語集](../../docs/schema/words.md)","- [技術スタック](../../docs/schema/stack.md)","- [ディレクトリ](../../docs/schema/directory-tree.md)","- [環境構築](../../docs/schema/setup.md)","- [環境変数](../../docs/schema/env.md)","- [開発コマンド](../../docs/schema/develop.md)","- [費用](../../docs/schema/cost.md)"]},{"path":"docv/service/install.yaml","href":"サービス/インストール.html","tags":[],"lines":["# yaml-language-server: $schema=../../assets/schema/install.schema.json","requirements:","  - name: Node.js","    purpose_markdown: |","      textlint を使うときだけ要る。`docv check --no-textlint` なら要らない","    url: https://nodejs.org/","  - name: Google Chrome","    purpose_markdown: |","      JPG を作るときだけ要る","steps:","  - id: binary","    name: バイナリを取る","    items:","      - os: windows","        body_markdown: |","          GitHub Release から `docv-1.2.1-x86_64-pc-windows-msvc.zip` を取り、展開した docv.exe を PATH の通った場所に置く。","      - os: macos","        body_markdown: |","          GitHub Release からバイナリを取り、パスの通った場所に置く。arm64 の例。","","          ```sh","          curl -L https://github.com/suzuki-hoge/docv/releases/download/v1.2.1/docv-1.2.1-aarch64-apple-darwin.tar.gz | tar xz","          mv docv /usr/local/bin/","          ```","","          ブラウザでダウンロードしたバイナリは、macOS の Gatekeeper に止められることがある。curl で取れば止められない。","      - os: linux","        body_markdown: |","          GitHub Release からバイナリを取り、パスの通った場所に置く。x86_64 の例。","","          ```sh","          curl -L https://github.com/suzuki-hoge/docv/releases/download/v1.2.1/docv-1.2.1-x86_64-unknown-linux-musl.tar.gz | tar xz","          mv docv /usr/local/bin/","          ```","  - id: cargo","    name: ソースから入れる（Rust の環境があるとき）","    items:","      body_markdown: |","        ```sh","        cargo install --git https://github.com/suzuki-hoge/docv","        ```","  - id: local","    name: 手元のソースから入れる（Rust の環境があるとき）","    items:","      body_markdown: |","        クローンしたリポジトリや、手を入れている作業中のソースから入れる。リポジトリのルートで実行する。","","        ```sh","        cargo install --path .","        ```","","        `~/.cargo/bin/docv` に入る。ソースを変えたら、もう一度実行すると入れ直せる。"]},{"path":"docv/service/words.yaml","href":"サービス/用語集.html","tags":[],"lines":["# yaml-language-server: $schema=../../assets/schema/words.schema.json","groups:","  - name: ファイルの種類","    items:","      - en: Slot","        desc_markdown: |","          どのプロジェクトにも要るドキュメントを書くファイル（Slot ファイル）。docv がミッションと形を決める。`docv/` に `\u003cまとまり>/\u003cID>.\u003c拡張子>` の名前で置く。19 の Slot がある","      - en: Free","        desc_markdown: |","          プロジェクトがミッションと形を決める Markdown のファイル（Free ファイル）。AI Agent が読み書きし、詳細を記録する。`docv.yaml` の `dir.free` のディレクトリ（既定は `docs/`）に置く","      - en: ADR","        desc_markdown: |","          決めたこと 1 つを、背景、選ばなかった案と一緒に残す記録。`docv/adr/` に 1 つの Markdown で置き、決めた後は書き換えない","  - name: 決まりの種類","    items:","      - ja: ルール","        en: Rule","        desc_markdown: |","          docv の仕組みが決める決まり。Slot と `docv.yaml` のスキーマ、YAML front matter の key、check が確かめることなど。利用側は変えられず、`docv desc` と `docv slot schema` で見る","      - ja: ガイドライン","        en: Guideline","        desc_markdown: |","          利用側がドキュメントを書くときの方針。調整の余地があり、利用側が自由に直す。Slot の Doc ガイドに書き、`docv slot gen doc-guide` で雛形を作る","      - ja: 設定","        en: Config","        desc_markdown: |","          `docv.yaml` で切り替えること。check のルールや textlint を使うか、出力を git で管理するかなど。`docv init --print` で見る","  - name: ファイルの分類","    items:","      - ja: 管理対象","        desc_markdown: |","          `docv.yaml` の `dir.free` のディレクトリの下の Markdown。YAML front matter に `mission` が要り、check の対象になる","      - ja: 管理外","        desc_markdown: |","          `dir.free` の外にあり、`ignore` にも当てはまらない Markdown。docv は中身を見ない","  - name: 書き方","    items:","      - ja: ミッション","        en: Mission","        desc_markdown: |","          そのファイルを読むと何が分かるか。Slot のミッションは docv が決め、Free ファイルのミッションは YAML front matter の `mission` に 1 文で書く。中身は、ミッションに収まることだけにする","      - ja: タグ","        en: Tags","        desc_markdown: |","          Free ファイルに付ける分類。1 つのファイルに任意の数を付けられ、タグにルールを付けられる"]},{"path":"docv/system/system-overview.md","href":"システム/システム概要.html","tags":[],"lines":["---","mission: 開発者に向けた、システムを作る部品と、そのつながりの全体像","---","","# システム概要","","docv は、利用者のリポジトリの中で動く単一の CLI で、サーバーを持たない。リポジトリのドキュメントを読み、検査と整形をし、人間が見る HTML を作る。外の道具は、使うと決めたときだけ呼ぶ。","","![部品とつながり](../../docs/figure/system-overview.svg)","","| 部品                     | 役割                                                                                                                                                                                                                                                                            |","| ------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| docv（CLI）              | ドキュメントを検査し、整形し、HTML を作る。決まり、雛形、HTML の部品を埋め込み、1 つで配る                                                                                                                                                                                      |","| リポジトリのドキュメント | `docv.yaml`、Slot ファイル、Free ファイル、ADR。AI Agent と人間が書き、docv が読む。fix は書き直す                                                                                                                                                                              |","| textlint                 | 日本語の文章を検査する。`docv.yaml` で使うと決めたときだけ、check と fix が npx で呼ぶ                                                                                                                                                                                          |","| Chrome                   | HTML のページを JPG にする。`docv.yaml` に `dir.image` を書いたときだけ、build が動かす                                                                                                                                                                                         |","| HTML、JPG                | build の出力。人間が全体像を掴むために見る。HTML はローカルで開き、検索したりリンクを辿れる。JPG は git で管理すれば GitHub で見られ、clone しなくても概要を把握できる。`dir.index` を書けば、GitHub で Slot ファイルと JPG を辿る入り口のインデックス（`docv-index.md`）も書く |","| GitHub                   | スキーマを版のタグごとに公開し、バイナリを配る。YAML の Slot と `docv.yaml` の 1 行目が、スキーマを指す                                                                                                                                                                         |","","部品ごとの振る舞いと、部品をまたいで守る決まりは、[システム仕様](system.md)。使っている言語とライブラリは、[技術スタック](stack.yaml)。"]},{"path":"docv/system/system.md","href":"システム/システム仕様.html","tags":[],"lines":["---","mission: 部品ごとの振る舞いと、部品の間の流れと、部品をまたいで守る決まり","---","","# システム仕様","","部品の全体像は、[システム概要](system-overview.md)。コマンドから見た振る舞いは、サービス仕様に書く。読み書きするファイルと終了コードは [コマンド](../service/service/cli.md)、HTML と JPG は [ビジュアライズ](../service/service/html.md) のページ。","","## 処理の流れ","","1. `docv.yaml` を読み、スキーマで確かめる。init、desc、slot list、slot schema と、`--print` を付けた slot gen は、`docv.yaml` を読まない","2. ルート以下のファイルを分類し、Slot、ADR、Free ファイルを読む","3. コマンドに応じて、次の部品を使う","","| コマンド | 使う部品                                                                                                                                |","| -------- | --------------------------------------------------------------------------------------------------------------------------------------- |","| check    | 埋め込んだスキーマと決まりで確かめる。`lint.textlint` が enable なら、npx で textlint を呼ぶ                                            |","| fix      | `lint.textlint` が enable なら、textlint に自動修正させる。続けて、埋め込んだ整形の道具で整形し、書き戻す                               |","| build    | HTML を `dir.html` に書き、`dir.index` を書いていればインデックスも書く。そのあと、`dir.image` を書いていれば、Chrome に JPG を撮らせる |","","## バイナリに埋め込むもの","","Rust で書いた単一のバイナリにし、次のものを埋め込む。利用者に Rust の環境はいらない。","","- Slot のテンプレ（`assets/template/`。YAML の Slot の項目のサンプルと、ドキュメントのガイドラインの雛形）","- YAML の Slot と `docv.yaml` のスキーマ（`assets/schema/`）","- docv の概要（`docv desc` が出す `assets/desc.md`）。サービス仕様の 1 ページ目（`docv/service/service/desc.md`）は、このファイルへのシンボリックリンク","- HTML の CSS（`assets/style.css`）","- 検索のページの JS（`assets/search.js`）","- Markdown の整形に使う dprint-plugin-markdown","- コードブロックの色付けに使う syntect と、その構文の定義とテーマ","","textlint を使うときだけ Node.js が、JPG を作るときだけ Chrome が要る。どちらもバイナリには入れない。","","## スキーマの公開","","`docv.yaml` と YAML の Slot の JSON Schema（`assets/schema/`）は、埋め込むほかにリポジトリでも公開する。`docv init` と `docv slot gen` は、ファイルの 1 行目に、版のタグを含む URL を書いて参照させる。新しい版の docv が書く URL は、その版のタグを push するまで開けない。","","## textlint とのやりとり","","check と fix は、`lint.textlint` が enable のときだけ textlint を動かす。textlint と 2 つのプリセット（ja-technical-writing、ja-spacing）は、npx で取ってくる。それぞれの版は、docv の版ごとに決める。","","- 設定ファイルは docv が作り、OS のキャッシュのディレクトリに書く。プリセットの既定に頼らず、使わないルールも含めて、すべての値を書く","- YAML の Slot の Markdown の項目は、OS のキャッシュのディレクトリに一時的なファイルとして書いて渡し、使い終わったら消す","- リポジトリには、ファイルを作らない","- 終了コード 1 は指摘として読み、それより大きい終了コードは失敗として扱う","","## Chrome とのやりとり","","build は、ローカルの Chrome をヘッドレスで起動し、DevTools Protocol で出力先の HTML を開いて撮る。印刷の表示にし、ページの高さに画面を合わせて、Slot のページを 1 枚ずつ撮る。","","Chrome が見つからないときや、DevTools に接続できないときは、error で終わる。HTML は、それまでに書き終えている。"]},{"path":"docv/system/stack.yaml","href":"システム/技術スタック.html","tags":[],"lines":["# yaml-language-server: $schema=../../assets/schema/stack.schema.json","stack:","  - group: 言語","    items:","      - name: Rust","        version: 2024 edition","        purpose_markdown: |","          CLI 本体。単一のバイナリにして配る","        url: https://www.rust-lang.org/","  - group: 埋め込むもの","    items:","      - name: dprint-plugin-markdown","        version: 0.26.0","        purpose_markdown: |","          Markdown の整形（docv fix）。Rust のライブラリとしてバイナリに埋め込む。Prettier と違って Node.js がいらず、docv の版で整形の結果が固定される","      - name: syntect","        version: 5.3.0","        purpose_markdown: |","          HTML のコードブロックの色付け（docv build）。構文の定義とテーマごとバイナリに埋め込む","  - group: 実行時に使うもの","    items:","      - name: Node.js（npx）","        purpose_markdown: |","          textlint を使うときだけ要る","      - name: textlint","        version: 15.8.0","        purpose_markdown: |","          日本語の文章の検査。docv の版ごとに版を固定し、npx で取ってくる","      - name: Google Chrome","        purpose_markdown: |","          JPG を作るときだけ要る","  - group: 配布","    items:","      - name: GitHub Actions","        purpose_markdown: |","          タグの push で各プラットフォーム向けにビルドする","      - name: GitHub Release","        purpose_markdown: |","          アーカイブとチェックサムを置く"]},{"path":"docv/guide/directory-tree.yaml","href":"開発者向けガイド/ディレクトリ.html","tags":[],"lines":["# yaml-language-server: $schema=../../assets/schema/directory-tree.schema.json","entries:","  - path: docv.yaml","    desc_markdown: |","      このリポジトリの docv の設定","  - path: docv-index.md","    desc_markdown: |","      docv build が書くインデックス。GitHub で Slot ファイルと JPG を辿る入り口で、README からリンクする","  - path: src/","    desc_markdown: |","      CLI のソースコード。コマンドごとにファイルを分ける","  - path: assets/","    desc_markdown: |","      実装から参照して出力するもの。バイナリに埋め込む","  - path: assets/template/","    desc_markdown: |","      docv slot gen が書く Slot のテンプレ（YAML の Slot の項目のサンプルと、ドキュメントのガイドラインの雛形）","  - path: assets/schema/","    desc_markdown: |","      YAML の Slot と `docv.yaml` の JSON Schema。`docv slot schema` で出す。公開して、エディタの補完に使う","  - path: assets/desc.md","    desc_markdown: |","      docv desc が出す docv の概要。Slot のサービス仕様の 1 ページ目と同じファイル","  - path: assets/style.css","    desc_markdown: |","      HTML の CSS","  - path: assets/search.js","    desc_markdown: |","      HTML の検索のページの JS","  - path: docs/","    desc_markdown: |","      このリポジトリの Free ファイル（スキーマの写し）と図。docv 自身で管理する","  - path: docv/","    desc_markdown: |","      このリポジトリの Slot ファイル","  - path: docv/adr/","    desc_markdown: |","      決めた経緯（ADR）","  - path: docs/schema/","    desc_markdown: |","      `docv.yaml` と YAML の Slot のスキーマの写し。HTML で公開する","  - path: docs/figure/","    desc_markdown: |","      ドキュメントに載せる図（SVG）。`docv/` には Slot のほかのファイルを置けないので、ここに置く","  - path: output/","    desc_markdown: |","      docv build の出力（HTML と JPG）。コミットする"]},{"path":"docv/guide/setup.yaml","href":"開発者向けガイド/環境構築.html","tags":[],"lines":["# yaml-language-server: $schema=../../assets/schema/setup.schema.json","requirements:","  - name: Rust","    version: stable（2024 edition が使えるもの）","    purpose_markdown: |","      ビルドとテスト","    url: https://rustup.rs/","  - name: Node.js","    purpose_markdown: |","      make fix で textlint をかける","  - name: Google Chrome","    purpose_markdown: |","      make fix で JPG を作る","steps:","  - id: install","    name: ビルドして手元に入れる","    items:","      body_markdown: |","        ```sh","        make install","        ```","","        このリポジトリのドキュメントは docv 自身で管理している。コードかドキュメントを変えたら、開発コマンドの `make fix` で確かめる。"]},{"path":"docv/guide/env.yaml","href":"開発者向けガイド/環境変数.html","tags":[],"lines":["# yaml-language-server: $schema=../../assets/schema/env.schema.json","envs:","  - key: DOCV_CHROME","    desc_markdown: |","      JPG を撮るときに使う Chrome の実行ファイルのパス。なければ、OS ごとの標準のインストール先と PATH から探す","    secret: false","    local_from_markdown: |","      シェルの環境変数","    release_from_markdown: |","      使わない（リリースのビルドでは JPG を撮らない）"]},{"path":"docv/guide/develop.yaml","href":"開発者向けガイド/開発コマンド.html","tags":[],"lines":["# yaml-language-server: $schema=../../assets/schema/develop.schema.json","steps:","  - id: fix","    name: 変えたら整えて確かめる","    items:","      body_markdown: |","        コードかドキュメントを変えたら、コミットの前に実行する。指摘が 1 件でもあれば止まる。","","        ```sh","        make fix","        ```","","        - コードを `cargo fmt` で整え、`cargo clippy` と `cargo test` を通す","        - `make check-doc-guide` で docv を install し、Doc ガイドの雛形を整えて確かめる。以降は、install した docv で実行する","        - このリポジトリのドキュメントを `docv fix` で整え、`docv check` を通す","        - `docv build` で、HTML を `output/docv/html/` に、JPG を `output/docv/image/` に、インデックスを `docv-index.md` に作り直す。どれもコミットする。GitHub で `docv-index.md` から JPG を辿れるようにし、clone してすぐ `docv open` で HTML を見られるようにするため","","        textlint を使うので Node.js が、JPG を作るので Chrome が要る。","  - id: check-doc-guide","    name: Doc ガイドの雛形を整えて確かめる","    items:","      body_markdown: |","        docv を install してから、雛形（`assets/template/doc-guide.md`）を一時ディレクトリに書き出して `docv fix` する。雛形は管理対象の外にあるため。変わったら雛形に書き戻して install し直し、`docv check` を通す。`make fix` も、途中でこれを実行する。","","        ```sh","        make check-doc-guide","        ```","  - id: install","    name: 手元の docv を新しくする","    items:","      body_markdown: |","        ```sh","        make install","        ```"]},{"path":"docv/guide/doc-guide.md","href":"開発者向けガイド/Doc%20ガイド.html","tags":[],"lines":["---","mission: このプロジェクトのドキュメントの置き場所と書き方","---","","# Doc ガイド","","このプロジェクトのドキュメントを書く・直すときの方針。人間と AI Agent の両方が従う。","","本ファイルは `docv slot gen doc-guide` が作った雛形で、プロジェクトに合わせて調整し利用する。","","`docv desc` で定義されるルール、設定、ガイドラインのうち、このページはガイドラインについての指示ファイルである。","","## どこに何を書くか","","| 書く内容                                                          | 書く場所                                                                                                       |","| ----------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------- |","| およそ普遍的に必要と思われること\u003cbr>Slot のミッションに当たること | Slot ファイル                                                                                                  |","| それ以外のプロジェクト固有の詳細情報                              | Free ファイル\u003cbr>`mission` 属性で AI Agent が一貫した用途で加筆できる目印にする                                |","| 意思決定や経緯、背景、取らなかった選択など                        | ADR                                                                                                            |","| タスクごとの詳細調査や議論                                        | GitHub Issue                                                                                                   |","| 作業予定                                                          | `docs/plan/`\u003cbr>解決して消すことが前提\u003cbr>いかなるファイルからもここの具体ファイルにリンク・言及してはならない |","| まとまっていない意思決定やメモ                                    | `docs/tmp/`\u003cbr>解決して消すことが前提\u003cbr>いかなるファイルからもここの具体ファイルにリンク・言及してはならない  |","","## 言葉の使い分け","","docv の文脈においては、あいまいな「仕様」という言葉を避け次のように定義している。どのファイルになにを書くべきかの拠り所にすること。","","| 言葉           | 指すもの                                                                                                                                                  | 書く場所                                                                                               |","| -------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------ |","| サービス説明   | docv をなにも知らない利用者へ伝える最初の説明                                                                                                             | サービス概要                                                                                           |","| サービス仕様   | 外から見た機能、振る舞い、決まり。実装をそっくり差し替えても変わらないこと\u003cbr>利用者、AI Agent、開発者が読む                                              | 要点はサービス仕様の 1 ページ目（`docv desc`）\u003cbr>詳しいことは 2 ページ目以降                          |","| アーキテクチャ | 部品（CLI、リポジトリのドキュメント、textlint、Chrome、出力など）の構成と役割、部品の間の流れ、どの処理をどの部品で行うか\u003cbr>開発者が判断を下すときに読む | 全体像はシステム概要。SVG で描く\u003cbr>部品ごとの詳しいことはシステム仕様                                 |","| サービスエラー | 利用者が書いたドキュメントや渡した引数が原因で起きるエラー\u003cbr>例: check の指摘、`docv.yaml` の誤り、終了コード                                            | サービス仕様の 2 ページ目以降                                                                          |","| システムエラー | 環境や外の道具が原因で起きるエラーと、その扱い\u003cbr>例: Chrome が見つからない、Chrome とのやりとりが途切れる                                                | システム仕様                                                                                           |","| 実装           | 1 つの部品の中のことで、コードを読めば分かること（関数やモジュールの分け方、処理の手順、ライブラリの使い方）                                              | 書かない\u003cbr>原則として必要とするのは AI Agent であり、それにとってはコードから自明であるため           |","| 設計           | 何かを判断し決めること。ドキュメントの種類ではない                                                                                                        | 決めたいことは `docs/tmp/` や GitHub Issue\u003cbr>決めた結果はミッションに沿うファイル\u003cbr>経緯や廃案は ADR |","","サービス仕様とシステム仕様は、複数ページに分割できる。明確な分割点は docv では指定しないが、およそ次のような観点でページが肥大化しすぎないよう分割するといい。","","- 読み手の違う情報がページに混在している","- 読むタイミングの違う情報がページに混在している","- 異なるコンポーネントや異なる機能の情報がページに混在している","","サービス仕様の 1 ページ目は、`docv desc` と同じ `desc.md`（`assets/desc.md` へのシンボリックリンク）にする。`docv desc` と一致させるため、このページは 1 ファイルのまま保ち、AI Agent が最初に読む要点だけを書く。詳しいことは 2 ページ目以降に書く。","","### 書き分けの例","","| 種類     | サービス仕様                                    | システム仕様                                         |","| -------- | ----------------------------------------------- | ---------------------------------------------------- |","| 出力     | HTML のページの作りと、毎回同じ出力にする決まり | Chrome を動かして JPG を撮る流れ                     |","| エラー   | check の指摘と終了コード                        | 外の道具が見つからないときや、やりとりが途切れたとき |","| スキーマ | YAML の Slot と `docv.yaml` の項目              | スキーマを埋め込み、版のタグの URL で公開すること    |","| 外の道具 | textlint で確かめる項目と、使うかどうかの設定   | どのコマンドが、どの道具を、いつ呼ぶか               |","","## 望ましいドキュメント","","- 概要と詳細が適切に分類されている","  - 概要は要点がまとまっていて、詳細は `\u003cdetails>` で折りたたみ必要なときのみ視認できるようになっている","- 現在の情報が整理されている","- 用語集の単語に沿って書かれている","- 事実と予定・課題管理を混ぜない","","## 望ましくないドキュメント","","- `mission` の示す内容が一意になっていない / ひとつのファイルに複数の内容を混ぜている","- 過去の情報がすべて羅列されている → 今現在知らなくていいことは随時削除し、必要な経緯は ADR に移す","- 同じ内容が複数の箇所に書いてある","- 実装が書いてあり、コードを変えるたびに直す必要がある","- Slot のミッションに当たる内容が、Free ファイルに置かれている","- コードの行番号やドキュメントの章番号など、頻繁に変更される情報に依存している","","## タグ","","HTML 閲覧しやすくするため、Free ファイルにはタグをつける。","","| タグ     | 書くこと                                                            |","| -------- | ------------------------------------------------------------------- |","| スキーマ | `docv.yaml` と YAML の Slot の JSON Schema の写し（`docs/schema/`） |","","## AI Agent への指示","","- セッション開始時に `docv desc` を実行し、本ファイルの指示に従いドキュメント管理をすること","- Slot ファイルのスキーマは `docv slot` 系コマンドで確認すること","- ドキュメント変更時は `docv fix` を通すこと","- ドキュメントを書き足すときは、増えた情報を適切な量で反映すること","- 実装は、指示がない限り書かないこと","- Free ファイルを足す前に、その mission がどれかの Slot のミッションに当たらないかを確かめること。当たるなら、その Slot に書き、長くなるならページに分けること","- Free ファイルに spec/ や architecture/ のような、Slot の代わりになるディレクトリができそうになったら、Slot のページ（タブ）の分け方を見直すこと","- 既存の文書を Slot に移すときは、ミッションに当たらない記述を、ほかの Slot、Free ファイル、ADR に分けること。実装は移さないこと","- 変わった情報は原則として上書きし、古くなった情報は原則として抹消すること","- ADR は加筆の指示があるまで作成せず、必要と思われる状況では作成提案にとどめること","- 検討中の項目、メモ、課題などを管理する場合は、正式ドキュメントとは分けて管理すること","  - タグや `docv.yaml` の `ignore` を活用すること","- アスキーアートを用いたいときは、まず SVG で作図すること"]},{"path":"docv/operation/release.md","href":"運用/リリース.html","tags":[],"lines":["---","mission: 版の決め方と、利用者への届け方","---","","# リリース","","版は `Cargo.toml` の `version` で決め、タグの push を合図に、GitHub Actions が各プラットフォーム向けのバイナリを GitHub Release に置く。","","## 手順","","1. `Cargo.toml` の `version` を上げてコミットする","2. v で始まるタグを push する（人間が行う）","","   ```sh","   git tag v1.0.0","   git push origin v1.0.0","   ```","","3. GitHub Actions が各プラットフォーム向けにビルドし、GitHub Release に置く","","## 置くもの","","- アーカイブの名前は `docv-\u003c版>-\u003ctarget>.tar.gz`。Windows は .zip。チェックサムも置く","- 対象は macOS（arm64、x86_64）、Linux（x86_64、arm64）、Windows（x86_64）"]},{"path":"docv/operation/cost.yaml","href":"運用/費用.html","tags":[],"lines":["# yaml-language-server: $schema=../../assets/schema/cost.schema.json","accepted_items:","  - name: GitHub Actions（標準のランナー）","    desc_markdown: |","      タグの push で各プラットフォーム向けにビルドする。public リポジトリでは、macOS と Windows のランナーも無料","    monthly: 0 円","  - name: GitHub Release","    desc_markdown: |","      リリースのアーカイブの置き場所。public リポジトリでは無料","    monthly: 0 円","rejected_items: []"]},{"path":"docv/adr/archive.md","href":"ADR/記録/外した内容は理由と一緒に%20archive%20に移す.html","tags":[],"lines":["---","group: 記録","date: 2026-10-10","---","","# 外した内容は理由と一緒に archive に移す","","## 決めたこと","","ドキュメントから外した内容は、`docv retire` で archive のディレクトリに移し、移した理由と元の場所を残す。"]},{"path":"docv/adr/fmt-command.md","href":"ADR/コマンド/整形は%20docv%20fmt%20で行う.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-10","---","","# 整形は docv fmt で行う","","## 決めたこと","","整形だけをする `docv fmt` と、整形が必要なファイルを出す `docv fmt --check` を置く。"]},{"path":"docv/adr/kinds.md","href":"ADR/構造化/ドキュメントを組み込みの種類と時間で分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-10","---","","# ドキュメントを組み込みの種類と時間で分ける","","## 背景","","何をどのファイルに書くかを決める手がかりが要る。","","## 決めたこと","","overview、spec、operation、cost、rule、plan、proposal、fixme、archive、tmp の種類を組み込みで持つ。種類ごとに時間（現在、未来、過去）、粒度、見出しの制約を決める。"]},{"path":"docv/adr/local-only.md","href":"ADR/フレームワークの範囲/check%20と%20HTML%20の生成はローカルで完結させる.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-10","---","","# check と HTML の生成はローカルで完結させる","","## 決めたこと","","check と build は、手元で実行して完結させる。CI での実行と公開は、利用者が必要なら自分で組む。","","## 選ばなかった案","","| 案                                                | 選ばなかった理由                   |","| ------------------------------------------------- | ---------------------------------- |","| GitHub Actions で check を実行し、HTML を公開する | ローカルで完結するほうが使いやすい |"]},{"path":"docv/adr/no-drift-detection.md","href":"ADR/フレームワークの範囲/実装とドキュメントのずれを検出しない.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-10","---","","# 実装とドキュメントのずれを検出しない","","## 決めたこと","","実装状態はドキュメントに書かない方針とし、実装とのずれは管理しない。コードの改善は Issue にする。","","## 選ばなかった案","","| 案                                                                                            | 選ばなかった理由                                 |","| --------------------------------------------------------------------------------------------- | ------------------------------------------------ |","| YAML front matter に根拠のコードのパスと確認した日を書き、コードが変わったら check が知らせる | 実装状態を書かないので、ずれを管理する必要がない |"]},{"path":"docv/adr/no-typed-blocks.md","href":"ADR/構造化/構造化は%20YAML%20front%20matter%20と%20docv.yaml%20に限る.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-10","---","","# 構造化は YAML front matter と `docv.yaml` に限る","","## 決めたこと","","個々のファイルの本文には、細かい形の制約を入れない。決まった形で書くものは、docv の規格のファイル（Slot）にする。","","## 選ばなかった案","","| 案                                                       | 選ばなかった理由                                                |","| -------------------------------------------------------- | --------------------------------------------------------------- |","| 費用やコマンドを、本文の中の YAML のコードブロックで書く | 本文に細かい制約を入れると、Markdown として読み書きしにくくなる |"]},{"path":"docv/adr/build-on-ci.md","href":"ADR/配布/GitHub%20Actions%20で各プラットフォーム向けにビルドする.html","tags":[],"lines":["---","group: 配布","date: 2026-10-11","---","","# GitHub Actions で各プラットフォーム向けにビルドする","","## 決めたこと","","v で始まるタグの push で、GitHub Actions が各プラットフォーム向けにビルドし、GitHub Release に置く。","","## 選ばなかった案","","| 案                                                                           | 選ばなかった理由                                                                                    |","| ---------------------------------------------------------------------------- | --------------------------------------------------------------------------------------------------- |","| 手元の Mac で全プラットフォーム向けにビルドし、gh release でアップロードする | public リポジトリなら macOS と Windows のランナーも無料で使え、タグを push するだけでリリースできる |","| Linux のランナーで cargo-zigbuild を使い、macOS 向けもクロスコンパイルする   | 各 OS のランナーで素直にビルドできるので、クロスコンパイルの手間をかける理由がない                  |"]},{"path":"docv/adr/fix-command.md","href":"ADR/コマンド/整形と%20textlint%20の自動修正を%20docv%20fix%20にまとめる.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-11","supersedes: [fmt-command]","---","","# 整形と textlint の自動修正を docv fix にまとめる","","## 背景","","textlint の自動修正も docv から呼ぶことにした。","","## 決めたこと","","整形と textlint の自動修正を `docv fix` にまとめる。整形が必要なファイルは check の format-diff で分かるので、`--check` は置かない。","","## 選ばなかった案","","| 案                      | 選ばなかった理由                                                         |","| ----------------------- | ------------------------------------------------------------------------ |","| check に --fix を付ける | check が通らないのに直さない、という選択肢はない。check は検査だけにする |"]},{"path":"docv/adr/rules-only.md","href":"ADR/フレームワークの範囲/AI%20Agent%20にはルールファイルを渡すところまでにする.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-11","---","","# AI Agent に
