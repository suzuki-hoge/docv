はルールファイルを渡すところまでにする","","## 背景","","AI Agent がドキュメントを書くとき、docv のルールに沿わせる手段が要る。","","## 決めたこと","","docv はルールファイル（`docv desc`）を出すところまでにする。ルールに沿って直させる作業や `CLAUDE.md` への追記は、フレームワークの外で利用者が行う。","","## 結果","","docv は特定の AI Agent の仕組みに依存しない。","","## 選ばなかった案","","| 案                                                          | 選ばなかった理由                                                                                |","| ----------------------------------------------------------- | ----------------------------------------------------------------------------------------------- |","| Skill を提供し、docv init で `CLAUDE.md` と hook を設定する | 特定の AI Agent の仕組みに寄りすぎる。利用者の `CLAUDE.md` や hook に docv が書き込むことになる |"]},{"path":"docv/adr/rust.md","href":"ADR/配布/Rust%20で書く.html","tags":[],"lines":["---","group: 配布","date: 2026-10-11","---","","# Rust で書く","","## 決めたこと","","CLI は Rust で書き、単一のバイナリにして配る。","","## 選ばなかった案","","| 案        | 選ばなかった理由                                                                                         |","| --------- | -------------------------------------------------------------------------------------------------------- |","| Go で書く | GitHub Actions で各プラットフォーム向けにビルドするなら、Go のクロスコンパイルの手軽さは決め手にならない |"]},{"path":"docv/adr/tags.md","href":"ADR/構造化/種類をやめ、任意の数を付けられるタグで分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-11","supersedes: [kinds]","---","","# 種類をやめ、任意の数を付けられるタグで分ける","","## 背景","","1 つのファイルに 1 つの種類では、複数の性質を持つファイルを表せない。種類ごとの決まりも、プロジェクトによって合わない。","","## 決めたこと","","分類は、YAML front matter の `tags` に任意の数を書くタグで行う。種類ごとのルールは、`docv.yaml` の `lint.tags` でタグに付ける。","","## 結果","","どのプロジェクトにもある問いは、タグではなく docv の規格のファイル（Slot）で答える。"]},{"path":"docv/adr/add-command.md","href":"ADR/コマンド/Slot%20のファイルは、パスではなく%20Slot%20の名前で作る.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-12","---","","# Slot のファイルは、パスではなく Slot の名前で作る","","## 背景","","`docv new \u003cパス>` で、原本、Slot、ADR のファイルを、パスに応じたテンプレから作っていた。","","## 決めたこと","","`docv add \u003cslot>` で、Slot のファイルだけを作る。パスは指定しない。YAML の Slot には項目のサンプルを書き、md の Slot は空のファイルを作る。YAML と md のどちらでも置ける Slot は、`api-yaml` と `api-md` のように名前で形を選ぶ。原本と ADR は、コマンドを使わずに書く。","","## 結果","","Slot のパスを覚えなくてよく、`docv add --list` で作れる Slot が分かる。原本と ADR のテンプレはなくなる。","","## 選ばなかった案","","| 案                            | 選ばなかった理由                                                                                    |","| ----------------------------- | --------------------------------------------------------------------------------------------------- |","| `docv new \u003cパス>` を残す      | Slot のパスは docv が決めていて、選ぶ余地がない。パスを書かせると、間違えたときに直させるだけになる |","| md の Slot にもテンプレを書く | md の Slot は自由に書くもので、サンプルの中身は消すことになる                                       |"]},{"path":"docv/adr/adr.md","href":"ADR/記録/決めた経緯は%20ADR%20で記録する.html","tags":[],"lines":["---","group: 記録","date: 2026-10-12","supersedes: [archive]","---","","# 決めた経緯は ADR で記録する","","## 背景","","archive は、外した本文を移したものの集まりで、保守するドキュメントではなかった。何を比べて何を選んだかを読み返すには、本文より、決定ごとの記録のほうが向いている。","","## 決めたこと","","決定 1 つを 1 つの Markdown で `docv/adr/` に置き、ファイル名を id にする。システムが使う項目（`group`、`date`、`supersedes`）は YAML front matter に書く。決定を変えるときは、新しい決定の `supersedes` から過去の決定を指す。HTML では、まとまりごとに決定のつながりを図で見せる。","","## 結果","","`docv retire`、archive のディレクトリ、YAML front matter の source はなくなる。`docs/` には今の姿だけを書く。","","## 選ばなかった案","","| 案                                     | 選ばなかった理由                                                                 |","| -------------------------------------- | -------------------------------------------------------------------------------- |","| archive を続ける                       | 外した本文がたまるだけで、決めた理由を探しにくい                                 |","| ADR に状態（採用、却下など）を持たせる | ADR に残すのは決めたことだけ。打ち消されたかは、新しい決定からのつながりでわかる |","| YAML front matter に `id` を書く       | ファイル名と二重になる                                                           |"]},{"path":"docv/adr/desc-as-service.md","href":"ADR/フレームワークの範囲/docv%20desc%20はサービス仕様と同じ%20docv%20の概要を出す.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-12","---","","# docv desc はサービス仕様と同じ docv の概要を出す","","## 背景","","`docv desc` は、原本の書き方と spec の 3 つを AI Agent 向けにまとめたルールファイルを出していた。同じことが 2 か所にあり、どう揃えるかが決まっていなかった。","","## 決めたこと","","`docv desc` は docv の概要を出し、docv のサービス仕様のページと同じ内容にする。元のファイルは `assets/desc.md` で、`docv/service/service.md` はそのシンボリックリンクにする。","","## 結果","","規格の詳細は desc に書き写さない。desc とサービス仕様を別々に揃える必要がなくなる。","","## 選ばなかった案","","| 案                              | 選ばなかった理由                              |","| ------------------------------- | --------------------------------------------- |","| desc に規格の詳細をまとめ続ける | 同じことが 2 か所にあり、揃え続ける必要がある |"]},{"path":"docv/adr/docs-pages.md","href":"ADR/出力/原本も%20HTML%20のページにする.html","tags":[],"lines":["---","group: 出力","date: 2026-10-12","---","","# 原本も HTML のページにする","","## 背景","","HTML のプロジェクト詳細のツリーは、原本の元の Markdown のファイルにリンクしていた。HTML を見ている人は、原本を読むたびに GitHub かエディタへ移ることになる。","","## 決めたこと","","原本を 1 つずつ HTML のページ（`プロジェクト詳細/\u003c原本のパス>.html`）にし、ツリーの題からリンクする。Slot や原本の本文の中にある原本へのリンクも、そのページに向ける。原本のページは JPG にしない。","","## 結果","","HTML の中だけで、全体像から原本の詳細まで辿れる。ツリーにファイル名を出す理由がなくなるので、ファイル名は出さない。","","## 選ばなかった案","","| 案                                   | 選ばなかった理由                                      |","| ------------------------------------ | ----------------------------------------------------- |","| 元の Markdown のファイルにリンクする | HTML を見ている人が、原本を読むたびに HTML の外に出る |"]},{"path":"docv/adr/no-index.md","href":"ADR/コマンド/AI%20Agent%20向けの一覧を出すコマンドを持たない.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-12","---","","# AI Agent 向けの一覧を出すコマンドを持たない","","## 背景","","AI Agent が読むファイルを選べるように、Slot、原本、ADR の一覧と、それぞれが答える問いを出す `docv index` を持っていた。","","## 決めたこと","","`docv index` をなくす。AI Agent は、`docv/` の Slot と、`docs/` の原本の YAML front matter の `mission` を見て、読むファイルを選ぶ。","","## 結果","","コマンドが 1 つ減る。`CLAUDE.md` などには `docv desc` の実行だけを書けばよい。","","## 選ばなかった案","","| 案                  | 選ばなかった理由                                                                                                    |","| ------------------- | ------------------------------------------------------------------------------------------------------------------- |","| `docv index` を残す | Slot は `docv/` に、原本は `docs/` に分かれていて、どこに何があるかは置き場所で自明。一覧を出すコマンドに価値がない |"]},{"path":"docv/adr/no-migrate-guide.md","href":"ADR/コマンド/後から入れるときのガイドを出すコマンドを持たない.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-12","---","","# 後から入れるときのガイドを出すコマンドを持たない","","## 背景","","`docv migrate-guide` は、後から docv を入れるときと docv を上げたときに使うコマンドだった。管理外のファイルの数、タグと Slot の案、check の結果、版ごとの移行の手順を出していた。版の管理をなくし（no-version）、版ごとの手順は出せなくなった。","","## 決めたこと","","`docv migrate-guide` をなくす。後から入れるときも、docv を上げたときも、`docv desc` で docv を知り、`docv check` の結果を見て直す。","","## 結果","","コマンドが 1 つ減る。`docv.yaml` のない場所で動くコマンドは、init、desc、`add --list` だけになる。","","## 選ばなかった案","","| 案                                         | 選ばなかった理由                         |","| ------------------------------------------ | ---------------------------------------- |","| 版の章を除いて `docv migrate-guide` を残す | `docv check` と `docv desc` だけで足りる |"]},{"path":"docv/adr/no-version.md","href":"ADR/記録/docv%20で版を管理しない.html","tags":[],"lines":["---","group: 記録","date: 2026-10-12","---","","# docv で版を管理しない","","## 背景","","原本の YAML front matter に、そのファイルが従う docv の版（`version`）を書いていた。check は版が古いと知らせ、migrate-guide はファイルの版から今の版まで、版ごとの手順をつないで出していた。`docv.yaml` にも、設定ファイルの形式の版を書いていた。","","## 決めたこと","","docv から版の管理をなくす。原本と `docv.yaml` の `version` をなくす。check の version-missing、version-newer、version-older と、migrate-guide の版の章もなくす。docv を上げたときも、後から入れるときも、`docv desc` と `docv check` を見て直す。","","## 結果","","原本の YAML front matter は `mission` と `tags` だけになる。Slot の書式が版で変わったら、check のエラーで気づく。","","## 選ばなかった案","","| 案                                                       | 選ばなかった理由                                    |","| -------------------------------------------------------- | --------------------------------------------------- |","| 原本の `version` を残す                                  | `docs/` のファイルは、docv で版を管理する必要がない |","| 版ごとの手順だけ残し、migrate-guide で元の版を指定させる | `docv desc` と `docv check` で直せる                |","| `docv.yaml` にプロジェクトの版を 1 つ書く                | `docv desc` と `docv check` で直せる                |"]},{"path":"docv/adr/slot-name.md","href":"ADR/構造化/規格のファイルを%20Slot%20と呼ぶ.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-12","---","","# 規格のファイルを Slot と呼ぶ","","## 背景","","どのプロジェクトにもある問いに、決まった形で答える規格のファイルを「枠」と呼んでいた。","","## 決めたこと","","「Slot」と呼ぶ。ドキュメント、CLI のメッセージとヘルプ、コードのコメントで揃える。","","## 結果","","`docv add \u003cslot>`、`docv.yaml` の `slots.dir`、`docs/spec/slot.md` と呼び方が揃う。","","## 選ばなかった案","","| 案           | 選ばなかった理由             |","| ------------ | ---------------------------- |","| 「枠」のまま | 何を指すのか意味がわからない |"]},{"path":"docv/adr/slot-schema.md","href":"ADR/コマンド/YAML%20の%20Slot%20のスキーマを%20docv%20schema%20で出す.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-12","---","","# YAML の Slot のスキーマを docv schema で出す","","## 背景","","YAML の Slot の項目の意味と、必須かどうかを知る手段が、テンプレのサンプルと check のエラーしかなかった。docv desc と docv check だけで docv を入れたり直したりするには、項目の意味が要る。","","## 決めたこと","","YAML の Slot ごとに、YAML で書いた JSON Schema を `assets/schema/` に置き、バイナリに埋め込む。`docv schema \u003cslot>` で Slot のスキーマを、`docv schema` で `docv.yaml` のスキーマを出す。同じものを `docs/schema/` の Markdown に写し、HTML で公開する。","","## 結果","","AI Agent は `docv desc` から `docv schema \u003cslot>` にたどり着き、項目の意味を知ってから Slot を書ける。スキーマと `docs/schema/` の写し、テンプレとこのリポジトリの Slot がスキーマに合っていることは、cargo test で確かめる。check は今までどおり Slot の型で確かめる。"]},{"path":"docv/adr/spec-into-slots.md","href":"ADR/記録/docv%20自身の設計は%20Slot%20に書き、spec%20には規格の詳細だけを残す.html","tags":[],"lines":["---","group: 記録","date: 2026-10-12","---","","# docv 自身の設計は Slot に書き、spec には規格の詳細だけを残す","","## 背景","","docv 自身の設計を `docs/spec/` の 15 ファイルに書いていた。Slot を作ってからは、サービス仕様、システム仕様、利用マニュアル、インストール、デプロイとリリースの Slot に書いたことが spec にもあり、2 か所で揃え続けることになっていた。","","## 決めたこと","","Slot の問いに答える内容は Slot に書き、spec と重なる記述は消す。`docs/` には、どの Slot の問いにも収まらない docv の規格の詳細（原本の書き方、Slot、ADR、`docv.yaml`）だけを残す。コマンドの挙動は利用マニュアルの `details` に、内部の決まりはシステム仕様に書く。","","## 結果","","spec は `slot.md`、`adr.md`、`config.md` の 3 つになり、原本の書き方は `rule/docs/guideline.md` に置く。`docv desc` のルールファイルの元は、この 4 つになる。docv 自身が、Slot に書けばドキュメントが足りることを示すサンプルになる。","","## 選ばなかった案","","| 案                                         | 選ばなかった理由                                                                     |","| ------------------------------------------ | ------------------------------------------------------------------------------------ |","| spec を正本にし、Slot からはリンクする     | Slot の問いの答えが Slot の中でそろわない。Slot は詳しいことも Slot の中に書く決まり |","| spec を Slot の `include` で埋め込む       | コマンドごと、章ごとに埋め込むことになり、どこに何があるかが分かりにくい             |","| `docv.yaml` の詳細も利用マニュアルに入れる | 利用マニュアルのページが長くなりすぎる。`docv.yaml` は規格として spec に残す         |"]},{"path":"docv/adr/split-deploy-release.md","href":"ADR/構造化/デプロイとリリースを別の%20md%20の%20Slot%20にする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-12","---","","# デプロイとリリースを別の md の Slot にする","","## 背景","","運用のまとまりに、デプロイとリリースを 1 つにした YAML の Slot（手順の形）を置いていた。","","## 決めたこと","","環境に反映すること（デプロイ）と、版を決めて利用者に届けること（リリース）を、別の Slot（`operation/deploy.md` と `operation/release.md`）にする。どちらも md にする。","","## 結果","","どちらかしかないプロジェクトは、ある方の Slot だけを置ける。環境ごとの違い、承認、切り戻しなど、番号付きの手順に収まらないことも書ける。","","## 選ばなかった案","","| 案                                 | 選ばなかった理由                                                                                              |","| ---------------------------------- | ------------------------------------------------------------------------------------------------------------- |","| 1 つの Slot のまま、手順の形で書く | 答える問いが 2 つあり、サーバーを持たない CLI のように片方しかないプロジェクトでは、Slot の名前と中身がずれる |","| 分けて、どちらも手順の YAML にする | デプロイとリリースは、手順のほかに書くこと（環境ごとの違い、切り戻し）が多く、`body` に寄せることになる       |"]},{"path":"docv/adr/code-highlight.md","href":"ADR/出力/HTML%20のコードブロックに%20build%20のときに色を付ける.html","tags":[],"lines":["---","group: 出力","date: 2026-10-13","---","","# HTML のコードブロックに build のときに色を付ける","","## 背景","","HTML のコードブロックは色がなく、YAML のスキーマのページなどで、キーと値の見分けがつきにくかった。","","## 決めたこと","","フェンスのコードブロックに、言語に合わせて色を付ける。色付けには Rust のライブラリ syntect を使い、構文の定義とテーマごとバイナリに埋め込む。色は build のときに HTML の中に埋め込み、JS は使わない。テーマは syntect の既定のテーマにある InspiredGitHub。","","## 結果","","HTML と JPG のコードブロックに色が付く。バイナリは構文の定義とテーマの分だけ大きくなる。言語がないか、syntect が知らない言語のブロックには色が付かない。"]},{"path":"docv/adr/fix-slot-markdown.md","href":"ADR/コマンド/Slot%20のディレクトリの%20Markdown%20も整形する.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-13","---","","# Slot のディレクトリの Markdown も整形する","","## 背景","","md の Slot と ADR は管理対象に入らず、docv fix の整形と textlint がかからなかった。表の縦の揃えは書いた人のエディタで決まり、エディタによって全角の文字の幅の数え方が違うため、直すたびに差分が出ていた。","","## 決めたこと","","`slots.dir` の中の Markdown（md の Slot と ADR）にも、管理対象のファイルと同じく、整形と textlint をかける。原本のルール（YAML front matter、書式の規則など）はかけない。表は、全角の文字を 2、それ以外の文字を 1 と数えて揃え、`docv fix` の結果を正とする。","","## 結果","","docv fix が md の Slot と ADR の表を揃える。`format.enabled` が true なら、揃っていない表を check が format-diff で出す。エディタで揃えた表は、fix で揃え直される。","","## 選ばなかった案","","| 案                              | 選ばなかった理由                                                                         |","| ------------------------------- | ---------------------------------------------------------------------------------------- |","| `docs` に `docv/**/*.md` を足す | 原本のルールがかかり、md の Slot と ADR にも YAML front matter の mission を求めてしまう |","| 表の幅を文字の数で数える        | 全角の文字を含む表が、等幅のフォントで揃って見えない                                     |"]},{"path":"docv/adr/manual-md.md","href":"ADR/構造化/利用マニュアルを%20md%20の%20Slot%20にする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-13","---","","# 利用マニュアルを md の Slot にする","","## 背景","","利用マニュアルは YAML の Slot で、ページの構成はコマンドの形（先頭のコマンドの表と、コマンドごとの見出し）で決まっていた。このリポジトリの利用マニュアルでは、コマンドの一覧と詳細に加えて、スキーマの一覧を章として並べたい。","","## 決めたこと","","利用マニュアルは md の Slot（`service/manual.md`）にする。YAML の利用マニュアルはなくす。docv add の名前は `manual` のままにする。","","## 結果","","利用マニュアルは、ほかの md の Slot と同じくそのまま HTML に出し、JPG にしない。テンプレとスキーマはなくなり、`docv schema manual` は md の Slot としてエラーにする。","","## 選ばなかった案","","| 案                            | 選ばなかった理由                                                  |","| ----------------------------- | ----------------------------------------------------------------- |","| YAML と md のどちらでも置ける | 利用マニュアルは md にしたので、Slot の名前は `manual` であるべき |"]},{"path":"docv/adr/slots-dir-exclude.md","href":"ADR/コマンド/Slot%20のディレクトリでも除外のルールを守る.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-13","---","","# Slot のディレクトリでも除外のルールを守る","","## 背景","","check は、`slots.dir` の下のファイルをすべて Slot の候補として読み、除外するかどうかを見ていなかった。`output.dir` の既定の `docv/build` は `slots.dir` の中にある。そのため、build のあとの check が、出力の HTML と JPG を slot-unknown の error にしていた。macOS の `.DS_Store` と、`.gitignore` に書いたファイルも、同じく error になっていた。","","## 決めたこと","","Slot と ADR を探すときも、原本と同じく、`.gitignore` に書かれたもの、`output.dir` の中、`ignore` に当てはまるものを除く。名前がドットで始まるファイルとディレクトリも読まない。Slot の名前はドットで始まらないため。`output.dir` の既定は `docv/build` のままにする。","","## 結果","","既定の設定のまま build しても、check は出力を見ない。`slots.dir` の中に置いたドットで始まるファイルは、Slot の名前に近くても slot-unknown にならない。","","## 選ばなかった案","","| 案                                           | 選ばなかった理由                                                                      |","| -------------------------------------------- | ------------------------------------------------------------------------------------- |","| `output.dir` の既定を `slots.dir` の外にする | 出力の問題しか解けず、`.DS_Store` と `.gitignore` に書いたファイルは error のまま残る |"]},{"path":"docv/adr/assets-only.md","href":"ADR/配布/実装から参照して出力するものを%20assets-%20にまとめる.html","tags":[],"lines":["---","group: 配布","date: 2026-10-15","---","","# 実装から参照して出力するものを assets/ にまとめる","","## 背景","","バイナリに埋め込むものが、3 か所に分かれていた。","","- `templates/`: YAML の Slot のサンプル","- `schema/`: `docv.yaml` のスキーマ","- `assets/`: CSS、docv の概要、YAML の Slot のスキーマ","","利用側が書き換えるかどうかや、公開するかどうかで分けていた。しかし、どれも実装から参照して出力するものという点で同じ。","","## 決めたこと","","実装から参照して出力するものは、すべて `assets/` に置く。YAML の Slot のサンプルは `assets/template/`、`docv.yaml` のスキーマは `assets/schema/docv.schema.json` に置く。`templates/` と `schema/` はなくす。","","## 結果","","埋め込むものは `assets/` を見れば揃う。`docv.yaml` から参照するスキーマの URL は `.../v\u003c版>/assets/schema/docv.schema.json` になる。タグを付けた版の URL は、その版の中身を指すので変わらない。","","## 選ばなかった案","","| 案                                              | 選ばなかった理由                                                 |","| ----------------------------------------------- | ---------------------------------------------------------------- |","| 利用側に書くもの（サンプル）を分けて置く        | 書き換えるかどうかは利用側の扱いで、実装の置き場所とは関係がない |","| 公開するスキーマだけをルートの `schema/` に残す | 公開は URL で参照するだけで、置き場所を分ける理由にならない      |"]},{"path":"docv/adr/directory-tables.md","href":"ADR/出力/ディレクトリのページを%201%20段ずつの表に分ける.html","tags":[],"lines":["---","group: 出力","date: 2026-10-15","---","","# ディレクトリのページを 1 段ずつの表に分ける","","## 背景","","ディレクトリのページは、すべてのパスを 1 つの表に並べ、深さを字下げで見せていた。深いパスと浅いパスが同じ表に混ざり、どのディレクトリの中身かが読み取りにくい。","","## 決めたこと","","1 つの表には 1 段だけを「名前 | 説明」で出し、入れ子は表を分けて出す。いちばん上の段の表を先に置き、下の段を持つディレクトリごとに、そのパスの h2 と 1 段の表を後ろに並べる。下の段を持つディレクトリの名前は、その表へのページ内リンクにする。名前の列の幅は、表どうしで揃える。表の名前はコードの書式にし、h2 のパスはコードの書式にしない。パスから GitHub へのリンクは付けない。","","## 結果","","表を見れば、1 つのディレクトリの直下に何があるかが分かる。入れ子を折りたたまないので、JPG にもすべての表が写る。深い入れ子は、ページ内リンクで下の表へ移って読む。","","## 選ばなかった案","","| 案                                       | 選ばなかった理由                                                                                                 |","| ---------------------------------------- | ---------------------------------------------------------------------------------------------------------------- |","| `pre` のツリーのテキストにする           | 長い説明を、画面でははみ出させ、横にスクロールできない JPG では折り返すことになり、画面と JPG で見え方が分かれる |","| 入れ子を折りたたみ（`details`）で見せる  | 画像にしたとき、閉じた中身が写らない                                                                             |","| 1 つの表に全段を並べ、深さで字下げをする | どのディレクトリの中身かが読み取りにくい                                                                         |"]},{"path":"docv/adr/free-file.md","href":"ADR/構造化/原本を%20Free%20ファイルと呼び変える.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-15","---","","# 原本を Free ファイルと呼び変える","","## 背景","","`docs/` の Markdown を「原本」と呼んでいた。docv は `docs/` から `docv/` を作るわけではなく、「原本」という呼び方は、2 つのファイルの関係を誤って伝える。","","## 決めたこと","","`docv/` の YAML と md を Slot ファイル、`docs/` の md を Free ファイルと呼ぶ。2 つは、問いと形を docv が決めるか、プロジェクトが決めるかで分かれる。Slot と Free の日本語の呼び方は定めない。管理対象と管理外の呼び方は残す。用語を変えても、過去の ADR は書き換えない。","","## 結果","","Slot、spec、guideline、README、コードのコメントから「原本」がなくなる。過去の ADR には「原本」が残り、今の用語では読めないことがある。","","## 選ばなかった案","","| 案                            | 選ばなかった理由                                        |","| ----------------------------- | ------------------------------------------------------- |","| Topic ファイル                | Slot との対の関係が、名前から読み取れない               |","| Doc ファイル                  | Slot ファイルもドキュメントなので、区別の名前として弱い |","| Text ファイル                 | Slot の md と YAML もテキストなので、区別にならない     |","| 過去の ADR の用語も書き換える | ADR は決めた後は書き換えない                            |"]},{"path":"docv/adr/outline-on-every-page.md","href":"ADR/出力/すべてのページの右に目次を置く.html","tags":[],"lines":["---","group: 出力","date: 2026-10-15","---","","# すべてのページの右に目次を置く","","## 背景","","右のサイドバーの目次は、Free ファイルのページにだけあった。Slot のページ、ADR のページ、index、プロジェクト詳細には目次がなく、ページによって読み方が変わる。YAML の Slot や ADR の見出しには id もなく、見出しへのリンクを張れない。","","## 決めたこと","","すべてのページの右に、そのページの h2 と h3 の目次を置く。id のない見出しには、Free ファイルと同じ形の id を付ける。見出しのないページでは、目次を出さない。","","## 結果","","どのページでも、目次から見出しへ移れる。どのページの見出しにも、ページ内リンクを張れる。","","## 選ばなかった案","","| 案                                          | 選ばなかった理由                                       |","| ------------------------------------------- | ------------------------------------------------------ |","| Free ファイルと Markdown の Slot にだけ置く | YAML の Slot や ADR のページだけ、目次がないままになる |","| 見出しのないページにも空の目次を置く        | 移る先がないので、場所を取るだけになる                 |"]},{"path":"docv/adr/page-only-links.md","href":"ADR/出力/HTML%20のリンクはページにだけ張る.html","tags":[],"lines":["---","group: 出力","date: 2026-10-15","---","","# HTML のリンクはページにだけ張る","","## 背景","","HTML は、Free ファイルにはそのページへリンクしていた。Slot ファイル、ADR、コードなどのほかのファイルには、`docv.yaml` の `repository.url` があれば GitHub に、なければ元のファイルにリンクしていた。HTML は clone したリポジトリで見るので、file:// で見ている人が GitHub へ移ったり、元の Markdown や YAML を開いたりすることになる。","","## 決めたこと","","リンクは、Free ファイル、Slot ファイル、ADR のページにだけ、出力先の中の相対パスで張る。ほかのファイル（コード、管理外のファイルなど）へのリンクは、文字だけを出す。`repository` の設定はなくす。例外は 2 つで、画像は元のファイルを相対パスで読み、API 仕様書と DB 仕様書の `ref` の先へは `index.html` のカードから相対パスでリンクする。","","## 結果","","file:// で開いても、ホスティングしても、HTML の中だけで辿れる。コードなどは、HTML からではなくエディタで開く。","","## 選ばなかった案","","| 案                                                         | 選ばなかった理由                                                                                    |","| ---------------------------------------------------------- | --------------------------------------------------------------------------------------------------- |","| `repository.url` を残し、ページのないファイルを GitHub へ  | clone したリポジトリで見るので、GitHub を辿る必要がない。非公開のリポジトリやオフラインでは開けない |","| ページのないファイルも、元のファイルに相対パスでリンクする | コードや管理外のファイルは、エディタで開けばよい                                                    |"]},{"path":"docv/adr/wrap-cards.md","href":"ADR/出力/Slot%20のカードを折り返して並べる.html","tags":[],"lines":["---","group: 出力","date: 2026-10-15","---","","# Slot のカードを折り返して並べる","","## 背景","","`index.html` の Slot のカードは、まとまりごとに 1 行で並べていた。画面に収まらないカードは、横にスクロールして見る。まとまりの Slot が増えると、幅の狭い画面では後ろのカードが隠れる。","","## 決めたこと","","カードは横に並べ、画面の幅に収まらなければ折り返す。カードの幅は固定のままにする。","","## 結果","","どの幅の画面でも、すべてのカードが見える。Slot の多いまとまりは、縦に 2 行以上を使う。","","## 選ばなかった案","","| 案                               | 選ばなかった理由                                 |","| -------------------------------- | ------------------------------------------------ |","| 横のスクロールのままにする       | スクロールしないと、置いていない Slot が見えない |","| カードの幅を画面に合わせて縮める | 長い Slot の名前が折り返す                       |"]},{"path":"docv/adr/api-db-md.md","href":"ADR/構造化/API%20仕様書と%20DB%20仕様書を%20md%20だけにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-16","---","","# API 仕様書と DB 仕様書を md だけにする","","## 背景","","API 仕様書と DB 仕様書は、yaml（外の定義への `ref` だけ）と md のどちらでも置けた。Slot の名前は `api-yaml` と `api-md` のように形で分かれ、yaml のときだけページを作らず、カードから定義へ直接リンクしていた。形が 2 つあるため、名前、check、HTML のリンクに、この 2 つの Slot だけの決まりが要った。","","## 決めたこと","","API 仕様書と DB 仕様書は md だけにし、Slot の名前を `api` と `db` にする。ほかの md の Slot と同じく、ページにしてそのまま出す。","","## 結果","","すべての Slot が、形を 1 つだけ持つ。同じ Slot のファイルが 2 つになることがないので、slot-duplicate はなくなる。外の道具で作った定義は、md の中に書き添える。","","## 選ばなかった案","","| 案                      | 選ばなかった理由                                      |","| ----------------------- | ----------------------------------------------------- |","| yaml と md の両方を残す | 名前、check、リンクに、2 つの Slot だけの決まりが残る |","| yaml（`ref`）だけにする | 説明を書く場所がない                                  |"]},{"path":"docv/adr/command-set.md","href":"ADR/コマンド/コマンドを%20init、desc、check、fix、build、slot%20に組み直す.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-16","---","","# コマンドを init、desc、check、fix、build、slot に組み直す","","## 背景","","HTML と JPG を作るコマンドが build-html と build-image に分かれていた。Slot を作る add と、スキーマを出す schema は、Slot と `docv.yaml` の両方を扱い、名前と中身が合っていなかった。`docv.yaml` の項目は、JSON Schema を読まないと分からなかった。","","## 決めたこと","","- `docv build` で HTML を作る。`output.image` が true のときだけ、続けて Slot のページを JPG にする","- Slot を扱うコマンドは `docv slot` の下に置く","  - `slot list` は、Slot の一覧と問いを出す","  - `slot gen \u003cslot> {--print | --force}` は、Slot ファイルを作る","  - `slot schema \u003cslot>` は、YAML の Slot のスキーマを出す","- md の Slot に `slot gen` を実行したら、空のファイルを作り、中身の形は自由で、問いに答える Markdown を書けばよいと表示する","- `docv init {--print | --force}` は、すべての項目を既定の値でコメントにした `docv.yaml` を書く。`docv schema` はなくす","- コマンドは init、desc、check、fix、build、slot の順に並べる","","## 結果","","`docv --help` の上から順に、導入から日々の作業まで辿れる。設定の項目は `docv init --print` で、Slot の問いは `docv slot list` で分かる。JPG を作らないプロジェクトは、Chrome がなくても build できる。","","## 選ばなかった案","","| 案                                                   | 選ばなかった理由                                               |","| ---------------------------------------------------- | -------------------------------------------------------------- |","| build で常に JPG を作る                              | JPG を使わないプロジェクトにも Chrome が要る                   |","| `slot-list` のように、ハイフンでつないだ名前にする   | `docv slot --help` で、Slot のコマンドだけをまとめて見られない |","| `docv init --print` で、init が書く 3 項目だけを出す | `lint`、`format`、`output` などの項目が見えない                |"]},{"path":"docv/adr/doc-guide.md","href":"ADR/フレームワークの範囲/ガイドラインを%20Doc%20ガイドの%20Slot%20の雛形にする.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-16","---","","# ガイドラインを Doc ガイドの Slot の雛形にする","","## 背景","","Free ファイルの書き方は、このリポジトリの `docs/rule/docs/guideline.md` にだけあり、利用側には届かなかった。届けるとしても、ドキュメントを書くときの方針はプロジェクトごとに調整したい。一方で、YAML front matter の key や check のように、docv の仕組みが決めるものは変えられない。","","## 決めたこと","","docv の決まりを、次の 3 つに分ける。","","- ルール: docv の仕組みが決めるもの。`docv desc` と `docv schema` で見る","- 設定: `docv.yaml` で切り替えるもの","- ガイドライン: ドキュメントを書くときの方針で、利用側が調整するもの","","ガイドラインは、開発者向けガイドの Slot「Doc ガイド」（`guide/doc-guide.md`）に書く。`docv add doc-guide` は、docv が勧めるガイドラインの雛形を書き、作った後は利用側が自由に直す。`docv add doc-guide --print` で、今の版の雛形を出せる。Free ファイルのルールは、`docs/spec/free.md` に分ける。docv 自身の Doc ガイドは、このリポジトリに合わせて直したもので、雛形とは一致させない。","","## 結果","","利用側は、ルールを docv の版と一緒に受け取り、ガイドラインは自分のものとして直せる。Doc ガイドは置き場所が決まっているので、AI Agent が見つけられ、HTML にもカードで出る。雛形を直しても、利用側の Doc ガイドには届かない。差分は `--print` で見比べる。","","## 選ばなかった案","","| 案                                                         | 選ばなかった理由                                                          |","| ---------------------------------------------------------- | ------------------------------------------------------------------------- |","| ガイドラインを `docv desc` に入れる                        | 利用側が調整できない                                                      |","| 基本のガイドラインに、利用側の差分を重ねて出す             | 差分で指せるように、ガイドラインに ID を振る設計が重い                    |","| ガイドラインの項目を、`docv.yaml` でオンとオフにする       | 文章の方針を細かい項目に切り分けられず、言い換えもできない                |","| `docv init` で、雛形を好きな場所に書き出す                 | `docv.yaml` があるプロジェクトでは作れない。AI Agent が置き場所を知れない |","| docv 自身の Doc ガイドを、雛形へのシンボリックリンクにする | このリポジトリに合わせて直せない                                          |","| Slot の名前を「ガイドライン」か「ドキュメント」にする      | 何のガイドラインか分からない。Slot もすべてドキュメントで、区別にならない |"]},{"path":"docv/adr/mission.md","href":"ADR/構造化/ファイルが扱うことをミッションと呼び、読むと何が分かるかで書く.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-16","---","","# ファイルが扱うことをミッションと呼び、読むと何が分かるかで書く","","## 背景","","Slot が扱うことを「答える問い」と呼び、Free ファイルの `mission` も「このファイルが答えること」と説明していた。ミッションの文も「〜は何か」「どう〜か」の疑問の形で書いていた。ドキュメントを開くのは、いつも疑問から始まるとは限らない。知りたいことがあるときに、どのファイルを読めばよいかが分かれば足りる。","","## 決めたこと","","Slot と Free ファイルが扱うことを、どちらも「ミッション」と呼ぶ。Slot のミッションは docv が決め、Free ファイルのミッションは YAML front matter の `mission` に書く。ミッションは、そのファイルを読むと何が分かるかを 1 文で書き、疑問の形にしない。","","## 結果","","Slot と Free ファイルの違いは、ミッションと形を誰が決めるかの 1 点で説明できる。「〇〇を知りたければこのファイル」と、ミッションから読むファイルを選べる。","","## 選ばなかった案","","| 案                    | 選ばなかった理由                                             |","| --------------------- | ------------------------------------------------------------ |","| 「問い」のまま残す    | 疑問を軸にドキュメントを管理しているように読める             |","| scope と呼ぶ          | 範囲の境界を指す語で、読むと何が分かるかが伝わらない         |","| subject、topic と呼ぶ | 「〜について」のような、何が分かるかの決まらない書き方を招く |"]},{"path":"docv/adr/appendix.md","href":"ADR/構造化/YAML%20の%20Slot%20に%20appendix_markdown%20を書けるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-17","supersedes: [no-body-include]","---","","# YAML の Slot に appendix_markdown を書けるようにする","","## 背景","","YAML の Slot の `body` と `include` をなくし、項目にない文章は Free ファイルに書いてリンクすることにした。しかし、項目に収まらない短い補足のために Free ファイルを作り、Slot からリンクするのは手間が大きい。","","## 決めたこと","","どの YAML の Slot にも、`appendix_markdown` を書けるようにする。HTML では、スキーマで決めた項目のあとに続けて出し、見出しは h2 から始まるように段を付け直す。ほかの Markdown の項目と同じく `|` のブロックで書き、同じ検査をかける。`include` はなくしたままにする。","","## 結果","","項目に収まらない補足を、Slot の中に書ける。ほかのファイルを埋め込む仕組みは持たない。"]},{"path":"docv/adr/check-paths.md","href":"ADR/コマンド/check%20にパスを渡しても、かける検査を変えない.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-17","---","","# check にパスを渡しても、かける検査を変えない","","## 背景","","`docv check` にパスを渡すと、Slot と ADR の検査を丸ごと飛ばしていた。YAML の Slot の形が壊れていても、ADR の `supersedes` の先がなくても、パスを渡すと error 0 件になっていた。","","## 決めたこと","","パスで絞るのは、確かめるファイルだけにする。かける検査は、パスを渡さないときと同じにする。Slot と ADR は、ファイルどうしのつながりも見るので、すべて読んでから、渡したパスの指摘だけを出す。","","## 結果","","1 つのファイルを直しながら、そのファイルだけを、全体と同じ基準で確かめられる。パスを渡しても、Slot と ADR はすべて読む。"]},{"path":"docv/adr/check-slot-markdown.md","href":"ADR/コマンド/md%20の%20Slot%20と%20ADR%20にも、Free%20ファイルと同じ検査をかける.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-17","---","","# md の Slot と ADR にも、Free ファイルと同じ検査をかける","","## 背景","","`dir.slot` の中の Markdown（md の Slot と ADR）には、Free ファイルのルールをかけず、整形と textlint だけをかけていた。リンクが切れていても、HTML ではただの文字になるだけで、気づけなかった。書式の規則も、Free ファイルにだけかかっていた。","","## 決めたこと","","md の Slot と ADR にも、YAML front matter のほかは、Free ファイルと同じ検査をかける。リンク切れ、見出しの数と章番号、書式の規則、整形、textlint。ADR の YAML front matter は、今までどおり ADR の決まりで確かめる。","","## 結果","","どの Markdown でも、同じ基準でリンク切れと書き方を確かめる。md の Slot と ADR には、YAML front matter の `mission` を求めない。"]},{"path":"docv/adr/check-template.md","href":"ADR/配布/Doc%20ガイドの雛形は、開発の手順で%20docv%20fix%20と%20docv%20check%20にかける.html","tags":[],"lines":["---","group: 配布","date: 2026-10-17","---","","# Doc ガイドの雛形は、開発の手順で docv fix と docv check にかける","","## 背景","","Doc ガイドの雛形（`assets/template/doc-guide.md`）は、利用者のプロジェクトで docv fix と docv check を通す必要がある。雛形は docv の管理対象の外にあり、このリポジトリの docv fix と docv check はかからない。","","## 決めたこと","","`make check-doc-guide` で、雛形を一時ディレクトリに書き出して docv fix し、変わったら雛形に書き戻し、docv check を通す。`make fix` も、途中でこれを実行する。","","## 結果","","雛形は、利用者の手元と同じ条件で整形と textlint を通った形で配られる。製品の設定は増えない。","","## 選ばなかった案","","| 案                                                   | 選ばなかった理由                                         |","| ---------------------------------------------------- | -------------------------------------------------------- |","| cargo test で、雛形が整形済みかだけを確かめる        | textlint をかけられず、直す手段も別に要る                |","| docv.yaml に、管理対象の外のファイルを足す項目を作る | このリポジトリのためだけに、利用者にも見える項目が増える |"]},{"path":"docv/adr/config-link.md","href":"ADR/出力/docv.yaml%20へのリンクを、現在の設定のページに向ける.html","tags":[],"lines":["---","group: 出力","date: 2026-10-17","---","","# docv.yaml へのリンクを、現在の設定のページに向ける","","## 背景","","HTML でリンクを張るのは、Free ファイル、Slot、ADR のページだけだった。利用マニュアルなどから現在の設定のページを案内したくても、そのページには元の md がなく、リンクを書けなかった。","","## 決めたこと","","Slot や Free ファイルの本文から `docv.yaml` へのリンクは、HTML では現在の設定のページに向ける。","","## 結果","","md では `docv.yaml` を指すので、GitHub では設定ファイルが開き、HTML では今の値の表が開く。どちらも、その場で設定を確かめられる。","","## 選ばなかった案","","| 案                                       | 選ばなかった理由                               |","| ---------------------------------------- | ---------------------------------------------- |","| 現在の設定のページへの特別なリンクを作る | GitHub で開けず、md としては壊れたリンクになる |"]},{"path":"docv/adr/config-page.md","href":"ADR/出力/現在の設定を%20HTML%20のページで見せる.html","tags":[],"lines":["---","group: 出力","date: 2026-10-17","---","","# 現在の設定を HTML のページで見せる","","## 背景","","`docv.yaml` に何を書けて、どれが効いているかは、スキーマか `docv init --print` を読まないと分からなかった。","","## 決めたこと","","HTML のサイドバーのいちばん下に「現在の設定」を置き、`docv.yaml` のすべての項目と今の値を 1 つの表で並べる。書いていない項目は既定の値で出す。選ぶ項目は候補を横に並べ、選んでいる候補に色を付ける。表の後に、textlint の検査項目と非検査項目を並べる。","","## 結果","","人間は、設定の全体と効いている値を、ブラウザを開けば一目で確かめられる。`docv desc` は CLI で読むものなので、このページには誘導しない。","","## 選ばなかった案","","| 案                                     | 選ばなかった理由                         |","| -------------------------------------- | ---------------------------------------- |","| `docv config show` で、CLI に表で出す  | 項目が多く、端末では見づらい             |","| 選ぶ項目をチェックボックスで縦に並べる | 行が長くなり、選んでいる候補が目立たない |"]},{"path":"docv/adr/dir-apart.md","href":"ADR/構造化/dir%20の%204%20つのディレクトリを互いに離し、HTML%20の既定を%20output-docv-html%20にする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-17","supersedes: [dir-keys]","---","","# dir の 4 つのディレクトリを互いに離し、HTML の既定を output/docv/html にする","","## 背景","","`dir.html` の既定の `docv/build` は、`dir.slots` の既定の `docv` の中にあった。Slot のディレクトリを読むときに、出力の HTML と JPG を除く必要があった。`dir.free` の中に `dir.slots` を書くなど、ほかの組み合わせでも、同じファイルを 2 つの役割で読むことになる。項目の名前は、`dir.free` などが単数で、`dir.slots` だけが複数だった。","","## 決めたこと","","- `dir.slots` を `dir.slot` にする","- `dir.html` の既定を `output/docv/html` にする。`dir.image` は今までどおり既定を持たず、書いたときだけ JPG を作る","- `dir.free`、`dir.slot`、`dir.html`、`dir.image`（書いたとき）は、どの 2 つも同じディレクトリにできず、一方が他方を含むこともできない。`docv.yaml` を読むときに確かめ、違反していれば、check、fix、build などは何もせずに終わる","","## 結果","","1 つのファイルは、Free ファイル、Slot ファイル、出力のどれか 1 つにしかならない。Slot のディレクトリを読むときに、出力を除く必要がない。","","## 選ばなかった案","","| 案                                           | 選ばなかった理由                                             |","| -------------------------------------------- | ------------------------------------------------------------ |","| 重なりを許し、読むときに出力を除き続ける     | 組み合わせごとに、どちらの役割で読むかを決め続けることになる |","| `dir.image` にも既定を置き、JPG を既定で作る | 既定の設定のままでは、Chrome のないマシンで build できない   |"]},{"path":"docv/adr/dir-keys.md","href":"ADR/構造化/docv%20が読み書きするディレクトリを%20dir%20にまとめる.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-17","---","","# docv が読み書きするディレクトリを dir にまとめる","","## 背景","","Free ファイルの置き場所は `docs`（glob の配列）、Slot は `slots.dir`、出力は `output.dir` と、置き場所の項目が散らばっていた。`docs` が複数書けるため、リンクの表示文字の起点を推し量る必要があった。出力を git で管理するかを `output.commit` で決め、docv が出力先に `.gitignore` を置いていた。","","## 決めたこと","","- 置き場所は `dir` にまとめ、`free`（Free ファイル）、`slots`（Slot ファイル）、`html`（HTML）、`image`（JPG）を書く","- `dir.free` はディレクトリ 1 つだけにする。リンクの表示文字は、このディレクトリからのパスにする","- `dir.image` を書いたときだけ、Slot のページを JPG にする","- 出力を git で管理するかは、プロジェクトの `.gitignore` に任せ、docv は `.gitignore` を書かない","","## 結果","","置き場所はすべて `dir` を見れば分かる。`dir.free` の外の Markdown（`README.md` など）は、管理対象にならない。","","## 選ばなかった案","","| 案                                     | 選ばなかった理由                         |","| -------------------------------------- | ---------------------------------------- |","| `docs` を glob の配列のまま残す        | 複数書く場面がなく、起点の推し量りが要る |","| `output.image` を true か false で残す | JPG の置き場所を HTML と分けられない     |"]},{"path":"docv/adr/fix-yaml-newline.md","href":"ADR/コマンド/docv%20fix%20で%20YAML%20のファイルの末尾の改行を整える.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-17","---","","# docv fix で YAML のファイルの末尾の改行を整える","","## 背景","","`docv fix` は Markdown だけを整形していた。`docv.yaml` と YAML の Slot の末尾に改行がなくても、直す手段がなかった。","","## 決めたこと","","`docv fix` は、`docv.yaml` と YAML の Slot の末尾の改行を 1 つにする。中身は変えない。`format.enabled` が true なら、check も同じ箇所を format-diff として出す。","","## 結果","","docv が扱うファイルは、どれも末尾の改行が 1 つにそろう。","","## 選ばなかった案","","| 案                      | 選ばなかった理由                     |","| ----------------------- | ------------------------------------ |","| YAML の中身まで整形する | 書いた順やコメントを崩すおそれがある |"]},{"path":"docv/adr/link-anchor.md","href":"ADR/コマンド/リンクのアンカーを%20check%20で確かめる.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-17","---","","# リンクのアンカーを check で確かめる","","## 背景","","check はリンク先のファイルがあるかだけを確かめ、`#` 以降のアンカーは確かめていなかった。見出しを書き換えると、そこを指すリンクが黙って切れていた。HTML の見出しには、GitHub と同じ形のアンカーを付けている。","","## 決めたこと","","Free ファイルのリンクのアンカーが、リンク先の Markdown の見出しにあるかを確かめ、なければ link-anchor を出す。アンカーは HTML と同じ規則で作り、同じ見出しが続けば `-1`、`-2` を付ける。`#` だけのページ内リンクは、そのファイルの見出しと比べる。Markdown でないファイルへのリンクのアンカーは確かめない。","","## 結果","","見出しを書き換えたときに、切れたリンクを check で見つけられる。GitHub と HTML のどちらで読んでも、確かめたアンカーで飛べる。"]},{"path":"docv/adr/lint-items.md","href":"ADR/フレームワークの範囲/check%20の設定を太字、斜体、$、textlint%20の%204%20つにする.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-17","---","","# check の設定を太字、斜体、`$`、textlint の 4 つにする","","## 背景","","`lint` には、タグごとのルール、過去の言い回しの語の足し引き、8 つの書式の規則があり、`overrides` でパスごとに道具を外せた。設定が多く、何が効いているかを追いにくかった。","","## 決めたこと","","- `lint` は `bold`、`italic`、`dollar`（`allow` か `deny`）と `textlint`（`enable` か `disable`）だけにする","- 章番号（h2 のどれかが章番号で始まるファイルだけ）と、リンクの表示文字は、設定によらず常に確かめる","- タグごとのルール、過去の言い回しと終わったタスクの検査、HTML タグと画像の代替テキストと章の区切りの規則、`overrides` はなくす","","## 結果","","設定は 4 つの切り替えで済み、ほかの検査はどのプロジェクトでも同じになる。`mission` は、すべての Free ファイルで必須になる。章の区切りを見やすくしたいときは、HTML の CSS で調整する。","","## 選ばなかった案","","| 案                                   | 選ばなかった理由                               |","| ------------------------------------ | ---------------------------------------------- |","| タグごとにルールを付けられるまま残す | タグごとに制御する場面がなく、全体で同じでよい |","| 章番号を設定で必須にする             | 章番号を使わないファイルにまで強いることになる |"]},{"path":"docv/adr/name.md","href":"ADR/配布/名前を%20docv%20にする.html","tags":[],"lines":["---","group: 配布","date: 2026-10-17","---","","# 名前を docv にする","","## 背景","","docv は仮の名前として、コマンド、設定ファイル（`docv.yaml`）、Slot のディレクトリ（`docv/`）、出力の目印（`.docv`）に使っていた。","","## 決めたこと","","名前を docv に決める。","","## 結果","","コマンドやファイルの名前を変える作業はない。"]},{"path":"docv/adr/no-body-include.md","href":"ADR/構造化/YAML%20の%20Slot%20の%20body%20と%20include%20をなくす.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-17","---","","# YAML の Slot の body と include をなくす","","## 背景","","YAML の Slot には、決まった項目のほかに、ページの最後に出す Markdown（`body`）と、ほかの Markdown を埋め込む指定（`include`）を書けた。このリポジトリでも、テンプレでも、どちらも使っていなかった。項目の外に文章を書けると、Slot の形を決めた意味が薄れる。","","## 決めたこと","","`body` と `include` をなくす。項目にない文章は、Free ファイルに書いてリンクする。","","## 結果","","YAML の Slot のページは、決まった項目だけで組み立てる。埋め込みの範囲を決める規則と、埋め込み先を確かめる check（`slot-include-missing`）が要らなくなる。"]},{"path":"docv/adr/no-image.md","href":"ADR/出力/JPG%20を違うマシンで揃えず、build%20--no-image%20で作らずに済ませる.html","tags":[],"lines":["---","group: 出力","date: 2026-10-17","---","","# JPG を違うマシンで揃えず、build --no-image で作らずに済ませる","","## 背景","","JPG は、マシンのフォントで変わる。違うマシンで同じ JPG にするには、フォントを埋め込む必要があり、日本語のフォントはサイズが大きい。`dir.image` を書いたプロジェクトでは、build のたびに Chrome で JPG を撮っていた。","","## 決めたこと","","違うマシンで同じ JPG にすることはしない。`docv build --no-image` は、`dir.image` を書いていても JPG を作らず、`dir.image` の中も変えない。チームで JPG を共有するなら、GitHub Actions などの決まった環境で作る。","","## 結果","","手元では、HTML だけを速く作り直せ、Chrome がなくても build できる。共有する JPG は、決まった環境で作る限り揃う。","","## 選ばなかった案","","| 案                                       | 選ばなかった理由                       |","| ---------------------------------------- | -------------------------------------- |","| フォントを埋め込み、どのマシンでも揃える | 日本語のフォントでバイナリが大きくなる |"]},{"path":"docv/adr/no-level.md","href":"ADR/コマンド/check%20の指摘の強さをなくし、すべて%20error%20にする.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-17","---","","# check の指摘の強さをなくし、すべて error にする","","## 背景","","check の指摘には error と warn があり、warn だけなら終了コードは 0 だった。warn になるのは、textlint の指摘と、ディレクトリの Slot に書いたパスがないときだけだった。このリポジトリでは warn も 0 件にしてからコミットしていて、warn を許す場面がなかった。","","## 決めたこと","","指摘の強さをなくし、すべてを error として出す。指摘が 1 件でもあれば、check は終了コード 1 で終わる。","","## 結果","","check の終了コードだけで、通ったかどうかが分かる。textlint で誤検知が出るルールは、強さを下げるのではなく、非検査項目に移して扱う。","","## 選ばなかった案","","| 案                                | 選ばなかった理由                       |","| --------------------------------- | -------------------------------------- |","| warn を残し、warn でも 1 で終える | 終了コードが同じなら、分ける意味がない |"]},{"path":"docv/adr/no-link-text.md","href":"ADR/コマンド/リンクの表示文字の規則をやめる.html","tags":[],"lines":["---","group: コマンド","date: 2026-10-17","---","","# リンクの表示文字の規則をやめる","","## 背景","","check は、管理対象のファイルへのリンクの表示文字を、`dir.free` からのリンク先のパスにすることを、常に求めていた（`link-text`）。ファイル名だけでは、どのディレクトリのファイルか分からないためだった。実際には、この規則に頼って読む場面がなかった。md の Slot や ADR にも Free ファイルと同じ検査をかけるなら、この規則もそこへ広げることになる。","","## 決めたこと","","`link-text` をなくす。リンクの表示文字は、書く人が決める。","","## 結果","","リンクの表示文字に、パスでない言葉を使える。表示文字からリンク先のディレクトリは分からなくなる。"]},{"path":"docv/adr/no-svg.md","href":"ADR/フレームワークの範囲/サービス仕様の図を%20docv%20が描かない.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-17","---","","# サービス仕様の図を docv が描かない","","## 背景","","サービス仕様の部品と依存から docv が SVG を描けば、図の道具がなくても全体が見える。描くには、配置を毎回同じにする規則が要る。","","## 決めたこと","","docv は図を描かない。Doc ガイドの雛形で、構成を示すときやアスキーアートを使いたいときは、まず SVG で作図するよう指示する。","","## 結果","","図は、プロジェクトが SVG で作り、Slot からリンクするか埋め込む。docv は、配置の規則を持たずに済む。"]},{"path":"docv/adr/plan-for-undecided.md","href":"ADR/構造化/まだ決まっていないことを%20docs-plan%20に置く.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-17","---","","# まだ決まっていないことを docs/plan に置く","","## 背景","","このリポジトリでは、まだ決まっていないことを `docs/fixme/open.md` に、やると決めたタスクを `docs/plan/` に分けて置いていた。どちらも片付いたら消すもので、置き場所を 2 つに分ける理由はなかった。`docs/fixme/` は管理対象で、HTML にも出ていた。","","## 決めたこと","","まだ決まっていないことも `docs/plan/` に置き、`docs/fixme/` と「未決」のタグをなくす。`docs/plan/` と `docs/tmp/` の中のファイルへは、ほかのファイルからリンクせず、言及しない。ディレクトリには、運用を説明するために言及してよい。","","## 結果","","正式なドキュメントには、決まったことだけが残る。決まっていないことは HTML に出ず、片付いたら消す。","","## 選ばなかった案","","| 案                          | 選ばなかった理由                                 |","| --------------------------- | ------------------------------------------------ |","| `docs/fixme/open.md` を残す | 事実と予定を、同じ管理対象の中に混ぜることになる |"]},{"path":"docv/adr/schema-json.md","href":"ADR/配布/スキーマを%20JSON%20に揃え、YAML%20の%20Slot%20の%201%20行目から参照する.html","tags":[],"lines":["---","group: 配布","date: 2026-10-17","---","","# スキーマを JSON に揃え、YAML の Slot の 1 行目から参照する","","## 背景","","`docv.yaml` のスキーマは、エディタが読めるよう JSON で書き、YAML の Slot のスキーマは、`docv slot schema` で読みやすいように YAML で書いていた。形を分ける理由は、ほかになかった。YAML の Slot はスキーマを参照しておらず、エディタで補完が効かなかった。","","## 決めたこと","","スキーマは、すべて JSON Schema を JSON で書き、`assets/schema/\u003c名前>.schema.json` に置く。`docv slot gen` は、YAML の Slot の 1 行目に、yaml-language-server の書式でスキーマの URL を書く。URL は `docv init` と同じく、実行した CLI の版のタグの `assets/schema/` を指す。","","## 結果","","`docv.yaml` と YAML の Slot のどちらも、エディタで項目の補完と検証が効く。版のタグを push するまでは、URL の先がない。check は今までどおり Slot の型で確かめる。","","## 選ばなかった案","","| 案                         | 選ばなかった理由                                    |","| -------------------------- | --------------------------------------------------- |","| YAML に揃える              | YAML で書いたスキーマを、エディタが読める保証がない |","| main ブランチの URL を使う | 使っている CLI の版と、スキーマがずれる             |"]},{"path":"docv/adr/search.md","href":"ADR/出力/HTML%20に、入力した文字列をそのまま探す検索のページを置く.html","tags":[],"lines":["---","group: 出力","date: 2026-10-17","---","","# HTML に、入力した文字列をそのまま探す検索のページを置く","","## 背景","","HTML でドキュメントを探す手段は、ブラウザのページ内検索だけで、1 ページの中しか探せなかった。HTML は file:// で開いても見られ、外部の CDN を使わず、JS が動かなくても中身を読める決まりがある。file:// では `fetch()` でファイルを読めない。","","## 決めたこと","","トップに検索のページを置き、サイドバーから開く。build は、Slot ファイル、ADR、Free ファイルの中身を行ごとに並べた索引を、検索のページの中に書く。JS は、入力した文字列をそのまま含む行を総当たりで探し、入力欄の下に、ファイルごとにパス、タグ、ヒットした行の前後 2 行を並べる。入力欄は、JS が動くときだけ出す。","","## 結果","","単語に区切らないので、日本語もそのまま探せ、ライブラリも要らない。あいまい検索と、関係が深い順の並べ替えはできない。索引は中身をすべて持つので、ドキュメントが増えるほど検索のページが大きくなる。","","## 選ばなかった案","","| 案                                           | 選ばなかった理由                                                                           |","| -------------------------------------------- | ------------------------------------------------------------------------------------------ |","| JS の全文検索のライブラリを埋め込む          | 日本語を単語に区切る工夫が要る。順位付けやあいまい検索は、まだ要らない                     |","| 静的サイト向けの検索ツールで索引を作る       | 索引を `fetch` で読むので、file:// で動かない。別のツールのインストールも要る              |","| 索引を別の JS ファイルに書き出す             | 索引を読むのは検索のページだけで、ファイルを分ける理由がない                               |","| build で単語から行を引く表（転置索引）を作る | 総当たりで足りる量では、表を作る手間に見合わない。区切り方を Rust と JS で揃える必要もある |"]},{"path":"docv/adr/tag-colors.md","href":"ADR/構造化/使うタグを、色と一緒に%20docv.yaml%20に書く.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-17","supersedes: [tags]","---","","# 使うタグを、色と一緒に docv.yaml に書く","","## 背景","","タグは任意の数を付けられ、`docv.yaml` の `tags` を書いたときだけ、使えるタグを限っていた。HTML のタグの色は、出てきた順に割り当てていて、ファイルを足すと色の変わることがあった。","","## 決めたこと","","分類は、YAML front matter の `tags` に任意の数を書くタグで行う。使うタグは、すべて `docv.yaml` の `tags` に、名前（`name`）と色（`color`）を書く。`tags` にないタグは、check が error にし、`tags` に足すよう案内する。","","## 結果","","タグの色はプロジェクトが決め、HTML のどのページでも同じになる。タグを使い始めるときに、`docv.yaml` を直す手間が増える。","","## 選ばなかった案","","| 案                                       | 選ばなかった理由                          |","| ---------------------------------------- | ----------------------------------------- |","| 色を書かないタグには、順に色を割り当てる | 決まりが 2 つになり、色が変わることがある |"]},{"path":"docv/adr/textlint-fixed-rules.md","href":"ADR/フレームワークの範囲/textlint%20のルールと値を%20docv%20が決める.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-17","---","","# textlint のルールと値を docv が決める","","## 背景","","`docv.yaml` の `lint.textlint` は、プリセット、ルールごとのオプション、表記ゆれの辞書、持ち込みの設定ファイルを書けた。textlint の設定をそのまま映した形で、textlint の変更に引きずられる。docv のドキュメントは事実を並べるもので、目的は AI Agent が書く文章のぶれをなくすこと。","","## 決めたこと","","`lint.textlint` は `enable` か `disable` だけにする。使うルールとその値は、ja-technical-writing と ja-spacing のルールごとに docv が決め、docv の版ごとに固定する。使わないルールも、使わないと明示する。","","## 結果","","同じ docv なら、どのプロジェクトでも同じ基準で文章を確かめる。ルールの一覧は、HTML の現在の設定のページと spec で見られる。プロジェクトごとの調整はできない。","","## 選ばなかった案","","| 案                                                 | 選ばなかった理由                            |","| -------------------------------------------------- | ------------------------------------------- |","| 文章の流儀（スペース、文体、長さ）だけを項目にする | ぶれがなければよく、項目を持つ理由がない    |","| jtf-style も使う                                   | 翻訳の実務文書向けで、ja-spacing と食い違う |","| 持ち込みの textlint の設定ファイルを残す           | textlint の設定に準拠した使い方が残る       |"]},{"path":"docv/adr/yaml-markdown.md","href":"ADR/構造化/YAML%20の%20Slot%20の%20Markdown%20は、_markdown%20で終わる項目に%20|%20で書き、検査する.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-17","---","","# YAML の Slot の Markdown は、_markdown で終わる項目に | で書き、検査する","","## 背景","","YAML の Slot には、Markdown として HTML に出す項目（`desc`、`purpose`、`markdown` など）と、ただの文字の項目が混ざり、名前では見分けられなかった。Markdown の項目は、リンク切れ、書式の規則、textlint のどれでも確かめていなかった。値の書き方（1 行、クォート、`|`、`>`）がまちまちで、指摘の行番号を YAML の行に戻せず、fix で書き戻すこともできなかった。","","## 決めたこと","","- Markdown の項目は、名前を `_markdown` で終わる形にする。`desc_markdown`、`purpose_markdown`、`body_markdown`、`local_from_markdown`、`release_from_markdown` の 5 つ。ディレクトリの `description` も `desc_markdown` にする","- Markdown の項目の値は、1 行でも必ず `|` のブロックで書く。`|-` や `|+` などは使わない。それ以外の文字列の項目は 1 行で書く。どちらも check が確かめる","- Markdown の項目の中身に、リンク、書式の規則、整形、textlint をかける。見出しの検査はかけない。指摘の行番号は YAML の行番号で出し、fix は中身を直して字下げを付け直す","- 中身の多くは表のセルに出す短い説明なので、textlint の `ja-no-mixed-period`（文末の「。」）はかけない","","## 結果","","名前で Markdown かどうかが分かり、どの Markdown も同じ基準で確かめる。短い値も `|` で 2 行になり、YAML は長くなる。行番号の分かる YAML のパーサー（yaml-rust2）を依存に足す。","","## 選ばなかった案","","| 案                                      | 選ばなかった理由                                                       |","| --------------------------------------- | ---------------------------------------------------------------------- |","| 1 行の値は `\\|` なしも許す              | 行番号の戻し方と fix の書き戻し方が、値の書き方の数だけ要る            |","| Markdown の項目の一覧を Slot ごとに持つ | 名前で見分けられれば、書く人にも分かり、検査も Slot ごとに分けずに済む |","| 短い説明にも「。」を求める              | 表のセルに出す説明の書き方が、Free ファイルの表と揃わない              |"]},{"path":"docv/adr/outline-width.md","href":"ADR/出力/目次のないページにも、目次の幅を空けておく.html","tags":[],"lines":["---","group: 出力","date: 2026-10-24","supersedes: [outline-on-every-page]","---","","# 目次のないページにも、目次の幅を空けておく","","## 背景","","すべてのページの右に目次を置き、見出しのないページでは目次を出していなかった。本文は、左のサイドバーと右の目次の間の真ん中に置く。目次のあるページとないページを行き来すると、本文の位置が横にずれる。","","## 決めたこと","","すべてのページの右に、そのページの h2 と h3 の目次を置く。id のない見出しには、Free ファイルと同じ形の id を付ける。見出しのないページでは、目次の代わりに、同じ幅の空の枠を置く。","","## 結果","","どのページに移っても、本文の位置は変わらない。見出しのないページは、本文の右に何もない幅が残る。","","## 選ばなかった案","","| 案                                         | 選ばなかった理由                                    |","| ------------------------------------------ | --------------------------------------------------- |","| 見出しのないページにも、題だけの目次を置く | 移る先のない目次は、中身があるように見えてしまう    |","| HTML を変えずに、CSS だけで右の幅を空ける  | 目次のあるなしを CSS で見分けることになり、込み入る |"]},{"path":"docv/adr/overview-slot.md","href":"ADR/構造化/サービス概要の%20Slot%20を足し、サービス仕様と分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-24","---","","# サービス概要の Slot を足し、サービス仕様と分ける","","## 背景","","サービス仕様の Slot のミッションは「これの目的、利用者、解決すること、部品の構成」で、利用者にサービスそのものを説明することと、詳しい仕様を書くことの 2 つが入っていた。仕様が詳しく長くなるほど、これが何かを知りたいだけの利用者が、仕様の中から説明を探すことになる。","","## 決めたこと","","サービス概要の Slot（`service/overview.md`、md）を足す。サービス概要には、これが何で誰の何を解決し、何ができるかを、利用者に向けて書く。サービス仕様には、機能と部品の構成と、それぞれの詳しい振る舞いと決まりを書く。","","サービス仕様のまとまりは、サービス概要、サービス仕様、利用マニュアル、インストール、用語集の順に並べる。","","## 結果","","利用者は、サービス概要だけを読めば、これが何かがわかる。サービス仕様は、説明を気にせず詳しく書ける。","","## 選ばなかった案","","| 案                                         | 選ばなかった理由                                                    |","| ------------------------------------------ | ------------------------------------------------------------------- |","| サービス仕様の冒頭に概要を書く決まりにする | md の Slot の中身の形は決めないので、概要を書いたかを確かめられない |"]},{"path":"docv/adr/service-pages.md","href":"ADR/構造化/サービス仕様をページに分けられるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-24","---","","# サービス仕様をページに分けられるようにする","","## 背景","","サービス仕様は 1 つの md の Slot で、HTML でも 1 つのページになる。利用者向けの機能と管理者向けの機能のように、読む人ごとに仕様が分かれるサービスでは、1 つのページが長くなり、読む人が自分に関わる部分を探すことになる。","","## 決めたこと","","サービス仕様は、`service/service.md` の代わりに、`service/service/` の直下に 1 ページ 1 つの Markdown で置けるようにする。ページの並びは YAML front matter の `order` で決め、本文の h1 をページの名前にする。HTML では、ページを 1 つずつ `サービス仕様/サービス仕様/\u003ch1>.html` にし、Slot の名前の下に、ページへのリンクをタブにして並べる。","","分けないときは、今と同じく `service/service.md` に書き、YAML front matter はいらない。分けられるのは、サービス仕様だけにする。","","## 結果","","すでにある `service/service.md` は、そのまま 1 ページのサービス仕様として読める。分けたページにも、ほかの md の Slot と同じ検査をかける。目次、検索、ほかのファイルからのリンクは、ページごとに効く。","","## 選ばなかった案","","| 案                                                   | 選ばなかった理由                                                                           |","| ---------------------------------------------------- | ------------------------------------------------------------------------------------------ |","| `docv/service-specs/` のように、`docv/` の直下に置く | Slot をまとまりのディレクトリの下に置く決まりが崩れる                                      |","| 分けないときも、ディレクトリに置く                   | すでにある `service/service.md` を移すことになる                                           |","| ページの名前を YAML front matter に書く              | 本文の h1 と同じ名前を 2 か所に書くことになる                                              |","| 1 つの HTML の中で、CSS でタブを切り替える           | 目次に全ページの見出しが混ざる。検索の結果や見出しへのリンクから、隠れているタブを開けない |"]},{"path":"docv/adr/bare-url-link.md","href":"ADR/出力/本文にそのまま書いた%20URL%20も、HTML%20でリンクにする.html","tags":[],"lines":["---","group: 出力","date: 2026-10-25","---","","# 本文にそのまま書いた URL も、HTML でリンクにする","","## 背景","","HTML では、`[文字](URL)` と `\u003cURL>` の形で書いたものだけをリンクにしていた。GitHub は、文の中にそのまま書いた URL もリンクにする。GitHub で読めばリンクなのに、HTML では文字だけになり、コピーして開くことになっていた。","","## 決めたこと","","build は、本文の文字の中の http:// と https:// で始まる URL をリンクにする。URL は、空白、`\u003c`、`>`、ASCII でない文字の前で終わる。末尾の句読点と、対になっていない `)` は URL に含めない。英数字の直後から始まるものはリンクにしない。リンク、画像、コード、HTML で書いた `\u003ca>` の中は変えない。","","## 結果","","書き方を変えずに、HTML から URL を開ける。日本語の文に続けて書いても、文は URL に入らない。ASCII でない文字を含む URL は、その文字の前までがリンクになるので、`[文字](URL)` で書く。","","## 選ばなかった案","","| 案                                                  | 選ばなかった理由                                            |","| --------------------------------------------------- | ----------------------------------------------------------- |","| GitHub と同じく、空白の前までを URL にする          | 日本語の文に続けて書くと、文が URL に入る                   |","| `www.` で始まるものもリンクにする                   | scheme がなく、http と https のどちらで開くかを決められない |","| check で、`[文字](URL)` か `\u003cURL>` で書くよう求める | 書く手間が増える。GitHub では、そのままでリンクになる       |"]},{"path":"docv/adr/group-names.md","href":"ADR/構造化/Slot%20のまとまりの名前を、サービスとシステムにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","---","","# Slot のまとまりの名前を、サービスとシステムにする","","## 背景","","Slot のまとまりの名前は「サービス仕様」と「システム仕様」で、まとまりの中の Slot にも、同じ名前の「サービス仕様」と「システム仕様」があった。Doc ガイドの雛形で「仕様」はサービス仕様とシステム仕様の 2 つの Slot を指すと決めたが、同じ言葉がまとまりも指していた。HTML のパスも `サービス仕様/サービス仕様.html` になり、どちらがまとまりかが読み取りにくかった。","","## 決めたこと","","まとまりの名前を「サービス」と「システム」にする。開発者向けガイドと運用は変えない。Slot ファイルを置くディレクトリ（`service/`、`system/`）も変えない。","","## 結果","","「サービス仕様」「システム仕様」は、Slot だけを指す。HTML のプロジェクト概要の見出しと、HTML と JPG のパスのまとまりの部分が変わる（`サービス/利用マニュアル.html`、`システム/DB 仕様書.html`）。出力の JPG に、README などからリンクしているプロジェクトは、リンクを直す。","","## 選ばなかった案","","| 案                                        | 選ばなかった理由                                   |","| ----------------------------------------- | -------------------------------------------------- |","| まとまりの名前を変えない                  | 同じ言葉が、まとまりと Slot の両方を指し続ける     |","| Slot の名前を「サービスの仕様」などにする | Doc ガイドの雛形で決めた言葉と、ミッションが変わる |"]},{"path":"docv/adr/md-slot-mission.md","href":"ADR/構造化/md%20の%20Slot%20の%20YAML%20front%20matter%20に、ミッションを必ず書く.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","---","","# md の Slot の YAML front matter に、ミッションを必ず書く","","## 背景","","Slot のミッションは docv が決め、`docv slot list` で出すだけだった。YAML の Slot は雛形の 1 行目にミッションのコメントがあるが、md の Slot は空のファイルで、YAML front matter も持たなかった。AI Agent がいつも `docv slot list` を見るとは限らず、md の Slot のファイルを開いても、何を書く Slot かが分からなかった。Slot は、複数のプロジェクトでドキュメントの決まりと見方を揃えるためにあり、ミッションをプロジェクトで変えることはできない。","","## 決めたこと","","md の Slot には、YAML front matter の `mission` に、`docv slot list` のミッションと同じ文を必ず書く。ページに分けたサービス仕様は、どのページにも `order` と一緒に書く。`mission` がないか、ミッションと違えば、check が slot-mission の error にする。`docv slot gen` は、`mission` を書いた YAML front matter だけのファイルを作る。Doc ガイドの雛形にも書いておく。","","## 結果","","どの md の Slot も、ファイルを開けば何を書く Slot かが分かる。誰かが書き換えても、docv の版を上げてミッションが変わっても、check の error で気づき、直すまで check が通らない。直すのは AI Agent で、error のメッセージに書くべき文を出す。`mission` が違っても、HTML には本文を出す。","","docv のサービス仕様（`docv/service/service.md`）は、`assets/desc.md` へのシンボリックリンクである。そのため `assets/desc.md` にも YAML front matter を書く。`docv desc` は、YAML front matter を除いた本文を出す。","","## 選ばなかった案","","| 案                                                  | 選ばなかった理由                                                                    |","| --------------------------------------------------- | ----------------------------------------------------------------------------------- |","| 1 行目に HTML のコメントで書く                      | ただのメモになり、書き換えられても、版を上げてミッションが変わっても気づけない      |","| `mission` を任意にする                              | 書いていない Slot では、ファイルを開いてもミッションが分からない                    |","| ミッションが違えば、docv fix で書き換える           | fix は整形と textlint の自動修正だけをする決まり。check の error で直させれば足りる |","| `mission` が違う Slot は HTML に出さない            | 版を上げただけで、直すまでページが消える                                            |","| YAML の Slot にも、`mission` を必須の項目として書く | YAML の Slot はスキーマで形を強制している。項目にすると、HTML の出力にも乗る        |"]},{"path":"docv/adr/service-spec-pages.md","href":"ADR/記録/docv%20のサービス仕様をページに分け、1%20ページ目を%20docv%20desc%20と同じファイルにする.html","tags":[],"lines":["---","group: 記録","date: 2026-10-25","supersedes: [spec-into-slots, desc-as-service]","---","","# docv のサービス仕様をページに分け、1 ページ目を docv desc と同じファイルにする","","## 背景","","docv のサービス仕様は、`assets/desc.md` へのシンボリックリンク 1 つで、`docv desc` と同じ内容だった。desc は AI Agent が最初に読む要点なので、詳しいことを書き足せない。そのため、規格の詳しいことを Free ファイルの `docs/spec/` に置いていた。Slot のミッションに当たる内容が Free ファイルに溢れ、Slot の作りを使えていなかった。","","## 決めたこと","","サービス仕様をページに分ける。1 ページ目（概要）は `assets/desc.md` へのシンボリックリンクにし、`docv desc` と同じ内容を保つ。`docs/spec/` の規格は、2 ページ目以降に移す。`docs/` には、スキーマの写しと図だけを残す。","","## 結果","","規格の詳しいことも、Slot の中で読める。`docv desc` の出力は、1 ページ目の h1 をタブの名前（概要）にしたほかは変わらない。Free ファイルのタグは、スキーマだけになる。","","## 選ばなかった案","","| 案                                                                | 選ばなかった理由                                       |","| ----------------------------------------------------------------- | ------------------------------------------------------ |","| サービス仕様を 1 ファイルのまま、詳しいことを `docs/spec/` に置く | Slot のミッションに当たる内容が、Free ファイルに溢れる |","| desc とサービス仕様を別のファイルにする                           | 同じことが 2 か所にあり、揃え続ける必要がある          |"]},{"path":"docv/adr/spec-boundary.md","href":"ADR/構造化/サービス仕様とシステム仕様を、実装を差し替えても変わらないかで分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [overview-slot]","---","","# サービス仕様とシステム仕様を、実装を差し替えても変わらないかで分ける","","## 背景","","サービス仕様の Slot のミッションは「機能と部品の構成と、それぞれの詳しい振る舞いと決まり」、システム仕様の Slot のミッションは「システムの内部の動きと、従う決まり」だった。部品の構成と内部の動きが重なり、どちらも決まりを含むので、ミッションだけではどちらに書くかが決まらない。AI Agent はミッションに従い、サービス仕様に部品の構成を書く。仕様、アーキテクチャ、実装、設計といった言葉の意味も決めておらず、書く人によって置き場所が変わる。","","## 決めたこと","","サービス仕様のミッションを「外から見た機能と、それぞれの振る舞いと決まり」に、システム仕様のミッションを「部品の構成と役割、部品の間の流れと、部品をまたいで守る決まり」にする。サービス概要の Slot と、まとまりの並びは変えない。","","Doc ガイドの雛形に「言葉の使い分け」の章を足し、言葉ごとに指すものと書く場所を決める。仕様は、サービス仕様とシステム仕様の 2 つを指す。実装をそっくり差し替えても成り立つことはサービス仕様に、部品の分け方と部品をまたぐことはシステム仕様に書く。1 つの部品の中のことで、コードを読めば分かること（実装）は、指示がない限り書かない。設計は決めることで、置き場所を持たない。決めた結果は各所に、理由は ADR に書く。","","## 結果","","ミッションだけで、サービス仕様とシステム仕様のどちらに書くかが決まる。言葉の使い分けはガイドラインなので、プロジェクトに合わせて直せる。すでに作った Doc ガイドは変わらないので、`docv slot gen doc-guide --print` で見比べる。","","## 選ばなかった案","","| 案                                                           | 選ばなかった理由                                                                            |","| ------------------------------------------------------------ | ------------------------------------------------------------------------------------------- |","| サービス仕様のミッションを「利用者から見た」で始める         | API だけのサービスやバッチでは、外にいるのが人とは限らない                                  |","| ミッションに読む人を書く                                     | ミッションは読むと何が分かるかを 1 文で書く決まりで、長くなる。読む人は言葉の使い分けに書く |","| 言葉の使い分けを `docv desc` に書く                          | ルールになり、プロジェクトに合わせて直せない                                                |","| check で、サービス仕様の中のテーブル名らしい識別子を知らせる | 誤検知が多い。言葉の選び方はガイドラインで扱い、ルールにしない                              |","| 設計の置き場所を作る                                         | 決めた結果と理由で、書く場所が分かれる                                                      |"]},{"path":"docv/adr/system-overview-slot.md","href":"ADR/構造化/システム概要の%20Slot%20を足し、システム仕様と分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [spec-boundary]","---","","# システム概要の Slot を足し、システム仕様と分ける","","## 背景","","システムのまとまりには、システム仕様、技術スタック、API 仕様書、DB 仕様書があり、システムをざっと理解するための Slot がなかった。システム仕様のミッションは「部品の構成と役割、部品の間の流れと、部品をまたいで守る決まり」で、全体を見せることと、詳しい決まりを書くことの 2 つが入っていた。詳しく書くほど、全体をつかみたいだけの開発者が、システム仕様の中から全体像を探すことになる。サービス仕様では、同じ理由でサービス概要を分けている。","","## 決めたこと","","システム概要の Slot（`system/system-overview.md`、md）を足す。ミッションは「開発者に向けた、システムを作る部品と、そのつながりの全体像」とする。システム仕様のミッションは「部品ごとの振る舞いと、部品の間の流れと、部品をまたいで守る決まり」にする。サービス仕様のミッションは変えない。","","システムのまとまりは、システム概要、システム仕様、技術スタック、API 仕様書、DB 仕様書の順に並べる。","","Doc ガイドの雛形の言葉の使い分けでは、アーキテクチャの全体像を、システム概要に SVG の図で書くことにする。サービス概要に書く「サービス説明」の言葉も足す。","","## 結果","","開発者は、システム概要の図だけで、どんな部品があり、どうつながっているかが分かる。システム概要は部品の役割とつながりを、技術スタックはそれを作る技術を書き、同じことを 2 か所に書かない。システム仕様の `mission` は変わるので、すでにある md の Slot は check の error で直す。","","## 選ばなかった案","","| 案                                               | 選ばなかった理由                                                      |","| ------------------------------------------------ | --------------------------------------------------------------------- |","| システム仕様の冒頭に全体像を書く決まりにする     | md の Slot の中身の形は決めないので、全体像を書いたかを確かめられない |","| 技術スタックに、部品のつながりを書ける項目を足す | 技術の一覧と、部品の構成図は、読む目的が違う                          |","| Slot の ID を `architecture` にする              | Slot の名前（システム概要）と ID の対応が読み取れない                 |"]},{"path":"docv/adr/system-pages.md","href":"ADR/構造化/システム仕様も、サービス仕様と同じくページに分けられるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [service-pages]","---","","# システム仕様も、サービス仕様と同じくページに分けられるようにする","","## 背景","","ページに分けられるのは、サービス仕様だけだった。システム仕様も、画面、サーバ、バッチのように部品が多いシステムでは、部品ごとの振る舞いが 1 つのページに並んで長くなる。部品を 1 つだけ知りたい開発者が、長いページの中から探すことになる。","","## 決めたこと","","サービス仕様とシステム仕様は、1 つのファイルの代わりに、1 ページ 1 つの Markdown で置けるようにする。置き場所は、`service/service.md` の代わりに `service/service/` の直下、`system/system.md` の代わりに `system/system/` の直下とする。どのページにも、YAML front matter に `order` と、その Slot の `mission` を書く。ページの並びは `order` で決め、本文の h1 をページの名前にする。HTML では、ページを 1 つずつ `\u003cまとまり>/\u003cSlot>/\u003ch1>.html` にし、Slot の名前の下に、ページへのリンクをタブにして並べる。","","分けないときは、今までどおり 1 つのファイルに書く。分けられるのは、サービス仕様とシステム仕様だけにする。","","どこで分けるかは docv では決めない。Doc ガイドの雛形に、分ける目安を書く。読み手、読むタイミング、部品や機能の違う情報が、1 つのページに混ざったら分ける。","","## 結果","","システム仕様も、部品ごとにページを分けて読める。分け方、検査、HTML の作りは、サービス仕様と同じになる。`docv desc` の案内は、「ページ分け」の章にまとめる。AI Agent は、`docv desc` で分けられることを、Doc ガイドで分ける目安を知る。","","## 選ばなかった案","","| 案                                             | 選ばなかった理由                                                |","| ---------------------------------------------- | --------------------------------------------------------------- |","| どの md の Slot も、ページに分けられる         | 利用マニュアルや API 仕様書を分けるかは、まだ要るかが分からない |","| システム仕様だけ、部品ごとの決まった形で分ける | md の Slot の中身の形は決めない。分け方はプロジェクトごとに違う |"]},{"path":"docs/schema/config.md","href":"プロジェクト詳細/docs/schema/config.html","tags":[["スキーマ",0]],"lines":["---","mission: docv.yaml の項目と、それぞれの形","tags: [スキーマ]","---","","# `docv.yaml` のスキーマ","","```json","{","  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",","  \"title\": \"docv.yaml\",","  \"description\": \"docv の設定ファイル。ツールの設定と、プロジェクト全体で共有する語彙を書く。ファイルごとの設定は YAML front matter に書く。項目の意味は `docv/service/service/config.md` を参照。\",","  \"type\": \"object\",","  \"additionalProperties\": false,","  \"properties\": {","    \"title\": {","      \"description\": \"HTML とインデックスに出すプロジェクト名。省略するとルートのディレクトリ名。\",","      \"type\": \"string\",","      \"minLength\": 1","    },","    \"dir\": {","      \"description\": \"docv が読み書きするディレクトリ。どれもルートからの相対パス。`index` を除くどの 2 つも、同じディレクトリにも、一方が他方を含む関係にもできない。\",","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"free\": {","          \"description\": \"管理対象の Markdown（Free ファイル）を置くディレクトリ。この下の `.md` のファイルがすべて対象。\",","          \"type\": \"string\",","          \"minLength\": 1,","          \"default\": \"docs\"","        },","        \"slot\": {","          \"description\": \"Slot ファイルを置くディレクトリ。\",","          \"type\": \"string\",","          \"minLength\": 1,","          \"default\": \"docv\"","        },","        \"html\": {","          \"description\": \"docv build が HTML を出すディレクトリ。\",","          \"type\": \"string\",","          \"minLength\": 1,","          \"default\": \"output/docv/html\"","        },","        \"image\": {","          \"description\": \"docv build が Slot のページの JPG を出すディレクトリ。書かなければ JPG を作らない。JPG を作るには Chrome が要る。\",","          \"type\": \"string\",","          \"minLength\": 1","        },","        \"index\": {","          \"description\": \"docv build がインデックス（`docv-index.md`）を書くディレクトリ。`.`（ルート）だけを書ける。書かなければインデックスを作らない。\",","          \"const\": \".\"","        }","      }","    },","    \"ignore\": {","      \"description\": \"管理対象にも管理外にもしないファイルの glob。\",","      \"type\": \"array\",","      \"items\": {","        \"type\": \"string\",","        \"minLength\": 1","      }","    },","    \"tags\": {","      \"description\": \"タグの一覧。YAML front matter の `tags` には、ここにあるタグだけを書ける。\",","      \"type\": \"array\",","      \"items\": {","        \"type\": \"object\",","        \"additionalProperties\": false,","        \"required\": [","          \"name\",","          \"color\"","        ],","        \"properties\": {","          \"name\": {","            \"type\": \"string\",","            \"minLength\": 1","          },","          \"color\": {","            \"description\": \"HTML でのタグの色。\",","            \"enum\": [","              \"blue\",","              \"green\",","              \"yellow\",","              \"red\",","              \"purple\",","              \"orange\",","              \"teal\",","              \"pink\"","            ]","          }","        }","      }","    },","    \"format\": {","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"enabled\": {","          \"description\": \"check で、整形が要るファイルを error にするか。\",","          \"type\": \"boolean\",","          \"default\": false","        }","      }","    },","    \"lint\": {","      \"description\": \"check の規則。項目の意味は `docv/service/service/config.md` を参照。\",","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"bold\": {","          \"description\": \"太字を使ってよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"italic\": {","          \"description\": \"斜体を使ってよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"dollar\": {","          \"description\": \"コードの外の 1 行に `$` を 2 つ以上書いてよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"textlint\": {","          \"description\": \"textlint で文章を校正するか。使うルールは docv が決める。\",","          \"enum\": [","            \"enable\",","            \"disable\"","          ],","          \"default\": \"disable\"","        }","      }","    }","  }","}","```"]},{"path":"docs/schema/cost.md","href":"プロジェクト詳細/docs/schema/cost.html","tags":[["スキーマ",0]],"lines":["---","mission: 費用（operation/cost.yaml）の項目と、それぞれの形","tags: [スキーマ]","---","","# 費用のスキーマ","","```json","{","  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",","  \"title\": \"費用（operation/cost.yaml）\",","  \"description\": \"かかっている費用と、費用を理由にやっていないこと\",","  \"type\": \"object\",","  \"additionalProperties\": false,","  \"properties\": {","    \"accepted_items\": {","      \"description\": \"費用をかけて使っているもの\",","      \"type\": \"array\",","      \"items\": {","        \"$ref\": \"#/$defs/item\"","      }","    },","    \"rejected_items\": {","      \"description\": \"費用を理由にやっていないこと。予算が変われば、`accepted_items` との間で項目を移す\",","      \"type\": \"array\",","      \"items\": {","        \"$ref\": \"#/$defs/item\"","      }","    },","    \"appendix_markdown\": {","      \"description\": \"項目のあとに続けて、ページに出す文章。Markdown。`|` のブロックで書く。\",","      \"type\": \"string\"","    }","  },","  \"$defs\": {","    \"item\": {","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"required\": [","        \"name\"","      ],","      \"properties\": {","        \"name\": {","          \"description\": \"名前\",","          \"type\": \"string\"","        },","        \"desc_markdown\": {","          \"description\": \"何のためか、なぜやらないか。Markdown。`|` のブロックで書く。\",","          \"type\": \"string\"","        },","        \"monthly\": {","          \"description\": \"1 か月あたりの金額。数でも文字列（「3 ドル」など）でもよい\",","          \"type\": [","            \"number\",","            \"string\"","          ]","        },","        \"ref\": {","          \"description\": \"料金のページなどの、ルートからの相対パスか URL\",","          \"type\": \"string\"","        }","      }","    }","  }","}","```"]},{"path":"docs/schema/develop.md","href":"プロジェクト詳細/docs/schema/develop.html","tags":[["スキーマ",0]],"lines":["---","mission: 開発コマンド（guide/develop.yaml）の項目と、それぞれの形","tags: [スキーマ]","---","","# 開発コマンドのスキーマ","","```json","{","  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",","  \"title\": \"開発コマンド（guide/develop.yaml）\",","  \"description\": \"テストやビルドなど、開発者が実行するコマンド\",","  \"type\": \"object\",","  \"additionalProperties\": false,","  \"properties\": {","    \"requirements\": {","      \"description\": \"前提とされるもの\",","      \"type\": \"array\",","      \"items\": {","        \"type\": \"object\",","        \"additionalProperties\": false,","        \"required\": [","          \"name\"","        ],","        \"properties\": {","          \"name\": {","            \"description\": \"名前\",","            \"type\": \"string\"","          },","          \"version\": {","            \"description\": \"要る版\",","            \"type\": \"string\"","          },","          \"purpose_markdown\": {","            \"description\": \"何に使うか。Markdown。`|` のブロックで書く。\",","            \"type\": \"string\"","          },","          \"url\": {","            \"description\": \"詳しく書いてあるページの URL\",","            \"type\": \"string\"","          }","        }","      }","    },","    \"steps\": {","      \"description\": \"手順の配列。書いた順に出す\",","      \"type\": \"array\",","      \"items\": {","        \"type\": \"object\",","        \"additionalProperties\": false,","        \"required\": [","          \"id\",","          \"name\"","        ],","        \"properties\": {","          \"id\": {","            \"description\": \"手順の ID。手順ごとに重ねない\",","            \"type\": \"string\"","          },","          \"name\": {","            \"description\": \"手順の名前\",","            \"type\": \"string\"","          },","          \"items\": {","            \"description\": \"手順の中身。1 つなら配列にしなくてよい。複数あるときは HTML で `os` ごとのタブにし、どの `item` にも `os` を書く\",","            \"oneOf\": [","              {","                \"$ref\": \"#/$defs/item\"","              },","              {","                \ // docv build の検索のページの JS。入力した文字列をそのまま含む行を探し、ファイルごとに入力欄の下へ並べる。
// 索引 DOCV_SEARCH は、build がこの JS の前に書く。ファイルの並びは索引の順（Slot ファイル、ADR、Free ファイル）のまま。
(function () {
  // ヒットした行の前後に出す行の数と、1 つのファイルに出すプレビューの数。
  var AROUND = 2;
  var MAX_PREVIEWS = 3;
  var form = document.querySelector('form.search');
  var input = form.querySelector('input');
  var count = document.getElementById('search-count');
  var results = document.getElementById('search-results');
  form.hidden = false;

  function escape(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 行の中の、入力した文字列に印を付ける。
  function mark(line, q) {
    return line.split(q).map(escape).join('<mark>' + escape(q) + '</mark>');
  }

  // ヒットした行の前後の範囲。重なるか隣り合う範囲は、1 つにつなげる。
  function ranges(lines, hits) {
    var out = [];
    hits.forEach(function (i) {
      var from = Math.max(0, i - AROUND);
      var to = Math.min(lines.length - 1, i + AROUND);
      var last = out[out.length - 1];
      if (last && from <= last.to + 1) {
        last.to = to;
      } else {
        out.push({ from: from, to: to });
      }
    });
    return out;
  }

  function file(f, q, hits) {
    var html = '<section class="hit"><p class="hit-file"><a href="' + escape(f.href) + '">' + escape(f.path) + '</a>';
    f.tags.forEach(function (t) {
      html += '<span class="tag c' + t[1] + '">' + escape(t[0]) + '</span>';
    });
    html += '</p>';
    var rs = ranges(f.lines, hits);
    rs.slice(0, MAX_PREVIEWS).forEach(function (r) {
      html += '<pre class="preview">';
      for (var i = r.from; i <= r.to; i++) {
        var line = f.lines[i];
        html += '<span class="ln">' + (i + 1) + '</span>' + (line.indexOf(q) >= 0 ? mark(line, q) : escape(line)) + '\n';
      }
      html += '</pre>';
    });
    if (rs.length > MAX_PREVIEWS) {
      html += '<p class="note">ほか ' + (rs.length - MAX_PREVIEWS) + ' か所</p>';
    }
    return html + '</section>';
  }

  function search() {
    var q = input.value;
    if (!q) {
      count.textContent = '';
      results.innerHTML = '';
      return;
    }
    var html = '';
    var files = 0;
    var lines = 0;
    DOCV_SEARCH.forEach(function (f) {
      var hits = [];
      f.lines.forEach(function (line, i) {
        if (line.indexOf(q) >= 0) hits.push(i);
      });
      if (!hits.length) return;
      files += 1;
      lines += hits.length;
      html += file(f, q, hits);
    });
    count.textContent = files ? files + ' ファイル、' + lines + ' 行' : '見つからない';
    results.innerHTML = html;
  }

  input.addEventListener('input', search);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
  });
  // 戻るで開き直したときは、ブラウザが残した入力で探し直す。
  window.addEventListener('pageshow', search);
  search();
})();
</script>
