 Slot に移すときは、ミッションに当たらない記述を、ほかの Slot、Free ファイル、ADR、PDR に分けること。実装は移さないこと","- 変わった情報は原則として上書きし、古くなった情報は原則として抹消すること","- ADR と PDR は加筆の指示があるまで作成せず、「ADR と PDR の作成基準」の書くものに当たる状況では作成提案にとどめること","- PDR の見直す条件を満たす状況に気づいたら、その PDR を示して、見直しを提案すること","- 検討中の項目、メモ、課題などを管理する場合は、正式ドキュメントとは分けて管理すること","  - タグや `docv.yaml` の `docv_exclude` を活用すること","- アスキーアートを用いたいときは、まず SVG で作図すること","- 画像は `docv desc` の「画像」の置き方に従い、使うファイルの隣に置くこと"]},{"path":"docv/slot/operation/release.md","href":"運用/リリース.html","tags":[],"lines":["---","mission: 版の決め方と、利用者への届け方","---","","# リリース","","版は `Cargo.toml` の `version` で決め、版のタグを push する。バイナリは配らず、利用者は GitHub のソースから cargo で入れる（[インストール](../service/install.yaml)）。","","## 手順","","1. `Cargo.toml` の `version` を上げ、次の 2 つと一緒にコミットする","   - `assets/update-guide.yaml` の先頭に、その版の変更点と対応を足す。対応のない版も書く。docv update-guide が出す 1 行は 100 文字以内にし、収まらない変更は分ける。足していないときと、長すぎるときは cargo test が落ちる","   - このリポジトリの `docv.yaml` の `docv_version` を、その版にする","2. v で始まるタグを push する（人間が行う）","","   ```sh","   git tag v1.0.0","   git push origin v1.0.0","   ```","","タグは、`docv init` と `docv slot gen` がファイルの 1 行目に書くスキーマの URL の参照先になる。タグを push するまで、その版の URL は開けない。"]},{"path":"docv/slot/operation/cost.yaml","href":"運用/費用.html","tags":[],"lines":["# yaml-language-server: $schema=../../../assets/schema/cost.schema.json","accepted_items:","  - name: GitHub","    desc_markdown: |","      ソースと、版のタグごとのスキーマの置き場所。public リポジトリでは無料","    monthly: 0 円","rejected_items: []"]},{"path":"docv/adr/typescript.md","href":"ADR/技術選定/TypeScriptで書く.html","tags":[],"lines":["---","group: 技術選定","date: 2026-10-10","---","","# TypeScript で書く","","## 背景","","ドキュメントを検査する CLI を作る。文章の検査には textlint を使い、textlint は Node.js で動く。","","## 決めたこと","","CLI は TypeScript で書き、npm のパッケージとして配る。textlint は、同じ Node.js の中からライブラリとして呼ぶ。","","## 結果","","textlint を外のコマンドとして呼ばずに済む。利用者は、Node.js を入れておく必要がある。","","## 選ばなかった案","","| 案          | 選ばなかった理由                                                          |","| ----------- | ------------------------------------------------------------------------- |","| Rust で書く | textlint を外のコマンドとして呼ぶことになり、Node.js との受け渡しが増える |"]},{"path":"docv/adr/rust.md","href":"ADR/技術選定/Rustで書く.html","tags":[],"lines":["---","group: 技術選定","date: 2026-10-11","supersedes: [typescript]","---","","# Rust で書く","","## 背景","","TypeScript で書くと、利用者は Node.js を入れておく必要がある。textlint を使わないプロジェクトでも、docv を動かすためだけに Node.js が要る。docv は多くのプロジェクトに入れて使うので、入れる手間を小さくしたい。","","## 決めたこと","","CLI は Rust で書き、単一のバイナリにして配る。","","## 結果","","利用者は、Node.js がなくても docv を使える。textlint を使うときだけ Node.js が要り、docv は textlint を外のコマンドとして呼ぶ。開発者は、Rust の環境を用意する。","","## 選ばなかった案","","| 案                      | 選ばなかった理由                                                                                         |","| ----------------------- | -------------------------------------------------------------------------------------------------------- |","| TypeScript で書き続ける | textlint を使わないプロジェクトにも Node.js が要る                                                       |","| Go で書く               | GitHub Actions で各プラットフォーム向けにビルドするなら、Go のクロスコンパイルの手軽さは決め手にならない |"]},{"path":"docv/adr/assets-only.md","href":"ADR/配布/実装から参照して出力するものをassets-にまとめる.html","tags":[],"lines":["---","group: 配布","date: 2026-10-15","---","","# 実装から参照して出力するものを assets/ にまとめる","","## 背景","","バイナリに埋め込むものが、3 か所に分かれていた。","","- `templates/`: YAML の Slot のサンプル","- `schema/`: `docv.yaml` のスキーマ","- `assets/`: CSS、docv の概要、YAML の Slot のスキーマ","","利用側が書き換えるかどうかや、公開するかどうかで分けていた。しかし、どれも実装から参照して出力するものという点で同じ。","","## 決めたこと","","実装から参照して出力するものは、すべて `assets/` に置く。YAML の Slot のサンプルは `assets/template/`、`docv.yaml` のスキーマは `assets/schema/docv.schema.json` に置く。`templates/` と `schema/` はなくす。","","## 結果","","埋め込むものは `assets/` を見れば揃う。`docv.yaml` から参照するスキーマの URL は `.../v\u003c版>/assets/schema/docv.schema.json` になる。タグを付けた版の URL は、その版の中身を指すので変わらない。","","## 選ばなかった案","","| 案                                              | 選ばなかった理由                                                 |","| ----------------------------------------------- | ---------------------------------------------------------------- |","| 利用側に書くもの（サンプル）を分けて置く        | 書き換えるかどうかは利用側の扱いで、実装の置き場所とは関係がない |","| 公開するスキーマだけをルートの `schema/` に残す | 公開は URL で参照するだけで、置き場所を分ける理由にならない      |"]},{"path":"docv/pdr/local-only.md","href":"PDR/フレームワークの範囲/checkとHTMLの生成はローカルで完結させる.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-10","---","","# check と HTML の生成はローカルで完結させる","","## 背景","","docv は、ドキュメントを書く人が手元で確かめ、手元で読むための道具。CI や公開の仕組みは、プロジェクトごとに違う。","","## 決めたこと","","check と build は、手元で実行して完結させる。CI での実行と公開は、利用者が必要なら自分で組む。","","## 結果","","利用者は、docv だけで check と HTML の生成ができる。CI で動かすときは、docv のコマンドを呼ぶ手順を利用者が組む。","","## 見直す条件","","- docv を入れたプロジェクトで、CI で check を実行する同じ手順を、それぞれが書き写しているのを見つけたとき","","## 選ばなかった案","","| 案                                                | 選ばなかった理由                   |","| ------------------------------------------------- | ---------------------------------- |","| GitHub Actions で check を実行し、HTML を公開する | ローカルで完結するほうが使いやすい |"]},{"path":"docv/pdr/no-typed-blocks.md","href":"PDR/構造化/構造化はYAMLfrontmatterとdocv.yamlに限る.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-10","---","","# 構造化は YAML front matter と `docv.yaml` に限る","","## 背景","","費用やコマンドのように、決まった形で書きたい情報がある。Free ファイルの本文の中に、決まった形のブロックを書かせる方法もあった。","","## 決めたこと","","個々のファイルの本文には、細かい形の制約を入れない。決まった形で書くものは、docv の規格のファイル（Slot）にする。","","## 結果","","Free ファイルは、ふつうの Markdown として読み書きできる。決まった形で書きたい情報は、Slot を足して扱う。","","## 見直す条件","","- Slot にするほどではない決まった形の情報を、複数のプロジェクトが Free ファイルの本文に同じ形で書いているのを見つけたとき","","## 選ばなかった案","","| 案                                                       | 選ばなかった理由                                                |","| -------------------------------------------------------- | --------------------------------------------------------------- |","| 費用やコマンドを、本文の中の YAML のコードブロックで書く | 本文に細かい制約を入れると、Markdown として読み書きしにくくなる |"]},{"path":"docv/pdr/rules-only.md","href":"PDR/フレームワークの範囲/AIAgentにはルールファイルを渡すところまでにする.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-11","---","","# AI Agent にはルールファイルを渡すところまでにする","","## 背景","","AI Agent がドキュメントを書くとき、docv のルールに沿わせる手段が要る。","","## 決めたこと","","docv はルールファイル（`docv desc`）を出すところまでにする。ルールに沿って直させる作業や `CLAUDE.md` への追記は、フレームワークの外で利用者が行う。","","## 結果","","docv は特定の AI Agent の仕組みに依存しない。","","## 見直す条件","","- `docv desc` を読ませても AI Agent が Doc ガイドに沿わないことが続き、利用者が同じ hook や設定を書き写すようになったとき","","## 選ばなかった案","","| 案                                                          | 選ばなかった理由                                                                                |","| ----------------------------------------------------------- | ----------------------------------------------------------------------------------------------- |","| Skill を提供し、docv init で `CLAUDE.md` と hook を設定する | 特定の AI Agent の仕組みに寄りすぎる。利用者の `CLAUDE.md` や hook に docv が書き込むことになる |"]},{"path":"docv/pdr/no-image.md","href":"PDR/出力/JPGを違うマシンで揃えず、build--no-imageで作らずに済ませる.html","tags":[],"lines":["---","group: 出力","date: 2026-10-17","---","","# JPG を違うマシンで揃えず、build --no-image で作らずに済ませる","","## 背景","","JPG は、マシンのフォントで変わる。違うマシンで同じ JPG にするには、フォントを埋め込む必要があり、日本語のフォントはサイズが大きい。`dir.image` を書いたプロジェクトでは、build のたびに Chrome で JPG を撮っていた。","","## 決めたこと","","違うマシンで同じ JPG にすることはしない。`docv build --no-image` は、`dir.image` を書いていても JPG を作らず、`dir.image` の中も変えない。チームで JPG を共有するなら、GitHub Actions などの決まった環境で作る。","","## 結果","","手元では、HTML だけを速く作り直せ、Chrome がなくても build できる。共有する JPG は、決まった環境で作る限り揃う。","","## 見直す条件","","- バイナリを大きくせずに、どのマシンでも同じ JPG を作れる手段が見つかったとき","- JPG をコミットするプロジェクトで、マシンの違いによる JPG の差分がレビューの妨げになったとき","","## 選ばなかった案","","| 案                                       | 選ばなかった理由                       |","| ---------------------------------------- | -------------------------------------- |","| フォントを埋め込み、どのマシンでも揃える | 日本語のフォントでバイナリが大きくなる |"]},{"path":"docv/pdr/overview-slot.md","href":"PDR/構造化/サービス概要のSlotを足し、サービス仕様と分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-24","---","","# サービス概要の Slot を足し、サービス仕様と分ける","","## 背景","","サービス仕様の Slot のミッションは「これの目的、利用者、解決すること、部品の構成」で、利用者にサービスそのものを説明することと、詳しい仕様を書くことの 2 つが入っていた。仕様が詳しく長くなるほど、これが何かを知りたいだけの利用者が、仕様の中から説明を探すことになる。","","## 決めたこと","","サービス概要の Slot（`service/overview.md`、md）を足す。サービス概要には、これが何で誰の何を解決し、何ができるかを、利用者に向けて書く。サービス仕様には、機能と部品の構成と、それぞれの詳しい振る舞いと決まりを書く。","","サービス仕様のまとまりは、サービス概要、サービス仕様、利用マニュアル、インストール、用語集の順に並べる。","","## 結果","","利用者は、サービス概要だけを読めば、これが何かがわかる。サービス仕様は、説明を気にせず詳しく書ける。","","## 見直す条件","","- サービス概要とサービス仕様に、同じ説明を書いているプロジェクトを見つけたとき","","## 選ばなかった案","","| 案                                         | 選ばなかった理由                                                    |","| ------------------------------------------ | ------------------------------------------------------------------- |","| サービス仕様の冒頭に概要を書く決まりにする | md の Slot の中身の形は決めないので、概要を書いたかを確かめられない |"]},{"path":"docv/pdr/service-pages.md","href":"PDR/構造化/サービス仕様をページに分けられるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-24","---","","# サービス仕様をページに分けられるようにする","","## 背景","","サービス仕様は 1 つの md の Slot で、HTML でも 1 つのページになる。利用者向けの機能と管理者向けの機能のように、読む人ごとに仕様が分かれるサービスでは、1 つのページが長くなり、読む人が自分に関わる部分を探すことになる。","","## 決めたこと","","サービス仕様は、`service/service.md` の代わりに、`service/service/` の直下に 1 ページ 1 つの Markdown で置けるようにする。ページの並びは YAML front matter の `order` で決め、本文の h1 をページの名前にする。HTML では、ページを 1 つずつ `サービス仕様/サービス仕様/\u003ch1>.html` にし、Slot の名前の下に、ページへのリンクをタブにして並べる。","","分けないときは、今と同じく `service/service.md` に書き、YAML front matter はいらない。分けられるのは、サービス仕様だけにする。","","## 結果","","すでにある `service/service.md` は、そのまま 1 ページのサービス仕様として読める。分けたページにも、ほかの md の Slot と同じ検査をかける。目次、検索、ほかのファイルからのリンクは、ページごとに効く。","","## 見直す条件","","- サービス仕様のほかにも、1 つのページが長くなり、分けたい md の Slot が出てきたとき","","## 選ばなかった案","","| 案                                                   | 選ばなかった理由                                                                           |","| ---------------------------------------------------- | ------------------------------------------------------------------------------------------ |","| `docv/service-specs/` のように、`docv/` の直下に置く | Slot をまとまりのディレクトリの下に置く決まりが崩れる                                      |","| 分けないときも、ディレクトリに置く                   | すでにある `service/service.md` を移すことになる                                           |","| ページの名前を YAML front matter に書く              | 本文の h1 と同じ名前を 2 か所に書くことになる                                              |","| 1 つの HTML の中で、CSS でタブを切り替える           | 目次に全ページの見出しが混ざる。検索の結果や見出しへのリンクから、隠れているタブを開けない |"]},{"path":"docv/pdr/spec-boundary.md","href":"PDR/構造化/サービス仕様とシステム仕様を、実装を差し替えても変わらないかで分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [overview-slot]","---","","# サービス仕様とシステム仕様を、実装を差し替えても変わらないかで分ける","","## 背景","","サービス仕様の Slot のミッションは「機能と部品の構成と、それぞれの詳しい振る舞いと決まり」、システム仕様の Slot のミッションは「システムの内部の動きと、従う決まり」だった。部品の構成と内部の動きが重なり、どちらも決まりを含むので、ミッションだけではどちらに書くかが決まらない。AI Agent はミッションに従い、サービス仕様に部品の構成を書く。仕様、アーキテクチャ、実装、設計といった言葉の意味も決めておらず、書く人によって置き場所が変わる。","","## 決めたこと","","サービス仕様のミッションを「外から見た機能と、それぞれの振る舞いと決まり」に、システム仕様のミッションを「部品の構成と役割、部品の間の流れと、部品をまたいで守る決まり」にする。サービス概要の Slot と、まとまりの並びは変えない。","","Doc ガイドの雛形に「言葉の使い分け」の章を足し、言葉ごとに指すものと書く場所を決める。仕様は、サービス仕様とシステム仕様の 2 つを指す。実装をそっくり差し替えても成り立つことはサービス仕様に、部品の分け方と部品をまたぐことはシステム仕様に書く。1 つの部品の中のことで、コードを読めば分かること（実装）は、指示がない限り書かない。設計は決めることで、置き場所を持たない。決めた結果は各所に、理由は ADR に書く。","","## 結果","","ミッションだけで、サービス仕様とシステム仕様のどちらに書くかが決まる。言葉の使い分けはガイドラインなので、プロジェクトに合わせて直せる。すでに作った Doc ガイドは変わらないので、`docv slot gen doc-guide --print` で見比べる。","","## 見直す条件","","- ミッションを読んでも、サービス仕様とシステム仕様のどちらに書くかで迷う記述が、繰り返し出たとき","","## 選ばなかった案","","| 案                                                           | 選ばなかった理由                                                                            |","| ------------------------------------------------------------ | ------------------------------------------------------------------------------------------- |","| サービス仕様のミッションを「利用者から見た」で始める         | API だけのサービスやバッチでは、外にいるのが人とは限らない                                  |","| ミッションに読む人を書く                                     | ミッションは読むと何が分かるかを 1 文で書く決まりで、長くなる。読む人は言葉の使い分けに書く |","| 言葉の使い分けを `docv desc` に書く                          | ルールになり、プロジェクトに合わせて直せない                                                |","| check で、サービス仕様の中のテーブル名らしい識別子を知らせる | 誤検知が多い。言葉の選び方はガイドラインで扱い、ルールにしない                              |","| 設計の置き場所を作る                                         | 決めた結果と理由で、書く場所が分かれる                                                      |"]},{"path":"docv/pdr/system-overview-slot.md","href":"PDR/構造化/システム概要のSlotを足し、システム仕様と分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [spec-boundary]","---","","# システム概要の Slot を足し、システム仕様と分ける","","## 背景","","システムのまとまりには、システム仕様、技術スタック、API 仕様書、DB 仕様書があり、システムをざっと理解するための Slot がなかった。システム仕様のミッションは「部品の構成と役割、部品の間の流れと、部品をまたいで守る決まり」で、全体を見せることと、詳しい決まりを書くことの 2 つが入っていた。詳しく書くほど、全体をつかみたいだけの開発者が、システム仕様の中から全体像を探すことになる。サービス仕様では、同じ理由でサービス概要を分けている。","","## 決めたこと","","システム概要の Slot（`system/system-overview.md`、md）を足す。ミッションは「開発者に向けた、システムを作る部品と、そのつながりの全体像」とする。システム仕様のミッションは「部品ごとの振る舞いと、部品の間の流れと、部品をまたいで守る決まり」にする。サービス仕様のミッションは変えない。","","システムのまとまりは、システム概要、システム仕様、技術スタック、API 仕様書、DB 仕様書の順に並べる。","","Doc ガイドの雛形の言葉の使い分けでは、アーキテクチャの全体像を、システム概要に SVG の図で書くことにする。サービス概要に書く「サービス説明」の言葉も足す。","","## 結果","","開発者は、システム概要の図だけで、どんな部品があり、どうつながっているかが分かる。システム概要は部品の役割とつながりを、技術スタックはそれを作る技術を書き、同じことを 2 か所に書かない。システム仕様の `mission` は変わるので、すでにある md の Slot は check の error で直す。","","## 見直す条件","","- システム概要とシステム仕様の両方に、同じ部品の説明を書いているプロジェクトを見つけたとき","","## 選ばなかった案","","| 案                                               | 選ばなかった理由                                                      |","| ------------------------------------------------ | --------------------------------------------------------------------- |","| システム仕様の冒頭に全体像を書く決まりにする     | md の Slot の中身の形は決めないので、全体像を書いたかを確かめられない |","| 技術スタックに、部品のつながりを書ける項目を足す | 技術の一覧と、部品の構成図は、読む目的が違う                          |","| Slot の ID を `architecture` にする              | Slot の名前（システム概要）と ID の対応が読み取れない                 |"]},{"path":"docv/pdr/system-pages.md","href":"PDR/構造化/システム仕様も、サービス仕様と同じくページに分けられるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [service-pages]","---","","# システム仕様も、サービス仕様と同じくページに分けられるようにする","","## 背景","","ページに分けられるのは、サービス仕様だけだった。システム仕様も、画面、サーバ、バッチのように部品が多いシステムでは、部品ごとの振る舞いが 1 つのページに並んで長くなる。部品を 1 つだけ知りたい開発者が、長いページの中から探すことになる。","","## 決めたこと","","サービス仕様とシステム仕様は、1 つのファイルの代わりに、1 ページ 1 つの Markdown で置けるようにする。置き場所は、`service/service.md` の代わりに `service/service/` の直下、`system/system.md` の代わりに `system/system/` の直下とする。どのページにも、YAML front matter に `order` と、その Slot の `mission` を書く。ページの並びは `order` で決め、本文の h1 をページの名前にする。HTML では、ページを 1 つずつ `\u003cまとまり>/\u003cSlot>/\u003ch1>.html` にし、Slot の名前の下に、ページへのリンクをタブにして並べる。","","分けないときは、今までどおり 1 つのファイルに書く。分けられるのは、サービス仕様とシステム仕様だけにする。","","どこで分けるかは docv では決めない。Doc ガイドの雛形に、分ける目安を書く。読み手、読むタイミング、部品や機能の違う情報が、1 つのページに混ざったら分ける。","","## 結果","","システム仕様も、部品ごとにページを分けて読める。分け方、検査、HTML の作りは、サービス仕様と同じになる。`docv desc` の案内は、「ページ分け」の章にまとめる。AI Agent は、`docv desc` で分けられることを、Doc ガイドで分ける目安を知る。","","## 見直す条件","","- 利用マニュアルや API 仕様書など、サービス仕様とシステム仕様のほかの Slot でも、1 つのページが長くなり、分けたいという要望が出たとき","","## 選ばなかった案","","| 案                                             | 選ばなかった理由                                                |","| ---------------------------------------------- | --------------------------------------------------------------- |","| どの md の Slot も、ページに分けられる         | 利用マニュアルや API 仕様書を分けるかは、まだ要るかが分からない |","| システム仕様だけ、部品ごとの決まった形で分ける | md の Slot の中身の形は決めない。分け方はプロジェクトごとに違う |"]},{"path":"docv/pdr/develop-infrastructure-pages.md","href":"PDR/構造化/開発コマンドとインフラと環境も、ページに分けられるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-07","supersedes: [system-pages]","---","","# 開発コマンドとインフラと環境も、ページに分けられるようにする","","## 背景","","ページに分けられるのは、サービス仕様とシステム仕様だけだった。画面、サーバ、バッチのように部品ごとに開発のコマンドや環境が違うプロジェクトでは、開発コマンドとインフラと環境も、部品ごとの記述が 1 つのページに並んで長くなる。開発コマンドは YAML の Slot で、md の Slot のように h1 をページの名前にできない。","","## 決めたこと","","開発コマンド（`guide/develop/`）とインフラと環境（`operation/infrastructure/`）も、1 つのファイルの代わりに、1 ページ 1 つのファイルで置けるようにする。ページの拡張子は、分けないときと同じにする。","","- インフラと環境は md なので、サービス仕様とシステム仕様と同じく、YAML front matter に `order` と `mission` を書き、本文の h1 をページの名前にする","- 開発コマンドは、分けないときの項目に、`order` とページの名前の `title` を足す。スキーマは分けないときと同じものを使い、`order` と `title` は一緒に書く","- `order` とページの名前の重なりは、同じ Slot のページどうしでだけ確かめる","","## 結果","","部品ごとにコマンドや環境が違うプロジェクトでも、ページを分けて読める。YAML のページは、ページごとに JPG を作り、インデックスからもページごとの JPG にリンクする。開発コマンドのスキーマが変わるので、版を上げてタグを打つまで、エディタは前の版のスキーマで確かめる。","","## 見直す条件","","- 利用マニュアルや API 仕様書など、まだ分けられない md の Slot でも、1 つのページが長くなり、分けたいという要望が出たとき","- 用語集や環境変数など、開発コマンドのほかの YAML の Slot でも、ページに分けたいという要望が出たとき","","## 選ばなかった案","","| 案                                                           | 選ばなかった理由                                                         |","| ------------------------------------------------------------ | ------------------------------------------------------------------------ |","| 開発コマンドのページの名前を、ファイル名にする               | ページのファイル名は自由に付ける決まりで、ほかの分けたページとも揃わない |","| 開発コマンドのページに、分けないときと別のスキーマを用意する | 同じ項目を 2 つのスキーマで持つことになる                                |","| どの Slot も、ページに分けられるようにする                   | 分ける要望のない Slot まで、ページの決まりを持つことになる               |"]},{"path":"docv/pdr/update-guide.md","href":"PDR/コマンド/docvを更新したときの変更点と対応を、docvupdate-guideで出す.html","tags":[],"lines":["---","group: コマンド","date: 2026-11-07","---","","# docv を更新したときの変更点と対応を、docv update-guide で出す","","## 背景","","docv の版を上げたとき、利用者が変わったことを知る手段は、`docv check` の error と `docv desc` だけだった。check で気づけるのは、ルールに合わなくなったことだけである。足された機能、Doc ガイドの雛形の変更、出力のパスの変更は、check を通っても伝わらない。出力のパスが変わると、README から JPG へのリンクが切れる。","","以前は、ファイルと `docv.yaml` に版を書き、版ごとの手順を出すコマンドを持っていた。`docv desc` と `docv check` で直せるとして、どちらもやめていた。そのため、docv を更新した後では、直前まで使っていた版が分からない。`docv init` と `docv slot gen` が 1 行目に書くスキーマの URL には版があるが、書いたときの版で、docv を更新しても変わらない。","","## 決めたこと","","- `docv update-guide --from \u003c版>` で、指定した版より後の版の変更点と対応を、古い版から順に出す。対応のない版も、「対応は要らない」と書いて出す","- 変更点と対応はバイナリに埋め込み、版を上げるときに足す。手元の docv の版と、出す内容を一致させるため","- `docv.yaml` の `docv_version` に、ドキュメントを合わせた docv の版を書く。`docv init` が書く","- `docv_version` が docv の版と違えば、パッチの版の違いでも check が error にし、update-guide に渡す版を案内する。docv を更新した AI Agent が、check の error を手がかりに update-guide を見つけられるようにするため","- `docv.yaml` と YAML の Slot の 1 行目にあるスキーマの URL の版も、`docv_version` と違えば check が error にする。エディタが、古い版のスキーマで補完と検証をしないようにするため","- update-guide の最後に、`docv_version` とスキーマの URL の版を上げるよう案内する","- update-guide の使い方は、`docv desc` と利用マニュアルに書き、Doc ガイドの雛形には書かない。docv を更新するときにしか要らないため","","## 結果","","docv を更新すると check が error になり、AI Agent は案内に従って update-guide を実行する。check では気づけない変更にも対応できる。","","版を上げるたびに、対応のない版でも、`docv_version` とスキーマの URL を書き換えるコミットが要る。チームの中では、docv の版を揃えることになる。CI で docv の最新を入れていると、新しい版が出たときに check が落ちるので、`docv_version` の版を入れる。","","1.8.0 より前から使っているプロジェクトには `docv_version` がないので、check が error にする。使っていた版は、`docv.yaml` の 1 行目のスキーマの URL から推して案内する。","","## 見直す条件","","- 「対応は要らない」だけの版が、3 つ続けて出たとき。パッチの版の違いでは check を落とさない形を考える","- update-guide の対応をせずに、`docv_version` だけを書き換えたプロジェクトを見つけたとき","","## 選ばなかった案","","| 案                                                                     | 選ばなかった理由                                                                           |","| ---------------------------------------------------------------------- | ------------------------------------------------------------------------------------------ |","| 1 行目のスキーマの URL の版を、使っている版として扱う                  | 決まりをコメントの行に持たせることになる。ローカルのパスでスキーマを指すと、版が分からない |","| 更新の前に `docv --version` で版を控えてもらう                         | 人が cargo install で更新すると、控える機会がない                                          |","| 変更点を GitHub の CHANGELOG に置く                                    | 手元の docv の版と、読む内容がずれる。AI Agent がネットワークで取りに行くことになる        |","| Doc ガイドの雛形で update-guide を案内する                             | 更新のときにしか要らない情報を、いつも読ませることになる                                   |","| `docv_version` の違いを check で知らせず、`docv desc` の案内だけにする | AI Agent は、docv が更新されたことを知らない                                               |","| パッチの版の違いは、check で知らせない                                 | パッチの版にも、対応の要る変更が入ることがある                                             |","","## 参考","","- [設定ファイル](../slot/service/service/config.md)","- [利用マニュアル](../slot/service/manual.md)","- [リリース](../slot/operation/release.md)"]},{"path":"docv/pdr/document-root.md","href":"PDR/構造化/ドキュメントを1つのディレクトリに集め、画像を使うファイルの隣に置く.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-14","---","","# ドキュメントを 1 つのディレクトリに集め、画像を使うファイルの隣に置く","","## 背景","","`docv.yaml` の `dir` には、Free ファイル、Slot ファイル、HTML、JPG、インデックスの置き場所を別々に書いていた。プロジェクトが、既存のディレクトリに合わせて配置を決められるようにするためだった。ADR と PDR は、Slot ファイルと同じ `dir.slot` の下に置いていた。","","画像の置き場所は決めていなかった。`dir.slot` の下には Slot のほかのファイルを置けない。そのため、Slot で使う図も Free ファイルのディレクトリへ置くことになる。ADR から、今の姿を書いた図を参照すると、図を直したときに過去の決定の中身まで変わる。","","ドキュメントは、原則として AI Agent が書いて直す。人間が探しやすいように、文章と画像を別のディレクトリに分ける必要はない。","","## 決めたこと","","`dir` は、ドキュメントを置く `dir.document_root` と、build の出力先の `dir.output` の 2 つにする。その下の配置は docv が決める。","","- `document_root` の下には、`free/`（Free ファイル）、`slot/`（Slot ファイル）、`adr/`、`pdr/` と、build が作るインデックスの `README.md` だけを置く","- `output` の下には、`html/` と `image/` を置く。JPG を作るかは `generate.image` で決める","- `output` は、`document_root` の中に置けない。AI Agent が `document_root` を読むと、HTML に写した同じ内容がほぼ倍入るため","- インデックスは、build のたびに作る。名前を `README.md` にし、GitHub で `document_root` を開くと表示されるようにする。手で直されないように、末尾に作った docv の版を書く。HTML のサイドバーの一番下にも版を出す","- `ignore` は `docv_exclude` に名前を変える。`.gitignore` と取り違えないため","","画像は、使うファイルと同じディレクトリに、`{使うファイルの名前}_{画像の名前}.{拡張子}` の名前で置く。名前の順に並べると、画像が使うファイルの隣に来る。持ち主のない画像は、check の error にする。複数のページで使う画像は、主になるページの隣に置き、ほかのページからはそのパスを参照する。共通の画像のディレクトリは作らない。","","ADR と PDR は、それぞれのディレクトリの中の画像だけを参照できる。外の画像と URL の画像は、check の error にする。決定がそれだけで完結し、ほかのドキュメントを直しても、過去の決定が変わらないようにするため。","","## 結果","","AI Agent は、設定を読まなくても、どこに何を置くかが分かる。dir どうしを重ねられないという決まりと検査はなくなる。画像の置き場所で迷わなくなり、持ち主をなくした画像は check で見つかる。","","既存のディレクトリに合わせた配置はできなくなる。docv を入れたプロジェクトは、ファイルを移し、リンクを直す。互換性を壊すので、版を 2.0.0 にし、`docv update-guide` に移し方を書く。出力をコミットするプロジェクトでは、docv の版を上げるたびに、HTML のすべてのページとインデックスに差分が出る。","","## 見直す条件","","- 既存のディレクトリを移せないことを理由に、docv を入れるのをやめたプロジェクトが出たとき","- `docv_exclude` で決まった配置から外したファイルが、どのプロジェクトでも同じ形で増えたとき","","## 選ばなかった案","","| 案                                                     | 選ばなかった理由                                                              |","| ------------------------------------------------------ | ----------------------------------------------------------------------------- |","| 今のまま、`dir` でそれぞれの置き場所を選べるようにする | 画像の置き場所が決まらない。AI Agent が、設定から置き場所を読み解く手間も残る |","| `output` を `document_root` の中に置く                 | AI Agent が読む範囲に、同じ内容がほぼ倍入る                                   |","| 画像を共通のディレクトリにまとめる                     | どのファイルの画像かが名前から分からず、使われなくなった画像に気づけない      |","| Free ファイルの画像の名前は check しない               | 名前を変えたり消したりしたファイルの画像が、持ち主のないまま残る              |"]},{"path":"docv/pdr/drop-directory-slot.md","href":"PDR/構造化/ディレクトリのSlotをやめる.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-14","---","","# ディレクトリの Slot をやめる","","## 背景","","開発者向けガイドに、ディレクトリごとの役割を書くディレクトリの Slot（`guide/directory-tree.yaml`）があった。HTML では、パスを 1 段ずつの表に分けて出し、`path` の先がなくなると check が slot-path-missing の error にしていた。","","このリポジトリで使ってみると、ディレクトリのページはほとんど開かれなかった。ディレクトリの名前と役割は、エディタやリポジトリのツリーを見れば分かることが多い。読む価値があるのは、どこに何を置くかの決まりのほうで、それはパスと役割の一覧の形には収まらない。","","## 決めたこと","","ディレクトリの Slot をやめる。Slot の定義、スキーマ、雛形、HTML の表を消す。ディレクトリについて書きたい決まりは、同じ版で足す設計・実装の Slot（`guide/design.md`）に書く。","","## 結果","","- すでにある `guide/directory-tree.yaml` は、check の slot-unknown の error になる。利用者は、残したい決まりを設計・実装に移し、ファイルを消す。docv update-guide で案内する","- ディレクトリの `path` の先がなくなったことに、check で気づけなくなる。ディレクトリの構成とドキュメントのずれは、機械では見つけない","- 公開したスキーマは版のタグの URL に残るので、前の版の docv を使うプロジェクトのエディタの補完は壊れない","","## 見直す条件","","- ディレクトリの構成とドキュメントのずれを、check で見つけたいという要望が出たとき","","## 選ばなかった案","","| 案                                                         | 選ばなかった理由                                                                                  |","| ---------------------------------------------------------- | ------------------------------------------------------------------------------------------------- |","| ディレクトリの Slot を残し、使わないプロジェクトは置かない | 置くかどうかは今も任意で、残しても開かれないページのために、書く手間と直す手間がかかり続ける      |","| ディレクトリの一覧を、設計・実装の YAML の項目にする       | 設計・実装は、決まりを自由な形で書く md の Slot。一覧の形を決めると、決まりの書き方を縛ってしまう |"]},{"path":"docv/pdr/guide-slots.md","href":"PDR/構造化/開発者向けガイドに、アーキテクチャ、設計・実装、テスト方針のSlotを足す.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-14","---","","# 開発者向けガイドに、アーキテクチャ、設計・実装、テスト方針の Slot を足す","","## 背景","","開発者向けガイドには、環境構築、開発コマンド、環境変数、Doc ガイドがあった。開発者がコードを書く前に知っておく方針を書く Slot はなかった。ある程度の大きさのサービスでは、次のどれもが要る。","","- システム全体の方式（部品の分け方、通信の方式、非同期処理の実現方法）","- コードの決まり（フレームワークの使い方、ディレクトリやコーディングの決まり）","- テストの方針","","Slot がないので Free ファイルへ書くしかなく、置き場所と書き方がプロジェクトごとにばらつく。","","Doc ガイドの雛形では、コードを読めば分かる実装は書かないと決めていて、コードの決まりをどこに書くかが決まっていなかった。","","## 決めたこと","","開発者向けガイドに、次の 3 つの md の Slot を足す。どれもページに分けられる。","","| Slot           | ファイル                | ミッション                                                                                     |","| -------------- | ----------------------- | ---------------------------------------------------------------------------------------------- |","| アーキテクチャ | `guide/architecture.md` | システム全体で採る方式と決まり（部品の分け方、通信の方式、非同期処理の実現方法など）           |","| 設計・実装     | `guide/design.md`       | コードを書くときに従う決まり（フレームワークの使い方、ディレクトリやコーディングの決まりなど） |","| テスト方針     | `guide/testing.md`      | テストの範囲と方法（自動テストの範囲、E2E テスト、手動テストについてなど）                     |","","開発者向けガイドは、環境構築、開発コマンド、アーキテクチャ、設計・実装、テスト方針、環境変数、Doc ガイドの順に並べる。","","- アーキテクチャのミッションでは、「サービスの分け方」ではなく「部品の分け方」と書く。docv では、画面、サーバ、バッチなどを部品と呼び、サービスは外から見た製品を指す（サービス概要、サービス仕様）","- 技術スタックは、使っている製品やライブラリの名前を一覧で見るための Slot のまま残す。方式は、アーキテクチャに書く","- 設計・実装には、コードを読んでも、守るべき決まりか、たまたまそうなっているかが分からないことを書く。今のコードの作り（実装）は、これまでどおり書かない","- テスト方針には、何をどのテストで確かめるかを書く。テストを実行するコマンドは、開発コマンドに書く","- Doc ガイドの雛形の言葉の使い分けに、アーキテクチャと実装の決まりを足す。これまでアーキテクチャと呼んでいた部品の構成は、システム構成と呼び、システム概要に書く","","## 結果","","- 方式、コードの決まり、テストの方針に、どのプロジェクトでも同じ置き場所ができる。AI Agent は、ミッションで書く Slot を決められる","- Free ファイルに書いていた方式や決まりは、Slot に移せる。移すかどうかは、プロジェクトが選ぶ","- アーキテクチャは、システム概要やシステム仕様と書く場所が近い。境目は Slot の規格の注に書く","","## 見直す条件","","- 3 つの Slot のどれに書くか、またはシステム概要やシステム仕様に書くかで迷う記述が、繰り返し出たとき","","## 選ばなかった案","","| 案                                    | 選ばなかった理由                                                                   |","| ------------------------------------- | ---------------------------------------------------------------------------------- |","| 方式や決まりは、Free ファイルに任せる | 置き場所がプロジェクトごとに違い、AI Agent がミッションで書く場所を決められない    |","| 技術スタックに、方式を書く項目を足す  | 技術スタックは名前を一覧で見るためのもので、方式の説明を足すと一覧が読みにくくなる |"]},{"path":"docv/free/schema/config.md","href":"プロジェクト詳細/docv/free/schema/config.html","tags":[["スキーマ",0]],"lines":["---","mission: docv.yaml の項目と、それぞれの形","tags: [スキーマ]","---","","# `docv.yaml` のスキーマ","","```json","{","  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",","  \"title\": \"docv.yaml\",","  \"description\": \"docv の設定ファイル。ツールの設定と、プロジェクト全体で共有する語彙を書く。ファイルごとの設定は YAML front matter に書く。項目の意味は `docv/slot/service/service/config.md` を参照。\",","  \"type\": \"object\",","  \"additionalProperties\": false,","  \"properties\": {","    \"docv_version\": {","      \"description\": \"ドキュメントを合わせた docv の版（`1.8.0` の形）。docv の版と違えば、docv check が error にする。docv を更新したら、`docv update-guide --from \u003cこの版>` で変わったことと対応を確かめ、対応してから書き換える。\",","      \"type\": \"string\",","      \"pattern\": \"^[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\"","    },","    \"title\": {","      \"description\": \"HTML とインデックスに出すプロジェクト名。省略するとルートのディレクトリ名。\",","      \"type\": \"string\",","      \"minLength\": 1","    },","    \"dir\": {","      \"description\": \"docv が読み書きするディレクトリ。どちらもルートからの相対パスで、ルートは書けない。`output` は、`document_root` と同じにも、その中にもできない。`document_root` も、`output` の中にはできない。\",","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"document_root\": {","          \"description\": \"ドキュメントを置くディレクトリ。この下に、`free/`（Free ファイル）、`slot/`（Slot ファイル）、`adr/`、`pdr/` と、docv build が作るインデックスの `README.md` を置く。直下にほかのものは置けない。\",","          \"type\": \"string\",","          \"minLength\": 1,","          \"default\": \"docv\"","        },","        \"output\": {","          \"description\": \"docv build の出力先。この下の `html/` に HTML を、`image/` に JPG を出す。AI Agent が `document_root` を読むときに同じ内容が倍入らないように、`document_root` の外に置く。\",","          \"type\": \"string\",","          \"minLength\": 1,","          \"default\": \"output/docv\"","        }","      }","    },","    \"docv_exclude\": {","      \"description\": \"docv が読まないファイルの glob。ルートからの相対パス。当てはまるファイルは、check（置き場所の検査も含む）、fix、整形、textlint、HTML、検索、インデックスのどれの対象にもならない。メモや下書きの置き場所に使う。\",","      \"type\": \"array\",","      \"items\": {","        \"type\": \"string\",","        \"minLength\": 1","      }","    },","    \"generate\": {","      \"description\": \"docv build が作るもの。\",","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"image\": {","          \"description\": \"YAML の Slot のページを JPG にして、`dir.output` の下の `image/` に出すか。JPG を作るには Chrome が要る。\",","          \"type\": \"boolean\",","          \"default\": false","        }","      }","    },","    \"tags\": {","      \"description\": \"タグの一覧。YAML front matter の `tags` には、ここにあるタグだけを書ける。\",","      \"type\": \"array\",","      \"items\": {","        \"type\": \"object\",","        \"additionalProperties\": false,","        \"required\": [","          \"name\",","          \"color\"","        ],","        \"properties\": {","          \"name\": {","            \"type\": \"string\",","            \"minLength\": 1","          },","          \"color\": {","            \"description\": \"HTML でのタグの色。\",","            \"enum\": [","              \"blue\",","              \"green\",","              \"yellow\",","              \"red\",","              \"purple\",","              \"orange\",","              \"teal\",","              \"pink\"","            ]","          }","        }","      }","    },","    \"format\": {","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"enabled\": {","          \"description\": \"check で、整形が要るファイルを error にするか。\",","          \"type\": \"boolean\",","          \"default\": false","        }","      }","    },","    \"lint\": {","      \"description\": \"check の規則。項目の意味は `docv/slot/service/service/config.md` を参照。\",","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"bold\": {","          \"description\": \"太字を使ってよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"italic\": {","          \"description\": \"斜体を使ってよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"dollar\": {","          \"description\": \"コードの外の 1 行に `$` を 2 つ以上書いてよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"textlint\": {","          \"description\": \"textlint で文章を校正するか。使うルールは docv が決める。\",","          \"enum\": [","            \"enable\",","            \"disable\"","          ],","          \"default\": \"disable\"","        }","      }","    }","  }","}","```"]},{"path":"docv/free/schema/cost.md","href":"プロジェクト詳細/docv/free/schema/cost.html","tags":[["スキーマ",0]],"lines":["---","mission: 費用（operation/cost.yaml）の項目と、それぞれの形","tags: [スキーマ]","---","","# 費用のスキーマ","","```json","{","  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",","  \"title\": \"費用（operation/cost.yaml）\",","  \"description\": \"かかっている費用と、費用を理由にやっていないこと\",","  \"type\": \"object\",","  \"additionalProperties\": false,","  \"properties\": {","    \"accepted_items\": {","      \"description\": \"費用をかけて使っているもの\",","      \"type\": \"array\",","      \"items\": {","        \"$ref\": \"#/$defs/item\"","
