 の中の画像だけを使う ( 外の画像や URL の画像は `docv check` が error にする )","- ファイルは手で作る","- 本文は、h1 に題を書き、次の章をこの順に h2 で書く。任意の章は、書くことがなければ置かない","    - `## 背景`: 決める必要が生じた課題と、そのときの制約や前提","    - `## 決めたこと`: 決めたことと、その案を選んだ理由。決めたことが当てはまる範囲","    - `## 決めないこと`（任意）: この ADR では決めないことと、それをどこで決めるか","    - `## 結果`: 決めたことで変わること。引き受けること（できなくなること、後で考えること）も書く","    - `## 選ばなかった案`: 比べた案と、それぞれを選ばなかった理由","    - `## 参考`（任意）: 根拠にしたファイルや資料へのリンク","- 決めた後は書き換えない","    - 既定のブランチ ( main など ) に入るまでは、同じファイルを書き換えてよい","    - 決定を変えるときは、新しい ADR を書き、その `supersedes` で過去の決定の id を指す","- HTML では、`group` ごとに決定のつながりを図にする","","```markdown","---","group: 言語","date: 2026-03-01","supersedes: [ go ]","---","","# Rust で書く","","## 背景","","配布するバイナリを 1 つにしたい。利用者の手元に、言語の実行環境を求めたくない","","## 決めたこと","","CLI は Rust で書き、単一のバイナリにして配る。CLI の外で動く道具（textlint など）は、この決定の範囲に含めない","","## 決めないこと","","バイナリをどこで配るかは決めない。リリースの Slot で決める","","## 結果","","利用者は、言語の実行環境なしで使える。開発者は、Rust の環境を用意する","","## 選ばなかった案","","| 案             | 選ばなかった理由             |","| -------------- | ---------------------------- |","| Node.js で書く | 利用者の手元に実行環境が要る |","| Zig で書く     | 情報が少ない                 |","","## 参考","","- [技術スタック](../slot/system/stack.md)","```","","### `group`","","任意","","決定のまとまりの名前","決定の対象 ( 言語、料金など ) で分け、Slot の名前にしない。打ち消しの鎖が 1 つの図に並び、Slot を組み替えても古くならない","省略すると「その他」","","### `date`","","必須 / YYYY-MM-DD","","決めた日","決定を並べる順に使う","","### `supersedes`","","任意 / リスト形式","","打ち消す過去の決定の id","","## 5. PDR","","PDR（Product Decision Record）は、プロダクトやサービスの仕様の変更 1 つを、その理由や見直す条件と一緒に残す記録。料金、プラン、提供する機能の範囲、対象とする利用者などを足す・変える・やめるときに書く。なぜ今の仕様になったのかを将来も分かるようにするための履歴なので、案を比べて選んだ決定に限らない","","- `docv/pdr/\u003cid>.md` に、変更 1 つを 1 ファイルで置く","- 画像は `docv/pdr/\u003cid>_\u003c画像の名前>.\u003c拡張子>` に置き、`docv/pdr/` の中の画像だけを使う","- ファイルの作り方、YAML front matter の項目、書き換えないこと、HTML の図は ADR と同じ","- `supersedes` は PDR だけを指す。ADR と PDR は、同じ id でも別の決定","- 題と `## 結果` は、利用者の言葉で書く。実現する手段は `## 決めたこと` に書く","- 本文の章は、ADR の章の `## 結果` の後に `## 見直す条件` を足し、`## 選ばなかった案` を任意にしたもの","    - `## 背景`: 決める必要が生じた課題と、そのときの利用者、市場、事業の状況","    - `## 決めたこと`: 決めたことと、その案を選んだ理由。決めたことが当てはまる範囲（対象の利用者、プラン、機能など）","    - `## 決めないこと`（任意）: この PDR では決めないことと、それをどこで決めるか","    - `## 結果`: 利用者と事業に起きると見込むこと。引き受けること（できなくなること、後で考えること）も書く","    - `## 見直す条件`: どんな状況になったら、この決定を見直すか。数や時期など、起きたかどうかを確かめられる形で書く","    - `## 選ばなかった案`（任意）: 比べた案があれば、それぞれを選ばなかった理由","    - `## 参考`（任意）: 根拠にしたファイルや資料へのリンク","- 見直す条件に当たっても書き換えない。決定を変えるなら、新しい PDR を書き、その `supersedes` で過去の決定の id を指す","","```markdown","---","group: 料金","date: 2026-04-01","supersedes: [ free-only ]","---","","# 注文の多い店舗に有料のプランを求める","","## 背景","","無料のプランだけで提供してきた。月の注文が 1 万件を超える店舗が増え、サーバの費用が売上を上回った","","## 決めたこと","","月の注文が 1,000 件を超える店舗には、有料のプランを求める。1,000 件までは、今までどおり無料にする","","## 結果","","注文の多い店舗の一部は、解約すると見込む","","## 見直す条件","","- 有料のプランに移った店舗が、対象の店舗の半分を下回ったとき","- 2027 年 3 月の時点で、サーバの費用が売上を上回ったままのとき","","## 選ばなかった案","","| 案                       | 選ばなかった理由                 |","| ------------------------ | -------------------------------- |","| すべての店舗を有料にする | 小さな店舗が使い始められなくなる |","```","","## 6. コマンド","","すべてのコマンドは `docv --help` と `docv \u003csub-command> --help` で確認する","","新たに導入する場合は `docv init` し、`docv gen doc-guide` でガイドラインを作り、`docv gen` と `docv check` で作成・調整を進める","","溜まったドキュメントをレビューするときは、`docv review-guide` を実行し、出した手順に従う","","## 7. スキーマ ( 設定ファイル )","","設定ファイル ( `docv.yaml` ) の項目は `docv init --print` で確認する","","すべての項目が、既定の値でコメントとして載っている","","## 8. ルール、ガイドライン、設定","","docv の決まりは、次の 3 つに分かれる","","- ルール: docv の仕組みが決める決まり。Slot の名前とミッション、`docv.yaml` のスキーマ、YAML front matter の key、check が確かめることなど。利用側は変えられない。この概要で確認する","- ガイドライン: ドキュメントを書くときの方針。`docv gen doc-guide` で Doc ガイド（`docv/slot/guide/doc-guide.md`）に雛形を作り、プロジェクトに合わせて自由に直す","- 設定: `docv.yaml` で切り替えること。check のルールや textlint を使うか、出力を git で管理するかなど。`docv init --print` で確認する","","## 9. docv の更新","","`docv.yaml` の `docv_version` に、ドキュメントを合わせた docv の版を書く","","- docv の版と違えば、パッチの版の違いでも `docv check` が error にする","- docv を更新したら、`docv update-guide --from \u003cdocv_version>` で版ごとの変更点と対応を確かめ、対応する","- 対応が終わったら、`docv_version` と、`docv.yaml` の 1 行目にあるスキーマの URL の版を、docv の版にする","- `docv_version` が docv の版より新しければ、docv を更新する"]},{"path":"docv/slot/service/service/slot.md","href":"サービス/サービス仕様/Slot.html","tags":[],"lines":["---","order: 2","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# Slot","","どのプロジェクトにも要るドキュメントを、docv が決めたミッションと形で書くファイルの規格。","","---","","## 1. 置き場所と書き方","","- Slot ファイルは、`docv.yaml` の `dir.document_root`（既定は `docv`）の下の `slot/` に、`\u003cまとまり>/\u003cSlot>.md` の名前で置く。まとまりのディレクトリは `service`（サービス）、`system`（システム）、`guide`（開発者向けガイド）、`operation`（運用）。Free ファイルは `free/` に置く（[設定ファイル](config.md) のページの「配置」の章）","- Slot ファイルは、すべて Markdown（`.md`）で書き、そのまま HTML に出す","- サービス仕様、システム仕様、開発コマンド、アーキテクチャ、設計・実装、テスト方針、インフラと環境だけは、ページに分けて `\u003cまとまり>/\u003cSlot>/` に置ける（「ページ分け」の章）","- ADR と PDR は、`slot/` ではなく、`document_root` の下の `adr/` と `pdr/` に置く","- `slot/` の中でも、除外に当たるファイル（[設定ファイル](config.md) のページの「docv が読むファイル」の章）と、名前がドットで始まるファイルとディレクトリ（`.DS_Store` など）は読まない。画像（[Free](free.md) のページの「画像」の章）は、Slot の隣に `{Slot の名前}_{画像の名前}.{拡張子}` の名前で置ける。ページに分けた Slot のページの隣には、`{ページの名前}_{画像の名前}.{拡張子}` で置ける。それ以外で Slot の名前でないファイルは、check が slot-unknown の error にする","- Slot を置くかどうかは任意。プロジェクトに当てはまらない Slot は作らない（例: 利用者の手元に入れるものがなければ、インストールの Slot はいらない）","- Slot のミッションに当たる詳しいことも、Slot の中に書く。Free ファイルへのリンクで済ませない","- Slot の中のリンクは、ほかの Markdown と同じく、ファイルの場所からの相対パスで書く","- `docv gen \u003cslot>` で、Slot ファイルを決まったパスに作れる（`docv list` で一覧とミッションを出す）","","---","","## 2. 一覧","","HTML には、この表の順に、まとまりごとに並べる。","","| ファイル                      | Slot           | まとまり         | ミッション                                                                                     |","| ----------------------------- | -------------- | ---------------- | ---------------------------------------------------------------------------------------------- |","| `service/overview.md`         | サービス概要   | サービス         | 利用者に向けた、これが何で、誰の何を解決し、何ができるかの説明                                 |","| `service/service.md`          | サービス仕様   | サービス         | 外から見た機能と、それぞれの振る舞いと決まり                                                   |","| `service/install.md`          | インストール   | サービス         | 利用者がこのサービスをインストールする方法                                                     |","| `service/manual.md`           | 利用マニュアル | サービス         | 利用者の使い方（CLI のコマンド、GUI の操作など）                                               |","| `service/words.md`            | 用語集         | サービス         | このプロジェクトの言葉の意味                                                                   |","| `system/system-overview.md`   | システム概要   | システム         | 開発者に向けた、システムを作る部品と、そのつながりの全体像                                     |","| `system/system.md`            | システム仕様   | システム         | 部品ごとの振る舞いと、部品の間の流れ                                                           |","| `system/stack.md`             | 技術スタック   | システム         | 利用している外部サービス、言語、ライブラリなどの名前と用途                                     |","| `system/api.md`               | API 仕様書     | システム         | API の一覧と、それぞれが受け取るものと返すもの                                                 |","| `system/db.md`                | DB 仕様書      | システム         | 保存しているデータと、その保存先と形                                                           |","| `guide/setup.md`              | 環境構築       | 開発者向けガイド | 開発を始めるのに用意するものと、実行するコマンド                                               |","| `guide/develop.md`            | 開発コマンド   | 開発者向けガイド | テストやビルドなど、開発者が実行するコマンド                                                   |","| `guide/architecture.md`       | アーキテクチャ | 開発者向けガイド | システム全体で採る方式と決まり（部品の分け方、通信の方式、非同期処理の実現方法など）           |","| `guide/design.md`             | 設計・実装     | 開発者向けガイド | コードを書くときに従う決まり（フレームワークの使い方、ディレクトリやコーディングの決まりなど） |","| `guide/testing.md`            | テスト方針     | 開発者向けガイド | テストの範囲と方法（自動テストの範囲、E2E テスト、手動テストについてなど）                     |","| `guide/env.md`                | 環境変数       | 開発者向けガイド | システムを動かすのに要る環境変数と、それぞれを設定している場所                                 |","| `guide/doc-guide.md`          | Doc ガイド     | 開発者向けガイド | このプロジェクトのドキュメントの置き場所と書き方                                               |","| `operation/infrastructure.md` | インフラと環境 | 運用             | 環境（本番、ステージング、開発など）の一覧と、それぞれの用途                                   |","| `operation/deploy.md`         | デプロイ       | 運用             | 作ったものを環境に反映する手順                                                                 |","| `operation/release.md`        | リリース       | 運用             | 版の決め方と、利用者への届け方                                                                 |","| `operation/cost.md`           | 費用           | 運用             | このプロジェクトの費用（月額費や、費用を理由にやっていないことなど）                           |","","- Slot の名前に近いパスで置くと、check が slot-unknown で正しいパスを示す。たとえば、まとまりのディレクトリが違う `words.md`、番号を付けた `service/03-words.md`、拡張子が違う `service/service.txt`","- 利用マニュアル（manual）と開発コマンド（develop）を分けるのは、使う人と目的が違うため。利用マニュアルは、リポジトリが CLI や GUI のときの、利用者向けの使い方","- サービス概要には、これは何で、何に使えるかを、利用者に向けて書く。サービス仕様には、外から見た機能と、それぞれがどう振る舞うかを詳しく書く。実装をそっくり差し替えても変わらないことが、サービス仕様になる","- システム概要には、どんな部品からなり、どうつながっているかを、開発者に向けて図で書く。システム仕様には、部品ごとの振る舞いと、部品の間の流れを詳しく書く。部品を作る言語やライブラリは、技術スタックに書く","- アーキテクチャには、部品の分け方とつなぎ方など、システム全体で採る方式と、部品をまたいで守る決まりを書く。どんな部品がありどうつながっているかはシステム概要に、使っている製品やライブラリの名前は技術スタックに書く。たとえば、重い処理をキューに積んでワーカーで非同期に行う方式は、アーキテクチャに書く。そのキューとワーカーはシステム概要に、注文の確定がキューを通ってワーカーに届く流れはシステム仕様に、キューの製品の名前は技術スタックに書く","- 設計・実装には、コードを書くときに従う決まりを書く。今のコードの作りは書かない。コードを読んでも、守るべき決まりか、たまたまそうなっているかは分からないため。ディレクトリの決まりも、ここに書く","- テスト方針には、何をどのテストで確かめるかを書く。テストを実行するコマンドは、開発コマンドに書く","- インフラと環境には、ある環境だけでなく、ない環境も書く（例: ステージングと本番があり、開発サーバーはない）","- デプロイは環境に反映すること、リリースは利用者に届けることで、どちらかしかないプロジェクトもある（例: サーバーを持たない CLI はリリースだけ）","","---","","## 3. 書き方","","- 中身の形は、check では確かめない","- YAML front matter には `mission` を書き、`docv list` のミッションと同じ文にする。ほかに書けるのは、関わる決定の `adr` と `pdr` だけ（[Free](free.md) のページの「関わる決定」の章）。ミッションは docv が決めるもので、プロジェクトでは変えない。ないか違えば、check が slot-mission の error にする。docv の版を上げてミッションが変わったときも、check で気づいて直す。ファイルを開けば、何を書く Slot かが分かるようにするため","- `mission` がないか違っても、HTML には本文を出す","- `docv gen` は、雛形のある Slot には雛形を作る。ほかの Slot には、YAML front matter の `mission` だけを書いたファイルを作り、中身の形は自由だと表示する","- 雛形にも `mission` を書いてある。作った雛形はプロジェクトのもので、列や文を足すのは自由。docv の版を上げても書き換えない","- 雛形の形から外れていないかは、check ではなく、`docv review-guide` のレビューで見る","","| Slot                   | 雛形の形                                                                                                                                        |","| ---------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------- |","| 用語集                 | まとまりごとの h2 の下に、用語、英語、意味の表を置く                                                                                            |","| 技術スタック           | 層ごとの h2 の下に、名前と用途の表を置く                                                                                                        |","| 環境変数               | キー、説明、ローカル環境、運用環境の表を置く。秘密の値のキーには 🔒 を付ける                                                                    |","| 費用                   | 「かかっている費用」と「費用を理由にやっていないこと」の h2 の下に、説明と月額の表を置く。説明は項目の名前から書き出し、参考の URL は末尾に置く |","| インストール、環境構築 | 「前提とされるもの」と「手順」の h2 を置く                                                                                                      |","| 開発コマンド           | 冒頭に、することとコマンドの表を置く。続けて、することごとの h2 の下に、実行の例、オプションの表、行われることの畳んだ箇条書きを置く            |","| Doc ガイド             | docv が勧めるガイドライン                                                                                                                       |","","---","","## 4. ページ分け","","サービス仕様、システム仕様、開発コマンド、アーキテクチャ、設計・実装、テスト方針、インフラと環境は、ページに分けられる。1 つのページが長くならないようにするため。読む人ごとに仕様が分かれるサービス（利用者向けの機能と管理者向けの機能など）、部品の多いシステム（画面、サーバ、バッチなど）、部品ごとに開発のコマンドや決まりや環境が違うプロジェクトで分ける。","","| Slot           | 1 つのファイル                | ページのディレクトリ        |","| -------------- | ----------------------------- | --------------------------- |","| サービス仕様   | `service/service.md`          | `service/service/`          |","| システム仕様   | `system/system.md`            | `system/system/`            |","| 開発コマンド   | `guide/develop.md`            | `guide/develop/`            |","| アーキテクチャ | `guide/architecture.md`       | `guide/architecture/`       |","| 設計・実装     | `guide/design.md`             | `guide/design/`             |","| テスト方針     | `guide/testing.md`            | `guide/testing/`            |","| インフラと環境 | `operation/infrastructure.md` | `operation/infrastructure/` |","","- 分けるときは、1 つのファイルの代わりに、ページのディレクトリの直下に 1 ページ 1 つの Markdown で置く。ファイル名は自由。両方に置くと check の error になる","- どのページにも、並びの `order`（整数）とページの名前を書く。ページは `order` の順に並べる。`order` もページの名前も、同じ Slot のページどうしで重ねない。ほかの Slot のページとは比べない","- 分けないときは、今までどおり 1 つのファイルに書く","- `docv gen` は、1 つのファイルを作り、分けるときの置き場所も表示する。ページがあるときは、1 つのファイルを作らずに error で終わる。ページは手で置く","","ページは、YAML front matter に `order` と `mission` を書く。関わる決定の `adr` と `pdr` も書ける。`mission` は、分けないときと同じく、その Slot のミッションと同じ文にする。本文の h1 が、ページの名前になる。","","```markdown","---","order: 2","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# 管理者向け機能","```","","---","","## 5. check","","| ID           | 内容                                                                                                                                      |","| ------------ | ----------------------------------------------------------------------------------------------------------------------------------------- |","| slot-unknown | `slot/` に、Slot の名前でも画像でもないファイルがある                                                                                     |","|              | YAML の Slot（`service/words.yaml` など、Slot の名前の `.yaml`）がある。`docv gen \u003cslot> --print` の雛形を見て、md に書き直すよう案内する |","| slot-invalid | 分けたページの形に合わない。`order` やページの名前（h1）がない、知らない項目、同じ Slot のページどうしの重なり                            |","|              | YAML front matter に、知らない項目がある。閉じる `---` がない                                                                             |","|              | 同じ Slot が、1 つのファイル（`service/service.md` など）と、ページのディレクトリ（`service/service/` など）の両方にある                  |","| slot-mission | YAML front matter に `mission` がないか、`docv list` のミッションと違う                                                                   |","","- Slot には、YAML front matter のほかは、Free ファイルと同じ検査（[Free](free.md) のページの「check のルール」の章）をかける","- `adr` と `pdr` は、Free ファイルと同じく decision-unknown と decision-superseded で確かめる","- `slot/` の中の画像には、Free ファイルの画像と同じ検査（image-owner）をかける"]},{"path":"docv/slot/service/service/free.md","href":"サービス/サービス仕様/Free.html","tags":[],"lines":["---","order: 3","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# Free","","docv が管理する Free ファイル（`docv.yaml` の `dir.document_root` の下の `free/` にある Markdown）のルールと、ドキュメントで使う画像のルール。何をどう書くかはガイドライン（Slot の Doc ガイド、`guide/doc-guide.md`）で、プロジェクトが決める。","","---","","## 1. YAML front matter","","| key       | 必須 | 中身                                                 |","| --------- | ---- | ---------------------------------------------------- |","| `mission` | 必須 | ミッション。このファイルを読むと何が分かるか（1 文） |","| `tags`    | 任意 | タグの配列（「タグ」の章）                           |","| `adr`     | 任意 | 関わる ADR の id の配列（「関わる決定」の章）        |","| `pdr`     | 任意 | 関わる PDR の id の配列（「関わる決定」の章）        |","","```yaml","---","mission: 注文を確定するタイミングと、失敗したときの扱い","tags: [仕様, 注文]","---","```","","- `mission` は 1 行で書く","- ファイルごとの設定は、すべて YAML front matter に書き、`docv.yaml` には書かない。ファイルを動かしても設定がずれず、AI Agent はファイルを読むだけで、そのファイルの扱いが分かる","- docv が知らない key は、そのまま残し、check もしない。作成者の記録（`created` / `updated` など）のように、プロジェクトが決めた key を書いてよい","- HTML は、`mission` をファイルの説明として表示する","","### 関わる決定","","- `adr` と `pdr` には、そのページに関わる決定の id を並べる。HTML では、docv がページの末尾に決定の題を出す（[ビジュアライズ](html.md) のページの「HTML の作り」の章）","- 本文には、ADR と PDR へのリンクや、「理由は ADR に書いた」のような文を書かない。決定を指すのは、`adr` と `pdr` だけにする","- ADR と PDR は、同じ id でも別の決定なので、項目を分ける","- 決定の側には、関わるページを書かない。決定は書き換えないが、ページは移ったり分かれたりするため","- md の Slot にも、同じく書ける","","```yaml","---","mission: 注文を確定するタイミングと、失敗したときの扱い","adr: [queue]","pdr: [paid-plan]","---","```","","---","","## 2. タグ","","- Free ファイルの分類は、YAML front matter の `tags` に書くタグで行う。1 つのファイルにいくつでも付けられる","- docv はタグの意味を決めない。どんなタグを使うかは、プロジェクトが決める","- 使うタグは、すべて `docv.yaml` の `tags` に書く。`tags` にないタグを付けると、check が error にする","- `tags` には、タグごとに名前（`name`）と色（`color`）を書く。色は HTML でタグを見分けるためのもので、blue、green、yellow、red、purple、orange、teal、pink から選ぶ","","```yaml","tags:","  - name: 仕様","    color: blue","  - name: 計画","    color: green","```","","---","","## 3. check のルール","","`docv check` が Free ファイルで確かめるルール。","","### YAML front matter","","| ID                  | 内容                                                                              |","| ------------------- | --------------------------------------------------------------------------------- |","| frontmatter-invalid | YAML front matter が読めない。`mission`、`tags`、`adr`、`pdr` の型が違う          |","| mission-missing     | `mission` がない                                                                  |","| mission-multiline   | `mission` が複数行                                                                |","| tag-unknown         | `docv.yaml` の `tags` にないタグがある                                            |","| decision-unknown    | `adr` か `pdr` の id の決定がない                                                 |","| decision-superseded | `adr` か `pdr` の id の決定が、打ち消されている。warning で、終了コードは変えない |","","### 構造とリンク","","| ID             | 内容                                                                     |","| -------------- | ------------------------------------------------------------------------ |","| title-count    | h1 が 1 つでない                                                         |","| heading-number | 章番号で始まる h2 があるのに、h2 が `1. ` から順に章番号で始まっていない |","| link-broken    | ルートの中を指す相対リンクの先にファイルがない                           |","| link-anchor    | リンクのアンカー（`#` 以降）が指す見出しが、リンク先の Markdown にない   |","","- 章番号は、h2 のどれかが `1. ` のような章番号で始まっているファイルでだけ確かめる。章番号を使わないファイルでは確かめない","- アンカーは、HTML の見出しと同じく GitHub と同じ形で作る。同じ見出しが続けば `-1`、`-2` を付ける。`#` だけのページ内リンクは、そのファイルの見出しと比べる。Markdown でないファイルへのリンクのアンカーは確かめない","","---","","## 4. 画像","","Free ファイル、Slot ファイル、ADR、PDR で使う画像の置き場所と名前。","","- 画像は、使うファイルと同じディレクトリに置く。共通の画像のディレクトリは作らない","- 名前は `{使うファイルの名前}_{画像の名前}.{拡張子}` にする。使うファイルの名前は、拡張子を除いた名前。たとえば、`order.md` で使う流れの図は `order_flow.svg`。名前の順に並べると、画像が使うファイルの隣に来る","- 複数のページで使う画像は、主になるページの隣に置き、ほかのページからはそのパスを参照する","- ADR と PDR は、それぞれのディレクトリ（`adr/`、`pdr/`）の中の画像だけを参照できる（[ADR](adr.md) のページの「check」の章）。それ単体で完結することに価値があり、最新のドキュメントの内容に過去の決定が左右されないようにするため","- 画像として扱うのは、拡張子が png、jpg、jpeg、gif、svg、webp のファイル","","| ID          | 内容                                                                                                                                                                   |","| ----------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| image-owner | `free/`、`slot/`、`adr/`、`pdr/` の下の画像に、持ち主がない。持ち主は、同じディレクトリにある、名前（拡張子を除く）が画像の名前の `_` より前と同じ Markdown のファイル |","","- 画像の名前に `_` がいくつかあるときは、どの `_` で区切っても、持ち主が見つかればよい。使うファイルの名前に `_` が入っていても、名前の付け方を変えずに済むため"]},{"path":"docv/slot/service/service/adr.md","href":"サービス/サービス仕様/ADR.html","tags":[],"lines":["---","order: 4","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# ADR","","ADR（Architecture Decision Record）は、技術の決定 1 つを、背景、結果、選ばなかった案と一緒に残す記録。Free ファイルと Slot には今の姿だけを書き、どう決めてきたかは ADR と PDR に残す。プロダクトやサービスの決定は [PDR](pdr.md) に残す。docv が形を決めるファイルの 1 つ。","","---","","## 1. 置き場所と書き方","","- `dir.document_root`（既定は `docv`）の下の `adr/` に、決定 1 つを 1 つの Markdown で置く。ファイル名は `\u003cid>.md` で、`.md` を除いた名前が決定を指す id になる","- 画像は、`adr/` の中に `{id}_{画像の名前}.{拡張子}` の名前で置き、`adr/` の中の画像だけを参照する。外の画像を使いたいときは、写しを置く。決定がそれだけで完結し、ほかのドキュメントを直しても、過去の決定が変わらないようにするため","- システムが使う項目（`group`、`date`、`supersedes`）は YAML front matter に書く。決定の中身は本文に書き、本文の h1 を題にする","- 状態（採用、却下など）は持たない。ADR に残すのは決めたことだけで、打ち消されたかどうかは、新しい決定の `supersedes` から指されているかでわかる。打ち消されていない決定が、今の決定","- 本文は、決まった章で書く（「本文の章」の章）","- 決めた後は書き換えない。決定を変えるときは、新しい ADR を書き、その `supersedes` から過去の決定の id を指す（未来から過去を参照する）","- 書き換えないのは、既定のブランチ（main など）に入った後から。それまでは、同じファイルを書き換えてよい","- 過去の決定から新しい決定へのつながりは、docv が `supersedes` を逆にたどって組み立てる。過去の ADR には書き足さない","- 決定に関わるページは、ページの側の YAML front matter の `adr` に書き、ADR には書かない（[Free](free.md) のページの「関わる決定」の章）","- 用語を変えても、過去の ADR は書き換えない。過去の ADR が今の用語で読めなくなることは許す。用語集の Slot には今の用語だけを書き、昔の用語との対応は残さない","","---","","## 2. YAML front matter の項目","","| 項目         | 必須 | 中身                                                                                    |","| ------------ | ---- | --------------------------------------------------------------------------------------- |","| `group`      | 任意 | まとまりの名前。同じ `group` の決定を、HTML で 1 つの図にまとめる。省略すると「その他」 |","| `date`       | 必須 | 決めた日（YYYY-MM-DD）。決定を並べる順と、`supersedes` が過去を指しているかに使う       |","| `supersedes` | 任意 | 打ち消す過去の決定の id の配列                                                          |","","- `group` は、決定の対象（言語、料金など）で分け、Slot の名前にしない。打ち消しの鎖が 1 つの図に並び、Slot を組み替えても古くならないようにするため","","---","","## 3. 本文の章","","本文は、h1 の題の下に、次の章をこの順に h2 で書く。任意の章は、書くことがなければ置かない。","","| 章             | 必須 | 書くこと                                                                               |","| -------------- | ---- | -------------------------------------------------------------------------------------- |","| 背景           | 必須 | 決める必要が生じた課題と、そのときの制約や前提                                         |","| 決めたこと     | 必須 | 決めたことと、その案を選んだ理由。決めたことが当てはまる範囲                           |","| 決めないこと   | 任意 | この ADR では決めないことと、それをどこで決めるか                                      |","| 結果           | 必須 | 決めたことで変わること。引き受けること（できなくなること、後で考えること）も書く       |","| 選ばなかった案 | 必須 | 比べた案と、それぞれを選ばなかった理由                                                 |","| 参考           | 任意 | 根拠にしたファイルや資料へのリンク。ADR だけで読めるように、本文の根拠をここにまとめる |","","- 章の形は check で確かめない。章を揃えるのは、ADR を読む人と AI Agent が、どの ADR も同じ順で読めるようにするため","","```markdown","---","group: 言語","date: 2026-03-01","supersedes: [go]","---","","# Rust で書く","","## 背景","","配布するバイナリを 1 つにしたい。利用者の手元に、言語の実行環境を求めたくない。","","## 決めたこと","","CLI は Rust で書き、単一のバイナリにして配る。CLI の外で動く道具（textlint など）は、この決定の範囲に含めない。","","## 決めないこと","","バイナリをどこで配るかは決めない。リリースの Slot で決める。","","## 結果","","利用者は、言語の実行環境なしで使える。開発者は、Rust の環境を用意する。","","## 選ばなかった案","","| 案             | 選ばなかった理由             |","| -------------- | ---------------------------- |","| Node.js で書く | 利用者の手元に実行環境が要る |","| Zig で書く     | 情報が少ない                 |","","## 参考","","- [技術スタック](../slot/system/stack.md)","```","","---","","## 4. check","","| ID              | 内容                                                                                         |","| --------------- | -------------------------------------------------------------------------------------------- |","| adr-invalid     | YAML front matter が ADR の形に合わない（知らない項目、`date` の形も含む）。本文に h1 がない |","| adr-unknown-ref | `supersedes` の先の ADR がない。または、その決定より後の決定を指している                     |","| adr-image       | 本文の画像が、`adr/` の外のファイルか URL を指している                                       |","","- 本文には、YAML front matter のほかは、Free ファイルと同じ検査（[Free](free.md) のページの「check のルール」の章）をかける","- `adr/` の中の画像には、Free ファイルの画像と同じ検査（[Free](free.md) のページの「画像」の章の image-owner）をかける","","---","","## 5. AI Agent","","- AI Agent が ADR を読むのは、決めた理由を聞かれたときだけ。今の姿は Free ファイルと Slot を読む"]},{"path":"docv/slot/service/service/pdr.md","href":"サービス/サービス仕様/PDR.html","tags":[],"lines":["---","order: 5","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# PDR","","PDR（Product Decision Record）は、プロダクトやサービスの仕様の変更 1 つを、その理由や見直す条件と一緒に残す記録。料金、プラン、提供する機能の範囲、対象とする利用者などを足す・変える・やめるときに書く。なぜ今の仕様になったのかを将来も分かるようにするための履歴なので、案を比べて選んだ決定に限らない。技術の決定は [ADR](adr.md) に残す。","","置き場所、YAML front matter、決めた後に書き換えないこと、HTML の作りは ADR と同じ。このページには、ADR と違うところを書く。","","---","","## 1. 置き場所と書き方","","- `dir.document_root`（既定は `docv`）の下の `pdr/` に、変更 1 つを 1 つの Markdown で置く","- 画像は、`pdr/` の中に `{id}_{画像の名前}.{拡張子}` の名前で置き、`pdr/` の中の画像だけを参照する。ADR の画像も参照しない","- ファイル名と id、YAML front matter の項目（`group`、`date`、`supersedes`）、状態を持たないこと、決めた後に書き換えないことは、[ADR](adr.md) と同じ","- 決定に関わるページは、ページの側の YAML front matter の `pdr` に書き、PDR には書かない","- `supersedes` は、PDR だけを指す。ADR と PDR は、同じ id でも別の決定。PDR から ADR に触れるときは、本文のリンクで示す","- 題と結果の章は、利用者の言葉で書く。実現する手段は、決めたことの章に書く","","---","","## 2. 本文の章","","本文は、h1 の題の下に、次の章をこの順に h2 で書く。任意の章は、書くことがなければ置かない。ADR の章に見直す条件を足し、選ばなかった案を任意にした形。","","| 章             | 必須 | 書くこと                                                                                       |","| -------------- | ---- | ---------------------------------------------------------------------------------------------- |","| 背景           | 必須 | 決める必要が生じた課題と、そのときの利用者、市場、事業の状況                                   |","| 決めたこと     | 必須 | 決めたことと、その案を選んだ理由。決めたことが当てはまる範囲（対象の利用者、プラン、機能など） |","| 決めないこと   | 任意 | この PDR では決めないことと、それをどこで決めるか                                              |","| 結果           | 必須 | 利用者と事業に起きると見込むこと。引き受けること（できなくなること、後で考えること）も書く     |","| 見直す条件     | 必須 | どんな状況になったら、この決定を見直すか。数や時期など、起きたかどうかを確かめられる形で書く   |","| 選ばなかった案 | 任意 | 比べた案があれば、それぞれを選ばなかった理由                                                   |","| 参考           | 任意 | 根拠にしたファイルや資料へのリンク。PDR だけで読めるように、本文の根拠をここにまとめる         |","","- 選ばなかった案を任意にするのは、PDR が仕様の変更の履歴で、案を比べずに決める変更（機能をやめるなど）も残すため","- 見直す条件は、必ず書く。プロダクトやサービスの決定は、利用者や市場が変わると正しさが変わる。決めたときに見込んだことが外れたと、後から気づけるようにするため","- 見直す条件に当たっても、PDR は書き換えない。見直して決定を変えるなら、新しい PDR を書き、その `supersedes` から指す","- 章の形は check で確かめない","","```markdown","---","group: 料金","date: 2026-04-01","supersedes: [free-only]","---","","# 注文の多い店舗に有料のプランを求める","","## 背景","","無料のプランだけで提供してきた。月の注文が 1 万件を超える店舗が増え、サーバの費用が売上を上回った。","","## 決めたこと","","月の注文が 1,000 件を超える店舗には、有料のプランを求める。1,000 件までは、今までどおり無料にする。","","## 決めないこと","","有料のプランの金額は決めない。サービス仕様の料金の章で決める。","","## 結果","","注文の多い店舗の一部は、解約すると見込む。注文の少ない店舗は、今までどおり無料で使える。","","## 見直す条件","","- 有料のプランに移った店舗が、対象の店舗の半分を下回ったとき","- 2027 年 3 月の時点で、サーバの費用が売上を上回ったままのとき","","## 選ばなかった案","","| 案                       | 選ばなかった理由                 |","| ------------------------ | -------------------------------- |","| すべての店舗を有料にする | 小さな店舗が使い始められなくなる |","| 店舗の画面に広告を出す   | 注文を受ける画面が狭くなる       |","","## 参考","","- [サービス仕様](../service/service.md)","```","","---","","## 3. check","","| ID              | 内容                                                                                         |","| --------------- | -------------------------------------------------------------------------------------------- |","| pdr-invalid     | YAML front matter が PDR の形に合わない（知らない項目、`date` の形も含む）。本文に h1 がない |","| pdr-unknown-ref | `supersedes` の先の PDR がない。または、その決定より後の決定を指している                     |","| pdr-image       | 本文の画像が、`pdr/` の外のファイルか URL を指している                                       |","","- 本文には、YAML front matter のほかは、Free ファイルと同じ検査（[Free](free.md) のページの「check のルール」の章）をかける","- `pdr/` の中の画像には、Free ファイルの画像と同じ検査（[Free](free.md) のページの「画像」の章の image-owner）をかける","","---","","## 4. AI Agent","","- AI Agent が PDR を読むのは、決めた理由を聞かれたときと、見直す条件に当たるかを確かめるときだけ。今の姿は Free ファイルと Slot を読む"]},{"path":"docv/slot/service/service/config.md","href":"サービス/サービス仕様/設定ファイル.html","tags":[],"lines":["---","order: 6","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# 設定ファイル","","リポジトリのルートに置く設定ファイル（`docv.yaml`）。型は [`assets/schema/docv.schema.json`](../../../../assets/schema/docv.schema.json) が正本。最初の章で項目を一覧にし、続く章で、一覧に書ききれない解釈の決まりと、`docv.yaml` で使うと決めたときだけ動く道具（書式の規則、textlint、整形）を書く。","","---","","## 1. 例","","```yaml","# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-hoge/docv/v2.3.2/assets/schema/docv.schema.json","docv_version: 2.3.2","title: shop-app","","dir:","  document_root: docv","  output: output/docv","docv_exclude:","  - docv/free/tmp/**","","tags:","  - name: 仕様","    color: blue","  - name: 手順","    color: green","  - name: 規約","    color: yellow","","lint:","  bold: deny","  textlint: enable","format:","  enabled: true","```","","| 項目                | 必須 | 既定          | 意味                                                                                                       |","| ------------------- | ---- | ------------- | ---------------------------------------------------------------------------------------------------------- |","| `docv_version`      |      |               | ドキュメントを合わせた docv の版。docv の版と違えば、check が error にする（「docv の版」の章）            |","| `title`             |      | ルートの名前  | HTML に出すプロジェクト名                                                                                  |","| `dir.document_root` |      | `docv`        | ドキュメントを置くディレクトリ。この下の配置は docv が決める（「配置」の章）                               |","| `dir.output`        |      | `output/docv` | docv build の出力先。この下に `html/` を作る（「配置」の章）                                               |","| `docv_exclude`      |      |               | docv が読まないファイルの glob の配列（「docv が読むファイル」の章）                                       |","| `tags`              |      |               | 使うタグの一覧。タグごとに `name` と、HTML の色の `color` を書く（[Free](free.md) のページの「タグ」の章） |","| `lint.bold`         |      | allow         | 太字を使ってよいか（「書式の規則」の章）                                                                   |","| `lint.italic`       |      | allow         | 斜体を使ってよいか（「書式の規則」の章）                                                                   |","| `lint.dollar`       |      | allow         | コードの外の 1 行に `$` を 2 つ以上書いてよいか（「書式の規則」の章）                                      |","| `lint.textlint`     |      | disable       | textlint で文章を校正するか（「textlint」の章）                                                            |","| `format.enabled`    |      | false         | check で、整形が要るファイルを error にするか（「整形との連動」の章）                                      |","","---","","## 2. 書くことと書かないこと","","- `docv.yaml` には、ツールの設定（`lint`、整形、出力）と、プロジェクト全体で共有する語彙（ドキュメントの置き場所、docv が読まないファイル、タグの一覧）だけを書く","- ファイルごとの設定（ミッション、タグ）は、そのファイルの YAML front matter に書く（[Free](free.md) のページの「YAML front matter」の章）","","---","","## 3. 配置","","`dir.document_root` と `dir.output` の下の配置は docv が決め、設定では変えない。AI Agent が、設定を読まなくても、どこに何を置くかが分かるようにするため。","","```","README.md            # 管理外。HTML では README のページにする。docv/README.md へリンクする","docv/                # dir.document_root","  README.md          # docv build が作るインデックス","  free/              # Free ファイル","    order.md         # 分類はディレクトリではなくタグで行う","    order_flow.svg   # order.md で使う画像","    tmp/             # メモを置く。docv_exclude に入れる","  slot/              # Slot ファイル","    service/         # サービス。ほかに system/、guide/、operation/","      service.md","  adr/               # ADR","  pdr/               # PDR","output/docv/         # dir.output","  html/              # HTML","```","","- `document_root` の直下には、`README.md`、`free/`、`slot/`、`adr/`、`pdr/` だけを置ける。ほかのファイルとディレクトリは、check が root-unknown の error にする。名前がドットで始まるもの、`.gitignore` に書かれたもの、`docv_exclude` に当てはまるものは除く","- `free/` と `slot/` を分けるのは、プロジェクトがミッションと形を決める Free ファイルと、docv が決める Slot ファイルを、置き場所で見分けられるようにするため","- 画像は、使うファイルと同じディレクトリに、`{使うファイルの名前}_{画像の名前}.{拡張子}` の名前で置く（[Free](free.md) のページの「画像」の章）","- `dir.document_root` と `dir.output` は、ルートからの相対パスで書く。どちらもルートは書けない","- `dir.output` は、`dir.document_root` と同じにも、その中にもできない。AI Agent が `document_root` を読むと、HTML に写した同じ内容がほぼ倍入るため","- `dir.document_root` は、`dir.output` の中にできない。build は出力先を作り直すので、ドキュメントを消してしまうため","- 違反すると、`docv.yaml` が正しくないとして、check、fix、build などの `docv.yaml` を読むコマンドが、何もせずに終了コード 2 で終わる。エラーには、置けない理由も出す","- docv build の出力を git で管理するかは、プロジェクトの `.gitignore` で決める。docv は `.gitignore` を書かない","","---","","## 4. docv が読むファイル","","- `free/` の下の `.md` のファイルが、管理対象（Free ファイル）になる。check、fix、HTML の対象になる","- `document_root` と `dir.output` の外にある `.md` のファイルは、管理外になる。中身は見ない","- `docv_exclude` に当てはまるファイルは、docv が読まない。check（root-unknown や slot-unknown などの置き場所の検査も含む）、fix、整形、textlint、HTML、検索、インデックスのどれの対象にもならない。メモや下書きの置き場所に使う","- `.gitignore` に書かれたファイルと、`dir.output` の中は、`docv_exclude` に書かなくても常に除く","- パスと glob は、すべてルートからの相対パスで書く。`*` は `/` をまたがず、`**` はまたぐ","","---","","## 5. 書式の規則（`lint.bold`、`lint.italic`、`lint.dollar`）","","太字などを使ってよいかを、プロジェクトごとに決める。`deny` にした書き方を、管理対象のファイルで error にする。","","| キー     | ルール ID    | `deny` のとき確かめること                                                                   |","| -------- | ------------ | ------------------------------------------------------------------------------------------- |","| `bold`   | style-bold   | 太字（`**`、`__`）を使っていない                                                            |","| `italic` | style-italic | 斜体（`*`、`_`）を使っていない                                                              |","| `dollar` | style-dollar | コードの外の 1 行に `$` が 2 つ以上ない。GitHub は `$` で挟んだ部分を数式として表示するため |","","- 既定はどれも `allow`（確かめない）","- コードブロックとインラインコードの中は見ない","- 章番号は、設定によらず常に確かめる（[Free](free.md) のページの「check のルール」の章）","- 管理対象のファイルのほか、Slot、ADR、PDR にもかける","","---","","## 6. textlint（`lint.textlint`）","","文章の校正に textlint を使う仕組み。AI Agent が書く文章のぶれをなくすのが目的なので、使うルールとその値は docv が決める。利用者は、使うかどうか（`enable`、`disable`）だけを決める。","","- 既定では使わない。`enable` にしたときだけ、`docv check` が textlint をかけ、`docv fix` が自動修正できるところを直す。かけるのは、管理対象のファイル、Slot、ADR、PDR","- textlint は Node.js で動くので、使うときだけ Node.js（npx）が必要になる。`enable` なのに Node.js が見つからないときは、終了コード 2 で終わる","- 結果は、ほかのルールと同じ形の error で出す。ルール ID は `textlint/\u003cプリセット>/\u003cルール>`（例: textlint/ja-technical-writing/sentence-length）。下の表では、プリセットごとにルールの名前だけを書く","- `--no-textlint` で、textlint だけを飛ばせる","- プロジェクトに `package.json` はいらない。初めて実行するときは、textlint を取ってくるのにネットワークが必要","- 使うルールとその値は、docv の版ごとに固定する。同じ docv なら同じ結果になる","","### 検査項目","","#### ja-technical-writing","","| ルール                               | 確かめること                             |","| ------------------------------------ | ---------------------------------------- |","| `sentence-length`                    | 一文を 100 文字以内にする                |","| `max-comma`                          | 一文のカンマ（,）を 3 つまでにする       |","| `max-ten`                            | 一文の読点（、）を 3 つまでにする        |","| `no-mix-dearu-desumasu`              | 「である」と「ですます」を混ぜない       |","| `ja-no-mixed-period`                 | 文末を「。」で終える                     |","| `arabic-kanji-numbers`               | 算用数字と漢数字を使い分ける             |","| `no-doubled-conjunction`             | 同じ接続詞を続けない                     |","| `no-doubled-conjunctive-particle-ga` | 逆接の「が」を一文に 2 回使わない        |","| `no-double-negative-ja`              | 二重否定を使わない                       |","| `no-doubled-joshi`                   | 同じ助詞を続けない                       |","| `no-dropping-the-ra`                 | ら抜き言葉を使わない                     |","| `no-nfd`                             | UTF8-MAC の濁点を使わない                |","| `no-zero-width-spaces`               | ゼロ幅スペースを使わない                 |","| `ja-no-abusage`                      | よくある誤用を避ける                     |","| `ja-no-redundant-expression`         | 冗長な表現を避ける                       |","| `ja-unnatural-alphabet`              | 入力ミスで紛れたアルファベットを残さない |","| `no-unmatched-pair`                  | 括弧を対にする                           |","","#### ja-spacing","","| ルール                                 | 確かめること                                      |","| -------------------------------------- | ------------------------------------------------- |","| `ja-space-between-half-and-full-width` | 半角の文字と全角の文字の間にスペースを入れる      |","| `ja-space-around-code`                 | インラインコードの前後にスペースを入れる          |","| `ja-space-around-link`                 | リンクの前後にスペースを入れる                    |","| `ja-space-around-emphasis`             | 斜体の前後にスペースを入れる                      |","| `ja-space-around-strong`               | 太字の前後にスペースを入れる                      |","| `ja-no-space-around-parentheses`       | 全角の括弧と [ ] の内側と外側にスペースを入れない |","","### 非検査項目","","docv は、次のルールを使わない。","","#### ja-technical-writing","","| ルール                         | 確かめないこと                 |","| ------------------------------ | ------------------------------ |","| `max-kanji-continuous-len`     | 漢字が続く長さ                 |","| `no-invalid-control-character` | 制御文字                       |","| `no-exclamation-question-mark` | 感嘆符と疑問符を使うこと       |","| `no-hankaku-kana`              | 半角カナ                       |","| `ja-no-weak-phrase`            | 「かもしれない」などの弱い表現 |","| `ja-no-successive-word`        | 同じ語の連続                   |","","#### ja-spacing","","| ルール                                            | 確かめないこと                 |","| ------------------------------------------------- | ------------------------------ |","| `ja-no-space-around-slash`                        | スラッシュの前後のスペース     |","| `ja-no-space-between-full-width`                  | 全角の文字どうしの間のスペース |","| `ja-nakaguro-or-halfwidth-space-between-katakana` | カタカナ語の区切りの文字       |","| `ja-space-after-exclamation`                      | 文末の感嘆符の後のスペース     |","| `ja-space-after-question`                         | 文末の疑問符の後のスペース     |","","---","","## 7. 整形との連動（`format.enabled`）","","整形の形は docv が決め、設定では変えない。設定で決めるのは、check を整形と連動させるかだけ。整形は、管理対象のファイル、Slot、ADR、PDR にかける。`docv.yaml` の末尾の改行は、1 つに整える。","","- 表は、列ごとに縦の線の位置を揃える。幅は、全角の文字（Unicode の East Asian Width が W か F の文字）を 2、それ以外の文字を 1 と数える","- エディタの表の揃え方は、この数え方と違うことがある。手で揃えず、`docv fix` の結果を正とする","- 整形の形は docv の版ごとに固定する。同じ docv なら、同じ入力から同じ結果になる","","| コマンド     | `format.enabled` が true のときの動き                             |","| ------------ | ----------------------------------------------------------------- |","| `docv check` | 整形が必要なファイルを、ルール ID format-diff の error として出す |","","- format-diff には、整形した結果と最初に違う行を出す","- false でも、`docv fix` を直接実行すれば整形できる","","---","","## 8. スキーマの参照","","- `docv.yaml` の先頭に、yaml-language-server の書式でスキーマの URL を書くと、エディタで補完と検証が効く","- URL には docv の版を含める。`docv init` は、実行した CLI の版の URL を書く。URL の版は `docv_version` と揃える（「docv の版」の章）","- `docv init --print` で、すべての項目を既定の値でコメントにした `docv.yaml` を出す。スキーマの写しは `docv/free/schema/config.md` に置く","","---","","## 9. docv の版（`docv_version`）","","`docv_version` には、ドキュメントを合わせた docv の版を書く。docv を更新した後で、前の版から変わったことに気づき、`docv update-guide` に渡す版が分かるようにするため。","","- `docv init` は、実行した CLI の版を書く","- check は、`docv_version` を docv の版と比べ、違えば error にする。パッチの版の違いも error にする。対応の要る変更は、パッチの版にも入ることがあるため","- `docv.yaml` の 1 行目に docv のスキーマの URL があれば、check は、URL の版を `docv_version` と比べる。エディタが、古い版のスキーマで補完と検証をしないようにするため","- ローカルのパスなど、版のタグを指す URL でないものは比べない。`docv_version` がないときも比べず、先に `docv_version` を直させる","- `docv.yaml` がスキーマに合わず読めないときも、`docv_version` が docv の版と違えば、エラーに update-guide の案内を添える。古い版の `docv.yaml` が読めず、案内まで届かないことがないようにするため","- `docv_version` とスキーマの URL は、docv では書き換えない。update-guide の対応を終えたかは、docv には分からないため","","| ID             | 内容                                                                                                                                                                                                                    |","| -------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| docv-version   | `docv_version` がないか、docv の版と違う。古ければ `docv update-guide --from \u003cdocv_version>` を、新しければ docv の更新を案内する。ないときは、`docv.yaml` の 1 行目のスキーマの URL から、使っていた版を推して案内する |","| schema-version | `docv.yaml` の 1 行目にあるスキーマの URL の版が、`docv_version` と違う                                                                                                                                                 |"]},{"path":"docv/slot/service/service/cli.md","href":"サービス/サービス仕様/コマンド.html","tags":[],"lines":["---","order: 7","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# コマンド","","どのコマンドにも共通する決まり。","","---","","## 1. ルートと出力","","- docv ルートで実行するコマンド（利用マニュアルのコマンド一覧）は、カレントディレクトリをルートにし、そこにある `docv.yaml` を読む。親のディレクトリは探さない","- 結果は標準出力に、エラーは標準エラーに出す","","---","","## 2. ファイルを書くコマンド","","| コマンド  | 書くもの                                                                                                                                                                                                                                                |","| --------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| init      | `docv.yaml` だけ。`--print` のときは書かない                                                                                                                                                                                                            |","| gen       | 指定した Slot ファイルだけ。`--print` のときは書かない                                                                                                                                                                                                  |","| fix       | 管理対象のファイル、Slot、ADR、PDR と `docv.yaml` だけ。整形と textlint の自動修正だけをする。`docv.yaml` は、末尾の改行だけを整える                                                                                                                    |","| build     | `dir.output` の下の `html/` の中と、`document_root` の直下の `README.md` だけ。出力先は、目印の `.docv` を残して中を消し、作り直す                                                                                                                      |","| diff-open | OS のキャッシュのディレクトリの下の `docv/diff-open/` の中だけ（macOS は `~/Library/Caches/docv/diff-open/`、Windows は `%LOCALAPPDATA%\\docv\\diff-open\\`）。build の出力先と同じく、目印の `.docv` を残して中を消し、作り直す。差分がないときは書かない |","","- ほかのコマンドは、ファイルを書かない","- `CLAUDE.md`、リポジトリのルートの `.gitignore`、hook の設定は、どのコマンドも書かない","- build と diff-open は、出力先に `.docv`（docv が作った目印）がなく、空でもないときは、何も書かずにエラーで終わる。`dir.output` を間違えて既存のディレクトリを指しても消さないため","- build は、すでにある `document_root` の `README.md` の 1 行目に docv の印のコメントがないときも、何も書かずにエラーで終わる。手で書いた同じ名前のファイルを消さないため","","---","","## 3. 終了コード","","| コード | 意味                                                                                                      |","| ------ | --------------------------------------------------------------------------------------------------------- |","| 0      | 成功。check で error が 1 件もない（warning だけのときも 0）                                              |","| 1      | check で指摘（error）が 1 件以上ある。fix で直せないファイルがある。open と diff-open に対応していない OS |","| 2      | `docv.yaml` がスキーマに合わない、引数が正しくない、など実行できない                                      |","","---","","## 4. 言語","","CLI のメッセージ、ヘルプ、docv の概要、テンプレは、日本語だけで書く。切り替えはできない。英語に訳した版を持つと、同じことを 2 か所で揃え続けることになるため。"]},{"path":"docv/slot/service/service/html.md","href":"サービス/サービス仕様/ビジュアライズ.html","tags":[],"lines":["---","order: 8","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# ビジュアライズ","","`docv build` が作る HTML とインデックスの作り。`docv diff-open` が作る HTML は、最後の章に書く。HTML は `dir.output` の下の `html/` に、インデックスは `document_root` の直下の `README.md` に書く。以下、出力先は `html/` を指す。","","---","","## 1. HTML の作り","","- CSS と JS は、出力先の直下の `docv.css` と `docv.js` に書き、各ページから相対パスで読む。ページの中には書かない。出力先をコミットするリポジトリで、CSS や JS を変えたときの差分を 1 ファイルに収めるため。外部の CDN は使わない。file:// で開いても、ホスティングしても見られる。画像は元のファイルを読むので、ホスティングするときは、画像を置いた `document_root` も含めて公開する","- JS は、決定のページのカーソルキーでの移動、Free のページのタグのトグル、検索のページ、元のファイルのパスのコピー、diff-open の行数の吹き出しにだけ使う。JS が動かなくても、すべての中身は読め、リンクから辿れる。コピーのボタンは JS が動くときだけ出す。ページに分けた Slot のタブは、ページへのリンクにする","- 出力するファイルとディレクトリの名前からは、空白を除く。Slot、ページに分けた Slot、ADR、PDR、Free ファイルのページのどれも同じ。たとえば、Doc ガイドのページは `開発者向けガイド/Docガイド.html`、題が「Go にする」の決定は `ADR/\u003cgroup>/Goにする.html` になる。CLI や git で、引用符なしでパスを扱えるようにするため。Free ファイルのページは、元のパスのディレクトリの名前からも空白を除く","- すべてのページの左に、README とトップの 8 ページへのサイドバーを、右に、そのページの h2 と h3 の目次を置く。見出しのないページでは、目次の代わりに同じ幅の空きを置き、ページを移っても本文の位置を変えない。幅の狭い画面では、左のサイドバーを本文の上に置き、項目を折り返して並べる。印刷の表示では、どちらのサイドバーも出さない","- サイドバーには、次の 3 つの段の順に項目を並べ、段の間に横線を引く。項目の名前は、サイドバーの幅で折り返さないように短くする。README は、そのページがあるときだけ出す。ADR と PDR は、決定があるときだけ出す","  - ドキュメント: README、Slot、Free、ADR、PDR","  - docv が作るもの: Index、Review Guide、Config","  - Search","- 左のサイドバーの一番下に、作った docv の版を `Generated by docv \u003c版>` の形で出す。どの版の docv で作ったページかを、見て分かるようにするため","  - docv は docv のリポジトリへ、版はその版のタグのソースへリンクする","- トップの 8 ページは、サイドバーと同じページの名前を h1 にする。ただし ADR の h1 は Architecture Decision Record、PDR の h1 は Product Decision Record で、略さずに書く。サイドバーは幅へ収まるよう略すが、ページでは何の記録かを読んで分かるようにするため","- トップのページの HTML のファイルの名前は、Slot が `index.html`、Free が `プロジェクト詳細.html`、ADR が `ADR.html`、PDR が `PDR.html`。Index、Review Guide、Config、Search は、`インデックス.html`、`レビューガイド.html`、`現在の設定.html`、`検索.html`","- Slot、ADR、PDR、Free ファイルのページの h1 の上に、元のファイルのルートからのパスを小さく出し、横にパスをクリップボードにコピーするボタンを置く。ページを見て編集したくなったときに、元のファイルを見つけられるように。Slot のページでは、同じ行の左に Slot のミッションを出し、パスとボタンを右に寄せる。ミッションは、パスと同じ大きさ、色、字体にする。1 行に収まらなければ、パスを次の行の右に送る","- 検索のページは、Slot ファイル、ADR、PDR、Free ファイルの中身を行ごとに並べた索引を、`docv.js` ではなく検索のページの中に書く。入力した文字列をそのまま含む行を探し、入力欄の下に、ファイルごとにパス、タグ、ヒットした行の前後 2 行を並べる。プレビューの長い行は、折り返さずに横へスクロールする。入力欄は、JS が動くときだけ出す","- フェンスのコードブロックは、フェンスに書いた言語（`yaml` など）に合わせて、build のときに色を付ける。色は HTML の中に埋め込み、JS は使わない。言語がないか、docv が知らない言語なら、色を付けずに出す","- リンクは、README、Free ファイル、Slot ファイル、ADR、PDR のページにだけ、出力先の中の相対パスで張る（ツリー、Slot ファイルや Free ファイルの本文の中のリンク）。file:// で開けば file:// のまま、ホスティングすればその中で辿れる。`docv.yaml` へのリンクは、現在の設定のページに向ける。HTML は clone したリポジトリで見るので、ほかのファイル（コード、管理外のファイルなど）はエディタで開けばよく、リンクにせず文字だけを出す","- 本文の中の http:// と https:// で始まる URL は、`[文字](URL)` の形で書いていなくてもリンクにする。URL は、空白、`\u003c`、`>`、ASCII でない文字の前で終わり、末尾の句読点と、対になっていない `)` は含めない。日本語の文と続けて書いても、後ろの文を URL に含めないため。リンク、画像、コードの中の URL は変えない","- 画像は、元のファイルを出力先から辿れる相対パスで読み、出力先にはコピーしない。出力先をコミットするリポジトリで、同じ画像を 2 か所に持たないため","- 表のセルの中のインラインコードは、折り返さない。コマンドやパスが途中で切れないようにするため","- 同じページの中で、見出しの行が同じ表は、列の幅をそろえる。並んだ表を、1 つの表と同じく縦方向で読めるようにするため","  - 短い列は、その列のどの表のセルも折り返さない幅にし、いちばん長い列が残りの幅を使う","- 段落と箇条書きは、表やコードと同じ右端で折り返す。本文の幅は、ページの本文の幅で抑える","- 表が横にはみ出すときは、ページごと広げず、表の中だけを横にスクロールさせる","- 本文の中のリンクには下線を付け、色だけでリンクを示さない。キーボードで移ったときは、どこにいるかを枠で示す","- Slot と Free ファイルのページは、本文の後に、YAML front matter の `adr` と `pdr` に書いた決定を「関わる決定」の h2 で並べ、決定のページへリンクする。ADR、PDR の順に、それぞれ書いた順で並べる。打ち消された決定と、ない決定は出さない。出す決定がなければ、h2 ごと出さない","","---","","## 2. README のページ","","- ルートの `README.md` を、`README.html` のページにする。`README.md` がないか、`docv_exclude` に当てはまるときは作らない","- `README.md` の h1 をページの h1 にし、本文の見出しは h2 から始まるように段を付け直す。見出しには、GitHub と同じ形のアンカーを付ける","- `README.md` は管理外のままにする。check と fix はかけず、検索の索引にも入れない","","---","","## 3. Slot のページ","","- Slot は 1 つずつ独立したページ（`\u003cまとまり>/\u003cSlot>.html`）にする。`index.html`（Slot）には、まとまりの見出しの下に、[Slot](slot.md) のページの「一覧」の章の順で、すべての Slot のカードを横に並べる。画面の幅に収まらなければ折り返す。紙面を縦に使いすぎず、画像にしてもすべてのカードが写るため。置いていない Slot のカードは、グレーにし、破線の枠と「未作成」の文字を付けて、リンクにしない。どのミッションのドキュメントがないかを、色だけに頼らずに見せるため。ページに分けられる Slot のカードには、「未作成」と同じ位置に、ページの数を `3 tabs` の形で出す。分けていないか、1 ページだけなら `1 tab`。開く前に、ページに分けられる Slot かと、ページの数が分かるようにするため。カードの幅は固定し、画面の幅に合わせない。幅は、いちばん長い Slot の名前（7 文字）が折り返さない大きさ","- Slot のカードと、Slot のページの見出しには、Slot ごとのアイコンを付ける。アイコンは、docv が Slot ごとに持つ線画の SVG で、外部の素材を使わない","- Slot のページには、Slot の名前の見出しを出す。h1 の上の、元のファイルのパスと同じ行に、Slot のミッションを出す（「HTML の作り」の章）。何を書くページかを、人間もページの中で分かるようにするため。出すのは docv が Slot ごとに決めた文で、YAML front matter の `mission` は、check で同じ文だと確かめるので読まない","- Markdown の中の `\u003cdetails>` は、閉じて出す。詳細は、知りたくなったときに開けば足りるため。印刷の表示では、開いて出す。紙では開けないため","- `\u003cdetails>` は枠で囲み、見出し（`\u003csummary>`）と中身の間に線を引く。見出しにマウスを乗せたら、カーソルを指の形にする。どこまでが折りたたんだ中身か、どこを押せば開くかを分かるようにするため。開いているときだけ、見出しの背景を左のサイドバーと同じ色にする。開いているかを、印の向きのほかに色でも分かるようにするため","- 開閉するのは、`\u003cdetails>` だけ","- ページに分けた Slot は、ページを 1 つずつ `\u003cまとまり>/\u003cSlot>/\u003cページの名前>.html`（`サービス/サービス仕様/管理者向け機能.html` など）にする。ページの名前は、ページの h1。Slot の名前の見出しの下に、すべてのページへのリンクを `order` の順にタブとして並べ、開いているページのタブに印を付ける。タブの下の中身は、分けないときの Slot と同じ形で出す。カードは、先頭のページを開く","- 見た目に凝らない。中身は、見出し、段落、箇条書き、表だけで出す","- 見出しは、ページの先頭の h1（Slot の名前）が 1 つだけで、その下に h2 を並べる。段は飛ばさない（h1 の次に h3 や h4 を置かない）","  - Slot の本文の見出しは、h2 から始まるように段を付け直す","- Slot の見出しには、Free ファイルのページと同じく、GitHub と同じ形のアンカーを付ける。`[docv init](#docv-init)` のようなページ内リンクが HTML でも GitHub でも飛べる","","---","","## 4. ADR と PDR のページ","","ADR と PDR は、同じ作りのページにする。違うのは、一覧のページ（`ADR.html` と `PDR.html`）、決定のページの置き場所（`ADR/` と `PDR/`）、題に付けるアイコンだけ。","","- `ADR.html` と `PDR.html` に、`group` ごとに h2 を置き、決定のつながりを、過去から未来へ左から右に箱と矢印で並べる。打ち消された決定の箱は、破線で薄く出す","- 箱の幅はそろえ、題は箱の中で折り返す。つながりは 1 列に並べ、並びきらないときは、その列を横にスクロールする","- つながりのない決定は、1 列に 1 つずつ並べず、まとまりのつながりの後ろに、箱を折り返して並べる。決定が増えても、ページが縦に伸びすぎないため","- 箱は決定のカードで、クリックすると決定 1 つのページ（`ADR/\u003cgroup>/\u003ctitle>.html` か `PDR/\u003cgroup>/\u003ctitle>.html`）を開く。決定 1 つを 1 ページにする","- 決定のページには、題を h1 にし、本文を出す。本文の見出しは h2 から始まるように段を付け直す。id と日付は出さない","- 打ち消された決定のページには、h1 の下に、打ち消されたことと、打ち消した新しい決定へのリンクを出す。下のカードまで読まなくても分かるように","- 決定のページの下に、前後の決定をカードで出す。打ち消した過去の決定は「← 過去の決定」の見出しを付けて左に、この決定を打ち消した新しい決定は「新しい決定 →」の見出しを付けて右に置く。新しい決定へのつながりは、生成するときに `supersedes` を逆にたどって組み立てる","- カーソルキーの ← と → で、前後の決定のページに移れる。前後に決定が複数あるときは、先頭のカードのページに移る。移れることは、カードの下に書く","- 決定のページの本文の後（前後の決定のカードの前）に、その決定を `adr` か `pdr` で指している Slot と Free ファイルのページを、「この決定を指しているページ」の h2 で並べる。指しているページがなければ、h2 ごと出さない。Slot は規格の順、Free ファイルはパスの順にする。決定の側に書かなくても、どこで効いているかを辿れるようにするため","","```","言語","+-----------+   +-------------+","| Go にする | → | Rust にする |","+-----------+   +-------------+","+--------------+  +---------------+","| React にする |  | Python も使う |","+--------------+  +---------------+","```","","---","","## 5. 現在の設定のページ","","`docv build` は、HTML の「現在の設定」のページに、`docv.yaml` のすべての項目と今の値を 1 つの表で並べる。何を設定でき、どれが効いているかを、スキーマを読まずに見るためのページ。","","- ページの名前の h1 の下に、項目の表を「docv.yaml」の h2 で置く","- 項目は、`dir.output` のように、キーを `.` でつないだ名前で出す。並びは、スキーマの順","- 書いていない項目は、既定の値で出す。値のない項目は `-` を出す","- 配列の項目は、要素を箇条書きにする","- 選ぶ項目（true か false、allow か deny など）は、候補を横に並べ、選んでいる候補に色を付ける","- 表の後に、textlint の検査項目と非検査項目（[設定ファイル](config.md) のページの「textlint」の章）を、それぞれ表で並べる","- Slot ファイルや Free ファイルから `docv.yaml` へのリンクは、HTML ではこのページに向ける","","---","","## 6. レビューガイドのページ","","`docv build` は、HTML のレビューガイドのページ（サイドバーの Review Guide）に、`docv review-guide` と同じレビューの手順を出す。レビューするときに AI Agent が読むものを、人間も普段から同じ観点で読めるようにするため。サイドバーにあれば、レビューのコマンドがあることも忘れにくい。","","- 手順は、`docv review-guide` と同じファイルから作る","  - 人間と AI Agent が読むものをずらさないため","- 一覧は出さず、一覧の見出しの下に、`docv review-guide` を実行したときに作ることを書く","  - build した時点の一覧になり、ずれるため","  - HTML を git で管理していると、Slot や ADR を足すたびに差分が出るため","- 手順の h1 は除き、ページの h1 を Review Guide にする","  - h1 の下に、`docv review-guide` が出す手順と同じ内容であることを書く","  - 手順の見出しは、h2 から始まるように段を付け直す","- 検索の索引に入れない","  - プロジェクトのドキュメントではないため","","---","","## 7. 毎回同じ出力にする決まり","","- 生成日時、実行したマシンのパス、乱数を出力に入れない","- 並び順を固定する。Slot は規格の順（ページに分けた Slot のページは `order` とパスの順）、Free ファイルはディレクトリのツリーの順、Slot の中の項目は書いた順にする。ADR と PDR は日付と id の順。検索の索引は、Slot ファイル、ADR、PDR、Free ファイルの順","- 入力（管理対象のファイル、`README.md`、Slot、ADR、PDR、`docv.yaml`、docv の版）が同じなら、HTML、`docv.css`、`docv.js`、インデックスはバイト単位で同じになる","","---","","## 8. インデックス","","build は、毎回 `document_root` の直下に `README.md` を書く。GitHub でリポジトリを開いた人が、clone しなくても Slot ファイルを読めるようにするためのリンク集。名前を `README.md` にするのは、GitHub で `document_root` を開くと、一覧の下に表示されるため。ルートの README からリンクして使う。","","- Slot を、HTML の Slot のページ（`index.html`）と同じく、まとまりごとに規格の順で、リンクの箇条書きにして並べる。ページに分けた Slot は、Slot の名前の下に、ページを `order` の順に入れ子で並べる。置いていない Slot は出さない","- Slot は、元のファイルへリンクする。GitHub で Markdown のまま読めるため。ファイルがシンボリックリンクなら、ルートの中にある先のファイルへリンクする。GitHub は、シンボリックリンクを開いても先の中身を出さないため","- Free ファイル、ADR、PDR は、それぞれの章に、置いているディレクトリへのリンクだけを出す。どれも詳細やプロジェクト固有の情報で、知りたくなった人は clone すると考えるため。検索とタグでの絞り込みは Free のページで、ADR と PDR のつながりの図はそれぞれのページで見られると、`docv open` と、そのページのルートからのパスで案内する","- リンクは、`README.md` の場所からの相対パスで、`[名前](\u003cパス>)` の形で書く。パスに空白や日本語が入っても、GitHub で辿れるようにするため","- 1 行目に、docv が作ったことを示すコメントを書く。build は、このコメントで始まらない `README.md` を書き換えない（[コマンド](cli.md) のページの「ファイルを書くコマンド」の章）","- 末尾に、作った docv の版を `Generated by docv \u003c版>` の形で書く。GitHub で見ても、docv が作ったファイルであり、手で直すものではないと分かるようにするため","  - docv と版は、サイドバーと同じく、リポジトリとその版のタグのソースへリンクする","- インデックスが古いままかは、check で確かめない。Slot を変えたら build で作り直す","- エイリアス（シンボリックリンク）やコピーを並べたディレクトリは作らない。GitHub はシンボリックリンクの先を出さず、コピーは同じ中身を 2 か所で持つことになり、md の中の相対リンクも壊れるため","- HTML にも、インデックスと同じ並びの Index のページを作る。リンクは、md ではなく、HTML のページに向ける。Free ファイル、ADR、PDR は、それぞれの一覧のページへリンクする。末尾には、インデックスと同じく作った docv の版を出す","","---","","## 9. diff-open の HTML","","`docv diff-open` は、build と同じ作りの HTML に、`--from` のリビジョンから変わったファイルの印を付けて作る。インデックスは作らない。","","ファイルごとに、新規、変更、削除のどれかの印を付ける。新規は `--from` になく今あるファイル、削除は `--from` にあり今ないファイル。","","| 場所                                          | 新規     | 削除                 | 変更 |","| --------------------------------------------- | -------- | -------------------- | ---- |","| Slot のカード、ADR と PDR の箱                | 緑の枠   | 赤の枠               | 鉛筆 |","| ページに分けた Slot のタブ、Free のページの行 | 緑の背景 | 赤の背景と取り消し線 | 鉛筆 |","| サイドバーの項目                              | 鉛筆     | 鉛筆                 | 鉛筆 |","","- 新規と変更と削除で、見た目を分ける。見た人のすることが違うため","  - 新規はページを全部読み、変更は差分を読み、削除は消してよいかを確かめる","- 鉛筆を付けた要素にマウスを乗せると、鉛筆の右に、足した行数と消した行数を出す","  - サイドバーの項目では、新規、変更、削除のファイルの数を出す","  - サイドバーの README と Config は、ファイルが 1 つなので、ファイルの数の代わりに行数を出す。2 つにはカードがなく、ほかに行数を見る場所がないため","- ページに分けた Slot のカードは、すべてのページが新規なら緑の枠、すべてのページが削除なら赤の枠、ほかは鉛筆にする。行数は、変わったページの合計","  - 今あるページに 1 つ足しただけの Slot を、新規にしないため","- 消したファイルも、カード、箱、タブ、行として出し、消したファイルのページへリンクする","  - 消したファイルのページは、作業ツリーから消えたことと、`git diff` のコマンドだけを出す。中身は出さない","  - 消した Slot は、未作成のカードに赤の枠を付ける","  - 消したページのタブは、ファイルの名前で出す","- 変わったファイルのページでは、h1 の上の元のファイルのパスの代わりに、`git diff \u003crev> -- \u003cpath>` のコマンドを出し、ボタンでコピーできるようにする。ページの中には差分を出さない","  - コマンドは、docv ルートで実行するものにする","  - 英数字、`/ . _ -`、ASCII でない文字のほかを含む引数は、単一引用符で囲む。シェルへそのまま貼れるようにするため","  - まだ git に追加していないファイルは、`git diff` に出ないので、パスのまま出す","  - README と Config のページは、build ではパスの行を出さないが、diff-open では変わったときだけコマンドの行を出す","- サイドバーのプロジェクトの名前の下に、どのリビジョンと比べたかを出す","- 画像の変更には、印を付けない"]},{"path":"docv/slot/service/install.md","href":"サービス/インストール.html","tags":[],"lines":["---","mission: 利用者がこのサービスをインストールする方法","---","","# インストール","","## 前提とされるもの","","| 名前                           | 用途                                                                 |","| ------------------------------ | -------------------------------------------------------------------- |","| [Node.js](https://nodejs.org/) | textlint を使うときだけ要る。`docv check --no-textlint` なら要らない |","","## 手順","","### GitHub のソースから入れる（Rust が必要）","","```sh","cargo install --git https://github.com/suzuki-hoge/docv","```","","### 手元のソースから入れる（Rust が必要）","","クローンしたリポジトリや、手を入れている作業中のソースから入れる。リポジトリのルートで実行する。","","```sh","make install","```","","`~/.cargo/bin/docv` に入る。ソースを変えたら、もう一度実行すると入れ直せる。"]},{"path":"docv/slot/service/manual.md","href":"サービス/利用マニュアル.html","tags":[],"lines":["---","mission: 利用者の使い方（CLI のコマンド、GUI の操作など）","---","","# 利用マニュアル","","## コマンド一覧","","| コマンド                                                   | 説明                                                                         | 実行ディレクトリ |","| ---------------------------------------------------------- | ---------------------------------------------------------------------------- | ---------------- |","| [`docv init`](#docv-init)                                  | `docv.yaml` を作る                                                           | 任意             |","| [`docv desc`](#docv-desc)                                  | docv の概要を出す                                                            | 任意             |","| [`docv list`](#docv-list)                                  | Slot と Free ファイルの一覧を出す                                            | 任意             |","| [`docv update-guide --from \u003cversion>`](#docv-update-guide) | docv を更新したときの変更点と対応を出す                                      | 任意             |","| [`docv review-guide`](#docv-review-guide)                  | ドキュメントをレビューする手順を出す                                         | docv ルート      |","| [`docv check [path...]`](#docv-check)                      | 管理対象のチェックを行う                                                     | docv ルート      |","| [`docv fix [path...]`](#docv-fix)                          | 管理対象のフォーマットとリントを行う                                         | docv ルート      |","| [`docv build`](#docv-build)                                | 人間向けの HTML を作る                                                       | docv ルート      |","| [`docv open`](#docv-open)                                  | 作った HTML をブラウザで開く                                                 | docv ルート      |","| [`docv diff-open [--from \u003crev>]`](#docv-diff-open)         | git のリビジョンから変わったファイルに印を付けた HTML を作り、ブラウザで開く | docv ルート      |","| [`docv gen \u003cslot>`](#docv-gen)                             | Slot ファイルを、決まったパスに作る                                          | docv ルート      |","","docv ルート: `docv.yaml` のあるディレクトリ。","","## コマンド詳細","","### docv init","","`docv.yaml` を作る。","","| オプション | 意味                                   |","| ---------- | -------------------------------------- |","| `--print`  | `docv.yaml` を作らずに、書く中身を出す |","| `--force`  | `docv.yaml` がすでにあっても書き直す   |","","### docv desc","","docv の概要を表示する。","","AI Agent にはこれを入力にして進めさせる。","","### docv list","","Slot と Free ファイルの一覧を表示する。AI Agent が、どこに何が書いてあり、何をどこに書くかを決めるのに使う。","","```sh","docv list","```","","```","Slot","* overview         docv/slot/service/overview.md          サービス概要  : 利用者に向けた、これが何で、誰の何を解決し、何ができるかの説明","* service          docv/slot/service/service/             サービス仕様  : 外から見た機能と、それぞれの振る舞いと決まり","                                                                          desc.md（概要）","                                                                          slot.md（Slot）","  deploy           docv/slot/operation/deploy.md          デプロイ      : 作ったものを環境に反映する手順","","Free","  docv/free/schema/config.md  docv.yaml の項目と、それぞれの形（タグ: スキーマ）","```","","- Slot は、プロジェクトに置いたかどうかによらず、docv の Slot をすべて、[Slot](service/slot.md) のページの「一覧」の章の順に出す","  - 置いた Slot には、行の頭に `*` を付ける","  - Slot ごとに、名前（`docv gen` に渡す名前）、パス、Slot の名前とミッションを出す。Slot の名前とミッションの間の `:` は、縦に揃える","  - ページに分けた Slot は、パスにディレクトリを出し、その下に、ページのファイルとページの名前を `order` の順に出す。ページの行は、ミッションの頭に揃える","  - 置いていない Slot のパスは、分けないときのファイルを出す","- Free ファイルは、パス、ミッション、タグを出す。`docv_exclude` に当たるファイルは出さない","  - `mission` のないファイルは、ミッションの代わりに「（mission がない）」と出す","  - Free ファイルがなければ、「なし」と出す","- ADR と PDR は出さない","- パスは、ルートからの相対パスで出す。開くときに、そのまま使えるようにするため","- `docv.yaml` のないディレクトリでは、Slot をすべて `*` なしで出し、Free ファイルは出さない","  - docv を入れる前に、どんな Slot があるかを見るのにも使える","","### docv update-guide","","docv を更新したときに、版ごとの変更点と対応を表示する。","","| オプション         | 意味                                                                                   |","| ------------------ | -------------------------------------------------------------------------------------- |","| `--from \u003cversion>` | 更新する前に使っていた docv の版。`docv.yaml` の `docv_version` を渡す。省略はできない |","","- `--from` の版より後の版から、今の docv の版までを、古い版から順に出す。対応のない版も出す","- 変更 1 つを 1 行にし、何が変わったかと、それへの対応を書く。対応は、要るもの、選ぶもの、要らないものがある","- どの行も 100 文字以内にする。横に長いと読みにくいため","- 最後に、`docv_version` と、`docv.yaml` の 1 行目にあるスキーマの URL の版を上げるよう案内する","- `--from` には `1.4.0` の形のほか、`v1.4.0` の形も書ける。最初の版（1.0.0）より前か、今の docv の版より新しければ、終了コード 2 で終わる","- docv を更新した後は、`docv check` が `docv_version` の違いを指摘し、`--from` に渡す版を案内する（[設定ファイル](service/config.md) の「docv の版」の章）","","```sh","docv update-guide --from 1.4.0","```","","docv 1.5.0 で実行したときの出力は次のとおり（変更の一部を省いた）。","","```","1.5.0 変更点","- 開発コマンドとインフラと環境のページ分けを追加: 長いなら、docv desc の「ページ分け」に従って分けられる。開発コマンドのページには order と title を書く","- インストールと環境構築の手順を、h3 の見出しで出すように変更: 対応は要らない","","対応が終わったら、docv.yaml の docv_version を 1.5.0 にする","docv.yaml の 1 行目にあるスキーマの URL の版も、v1.5.0 にする","最後に docv check で、残りがないかを確かめる","```","","### docv review-guide","","溜まったドキュメントをレビューする手順と、ADR と PDR の一覧を表示する。Slot ファイルと Free ファイルは、手順の中で `docv list` を実行して読む。docv は指摘を出さない。出力を AI Agent に渡し、AI Agent が指摘を出す。","","```sh","docv review-guide","```","","1. AI Agent に「`docv review-guide` を実行し、その手順でドキュメントをレビューして」と頼む","2. AI Agent が、ドキュメントだけで見るか、コードやインフラの定義も調べるかを確かめる","   - 頼むときに言っておけば、聞かれない","3. AI Agent が、番号付きの指摘と、選べる直し方を出す","   - この時点では、ファイルを書き換えない","4. 指摘ごとに、番号で直し方を選ぶ","   - 直さないものは「このままでいい」と答える","5. AI Agent が、選んだ直し方で直す","","手順は、`docv build` が作る HTML の Review Guide のページでも読める。","","### docv check","","ドキュメントファイルを検査する。","","| オプション      | 意味                                                                         |","| --------------- | ---------------------------------------------------------------------------- |","| `--no-textlint` | textlint だけを飛ばす ( 設定で textlint を有効化している場合のみ意味がある ) |","","```sh","docv check","docv check docv/free/spec/order.md","```","","対象ファイルと主な検査内容は次のとおり。","","| 検査内容                                  | Slot | Free | ADR / PDR |","| ----------------------------------------- | ---- | ---- | --------- |","| YAML front matter およびタグ              | ✅   | ✅   | ✅        |","| ドキュメントのリンク切れ                  | ✅   | ✅   | ✅        |","| 見出しの数と章番号                        | ✅   | ✅   | ✅        |","| Slot ファイルの名前                       | ✅   |      |           |","| 太字、斜体、ドルマークの利用 ( 設定次第 ) | ✅   | ✅   | ✅        |","| format ( 設定次第 )                       | ✅   | ✅   | ✅        |","| textlint ( 設定次第 )                     | ✅   | ✅   | ✅        |","","Slot の YAML front matter は、`mission` が `docv list` のミッションと同じかを検査する。ページに分けた Slot は、`order` とページの名前（h1）があるかと、同じ Slot のページどうしの重なりも検査する。中身の形（雛形の見出しや表）は検査しない。","","YAML の Slot（`service/words.yaml` など）が残っていれば error にし、`docv gen \u003cslot> --print` の雛形を見て md に書き直すよう案内する。","","あわせて、`docv.yaml` の `docv_version` を docv の版と比べる。`docv.yaml` の 1 行目にあるスキーマの URL の版も、`docv_version` と比べる（[設定ファイル](service/config.md) の「docv の版」の章）。","","直さなくても困らないもの（打ち消された決定を `adr` や `pdr` で指しているなど）は、warning にする。warning の行は、ルール ID の前に `warning` を付ける。最後に `error N 件` を出し、warning があれば続けて `warning N 件` を出す。warning だけなら、終了コードは 0。","","パスを渡しても、検査するファイルが絞られるだけで、検査内容は変わらない。","","現在の設定は [現在の設定](../../../docv.yaml) を参照。","","### docv fix","","ドキュメントファイルの自動修正できるところを変更する。","","修正内容は次のとおり。","","- format ( 設定次第 )","- textlint が自動修正できる箇所 ( 設定次第 )","","### docv build","","人間向けの HTML を生成する。","","- 出力先は `docv.yaml` の `dir.output` の下の `html/`","- `document_root` の直下に、Slot ファイルへのリンクを並べたインデックス（`README.md`）を毎回書く","  - ルートの README からリンクすると、GitHub でリポジトリを開いた人が、clone しなくても Slot ファイルを読める","","### docv open","","`docv build` が `dir.output` の下の `html/` に作った Slot のページ（`index.html`）を、既定のブラウザで開く。","","- macOS は `open`、Windows は `explorer` で開く","- ほかの OS には対応しない。対応していないと表示し、終了コード 1 で終わる","- まだ `docv build` していなければ、何も開かずにエラーで終わる","","### docv diff-open","","`--from` のリビジョンと作業ツリーを git で比べ、変わったファイルに印を付けた HTML を作って、既定のブラウザで開く。このままコミットしたら、ドキュメントのどこが変わるかを見るために使う。","","- 比べるのは、`docv.yaml`、ルートの `README.md`、`document_root` の中のファイル","  - インデックス（`document_root` の `README.md`）と、`docv_exclude` に当たるファイルは比べない","  - まだ git に追加していないファイルも、新しく足したファイルとして比べる","  - docv の版を上げただけの行（`docv.yaml` の 1 行目のスキーマの URL と `docv_version`）は、差分に数えない。版のほかに変わっていないファイルには、印を付けない","- ページの中には差分を出さない","  - 元のファイルのパスの代わりに `git diff` のコマンドを出すので、詳しい差分はそれを実行して見る","- HTML は OS のキャッシュのディレクトリに書き、`dir.output` には書かない。実行するたびに作り直す","- 差分がなければ、何も作らずに、差分がないと表示して終わる","- git の管理下にないときと、`--from` がリビジョンでないときは、エラーで終わる","- `docv open` と同じく、macOS と Windows だけに対応する","","| オプション     | 意味                                                                            |","| -------------- | ------------------------------------------------------------------------------- |","| `--from \u003crev>` | 比べる git のリビジョン（ブランチ、タグ、コミット）。省略すると `HEAD` と比べる |","","### docv gen","","Slot ファイルを、決まったパスに作る。","","YAML front matter の `mission` にミッションを書く。用語集、技術スタック、環境変数、費用、インストール、環境構築、開発コマンド、Doc ガイドは、見出しと表の形を示した雛形を書く。ほかの Slot は、中身の形が自由なので、`mission` だけを書く。","","| オプション | 意味                                    |","| ---------- | --------------------------------------- |","| `--print`  | Slot ファイルを作らずに、書く中身を出す |","| `--force`  | Slot ファイルがすでにあっても書き直す   |","","```sh","docv gen manual               # docv/slot/service/manual.md を作る","docv gen doc-guide            # docv/slot/guide/doc-guide.md に、ガイドラインの雛形を作る","docv gen doc-guide --print    # 運用中のファイルと雛形を見比べる","```","","Slot をページに分けるときは、`docv/slot/service/service/` などのページのディレクトリの下にページを手で置く（[ページ分け](service/desc.md#ページ分け)）。ページがあるときは、`docv gen service` などは、1 つのファイルを作らずにエラーで終わる。","","## スキーマ一覧","","- [`docv.yaml`](../../free/schema/config.md)"]},{"path":"docv/slot/service/words.md","href":"サービス/用語集.html","tags":[],"lines":["---","mission: このプロジェクトの言葉の意味","---","","# 用語集","","## ファイルの種類","","| 用語 | 英語 | 意味                                                                                                                                                                                                                                 |","| ---- | ---- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |","| Slot |      | どのプロジェクトにも要るドキュメントを書くファイル（Slot ファイル）。docv がミッションと形を決める。`docv.yaml` の `dir.document_root` の下の `slot/`（既定は `docv/slot/`）に、`\u003cまとまり>/\u003cID>.md` の名前で置く。21 の Slot がある |","| Free |      | プロジェクトがミッションと形を決める Markdown のファイル（Free ファイル）。AI Agent が読み書きし、詳細を記録する。`dir.document_root` の下の `free/`（既定は `docv/free/`）に置く                                                    |","| ADR  |      | Architecture Decision Record。技術の決定 1 つを、背景、選ばなかった案と一緒に残す記録。`docv/adr/` に 1 つの Markdown で置き、決めた後は書き換えない                                                                                 |","| PDR  |      | Product Decision Record。プロダクトやサービスの仕様の変更 1 つを、その理由、見直す条件と一緒に残す記録。`docv/pdr/` に 1 つの Markdown で置き、決めた後は書き換えない                                                                |","","## 決まりの種類","","| 用語         | 英語      | 意味                                                                                                                                                                     |","| ------------ | --------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |","| ルール       | Rule      | docv の仕組みが決める決まり。Slot の名前とミッション、`docv.yaml` のスキーマ、YAML front matter の key、check が確かめることなど。利用側は変えられず、`docv desc` で見る |","| ガイドライン | Guideline | 利用側がドキュメントを書くときの方針。調整の余地があり、利用側が自由に直す。Slot の Doc ガイドに書き、`docv gen doc-guide` で雛形を作る                                  |","| 設定         | Config    | `docv.yaml` で切り替えること。check のルールや textlint を使うか、出力を git で管理するかなど。`docv init --print` で見る                                                |","","## ファイルの分類","","| 用語     | 英語 | 意味                                                                                                          |","| -------- | ---- | ------------------------------------------------------------------------------------------------------------- |","| 管理対象 |      | `dir.document_root` の下の `free/` にある Markdown。YAML front matter に `mission` が要り、check の対象になる |","| 管理外   |      | `dir.document_root` と `dir.output` の外にある Markdown。docv は中身を見ない                                  |","","## 書き方","","| 用語       | 英語    | 意味                                                                                                                                                                                  |","| ---------- | ------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| ミッション | Mission | そのファイルを読むと何が分かるか。Slot のミッションは docv が決め、Free ファイルのミッションは YAML front matter の `mission` に 1 文で書く。中身は、ミッションに収まることだけにする |","| タグ       | Tags    | Free ファイルに付ける分類。1 つのファイルに任意の数を付けられ、タグにルールを付けられる                                                                                               |"]},{"path":"docv/slot/system/system-overview.md","href":"システム/システム概要.html","tags":[],"lines":["---","mission: 開発者に向けた、システムを作る部品と、そのつながりの全体像","---","","# システム概要","","docv は、利用者のリポジトリの中で動く単一の CLI で、サーバーを持たない。リポジトリのドキュメントを読み、検査と整形をし、人間が見る HTML を作る。外の道具は、使うと決めたときだけ呼ぶ。","","![部品とつながり](system-overview_parts.svg)","","| 部品                     | 役割                                                                                                                                                                                                                 |","| ------------------------ | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| docv（CLI）              | ドキュメントを検査し、整形し、HTML を作る。決まり、雛形、HTML の部品を埋め込み、1 つのバイナリにする                                                                                                                 |","| リポジトリのドキュメント | `docv.yaml`、Slot ファイル、Free ファイル、ADR、PDR。AI Agent と人間が書き、docv が読む。fix は書き直す                                                                                                              |","| textlint                 | 日本語の文章を検査する。`docv.yaml` で使うと決めたときだけ、check と fix が npx で呼ぶ                                                                                                                               |","| git                      | 比べるリビジョンと作業ツリーの差分を取る。diff-open のときだけ呼ぶ。diff-open は、変わったファイルに印を付けた HTML を、OS のキャッシュのディレクトリに書いて開く                                                    |","| HTML、インデックス       | build の出力。人間が全体像を掴むために見る。HTML はローカルで開き、検索したりリンクを辿れる。インデックス（`document_root` の `README.md`）は、GitHub で Slot ファイルを辿る入り口で、clone しなくても Slot を読める |","| GitHub                   | ソースを置き、スキーマを版のタグごとに公開する。利用者は、ソースから cargo で docv を入れる。`docv.yaml` の 1 行目が、スキーマを指す                                                                                 |"]},{"path":"docv/slot/system/system.md","href":"システム/システム仕様.html","tags":[],"lines":["---","mission: 部品ごとの振る舞いと、部品の間の流れ","---","","# システム仕様","","## 処理の流れ","","1. `docv.yaml` を読み、スキーマで確かめる。init、desc、update-guide と、`--print` を付けた gen は、`docv.yaml` を読まない。list は、`docv.yaml` があれば読み、なければ Slot の一覧だけを出す","2. ルート以下のファイルを分類し、Slot、ADR、PDR、Free ファイルを読む","3. コマンドに応じて、次の部品を使う","","| コマンド  | 使う部品                                                                                                                            |","| --------- | ----------------------------------------------------------------------------------------------------------------------------------- |","| check     | 埋め込んだスキーマと決まりで確かめる。`lint.textlint` が enable なら、npx で textlint を呼ぶ                                        |","| fix       | `lint.textlint` が enable なら、textlint に自動修正させる。続けて、埋め込んだ整形の道具で整形し、書き戻す                           |","| build     | HTML を `dir.output` の下の `html/` に書き、インデックスを `document_root` の `README.md` に書く                                    |","| diff-open | git で `--from` のリビジョンと作業ツリーの差分を取り、印を付けた HTML を OS のキャッシュのディレクトリに書いて、OS のコマンドで開く |","","## バイナリに埋め込むもの","","Rust で書いたバイナリに、次のものを埋め込む。","","- Slot の雛形（`assets/template/`）","- `docv.yaml` のスキーマ（`assets/schema/`）","- docv の概要（`docv desc` が出す `assets/desc.md`）。サービス仕様の 1 ページ目（`docv/slot/service/service/desc.md`）は、このファイルへのシンボリックリンク","- 版ごとの変更点と対応（`docv update-guide` が出す `assets/update-guide.yaml`）。手元の docv の版と、出す内容を一致させるため","- ドキュメントをレビューする手順（`docv review-guide` が出す `assets/review-guide.md`）","- HTML の CSS（`assets/docv.css`）と JS（`assets/docv.js`）。build が、出力先の直下にそのまま書く","- Markdown の整形に使う dprint-plugin-markdown","- コードブロックの色付けに使う syntect と、その構文の定義とテーマ","","textlint を使うときだけ Node.js が、diff-open を使うときだけ git が要る。どれもバイナリには入れない。","","## スキーマの公開","","`docv.yaml` の JSON Schema（`assets/schema/`）は、埋め込むほかにリポジトリでも公開する。`docv init` は、`docv.yaml` の 1 行目に、版のタグを含む URL を書いて参照させる。新しい版の docv が書く URL は、その版のタグを push するまで開けない。","","## textlint とのやりとり","","check と fix は、`lint.textlint` が enable のときだけ textlint を動かす。textlint と 2 つのプリセット（ja-technical-writing、ja-spacing）は、npx で取ってくる。それぞれの版は、docv の版ごとに決める。","","- 設定ファイルは docv が作り、OS のキャッシュのディレクトリに書く。プリセットの既定に頼らず、使わないルールも含めて、すべての値を書く","- リポジトリには、ファイルを作らない","- 終了コード 1 は指摘として読み、それより大きい終了コードは失敗として扱う","","## git とのやりとり","","diff-open は、docv ルートで git のコマンドを呼び、`--from` のリビジョンと作業ツリーを比べる。","","- `git diff` で、変わったファイルごとに、新規、変更、削除のどれかと、足した行数と消した行数を取る","  - 名前を変えたファイルは、消したファイルと新しいファイルとして扱う","  - 行数がどちらも 0 のファイル（モードだけの変更）は、変わっていないとみなす","  - 画像などのバイナリは、行数を取れないので、行数のない変更として扱う","- まだ git に追加していないファイルは、`git ls-files` で取り、新規として扱う。行数は、ファイルの行を数える","- 消したファイルは、`git show` で `--from` での中身を読み、題や ADR と PDR の `group` を出す","- 書き換えた `docv.yaml` は、`git show` で `--from` での中身を読み、docv の版を伏せて今の中身と比べる","  - 伏せるのは、docv check が版を確かめる行（1 行目のスキーマの URL の版と、`docv_version` の値）だけ","  - 伏せて同じなら、変わっていないとみなす。違えば、版だけが違う行を、足した行数と消した行数から引く","- 比べるのは `--from` のコミットそのもので、ブランチの分かれ目（merge-base）ではない","- git が見つからないとき、ルートが git の管理下にないとき、`--from` がコミットを指さないときは、error で終わる"]},{"path":"docv/slot/system/stack.md","href":"システム/技術スタック.html","tags":[],"lines":["---","mission: 利用している外部サービス、言語、ライブラリなどの名前と用途","---","","# 技術スタック","","## 言語","","| 名前                               | 用途                           |","| ---------------------------------- | ------------------------------ |","| [Rust](https://www.rust-lang.org/) | CLI 本体。単一のバイナリにする |","","## 埋め込むもの","","| 名前                   | 用途                                                                                                                                          |","| ---------------------- | --------------------------------------------------------------------------------------------------------------------------------------------- |","| dprint-plugin-markdown | Markdown の整形（docv fix）。Rust のライブラリとしてバイナリに埋め込む。Prettier と違って Node.js がいらず、docv の版で整形の結果が固定される |","| syntect                | HTML のコードブロックの色付け（docv build）。構文の定義とテーマごとバイナリに埋め込む                                                         |","","## 実行時に使うもの","","| 名前           | 用途                                                            |","| -------------- | --------------------------------------------------------------- |","| Node.js（npx） | textlint を使うときだけ要る                                     |","| textlint       | 日本語の文章の検査。docv の版ごとに版を固定し、npx で取ってくる |","","## 配布","","| 名前   | 用途                                                                                      |","| ------ | ----------------------------------------------------------------------------------------- |","| GitHub | ソースと、版のタグごとのスキーマを置く。利用者は `cargo install --git` でソースから入れる |"]},{"path":"docv/slot/guide/setup.md","href":"開発者向けガイド/環境構築.html","tags":[],"lines":["---","mission: 開発を始めるのに用意するものと、実行するコマンド","---","","# 環境構築","","## 前提とされるもの","","| 名前                                                 | 用途                          |","| ---------------------------------------------------- | ----------------------------- |","| [Rust](https://rustup.rs/)（2024 edition の stable） | ビルドとテスト                |","| Node.js                                              | make fix で textlint をかける |","","## 手順","","### ビルドして手元に入れる","","```sh","make install","```","","このリポジトリのドキュメントは docv 自身で管理している。コードかドキュメントを変えたら、開発コマンドの `make fix` で確かめる。"]},{"path":"docv/slot/guide/develop.md","href":"開発者向けガイド/開発コマンド.html","tags":[],"lines":["---","mission: テストやビルドなど、開発者が実行するコマンド","---","","# 開発コマンド","","| すること                 | コマンド                                                               |","| ------------------------ | ---------------------------------------------------------------------- |","| 整えて確かめる           | `make fix`                                                             |","| 雛形を整えて確かめる     | `make check-templates`                                                 |","| 手元の docv を入れ直す   | `make install`                                                         |","| 版を上げる               | `make new-version V=x.y.z`                                             |","| 任意の版の docv を入れる | `cargo install --git https://github.com/suzuki-hoge/docv --tag v1.7.0` |","","## 整えて確かめる","","```sh","make fix","```","","コードかドキュメントを変えたら、コミットの前に実行する。指摘が 1 件でもあれば止まる。textlint を使うので Node.js が要る。","","\u003cdetails>","\u003csummary>行われること\u003c/summary>","","- コードを `cargo fmt` で整え、`cargo clippy` と `cargo test` を通す","- `make check-templates` で docv を install し、雛形を整えて確かめる。以降は、install した docv で実行する","- このリポジトリのドキュメントを `docv fix` で整え、`docv check` を通す","- `docv build` で、HTML を `output/docv/html/` に、インデックスを `docv/README.md` に作り直す。どちらもコミットする。GitHub で `docv/README.md` から Slot を辿れるようにし、clone してすぐ `docv open` で HTML を見られるようにするため","","\u003c/details>","","## 雛形を整えて確かめる","","```sh","make check-templates","```","","`make fix` も、途中でこれを実行する。","","\u003cdetails>","\u003csummary>行われること\u003c/summary>","","- docv を install する","- `docv gen` が書く雛形（`assets/template/`）を一時ディレクトリに書き出して `docv fix` する。雛形は管理対象の外にあるため","- 変わった雛形を書き戻して、install し直す","- 書き出した雛形に `docv check` を通す","","\u003c/details>","","## 手元の docv を入れ直す","","```sh","make install","```","","## 版を上げる","","```sh","make new-version V=x.y.z","```","","人間が実行する。前もって、`assets/update-guide.yaml` の先頭にその版の変更点と対応を書いておく。コミットはしない（版上げのコミットに入れる）。","","| オプション | 意味         |","| ---------- | ------------ |","| `V=x.y.z`  | 上げる先の版 |","","\u003cdetails>","\u003csummary>行われること\u003c/summary>","","- 版を書き換えて `make fix` を通す","- 「版を x.y.z にする」のコミット、タグ、push までを行う","","\u003c/details>","","## 任意の版の docv を入れる","","```sh","cargo install --git https://github.com/suzuki-hoge/docv --tag v1.7.0","```","","版のタグを指定して、GitHub のソースから入れる。前の版の動きを確かめるときに使う。","","| オプション   | 意味           |","| ------------ | -------------- |","| `--tag \u003c版>` | 入れる版のタグ |","","\u003cdetails>","\u003csummary>行われること\u003c/summary>","","- `make install` で入れた docv を置き換える","- 手元のソースに戻すときは、もう一度 `make install` を実行する","","\u003c/details>"]},{"path":"docv/slot/guide/architecture.md","href":"開発者向けガイド/アーキテクチャ.html","tags":[],"lines":["---","mission: システム全体で採る方式と決まり（部品の分け方、通信の方式、非同期処理の実現方法など）","---","","# アーキテクチャ","","## 部品の分け方","","- docv は 1 つのバイナリにまとめ、実行に要るもの（決まり、雛形、スキーマ、CSS、JS など）を埋め込む。手元の docv の版と、決まりや雛形の版がずれないようにするため","- 外の道具（textlint、git）は、docv に入れず、使うと決めたときだけ呼ぶ。使わないプロジェクトに、Node.js などを求めないため","- サーバーとデータベースは持たない。出力の HTML は静的なファイルにする","","## つなぎ方","","- 部品の間は、ファイルと子のプロセスでつなぐ。docv はリポジトリのファイルを読み、外の道具を子のプロセスとして動かし、結果を受け取るまで待つ。非同期の処理やキューは持たない","- 外のサービスとは通信しない。例外は、npx が textlint を取ってくるときだけ","","## 全体で守る決まり","","- コマンドは、呼ばれるたびにリポジトリを読み直し、終わったら止まる。常に動いているプロセスは持たず、前の実行の結果を使わない","- リポジトリに書くのは、コマンドごとに決めた範囲だけ（[コマンド](../service/service/cli.md) の「ファイルを書くコマンド」）"]},{"path":"docv/slot/guide/design.md","href":"開発者向けガイド/設計・実装.html","tags":[],"lines":["---","mission: コードを書くときに従う決まり（フレームワークの使い方、ディレクトリやコーディングの決まりなど）","---","","# 設計・実装","","## 進め方","","- 実装の前に、Slot とサービス仕様を読む。違う実装が要るなら、実装より先に Slot かサービス仕様を直す","- コメント、メッセージ、テストの中の説明は日本語で書く","","## コード","","- `src/` は、コマンドごとと、扱うもの（Slot、決定、Markdown など）ごとにファイルを分ける","- 実装から参照して出力するもの（雛形、スキーマ、docv の概要、レビューの手順、CSS、JS、版ごとの変更点）は、`assets/` に置いて埋め込む。コードの中に文字列で書かない","- 出力の並びは、書いた順か、並びの決まった入れ物（BTreeMap など）で決める。HashMap の順に頼らない。毎回同じ出力にするため（[ビジュアライズ](../service/service/html.md) の「毎回同じ出力にする決まり」）","- `assets/schema/` を変えたら、`docv/free/schema/` の写しも直す","","## ディレクトリ","","| ディレクトリ | 置くもの                                                      |","| ------------ | ------------------------------------------------------------- |","| `src/`       | CLI のソースコード                                            |","| `assets/`    | 実装から参照して出力するもの。バイナリに埋め込み、公開する    |","| `docv/`      | このリポジトリのドキュメント。docv 自身で管理する             |","| `output/`    | docv build の出力。clone してすぐ見られるように、コミットする |","| `scripts/`   | Makefile から呼ぶ、開発で使うシェルスクリプト                 |"]},{"path":"docv/slot/guide/testing.md","href":"開発者向けガイド/テスト方針.html","tags":[],"lines":["---","mission: テストの範囲と方法（自動テストの範囲、E2E テスト、手動テストについてなど）","---","","# テスト方針","","自動テストは `cargo test` で、`make fix` の中で実行する。","","## 自動テストで確かめること","","- テストは、確かめるコードと同じファイルの `tests` モジュールに書く","- ファイルを読むものは、一時ディレクトリに小さなプロジェクトを作り、check の指摘や build が書いた HTML の文字列を確かめる","- 埋め込むものどうしが揃っていることも確かめる。スキーマと `docv/free/schema/` の写し、`assets/update-guide.yaml` にある今の版と 1 行の長さ","","## 自動テストで確かめないこと","","- textlint は、`cargo test` では呼ばない。Node.js がなくても通るようにするため。確かめるのは、渡す設定と、受け取った結果の読み方だけ","- 代わりに、`make fix` で、このリポジトリのドキュメントに textlint を含む docv check と、docv build をかける。docv を使うプロジェクトとして、外から通して確かめる E2E テストに当たる","- HTML の見た目は、人間が `docv open` で開いて確かめる"]},{"path":"docv/slot/guide/doc-guide.md","href":"開発者向けガイド/Docガイド.html","tags":[],"lines":["---","mission: このプロジェクトのドキュメントの置き場所と書き方","---","","# Doc ガイド","","このプロジェクトでドキュメントを書く人間と AI Agent は、このページに従う。","","`docv gen doc-guide` が作った雛形を、プロジェクトに合わせて直して使う。docv が決めるルール（ディレクトリ、ミッション、ADR と PDR の章など）は `docv desc` にあり、このページには書き方のガイドラインだけを書く。","","docv の目的は、人間がプロジェクトの今の姿をいつでもざっと把握できるようにすることである。","","ドキュメントは、プロジェクトについて知りたいときや、サービス仕様とシステム仕様を変えるときに、判断の材料として読まれる。","","ドキュメントには、次の 3 つを書く。","","- Slot: およそどのプロジェクトでも要ること（サービス仕様、環境構築など）","- Free ファイル: プロジェクトに特有の詳しいこと","- ADR と PDR: 意思決定の背景と、決めたこと","","## 1. Slot","","### 言葉の使い分け","","あいまいな言葉は、次のように使い分け、書く場所を決める。","","| 言葉           | 指すもの
