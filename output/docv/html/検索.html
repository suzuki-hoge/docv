                                                         | 書く場所                                                                                            |","| -------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------ | --------------------------------------------------------------------------------------------------- |","| サービス説明   | docv をなにも知らない利用者へ伝える最初の説明                                                                                                          | サービス概要                                                                                        |","| サービス仕様   | 外から見た機能、振る舞い、決まり。実装をそっくり差し替えても変わらないこと\u003cbr>利用者、AI Agent、開発者が読む                                           | 要点はサービス仕様の 1 ページ目（`docv desc`）\u003cbr>詳しいことは 2 ページ目以降                       |","| システム構成   | 部品（CLI、リポジトリのドキュメント、textlint、git、出力など）の構成と役割、部品の間の流れ、どの処理をどの部品で行うか\u003cbr>開発者が判断を下すときに読む | 全体像はシステム概要。SVG で描く\u003cbr>部品ごとの詳しいことはシステム仕様                              |","| アーキテクチャ | システム全体で採る方式と決まり（部品の分け方、通信の方式、非同期処理の実現方法など）\u003cbr>部品を足したり、つなぎ方を変えたりするときに読む               | アーキテクチャ\u003cbr>その方式を選んだ理由は ADR                                                        |","| サービスエラー | 利用者が書いたドキュメントや渡した引数が原因で起きるエラー\u003cbr>例: check の指摘、`docv.yaml` の誤り、終了コード                                         | サービス仕様の 2 ページ目以降                                                                       |","| システムエラー | 環境や外の道具が原因で起きるエラーと、その扱い\u003cbr>例: textlint に要る Node.js が見つからない、ルートが git の管理下にない                              | システム仕様                                                                                        |","| 実装の決まり   | コードを書くときに従う決まり。コードを読んでも、守るべき決まりか、たまたまそうなっているかが分からないこと                                             | コード全体にかかるものは設計・実装\u003cbr>1 か所に置けるものは、そのコードのコメント                    |","| 実装           | 1 つの部品の中の今の作り（関数やモジュールの分け方、処理の手順）                                                                                       | 書かない。コードを読めば分かる                                                                      |","| 設計           | 何かを判断し決めること。ドキュメントの種類ではない                                                                                                     | 決めたいことは `docv/free/plan/`\u003cbr>決めた結果はミッションに沿うファイル\u003cbr>経緯や廃案は ADR か PDR |","","サービス仕様とシステム仕様は、利用者に見える結果か、それを実現する方法かで書き分ける。","","次に例を示す。","","| 書きたいこと | サービス仕様に書くこと                          | システム仕様に書くこと                               |","| ------------ | ----------------------------------------------- | ---------------------------------------------------- |","| 出力         | HTML のページの作りと、毎回同じ出力にする決まり | 出力先を作り直し、埋め込んだ CSS と JS を書く流れ    |","| エラー       | check の指摘と終了コード                        | 外の道具が見つからないときや、やりとりが途切れたとき |","| スキーマ     | `docv.yaml` の項目                              | スキーマを埋め込み、版のタグの URL で公開すること    |","| 外の道具     | textlint で確かめる項目と、使うかどうかの設定   | どのコマンドが、どの道具を、いつ呼ぶか               |","","### ページの分け方","","ページに分けられる Slot は、次のどれかに当たったら分ける。分けておく理由のないページは、まとめる。","","- 読み手の違う情報が混ざっている","- 読むタイミングの違う情報が混ざっている","- 違う部品や機能の情報が混ざっている","","サービス仕様の 1 ページ目は、`docv desc` と同じ `desc.md`（`assets/desc.md` へのシンボリックリンク）にする。`docv desc` と一致させるため、このページは 1 ファイルのまま保ち、AI Agent が最初に読む要点だけを書く。詳しいことは 2 ページ目以降に書く。","","## 2. Free","","- 足す前に、`docv list` で、Slot のミッションに当たらないかを確かめる","  - 当たるなら、その Slot に書く","- 1 つのファイルの `mission` は、1 つの用途にする","- ディレクトリを細かく設計せず、タグで分ける","  - 複数の属性を持つファイルは、ディレクトリでは置き場所が定まらないため","  - Slot の代わりになるディレクトリ（spec/、architecture/ など）ができそうになったら、Slot のページの分け方を見直す","","このリポジトリでは、次のタグを使う。","","| タグ     | 書くこと                                                 |","| -------- | -------------------------------------------------------- |","| スキーマ | `docv.yaml` の JSON Schema の写し（`docv/free/schema/`） |","","## 3. ADR","","今の姿は Slot と Free ファイルに書き、なぜそうなったかを ADR と PDR に残す。","","なぜやらなかったかは今の姿に残らないので、意思決定の履歴を残すことに価値がある。","","### 書くとき","","ADR（Architecture Decision Record）は、次のすべてに当たる技術の決定のときに書く。","","- 複数の案を比べて選び、選んだ理由が今のドキュメントやコードからは読み取れない","- 長く効き、後から変えるのに手間がかかる（使う言語、IaC の道具、部品の分け方、API の形、データの持ち方など）","- 実装の方法を変えても覆らない（コードを少し直せば正せるものは当たらない）","","### 書かないもの","","ADR と PDR のどちらにも、次のものは書かない。","","- 今の決定を変えずに直したこと（バグ修正、考慮漏れの手当て）","  - 理由を残したいときは、コミットメッセージに書く","- 決定に従って選ぶ細部（関数名、環境変数名、ライブラリの細かな使い方、画面の文言など）","- 移行の計画や進み具合など、短い間に状態が変わること","","### 書き方","","ADR と PDR の両方で、次のように書く。","","- 1 つの記録には、決定か変更を 1 つだけ書く","- 技術とプロダクトの両方にまたがるときは、仕様の変更を PDR に、それを実現する技術の決定を ADR に分け、「参考」の章で互いにつなぐ","- その記録だけで読めるように書く","  - 根拠は、後から確かめられるファイルや資料へのリンクにし、「参考」の章にまとめる","  - 会議や口頭でしか確かめていないことを根拠にしない","  - 決めた理由を、Issue や PR の番号に預けない","- 決めたことは、実装の自由を奪わない粒度で書く","  - 決めたことを守ったまま細部を差し替えたとき、本文を書き換える必要があるなら、その細部は書かない","","## 4. PDR","","PDR（Product Decision Record）は、サービス仕様についての ADR に当たる。","","- 料金、プラン、提供する機能の範囲、対象とする利用者、サポートの方針などの変更","- やらないと決めたこと、やめたこと","  - 同じ案がまた出たときに、理由を示せるようにするため","","書かないものと書き方は、ADR と同じ。見直す条件は、当たったかどうかを後から客観的に判断できる形で書く。","","## 5. ドキュメントの外に書くこと","","次のことは、ドキュメントの外に置く。","","| 書くこと                           | 置き場所                                                                                                            |","| ---------------------------------- | ------------------------------------------------------------------------------------------------------------------- |","| 値や設定を変える人に要る理由       | その値の隣のコメント                                                                                                |","| 部品の作り                         | 部品のコメント                                                                                                      |","| テーブルや列の意味                 | スキーマのコメント（生成したテーブル仕様書に出る）                                                                  |","| 確かめるケース                     | テスト名                                                                                                            |","| 検証器やリンタで守らせている決まり | 検証器やリンタの文（コメント、エラーの文）                                                                          |","| 使う人に毎回伝えるべき注意         | 製品やスクリプトの確認や文\u003cbr>言わせられないときだけドキュメント                                                    |","| AI Agent の作業の進め方            | エージェントの指示ファイル                                                                                          |","| 予定、未決、実装の状態、調査や議論 | `docv/free/plan/`\u003cbr>解決して消すことが前提\u003cbr>いかなるファイルからもここの具体ファイルにリンク・言及してはならない |","| 作業の報告、確かめてほしいこと     | コミットメッセージ                                                                                                  |","| 作業メモ                           | ルートの `tmp/`（コミットしない）                                                                                   |","","## 6. 書かないもの","","読者が自分で知れることは書かない。","","- 一般的な知識（Nginx とは何かなど、調べれば分かるもの）","- コード、設定、生成物、テストを読めば分かること","  - プロジェクトを調べれば分かる細部は、原則としてドキュメントで説明しない","  - コードの決まりやテストのパターンの説明は、ドキュメントではなく、コードのコメントに書く","- 安全に実行でき、結果を見れば分かること","  - 例: 安全装置のある道具について、実行する前の条件を細かく並べない","  - 例: リンタを実行すれば分かることを、ドキュメントの決まりとして細かく書かない","- 時系列の記録や、作業の報告","- 今はない、過去の情報（廃止したことは、決定として ADR か PDR に書く）","","## 7. 共通の書き方","","### ページ","","- 今の姿だけを書く","  - 経緯は ADR か PDR に、やったことはコミットメッセージに書く","  - 変わった情報は上書きし、古くなった情報は消す","  - 仕様は、実装の状態（未実装、止めている）にかかわらず、あるべき姿として書く","- 結論から書き、前置きや、同じことの言い換えを書かない","- 型（表の列、決まった見出し）を先に決める","- 「補足」「注意点」「残るリスク」のような受け皿の節を作らない","  - 残るものは、原因になった決定の隣に「そのため、次のことは残る」と書く","- 読者に置き換えをさせない","  - 環境ごとに変わる値は、表の列にする","  - コマンドは、「変える値の行」と「そのまま貼れるブロック」にする","- 用語集の言葉で書く","- 行番号や章番号のような、すぐ変わるものを頼りに書かない","- ほかのページへの案内は、書かないのを基本にする","  - Slot はミッションで、ほかのページは HTML の検索で辿れる","","### 箇条書きと折りたたみ","","- 箇条書きは 1 項目 1 文にする","  - 2 文以上になるなら、子の項目に分ける","  - 別々の決まりは、別の項目にする","- 畳むのは、必要になってから読む詳しいこと（全項目の一覧、例、例外の扱い、理由の細部など）","  - 読む人の誰もが知っておく要点と決まりは畳まない","  - 畳んだところを読まなくても、話が通るようにする","  - `\u003csummary>` を見るだけで、中に何があるかが分かるようにする","  - 消すべきものは、畳んで残さずに消す","","### 図","","- 分岐や合流、多対多のつながり、状態の移り変わりは、SVG の図にし、その分の文を消す","  - 上から順に実行する一本道の手順は、箇条書きのままにする","  - アスキーアートは使わない","- 図と同じことを、本文で説明しない","- 図は、今の構成に合わせて直す","","## 8. AI Agent への指示","","- セッションの初めに `docv desc` と `docv list` を実行し、このページに従う","- ドキュメントを変えたら、`docv fix` を通す","- 書く前に","  - 理由や決まりは、コードとコメントを探し、同じことがあれば写さない","  - 実装は、指示がない限り書かない","  - 長い手順や注意は、製品やスクリプトに言わせられないかを人間に提案する","  - 決まりを変えるときは、関わる ADR と PDR を探す","- 書いた後に","  - 手順を書いたら読者としてなぞり、戻せないこと、戻している間の振る舞い、気づけないことが書いてあるかを確かめる","  - 既存の文書を Slot に移したら、ミッションに当たらない記述を、ほかの Slot、Free ファイル、ADR、PDR に分ける","  - 実装は、Slot に移さない","- 直すよう言われたら、消す・移すを先にし、割る・畳むは後にする","- ADR と PDR","  - 加筆の指示があるまで作らない","  - 「ADR」と「PDR」の章で書くとしたものに当たる状況では、作ることを提案する","  - 書いたら、このページの基準で見直してから人間に見せる","  - PDR の見直す条件を満たす状況に気づいたら、その PDR を示して見直しを提案する","- このページに合わない記述を、作業中に 2 つ以上のファイルで見つけたら、作業を終えてから `docv review-guide` でのレビューを提案する","  - リリースの前や、大きな機能を入れた後にも提案する"]},{"path":"docv/slot/operation/release.md","href":"運用/リリース.html","tags":[],"lines":["---","mission: 版の決め方と、利用者への届け方","---","","# リリース","","版は `Cargo.toml` の `version` で決め、版のタグを push する。バイナリは配らず、利用者は GitHub のソースから cargo で入れる。","","## 手順","","1. `assets/update-guide.yaml` の先頭に、その版の変更点と対応を足す。コミットはしない","   - 版上げのコミットに入れる。コミットしてあると、`make new-version` が止まる","   - 対応のない版も書く","   - docv update-guide が出す 1 行は 100 文字以内にし、収まらない変更は分ける。長すぎると、次の手順の途中の cargo test が落ちる","2. 人間が `make new-version` を実行する","","   ```sh","   make new-version V=x.y.z","   ```","","版を手で書き換えない。版上げのコミットとタグを、毎回同じ形にするため。","","`make new-version` は、次を順に行う。","","1. 始める前に、次を確かめる","   - main にいて、origin の main を取り込んである","   - 手元の変更が `assets/update-guide.yaml` だけで、その先頭が渡した版になっている","   - 渡した版の変更点と対応を、まだコミットしていない","   - 渡した版が今の版より新しく、その版のタグがまだない","2. 版を書く場所（`Cargo.toml`、`Cargo.lock`、`docv.yaml` の `docv_version`、設定ファイルのページの例）を、新しい版に書き換える","3. 古い版が、決まった場所（版ごとの変更点、ADR、PDR、作り直す出力など）の外に残っていないかを探す","4. `make fix` で確かめ、HTML とインデックスを新しい版で作り直す","5. 「版を x.y.z にする」でコミットし、v で始まるタグを打ち、main とタグを push する","","\u003cdetails>","\u003csummary>止まったとき\u003c/summary>","","| 止まったところ               | 直し方                                                                                                      |","| ---------------------------- | ----------------------------------------------------------------------------------------------------------- |","| 始める前の確かめ             | 表示に従って直す。何も書き換えていない                                                                      |","| 版の書き換えか、古い版の探し | 版を書く場所が増えたか、書き方が変わった。`scripts/new-version.sh` の書き換える場所か、残してよい場所を直す |","| `make fix`                   | 指摘を直す。書き換えは元に戻してあり、`assets/update-guide.yaml` はそのまま残る                             |","| push                         | コミットとタグは手元に残っている。表示されたコマンドで push し直す                                          |","","途中で止まったら、直してからもう一度 `make new-version` を実行する。","","\u003c/details>","","タグは、`docv init` が `docv.yaml` の 1 行目に書くスキーマの URL の参照先になる。タグを push するまで、その版の URL は開けない。"]},{"path":"docv/slot/operation/cost.md","href":"運用/費用.html","tags":[],"lines":["---","mission: このプロジェクトの費用（月額費や、費用を理由にやっていないことなど）","---","","# 費用","","## かかっている費用","","| 説明                                                                           | 月額 |","| ------------------------------------------------------------------------------ | ---- |","| GitHub では、ソースと、版のタグごとのスキーマを置く。public リポジトリでは無料 | 0 円 |","","## 費用を理由にやっていないこと","","ない。"]},{"path":"docv/adr/typescript.md","href":"ADR/技術選定/TypeScriptで書く.html","tags":[],"lines":["---","group: 技術選定","date: 2026-10-10","---","","# TypeScript で書く","","## 背景","","ドキュメントを検査する CLI を作る。文章の検査には textlint を使い、textlint は Node.js で動く。","","## 決めたこと","","CLI は TypeScript で書き、npm のパッケージとして配る。textlint は、同じ Node.js の中からライブラリとして呼ぶ。","","## 結果","","textlint を外のコマンドとして呼ばずに済む。利用者は、Node.js を入れておく必要がある。","","## 選ばなかった案","","| 案          | 選ばなかった理由                                                          |","| ----------- | ------------------------------------------------------------------------- |","| Rust で書く | textlint を外のコマンドとして呼ぶことになり、Node.js との受け渡しが増える |"]},{"path":"docv/adr/rust.md","href":"ADR/技術選定/Rustで書く.html","tags":[],"lines":["---","group: 技術選定","date: 2026-10-11","supersedes: [typescript]","---","","# Rust で書く","","## 背景","","TypeScript で書くと、利用者は Node.js を入れておく必要がある。textlint を使わないプロジェクトでも、docv を動かすためだけに Node.js が要る。docv は多くのプロジェクトに入れて使うので、入れる手間を小さくしたい。","","## 決めたこと","","CLI は Rust で書き、単一のバイナリにして配る。","","## 結果","","利用者は、Node.js がなくても docv を使える。textlint を使うときだけ Node.js が要り、docv は textlint を外のコマンドとして呼ぶ。開発者は、Rust の環境を用意する。","","## 選ばなかった案","","| 案                      | 選ばなかった理由                                                                                         |","| ----------------------- | -------------------------------------------------------------------------------------------------------- |","| TypeScript で書き続ける | textlint を使わないプロジェクトにも Node.js が要る                                                       |","| Go で書く               | GitHub Actions で各プラットフォーム向けにビルドするなら、Go のクロスコンパイルの手軽さは決め手にならない |"]},{"path":"docv/adr/assets-only.md","href":"ADR/配布/実装から参照して出力するものをassets-にまとめる.html","tags":[],"lines":["---","group: 配布","date: 2026-10-15","---","","# 実装から参照して出力するものを assets/ にまとめる","","## 背景","","バイナリに埋め込むものが、3 か所に分かれていた。","","- `templates/`: YAML の Slot のサンプル","- `schema/`: `docv.yaml` のスキーマ","- `assets/`: CSS、docv の概要、YAML の Slot のスキーマ","","利用側が書き換えるかどうかや、公開するかどうかで分けていた。しかし、どれも実装から参照して出力するものという点で同じ。","","## 決めたこと","","実装から参照して出力するものは、すべて `assets/` に置く。YAML の Slot のサンプルは `assets/template/`、`docv.yaml` のスキーマは `assets/schema/docv.schema.json` に置く。`templates/` と `schema/` はなくす。","","## 結果","","埋め込むものは `assets/` を見れば揃う。`docv.yaml` から参照するスキーマの URL は `.../v\u003c版>/assets/schema/docv.schema.json` になる。タグを付けた版の URL は、その版の中身を指すので変わらない。","","## 選ばなかった案","","| 案                                              | 選ばなかった理由                                                 |","| ----------------------------------------------- | ---------------------------------------------------------------- |","| 利用側に書くもの（サンプル）を分けて置く        | 書き換えるかどうかは利用側の扱いで、実装の置き場所とは関係がない |","| 公開するスキーマだけをルートの `schema/` に残す | 公開は URL で参照するだけで、置き場所を分ける理由にならない      |"]},{"path":"docv/pdr/local-only.md","href":"PDR/フレームワークの範囲/checkとHTMLの生成はローカルで完結させる.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-10","---","","# check と HTML の生成はローカルで完結させる","","## 背景","","docv は、ドキュメントを書く人が手元で確かめ、手元で読むための道具。CI や公開の仕組みは、プロジェクトごとに違う。","","## 決めたこと","","check と build は、手元で実行して完結させる。CI での実行と公開は、利用者が必要なら自分で組む。","","## 結果","","利用者は、docv だけで check と HTML の生成ができる。CI で動かすときは、docv のコマンドを呼ぶ手順を利用者が組む。","","## 見直す条件","","- docv を入れたプロジェクトで、CI で check を実行する同じ手順を、それぞれが書き写しているのを見つけたとき","","## 選ばなかった案","","| 案                                                | 選ばなかった理由                   |","| ------------------------------------------------- | ---------------------------------- |","| GitHub Actions で check を実行し、HTML を公開する | ローカルで完結するほうが使いやすい |"]},{"path":"docv/pdr/no-typed-blocks.md","href":"PDR/構造化/構造化はYAMLfrontmatterとdocv.yamlに限る.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-10","---","","# 構造化は YAML front matter と `docv.yaml` に限る","","## 背景","","費用やコマンドのように、決まった形で書きたい情報がある。Free ファイルの本文の中に、決まった形のブロックを書かせる方法もあった。","","## 決めたこと","","個々のファイルの本文には、細かい形の制約を入れない。決まった形で書くものは、docv の規格のファイル（Slot）にする。","","## 結果","","Free ファイルは、ふつうの Markdown として読み書きできる。決まった形で書きたい情報は、Slot を足して扱う。","","## 見直す条件","","- Slot にするほどではない決まった形の情報を、複数のプロジェクトが Free ファイルの本文に同じ形で書いているのを見つけたとき","","## 選ばなかった案","","| 案                                                       | 選ばなかった理由                                                |","| -------------------------------------------------------- | --------------------------------------------------------------- |","| 費用やコマンドを、本文の中の YAML のコードブロックで書く | 本文に細かい制約を入れると、Markdown として読み書きしにくくなる |"]},{"path":"docv/pdr/rules-only.md","href":"PDR/フレームワークの範囲/AIAgentにはルールファイルを渡すところまでにする.html","tags":[],"lines":["---","group: フレームワークの範囲","date: 2026-10-11","---","","# AI Agent にはルールファイルを渡すところまでにする","","## 背景","","AI Agent がドキュメントを書くとき、docv のルールに沿わせる手段が要る。","","## 決めたこと","","docv はルールファイル（`docv desc`）を出すところまでにする。ルールに沿って直させる作業や `CLAUDE.md` への追記は、フレームワークの外で利用者が行う。","","## 結果","","docv は特定の AI Agent の仕組みに依存しない。","","## 見直す条件","","- `docv desc` を読ませても AI Agent が Doc ガイドに沿わないことが続き、利用者が同じ hook や設定を書き写すようになったとき","","## 選ばなかった案","","| 案                                                          | 選ばなかった理由                                                                                |","| ----------------------------------------------------------- | ----------------------------------------------------------------------------------------------- |","| Skill を提供し、docv init で `CLAUDE.md` と hook を設定する | 特定の AI Agent の仕組みに寄りすぎる。利用者の `CLAUDE.md` や hook に docv が書き込むことになる |"]},{"path":"docv/pdr/no-image.md","href":"PDR/出力/JPGを違うマシンで揃えず、build--no-imageで作らずに済ませる.html","tags":[],"lines":["---","group: 出力","date: 2026-10-17","---","","# JPG を違うマシンで揃えず、build --no-image で作らずに済ませる","","## 背景","","JPG は、マシンのフォントで変わる。違うマシンで同じ JPG にするには、フォントを埋め込む必要があり、日本語のフォントはサイズが大きい。`dir.image` を書いたプロジェクトでは、build のたびに Chrome で JPG を撮っていた。","","## 決めたこと","","違うマシンで同じ JPG にすることはしない。`docv build --no-image` は、`dir.image` を書いていても JPG を作らず、`dir.image` の中も変えない。チームで JPG を共有するなら、GitHub Actions などの決まった環境で作る。","","## 結果","","手元では、HTML だけを速く作り直せ、Chrome がなくても build できる。共有する JPG は、決まった環境で作る限り揃う。","","## 見直す条件","","- バイナリを大きくせずに、どのマシンでも同じ JPG を作れる手段が見つかったとき","- JPG をコミットするプロジェクトで、マシンの違いによる JPG の差分がレビューの妨げになったとき","","## 選ばなかった案","","| 案                                       | 選ばなかった理由                       |","| ---------------------------------------- | -------------------------------------- |","| フォントを埋め込み、どのマシンでも揃える | 日本語のフォントでバイナリが大きくなる |"]},{"path":"docv/pdr/overview-slot.md","href":"PDR/構造化/サービス概要のSlotを足し、サービス仕様と分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-24","---","","# サービス概要の Slot を足し、サービス仕様と分ける","","## 背景","","サービス仕様の Slot のミッションは「これの目的、利用者、解決すること、部品の構成」で、利用者にサービスそのものを説明することと、詳しい仕様を書くことの 2 つが入っていた。仕様が詳しく長くなるほど、これが何かを知りたいだけの利用者が、仕様の中から説明を探すことになる。","","## 決めたこと","","サービス概要の Slot（`service/overview.md`、md）を足す。サービス概要には、これが何で誰の何を解決し、何ができるかを、利用者に向けて書く。サービス仕様には、機能と部品の構成と、それぞれの詳しい振る舞いと決まりを書く。","","サービス仕様のまとまりは、サービス概要、サービス仕様、利用マニュアル、インストール、用語集の順に並べる。","","## 結果","","利用者は、サービス概要だけを読めば、これが何かがわかる。サービス仕様は、説明を気にせず詳しく書ける。","","## 見直す条件","","- サービス概要とサービス仕様に、同じ説明を書いているプロジェクトを見つけたとき","","## 選ばなかった案","","| 案                                         | 選ばなかった理由                                                    |","| ------------------------------------------ | ------------------------------------------------------------------- |","| サービス仕様の冒頭に概要を書く決まりにする | md の Slot の中身の形は決めないので、概要を書いたかを確かめられない |"]},{"path":"docv/pdr/service-pages.md","href":"PDR/構造化/サービス仕様をページに分けられるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-24","---","","# サービス仕様をページに分けられるようにする","","## 背景","","サービス仕様は 1 つの md の Slot で、HTML でも 1 つのページになる。利用者向けの機能と管理者向けの機能のように、読む人ごとに仕様が分かれるサービスでは、1 つのページが長くなり、読む人が自分に関わる部分を探すことになる。","","## 決めたこと","","サービス仕様は、`service/service.md` の代わりに、`service/service/` の直下に 1 ページ 1 つの Markdown で置けるようにする。ページの並びは YAML front matter の `order` で決め、本文の h1 をページの名前にする。HTML では、ページを 1 つずつ `サービス仕様/サービス仕様/\u003ch1>.html` にし、Slot の名前の下に、ページへのリンクをタブにして並べる。","","分けないときは、今と同じく `service/service.md` に書き、YAML front matter はいらない。分けられるのは、サービス仕様だけにする。","","## 結果","","すでにある `service/service.md` は、そのまま 1 ページのサービス仕様として読める。分けたページにも、ほかの md の Slot と同じ検査をかける。目次、検索、ほかのファイルからのリンクは、ページごとに効く。","","## 見直す条件","","- サービス仕様のほかにも、1 つのページが長くなり、分けたい md の Slot が出てきたとき","","## 選ばなかった案","","| 案                                                   | 選ばなかった理由                                                                           |","| ---------------------------------------------------- | ------------------------------------------------------------------------------------------ |","| `docv/service-specs/` のように、`docv/` の直下に置く | Slot をまとまりのディレクトリの下に置く決まりが崩れる                                      |","| 分けないときも、ディレクトリに置く                   | すでにある `service/service.md` を移すことになる                                           |","| ページの名前を YAML front matter に書く              | 本文の h1 と同じ名前を 2 か所に書くことになる                                              |","| 1 つの HTML の中で、CSS でタブを切り替える           | 目次に全ページの見出しが混ざる。検索の結果や見出しへのリンクから、隠れているタブを開けない |"]},{"path":"docv/pdr/spec-boundary.md","href":"PDR/構造化/サービス仕様とシステム仕様を、実装を差し替えても変わらないかで分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [overview-slot]","---","","# サービス仕様とシステム仕様を、実装を差し替えても変わらないかで分ける","","## 背景","","サービス仕様の Slot のミッションは「機能と部品の構成と、それぞれの詳しい振る舞いと決まり」、システム仕様の Slot のミッションは「システムの内部の動きと、従う決まり」だった。部品の構成と内部の動きが重なり、どちらも決まりを含むので、ミッションだけではどちらに書くかが決まらない。AI Agent はミッションに従い、サービス仕様に部品の構成を書く。仕様、アーキテクチャ、実装、設計といった言葉の意味も決めておらず、書く人によって置き場所が変わる。","","## 決めたこと","","サービス仕様のミッションを「外から見た機能と、それぞれの振る舞いと決まり」に、システム仕様のミッションを「部品の構成と役割、部品の間の流れと、部品をまたいで守る決まり」にする。サービス概要の Slot と、まとまりの並びは変えない。","","Doc ガイドの雛形に「言葉の使い分け」の章を足し、言葉ごとに指すものと書く場所を決める。仕様は、サービス仕様とシステム仕様の 2 つを指す。実装をそっくり差し替えても成り立つことはサービス仕様に、部品の分け方と部品をまたぐことはシステム仕様に書く。1 つの部品の中のことで、コードを読めば分かること（実装）は、指示がない限り書かない。設計は決めることで、置き場所を持たない。決めた結果は各所に、理由は ADR に書く。","","## 結果","","ミッションだけで、サービス仕様とシステム仕様のどちらに書くかが決まる。言葉の使い分けはガイドラインなので、プロジェクトに合わせて直せる。すでに作った Doc ガイドは変わらないので、`docv slot gen doc-guide --print` で見比べる。","","## 見直す条件","","- ミッションを読んでも、サービス仕様とシステム仕様のどちらに書くかで迷う記述が、繰り返し出たとき","","## 選ばなかった案","","| 案                                                           | 選ばなかった理由                                                                            |","| ------------------------------------------------------------ | ------------------------------------------------------------------------------------------- |","| サービス仕様のミッションを「利用者から見た」で始める         | API だけのサービスやバッチでは、外にいるのが人とは限らない                                  |","| ミッションに読む人を書く                                     | ミッションは読むと何が分かるかを 1 文で書く決まりで、長くなる。読む人は言葉の使い分けに書く |","| 言葉の使い分けを `docv desc` に書く                          | ルールになり、プロジェクトに合わせて直せない                                                |","| check で、サービス仕様の中のテーブル名らしい識別子を知らせる | 誤検知が多い。言葉の選び方はガイドラインで扱い、ルールにしない                              |","| 設計の置き場所を作る                                         | 決めた結果と理由で、書く場所が分かれる                                                      |"]},{"path":"docv/pdr/system-overview-slot.md","href":"PDR/構造化/システム概要のSlotを足し、システム仕様と分ける.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [spec-boundary]","---","","# システム概要の Slot を足し、システム仕様と分ける","","## 背景","","システムのまとまりには、システム仕様、技術スタック、API 仕様書、DB 仕様書があり、システムをざっと理解するための Slot がなかった。システム仕様のミッションは「部品の構成と役割、部品の間の流れと、部品をまたいで守る決まり」で、全体を見せることと、詳しい決まりを書くことの 2 つが入っていた。詳しく書くほど、全体をつかみたいだけの開発者が、システム仕様の中から全体像を探すことになる。サービス仕様では、同じ理由でサービス概要を分けている。","","## 決めたこと","","システム概要の Slot（`system/system-overview.md`、md）を足す。ミッションは「開発者に向けた、システムを作る部品と、そのつながりの全体像」とする。システム仕様のミッションは「部品ごとの振る舞いと、部品の間の流れと、部品をまたいで守る決まり」にする。サービス仕様のミッションは変えない。","","システムのまとまりは、システム概要、システム仕様、技術スタック、API 仕様書、DB 仕様書の順に並べる。","","Doc ガイドの雛形の言葉の使い分けでは、アーキテクチャの全体像を、システム概要に SVG の図で書くことにする。サービス概要に書く「サービス説明」の言葉も足す。","","## 結果","","開発者は、システム概要の図だけで、どんな部品があり、どうつながっているかが分かる。システム概要は部品の役割とつながりを、技術スタックはそれを作る技術を書き、同じことを 2 か所に書かない。システム仕様の `mission` は変わるので、すでにある md の Slot は check の error で直す。","","## 見直す条件","","- システム概要とシステム仕様の両方に、同じ部品の説明を書いているプロジェクトを見つけたとき","","## 選ばなかった案","","| 案                                               | 選ばなかった理由                                                      |","| ------------------------------------------------ | --------------------------------------------------------------------- |","| システム仕様の冒頭に全体像を書く決まりにする     | md の Slot の中身の形は決めないので、全体像を書いたかを確かめられない |","| 技術スタックに、部品のつながりを書ける項目を足す | 技術の一覧と、部品の構成図は、読む目的が違う                          |","| Slot の ID を `architecture` にする              | Slot の名前（システム概要）と ID の対応が読み取れない                 |"]},{"path":"docv/pdr/system-pages.md","href":"PDR/構造化/システム仕様も、サービス仕様と同じくページに分けられるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-10-25","supersedes: [service-pages]","---","","# システム仕様も、サービス仕様と同じくページに分けられるようにする","","## 背景","","ページに分けられるのは、サービス仕様だけだった。システム仕様も、画面、サーバ、バッチのように部品が多いシステムでは、部品ごとの振る舞いが 1 つのページに並んで長くなる。部品を 1 つだけ知りたい開発者が、長いページの中から探すことになる。","","## 決めたこと","","サービス仕様とシステム仕様は、1 つのファイルの代わりに、1 ページ 1 つの Markdown で置けるようにする。置き場所は、`service/service.md` の代わりに `service/service/` の直下、`system/system.md` の代わりに `system/system/` の直下とする。どのページにも、YAML front matter に `order` と、その Slot の `mission` を書く。ページの並びは `order` で決め、本文の h1 をページの名前にする。HTML では、ページを 1 つずつ `\u003cまとまり>/\u003cSlot>/\u003ch1>.html` にし、Slot の名前の下に、ページへのリンクをタブにして並べる。","","分けないときは、今までどおり 1 つのファイルに書く。分けられるのは、サービス仕様とシステム仕様だけにする。","","どこで分けるかは docv では決めない。Doc ガイドの雛形に、分ける目安を書く。読み手、読むタイミング、部品や機能の違う情報が、1 つのページに混ざったら分ける。","","## 結果","","システム仕様も、部品ごとにページを分けて読める。分け方、検査、HTML の作りは、サービス仕様と同じになる。`docv desc` の案内は、「ページ分け」の章にまとめる。AI Agent は、`docv desc` で分けられることを、Doc ガイドで分ける目安を知る。","","## 見直す条件","","- 利用マニュアルや API 仕様書など、サービス仕様とシステム仕様のほかの Slot でも、1 つのページが長くなり、分けたいという要望が出たとき","","## 選ばなかった案","","| 案                                             | 選ばなかった理由                                                |","| ---------------------------------------------- | --------------------------------------------------------------- |","| どの md の Slot も、ページに分けられる         | 利用マニュアルや API 仕様書を分けるかは、まだ要るかが分からない |","| システム仕様だけ、部品ごとの決まった形で分ける | md の Slot の中身の形は決めない。分け方はプロジェクトごとに違う |"]},{"path":"docv/pdr/develop-infrastructure-pages.md","href":"PDR/構造化/開発コマンドとインフラと環境も、ページに分けられるようにする.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-07","supersedes: [system-pages]","---","","# 開発コマンドとインフラと環境も、ページに分けられるようにする","","## 背景","","ページに分けられるのは、サービス仕様とシステム仕様だけだった。画面、サーバ、バッチのように部品ごとに開発のコマンドや環境が違うプロジェクトでは、開発コマンドとインフラと環境も、部品ごとの記述が 1 つのページに並んで長くなる。開発コマンドは YAML の Slot で、md の Slot のように h1 をページの名前にできない。","","## 決めたこと","","開発コマンド（`guide/develop/`）とインフラと環境（`operation/infrastructure/`）も、1 つのファイルの代わりに、1 ページ 1 つのファイルで置けるようにする。ページの拡張子は、分けないときと同じにする。","","- インフラと環境は md なので、サービス仕様とシステム仕様と同じく、YAML front matter に `order` と `mission` を書き、本文の h1 をページの名前にする","- 開発コマンドは、分けないときの項目に、`order` とページの名前の `title` を足す。スキーマは分けないときと同じものを使い、`order` と `title` は一緒に書く","- `order` とページの名前の重なりは、同じ Slot のページどうしでだけ確かめる","","## 結果","","部品ごとにコマンドや環境が違うプロジェクトでも、ページを分けて読める。YAML のページは、ページごとに JPG を作り、インデックスからもページごとの JPG にリンクする。開発コマンドのスキーマが変わるので、版を上げてタグを打つまで、エディタは前の版のスキーマで確かめる。","","## 見直す条件","","- 利用マニュアルや API 仕様書など、まだ分けられない md の Slot でも、1 つのページが長くなり、分けたいという要望が出たとき","- 用語集や環境変数など、開発コマンドのほかの YAML の Slot でも、ページに分けたいという要望が出たとき","","## 選ばなかった案","","| 案                                                           | 選ばなかった理由                                                         |","| ------------------------------------------------------------ | ------------------------------------------------------------------------ |","| 開発コマンドのページの名前を、ファイル名にする               | ページのファイル名は自由に付ける決まりで、ほかの分けたページとも揃わない |","| 開発コマンドのページに、分けないときと別のスキーマを用意する | 同じ項目を 2 つのスキーマで持つことになる                                |","| どの Slot も、ページに分けられるようにする                   | 分ける要望のない Slot まで、ページの決まりを持つことになる               |"]},{"path":"docv/pdr/update-guide.md","href":"PDR/コマンド/docvを更新したときの変更点と対応を、docvupdate-guideで出す.html","tags":[],"lines":["---","group: コマンド","date: 2026-11-07","---","","# docv を更新したときの変更点と対応を、docv update-guide で出す","","## 背景","","docv の版を上げたとき、利用者が変わったことを知る手段は、`docv check` の error と `docv desc` だけだった。check で気づけるのは、ルールに合わなくなったことだけである。足された機能、Doc ガイドの雛形の変更、出力のパスの変更は、check を通っても伝わらない。出力のパスが変わると、README から JPG へのリンクが切れる。","","以前は、ファイルと `docv.yaml` に版を書き、版ごとの手順を出すコマンドを持っていた。`docv desc` と `docv check` で直せるとして、どちらもやめていた。そのため、docv を更新した後では、直前まで使っていた版が分からない。`docv init` と `docv slot gen` が 1 行目に書くスキーマの URL には版があるが、書いたときの版で、docv を更新しても変わらない。","","## 決めたこと","","- `docv update-guide --from \u003c版>` で、指定した版より後の版の変更点と対応を、古い版から順に出す。対応のない版も、「対応は要らない」と書いて出す","- 変更点と対応はバイナリに埋め込み、版を上げるときに足す。手元の docv の版と、出す内容を一致させるため","- `docv.yaml` の `docv_version` に、ドキュメントを合わせた docv の版を書く。`docv init` が書く","- `docv_version` が docv の版と違えば、パッチの版の違いでも check が error にし、update-guide に渡す版を案内する。docv を更新した AI Agent が、check の error を手がかりに update-guide を見つけられるようにするため","- `docv.yaml` と YAML の Slot の 1 行目にあるスキーマの URL の版も、`docv_version` と違えば check が error にする。エディタが、古い版のスキーマで補完と検証をしないようにするため","- update-guide の最後に、`docv_version` とスキーマの URL の版を上げるよう案内する","- update-guide の使い方は、`docv desc` と利用マニュアルに書き、Doc ガイドの雛形には書かない。docv を更新するときにしか要らないため","","## 結果","","docv を更新すると check が error になり、AI Agent は案内に従って update-guide を実行する。check では気づけない変更にも対応できる。","","版を上げるたびに、対応のない版でも、`docv_version` とスキーマの URL を書き換えるコミットが要る。チームの中では、docv の版を揃えることになる。CI で docv の最新を入れていると、新しい版が出たときに check が落ちるので、`docv_version` の版を入れる。","","1.8.0 より前から使っているプロジェクトには `docv_version` がないので、check が error にする。使っていた版は、`docv.yaml` の 1 行目のスキーマの URL から推して案内する。","","## 見直す条件","","- 「対応は要らない」だけの版が、3 つ続けて出たとき。パッチの版の違いでは check を落とさない形を考える","- update-guide の対応をせずに、`docv_version` だけを書き換えたプロジェクトを見つけたとき","","## 選ばなかった案","","| 案                                                                     | 選ばなかった理由                                                                           |","| ---------------------------------------------------------------------- | ------------------------------------------------------------------------------------------ |","| 1 行目のスキーマの URL の版を、使っている版として扱う                  | 決まりをコメントの行に持たせることになる。ローカルのパスでスキーマを指すと、版が分からない |","| 更新の前に `docv --version` で版を控えてもらう                         | 人が cargo install で更新すると、控える機会がない                                          |","| 変更点を GitHub の CHANGELOG に置く                                    | 手元の docv の版と、読む内容がずれる。AI Agent がネットワークで取りに行くことになる        |","| Doc ガイドの雛形で update-guide を案内する                             | 更新のときにしか要らない情報を、いつも読ませることになる                                   |","| `docv_version` の違いを check で知らせず、`docv desc` の案内だけにする | AI Agent は、docv が更新されたことを知らない                                               |","| パッチの版の違いは、check で知らせない                                 | パッチの版にも、対応の要る変更が入ることがある                                             |","","## 参考","","- [設定ファイル](../slot/service/service/config.md)","- [利用マニュアル](../slot/service/manual.md)","- [リリース](../slot/operation/release.md)"]},{"path":"docv/pdr/document-root.md","href":"PDR/構造化/ドキュメントを1つのディレクトリに集め、画像を使うファイルの隣に置く.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-14","---","","# ドキュメントを 1 つのディレクトリに集め、画像を使うファイルの隣に置く","","## 背景","","`docv.yaml` の `dir` には、Free ファイル、Slot ファイル、HTML、JPG、インデックスの置き場所を別々に書いていた。プロジェクトが、既存のディレクトリに合わせて配置を決められるようにするためだった。ADR と PDR は、Slot ファイルと同じ `dir.slot` の下に置いていた。","","画像の置き場所は決めていなかった。`dir.slot` の下には Slot のほかのファイルを置けない。そのため、Slot で使う図も Free ファイルのディレクトリへ置くことになる。ADR から、今の姿を書いた図を参照すると、図を直したときに過去の決定の中身まで変わる。","","ドキュメントは、原則として AI Agent が書いて直す。人間が探しやすいように、文章と画像を別のディレクトリに分ける必要はない。","","## 決めたこと","","`dir` は、ドキュメントを置く `dir.document_root` と、build の出力先の `dir.output` の 2 つにする。その下の配置は docv が決める。","","- `document_root` の下には、`free/`（Free ファイル）、`slot/`（Slot ファイル）、`adr/`、`pdr/` と、build が作るインデックスの `README.md` だけを置く","- `output` の下には、`html/` と `image/` を置く。JPG を作るかは `generate.image` で決める","- `output` は、`document_root` の中に置けない。AI Agent が `document_root` を読むと、HTML に写した同じ内容がほぼ倍入るため","- インデックスは、build のたびに作る。名前を `README.md` にし、GitHub で `document_root` を開くと表示されるようにする。手で直されないように、末尾に作った docv の版を書く。HTML のサイドバーの一番下にも版を出す","- `ignore` は `docv_exclude` に名前を変える。`.gitignore` と取り違えないため","","画像は、使うファイルと同じディレクトリに、`{使うファイルの名前}_{画像の名前}.{拡張子}` の名前で置く。名前の順に並べると、画像が使うファイルの隣に来る。持ち主のない画像は、check の error にする。複数のページで使う画像は、主になるページの隣に置き、ほかのページからはそのパスを参照する。共通の画像のディレクトリは作らない。","","ADR と PDR は、それぞれのディレクトリの中の画像だけを参照できる。外の画像と URL の画像は、check の error にする。決定がそれだけで完結し、ほかのドキュメントを直しても、過去の決定が変わらないようにするため。","","## 結果","","AI Agent は、設定を読まなくても、どこに何を置くかが分かる。dir どうしを重ねられないという決まりと検査はなくなる。画像の置き場所で迷わなくなり、持ち主をなくした画像は check で見つかる。","","既存のディレクトリに合わせた配置はできなくなる。docv を入れたプロジェクトは、ファイルを移し、リンクを直す。互換性を壊すので、版を 2.0.0 にし、`docv update-guide` に移し方を書く。出力をコミットするプロジェクトでは、docv の版を上げるたびに、HTML のすべてのページとインデックスに差分が出る。","","## 見直す条件","","- 既存のディレクトリを移せないことを理由に、docv を入れるのをやめたプロジェクトが出たとき","- `docv_exclude` で決まった配置から外したファイルが、どのプロジェクトでも同じ形で増えたとき","","## 選ばなかった案","","| 案                                                     | 選ばなかった理由                                                              |","| ------------------------------------------------------ | ----------------------------------------------------------------------------- |","| 今のまま、`dir` でそれぞれの置き場所を選べるようにする | 画像の置き場所が決まらない。AI Agent が、設定から置き場所を読み解く手間も残る |","| `output` を `document_root` の中に置く                 | AI Agent が読む範囲に、同じ内容がほぼ倍入る                                   |","| 画像を共通のディレクトリにまとめる                     | どのファイルの画像かが名前から分からず、使われなくなった画像に気づけない      |","| Free ファイルの画像の名前は check しない               | 名前を変えたり消したりしたファイルの画像が、持ち主のないまま残る              |"]},{"path":"docv/pdr/drop-directory-slot.md","href":"PDR/構造化/ディレクトリのSlotをやめる.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-14","---","","# ディレクトリの Slot をやめる","","## 背景","","開発者向けガイドに、ディレクトリごとの役割を書くディレクトリの Slot（`guide/directory-tree.yaml`）があった。HTML では、パスを 1 段ずつの表に分けて出し、`path` の先がなくなると check が slot-path-missing の error にしていた。","","このリポジトリで使ってみると、ディレクトリのページはほとんど開かれなかった。ディレクトリの名前と役割は、エディタやリポジトリのツリーを見れば分かることが多い。読む価値があるのは、どこに何を置くかの決まりのほうで、それはパスと役割の一覧の形には収まらない。","","## 決めたこと","","ディレクトリの Slot をやめる。Slot の定義、スキーマ、雛形、HTML の表を消す。ディレクトリについて書きたい決まりは、同じ版で足す設計・実装の Slot（`guide/design.md`）に書く。","","## 結果","","- すでにある `guide/directory-tree.yaml` は、check の slot-unknown の error になる。利用者は、残したい決まりを設計・実装に移し、ファイルを消す。docv update-guide で案内する","- ディレクトリの `path` の先がなくなったことに、check で気づけなくなる。ディレクトリの構成とドキュメントのずれは、機械では見つけない","- 公開したスキーマは版のタグの URL に残るので、前の版の docv を使うプロジェクトのエディタの補完は壊れない","","## 見直す条件","","- ディレクトリの構成とドキュメントのずれを、check で見つけたいという要望が出たとき","","## 選ばなかった案","","| 案                                                         | 選ばなかった理由                                                                                  |","| ---------------------------------------------------------- | ------------------------------------------------------------------------------------------------- |","| ディレクトリの Slot を残し、使わないプロジェクトは置かない | 置くかどうかは今も任意で、残しても開かれないページのために、書く手間と直す手間がかかり続ける      |","| ディレクトリの一覧を、設計・実装の YAML の項目にする       | 設計・実装は、決まりを自由な形で書く md の Slot。一覧の形を決めると、決まりの書き方を縛ってしまう |"]},{"path":"docv/pdr/guide-slots.md","href":"PDR/構造化/開発者向けガイドに、アーキテクチャ、設計・実装、テスト方針のSlotを足す.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-14","---","","# 開発者向けガイドに、アーキテクチャ、設計・実装、テスト方針の Slot を足す","","## 背景","","開発者向けガイドには、環境構築、開発コマンド、環境変数、Doc ガイドがあった。開発者がコードを書く前に知っておく方針を書く Slot はなかった。ある程度の大きさのサービスでは、次のどれもが要る。","","- システム全体の方式（部品の分け方、通信の方式、非同期処理の実現方法）","- コードの決まり（フレームワークの使い方、ディレクトリやコーディングの決まり）","- テストの方針","","Slot がないので Free ファイルへ書くしかなく、置き場所と書き方がプロジェクトごとにばらつく。","","Doc ガイドの雛形では、コードを読めば分かる実装は書かないと決めていて、コードの決まりをどこに書くかが決まっていなかった。","","## 決めたこと","","開発者向けガイドに、次の 3 つの md の Slot を足す。どれもページに分けられる。","","| Slot           | ファイル                | ミッション                                                                                     |","| -------------- | ----------------------- | ---------------------------------------------------------------------------------------------- |","| アーキテクチャ | `guide/architecture.md` | システム全体で採る方式と決まり（部品の分け方、通信の方式、非同期処理の実現方法など）           |","| 設計・実装     | `guide/design.md`       | コードを書くときに従う決まり（フレームワークの使い方、ディレクトリやコーディングの決まりなど） |","| テスト方針     | `guide/testing.md`      | テストの範囲と方法（自動テストの範囲、E2E テスト、手動テストについてなど）                     |","","開発者向けガイドは、環境構築、開発コマンド、アーキテクチャ、設計・実装、テスト方針、環境変数、Doc ガイドの順に並べる。","","- アーキテクチャのミッションでは、「サービスの分け方」ではなく「部品の分け方」と書く。docv では、画面、サーバ、バッチなどを部品と呼び、サービスは外から見た製品を指す（サービス概要、サービス仕様）","- 技術スタックは、使っている製品やライブラリの名前を一覧で見るための Slot のまま残す。方式は、アーキテクチャに書く","- 設計・実装には、コードを読んでも、守るべき決まりか、たまたまそうなっているかが分からないことを書く。今のコードの作り（実装）は、これまでどおり書かない","- テスト方針には、何をどのテストで確かめるかを書く。テストを実行するコマンドは、開発コマンドに書く","- Doc ガイドの雛形の言葉の使い分けに、アーキテクチャと実装の決まりを足す。これまでアーキテクチャと呼んでいた部品の構成は、システム構成と呼び、システム概要に書く","","## 結果","","- 方式、コードの決まり、テストの方針に、どのプロジェクトでも同じ置き場所ができる。AI Agent は、ミッションで書く Slot を決められる","- Free ファイルに書いていた方式や決まりは、Slot に移せる。移すかどうかは、プロジェクトが選ぶ","- アーキテクチャは、システム概要やシステム仕様と書く場所が近い。境目は Slot の規格の注に書く","","## 見直す条件","","- 3 つの Slot のどれに書くか、またはシステム概要やシステム仕様に書くかで迷う記述が、繰り返し出たとき","","## 選ばなかった案","","| 案                                    | 選ばなかった理由                                                                   |","| ------------------------------------- | ---------------------------------------------------------------------------------- |","| 方式や決まりは、Free ファイルに任せる | 置き場所がプロジェクトごとに違い、AI Agent がミッションで書く場所を決められない    |","| 技術スタックに、方式を書く項目を足す  | 技術スタックは名前を一覧で見るためのもので、方式の説明を足すと一覧が読みにくくなる |"]},{"path":"docv/pdr/system-rules-to-architecture.md","href":"PDR/構造化/部品をまたいで守る決まりを、システム仕様からアーキテクチャに移す.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-14","supersedes: [system-overview-slot]","---","","# 部品をまたいで守る決まりを、システム仕様からアーキテクチャに移す","","## 背景","","システム仕様のミッションは「部品ごとの振る舞いと、部品の間の流れと、部品をまたいで守る決まり」だった。開発者向けガイドに足したアーキテクチャの Slot は、システム全体で採る方式と決まりを書く。部品をまたいで守る決まりは、システム全体で採る決まりと重なり、どちらに書くかがミッションだけでは決まらない。このリポジトリでも、アーキテクチャに書いた方式が、システム仕様の記述と重なった。","","## 決めたこと","","システム仕様のミッションを「部品ごとの振る舞いと、部品の間の流れ」にし、部品をまたいで守る決まりは、アーキテクチャに書く。","","部品は、画面、サーバ、バッチ、DB、外部サービスなど、システムを作る単位を指す言葉として、システム概要、システム仕様、アーキテクチャのミッションで揃える。部品を軸にすると、次のように書き分けられる。","","| Slot           | 書くこと                                       |","| -------------- | ---------------------------------------------- |","| システム概要   | どんな部品があるか                             |","| システム仕様   | 部品ごとに何をするか、部品の間で何が流れるか   |","| アーキテクチャ | 部品をどう分け、どうつなぎ、全体で何を揃えるか |","| 設計・実装     | 部品の中のコードをどう書くか                   |","","## 結果","","- システム仕様の `mission` が変わるので、すでにある md の Slot は、check の slot-mission の error で直す","- システム仕様に書いていた、部品をまたいで守る決まりは、アーキテクチャに移す。移したかどうかは、check では確かめない","- システム仕様は、個別の部品と流れを詳しく書く Slot になる。全体の方式を知りたい開発者は、アーキテクチャを読む","","## 見直す条件","","- アーキテクチャとシステム仕様のどちらに書くかで迷う記述が、繰り返し出たとき","","## 選ばなかった案","","| 案                                             | 選ばなかった理由                                                                                                                                                                                                                                                   |","| ---------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |","| 部品という言葉を使わずにミッションを書く       | 「システムの内部」のような言葉になり、どの Slot に書くかが決まらない。システム仕様のミッションが「システムの内部の動き」だったときも、サービス仕様と重なって書き直した（[サービス仕様とシステム仕様を、実装を差し替えても変わらないかで分ける](spec-boundary.md)） |","| 部品をまたいで守る決まりを、システム仕様に残す | アーキテクチャの決まりと重なり、ミッションだけでは書く場所が決まらない                                                                                                                                                                                             |"]},{"path":"docv/pdr/review-guide.md","href":"PDR/コマンド/ドキュメントを蒸留する手順をdocvreview-guideで出し、基準はDocガイドに置く.html","tags":[],"lines":["---","group: コマンド","date: 2026-11-15","---","","# ドキュメントを蒸留する手順を docv review-guide で出し、基準は Doc ガイドに置く","","## 背景","","AI Agent と開発すると、機能やコードはあまり増えないのに、ドキュメントだけが作業の報告のように増えていく。増えるほど、人間がプロジェクトの状態を一瞥できなくなる。","","Doc ガイドは、書くときに従う方針である。溜まったドキュメントをまとめてレビューする手順はなかった。","","レビューの観点は、ほとんどが Doc ガイドの基準と同じことになる。ミッションに沿っているか、同じことが複数の箇所にないか、ページをどう分けるかなどである。","","## 決めたこと","","レビューの判断の基準と、見て回る手順を分けて置く。","","| 分けたもの                                                                                           | 置き場所                                                                        | 調整できるか                |","| ---------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------- | --------------------------- |","| 判断の基準（何が望ましくないか）                                                                     | Doc ガイド                                                                      | プロジェクトで直せる        |","| 手順、観点、削るべきでないもの、判断に使わないもの、直し方、報告の形                                 | `docv review-guide` の出力と、HTML の Review Guide のページ。バイナリに埋め込む | 直せない。docv の版で決まる |","| 一覧（Slot と Free ファイルのパス、ミッション、タグ、打ち消されていない ADR と PDR、`docv_exclude`） | `docv review-guide` が、実行するたびにファイルから作る                          | 書くものではない            |","","- レビューの目的は、蒸留にする","  - 今の姿と決まり、その理由、境目（やらないこと）を残し、それ以外を除く","  - それらを読み取りやすくする概要や例、参照も残す","  - 量を減らすことは目的にしない","- review-guide は指摘を出さない","  - ファイルを読んで確かめ、指摘するのは、出力を受け取った AI Agent である","- 一覧には、読んでも分からないことか、AI Agent が自分で集めると間違えやすいことだけを出す","- 一覧に見出しは出さない","  - 対象はすべて読ませるので、同じことを 2 度読ませることになるため","- 一覧に行数は出さない","  - 数が並ぶと、大きいものを悪いと受け取るため","- 手順と Doc ガイドが食い違うときは、Doc ガイドに従う","  - 基準をプロジェクトで調整できるようにするため","- Doc ガイドにあって観点にない基準も、レビューで確かめる","  - プロジェクトが足した基準も効かせるため","- レビューの対象は、Slot と Free ファイルにする","  - ADR と PDR は対象にしない","- 一覧には、打ち消されていない ADR と PDR を出す","  - Slot や Free ファイルにある経緯が、決定にも書いてあるかを確かめるのに使う","  - 今の姿として書いたことが、決定と食い違っていないかを確かめるのにも使う","  - 打ち消された決定は、履歴なので出さない","- ファイルどうしの矛盾は、どちらが今の姿かを調べて直す","  - 分からなければ、人間に確かめる","- 決定との矛盾は揃えず、人間に確かめる","  - 決定を変えるには、新しい ADR か PDR が要るため","- レビューの結果はファイルに書かず、直すのは人間が選んでからにする","  - レビューの報告が、新しい作業の報告として溜まらないようにするため","- 観点ごとに直し方を決め、AI Agent はその中から選ぶ","  - 決めていないと、AI Agent は自分の好みで直し方を決め、書き足す直し方を選びがちなため","- ドキュメントのどこにも書いていない情報は、書き足さない","  - 例外は、決定との矛盾で新しい ADR か PDR を書くことだけ","- 指摘に添える直し方は、どれを選んでもドキュメントが変わるものだけにする","  - 人間が断った指摘を、次のレビューで繰り返さないため","- 人間が「このままでいい」と答えた指摘は、その判断を一般化した 1 行を、Doc ガイドに足す案として示す","  - Doc ガイドが例外の一覧になって観点が効かなくならないよう、観点を丸ごと外す 1 行にはしない","  - その箇所だけの例外は、次のレビューでも指摘されるのを受け入れる","- 削るべきでないものと判断に使わないものを、観点と並べて出す","  - 量を減らすよう頼まれた AI Agent は、決まりの理由や境目まで削ったり、大きさで判断したりするため","- Doc ガイドの雛形に、レビューの基準になることを足す","  - 作業の報告、冗長、折りたたみ、箇条書き、図、概要、ページをまとめること、メモの片付け","  - ADR と PDR を書いたら、作成基準に照らして見直すという指示","- `docv build` が作る HTML のサイドバーに Review Guide のページを置き、review-guide と同じ手順を出す","  - レビューするときに AI Agent が読むものを、人間も普段から同じ観点で読めるようにするため","  - サイドバーにあれば、レビューのコマンドがあることも忘れにくいため","- HTML のページには、一覧を出さない","  - build した時点の一覧がずれていき、HTML を git で管理していると、Slot や ADR を足すたびに差分が出るため","- review-guide の使い方は、`docv desc` と利用マニュアルに書く","- Doc ガイドの雛形には、手順は書かず、レビューを提案するきっかけだけを書く","  - きっかけは、作業中に 2 つ以上のファイルで望ましくない記述を見つけたときと、リリースの前や大きな機能を入れた後","  - いつレビューするかは、プロジェクトで調整したいことなので、ガイドラインに当たる","","## 結果","","- AI Agent に「`docv review-guide` に従ってレビューして」と頼めば、どのプロジェクトでも同じ手順でレビューできる","- 人間は、HTML の Review Guide のページで、AI Agent と同じ観点を読める","- プロジェクトは、Doc ガイドを直すことで、レビューの基準を足したり緩めたりできる","  - 観点そのものは調整できない","- 断った指摘は、ドキュメントが変わるので、次のレビューでは出ない","  - その箇所だけの例外として残したものは、レビューのたびに指摘される","- 書くときにすり抜けた、ふさわしくない ADR と PDR は、レビューでは見つからない","  - 増えて読みにくくなるのは ADR と PDR の系譜の図で、今の状態を一瞥することは崩れない","- すでに Doc ガイドを作ったプロジェクトには、雛形に足した基準が入らない","  - Doc ガイドは、docv の版を上げても書き換えないため","  - 版を上げるときに、update-guide で足した基準を案内する","","## 見直す条件","","- review-guide の出力を書き写し、観点を直したファイルをプロジェクトに置く利用者が出たとき","  - 観点もプロジェクトで調整したいという合図になる","- ADR と PDR に、作成基準の書かないものに当たる記録が溜まっているのを見つけたとき","  - ADR と PDR をレビューの対象から外したことを見直す","","## 選ばなかった案","","| 案                                                             | 選ばなかった理由                                                                                                      |","| -------------------------------------------------------------- | --------------------------------------------------------------------------------------------------------------------- |","| レビューガイドの Slot を作り、雛形を生成してプロジェクトで直す | 基準が Doc ガイドと 2 か所になり、ずれていく。Slot はプロジェクトの状態を書く場所で、レビューの手順はそれに当たらない |","| Doc ガイドの雛形に、レビューの手順を書く                       | たまにしか使わない手順を、毎回のセッションで読ませることになる                                                        |","| 観点ごとの基準も、コマンドに埋め込む                           | プロジェクトで基準を調整できない。プロジェクトで直した Doc ガイドとずれる                                             |","| docv が LLM を呼んで、指摘まで出す                             | docv は、AI Agent に渡す文を出すところまでにしている                                                                  |","| ドキュメントを減らすこと（圧縮）を目的にする                   | 量を目的にすると、決まりの理由や境目まで削られ、大きさで判断するようになる                                            |","| ページの行数などに上限を決めて指摘する                         | ドキュメントの絶対的な大きさに正解はない。分けるかどうかは中身で決める                                                |","| ADR と PDR もレビューの対象にする                              | 今の姿ではなく、書き換えない記録である。ふさわしいかは、書くときに決めたほうが早い                                    |","| ADR と PDR を書いた直後用のコマンドを分ける                    | 基準は Doc ガイドにあり、書くときに読まれている。1 件ずつ確かめるので、docv が作る一覧も要らない                      |","| ADR と PDR をすべて一覧に出す                                  | 打ち消された決定を今の決定として読み、誤った食い違いを指摘させてしまう                                                |","| 決まった間隔でレビューを促す                                   | docv は状態を持たず、前回いつレビューしたかを知らない                                                                 |","| ドキュメントの量でレビューを促す                               | ドキュメントの大きさに正解はない                                                                                      |","| check でレビューを促す                                         | check は意味を判断しない                                                                                              |","| 断った指摘を、ファイルに記録して次から除く                     | レビューの記録が、新しい作業の報告として溜まる。docv が状態を持つことにもなる                                         |","| 本文に「指摘しない」印（`\u003c!-- keep -->` など）を付ける         | 人間が読むドキュメントに雑音が入る。AI Agent が、指摘を黙らせるために印を付けるようになる                             |","| 前回のレビューから変わったファイルだけを見る                   | docv は前回のレビューを知らない。古くからある問題を見逃す                                                             |","| 句点で文を重ねた箇条書きを check で指摘する                    | 徹底させるのに手間がかかる。AI Agent がよく書く形なので、なくそうとすると、かえって手間が増える                       |","","## 参考","","- [AI Agent にはルールファイルを渡すところまでにする](rules-only.md)","- [docv を更新したときの変更点と対応を、docv update-guide で出す](update-guide.md)","- [利用マニュアル](../slot/service/manual.md)","- [Doc ガイド](../slot/guide/doc-guide.md)"]},{"path":"docv/pdr/diff-open.md","href":"PDR/コマンド/コミットする前のドキュメントの変わり方を、docvdiff-openで見る.html","tags":[],"lines":["---","group: コマンド","date: 2026-11-16","---","","# コミットする前のドキュメントの変わり方を、docv diff-open で見る","","## 背景","","実装に合わせてドキュメントを書き換えると、どのドキュメントがどう変わったかが分かりにくい。`git diff` はファイルの行の差分を出すが、HTML のどのページ、どのカードに当たるかは分からない。「このままコミットしたら、ドキュメントのどこが変わるか」を、普段見ている HTML の形で見たい。","","見たくなるのは、大きな変更をしたときと、docv の版を上げたときだと見込む。","","## 決めたこと","","- `docv diff-open [--from \u003crev>]` を足す。`--from` のリビジョン（省略すると `HEAD`）と作業ツリーを比べ、HTML を作ってブラウザで開くまでを、1 回で行う","  - 作ると開くを分けない。ドキュメントを書き換えても開いているページは変わらず、見るたびに作り直すため","- 比べるのは、ドキュメントの元のファイル（Markdown と YAML）にする。HTML どうしは比べない","  - `--from` のリビジョンは、今の docv では build できないことがある。docv の版を上げたときが、それに当たる","  - HTML を git で管理していないプロジェクトもある","- ページの中には差分を出さず、ファイルごとに印を付けるだけにする。詳しい差分は、元のファイルのパスの代わりに出す `git diff` のコマンドで見てもらう","  - ページの中に差分を出すには、ページの HTML どうしを比べることになるため","- 印は、新規、変更、削除の 3 つにする","  - 新規はページを全部読み、変更は差分を読み、削除は消してよいかを確かめる。見た人のすることが違うので、見た目を分ける","  - 足した行と消した行で印を分けても、見た人のすることは変わらない。消すだけの変更は、ほとんど起きない","  - 新規と削除はカードや行に色を付けて示し、変更は印を付けて、マウスを乗せると行数を出す","- 消したファイルも、カード、箱、行として出す。ADR と Slot を消すことは普段ないので、消したときは目立たせるため","- HTML は OS のキャッシュのディレクトリに書き、`dir.output` には書かない。出力を git で管理するリポジトリで、差分の HTML をコミットしないため","","## 決めないこと","","- 画像だけを変えたときに、その画像を使うページに印を付けるかは決めない。使ってみて要ると分かったら、別の PDR で決める","- `--from` に渡したブランチと、作業ツリーとの分かれ目（merge-base）で比べるかは決めない。今は `--from` のコミットそのものと比べる","","## 結果","","コミットする前に、変わったページを普段の HTML の形で見られる。docv の版を上げたときも、上げる前のコミットと比べられる。","","中身の差分は、ブラウザでは見られない。`git diff` のコマンドをコピーして、端末で見る。","","git の管理下にないプロジェクトでは使えない。`docv open` と同じく、macOS と Windows のほかでは使えない。","","## 見直す条件","","- 印だけでは足りず、ページの中の差分を HTML で見たいという Issue が立ったとき","- ブランチを `--from` に渡すと、ブランチで変えていないファイルにまで印が付くという Issue が立ったとき","","## 選ばなかった案","","| 案                                                         | 選ばなかった理由                                                                                              |","| ---------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------- |","| build のたびに差分を取り、出力に印を付ける                 | 出力が git の状態で変わり、入力が同じなら同じ出力にする決まりに反する。出力をコミットするリポジトリに印が残る |","| ページの中で、足した行と消した行に色を付け、切り替えで消す | HTML どうしを比べることになり、`--from` が今の docv で build できないと作れない                               |","| `document_root` に絞って `git diff` を出すラッパー         | 変わったファイルが、HTML のどのページ、どのカードに当たるかが分からない                                       |","| 足した行と消した行で、+ と − の印を分ける                  | 見た人のすることが変わらない                                                                                  |","| 新規にも、変更と同じ印を付ける                             | 新規はページを全部読み、変更は差分を読む。することが違う                                                      |","","## 参考","","- [利用マニュアル](../slot/service/manual.md)","- [ビジュアライズ](../slot/service/service/html.md)","- [システム仕様](../slot/system/system.md)"]},{"path":"docv/pdr/markdown-slots.md","href":"PDR/出力/SlotをすべてMarkdownで書き、JPGをやめる.html","tags":[],"lines":["---","group: 出力","date: 2026-11-19","supersedes: [no-image]","---","","# Slot をすべて Markdown で書き、JPG をやめる","","## 背景","","インストール、用語集、技術スタック、環境構築、開発コマンド、環境変数、費用の 7 つの Slot は、決まった項目の YAML で書いていた。YAML の Slot は GitHub でそのまま読めないので、build が Chrome でページを JPG に撮り、インデックスから JPG へリンクしていた。","","GitHub で JPG を開いて読むことは、ほとんどなかった。JPG のために、次のものを抱えていた。","","- Chrome への依存と、ページを撮る処理","- `generate.image`、`--no-image`、出力先の `image/`、JPG を git で管理すること","- 「JPG は同じマシンでしか同じにならない」という、毎回同じ出力にする決まりの例外","- 版を上げるたびに直す、YAML の Slot の 1 行目のスキーマの URL","","YAML の値は、HTML を作るのに使っているだけだった。Markdown にしても、失う機能はない。","","## 決めたこと","","Slot は、すべて Markdown で書く。JPG は作らない。","","- 7 つの Slot の形は、`docv gen` が作る雛形で示す","  - check で確かめるのは、ほかの Slot と同じく `mission` だけにする","  - 列や文を足すのは、利用者の自由にする","  - 雛形の形から外れていないかは、`docv review-guide` のレビューで見る","- 残った YAML の Slot は、check が error にし、雛形を見て Markdown に書き直すよう案内する","- `generate.image`、`--no-image`、出力先の `image/`、Chrome への依存、YAML の Slot のスキーマと `docv slot schema` をなくす","- インデックスは、すべての Slot を Markdown のファイルへリンクする","","前の決定のうち、次のところはこの決定で変わる。","","| 決定                                                                        | 変わるところ                                                                          |","| --------------------------------------------------------------------------- | ------------------------------------------------------------------------------------- |","| [ドキュメントを 1 つのディレクトリに集める](document-root.md)               | 出力先の下は `html/` だけになり、`generate.image` はなくなる                          |","| [docv update-guide で出す](update-guide.md)                                 | check がスキーマの URL の版を比べるのは、`docv.yaml` の 1 行目だけになる              |","| [開発コマンドとインフラと環境も分けられる](develop-infrastructure-pages.md) | 開発コマンドのページも Markdown で書き、ページの名前は h1 にする。ページの JPG はない |","","## 結果","","- 利用者は、7 つの Slot を `docv gen \u003cslot> --print` の雛形を見て、Markdown に書き直す","- GitHub の PR で、どの Slot も描画した差分を見られる。`mission` を front matter に書けて、check も効く","- build に Chrome が要らなくなり、出力は、どのマシンでも入力が同じなら同じになる","- 雛形の形は check で守られないので、崩れてもレビューまで気づかない","","## 見直す条件","","- 雛形の形から外れた Slot を、`docv review-guide` のレビューで指摘することが、1 つのプロジェクトで 3 回続いたとき","  - 形を check で確かめる理由になる","- GitHub で Slot を読む人から、表や手順を Markdown より見やすい形で見たいという要望が出たとき","","## 選ばなかった案","","| 案                                                   | 選ばなかった理由                                                                |","| ---------------------------------------------------- | ------------------------------------------------------------------------------- |","| YAML の Slot を残し、JPG だけをやめる                | YAML の Slot は GitHub で読めず、インデックスから辿れなくなる                   |","| 雛形の形（見出しや表の列）を check で確かめる        | 列や文を足す利用者の自由がなくなる。形は雛形と LLM のレビューで保てる           |","| OS ごとの手順のタブを、Markdown の書き方を決めて残す | docv だけの書き方を作り込むことになる。並べて書くか、`\u003cdetails>` で畳めば足りる |"]},{"path":"docv/pdr/related-decisions.md","href":"PDR/構造化/ページに関わる決定をYAMLfrontmatterに書き、ページの末尾に出す.html","tags":[],"lines":["---","group: 構造化","date: 2026-11-19","---","","# ページに関わる決定を YAML front matter に書き、ページの末尾に出す","","## 背景","","Slot と Free ファイルの決まりの文に、ADR や PDR へのリンクや、「理由は ADR に書いた」のような文が付いていた。ページの読者に要るのは今の決まりで、決定の経緯ではない。決定が打ち消されても、リンクは古い決定を指したまま残る。","","一方で、決まりを変える人は、その決まりに関わる決定を知りたい。本文から消すだけでは、関わる決定を辿れなくなる。","","## 決めたこと","","ページの側の YAML front matter に、関わる決定の id を並べる。","","- `adr` と `pdr` に、それぞれの id を並べる。ADR と PDR は、同じ id でも別の決定なので、項目を分ける","- md の Slot（分けたページも）と Free ファイルに書ける","- HTML では、docv がページの本文の後に、関わる決定の題を並べてリンクする","- 決定のページには、その決定を指しているページを逆に並べる","- ない id は、check が error にする","- 打ち消された決定を指していれば、check が warning にし、ページの末尾には出さない","  - 打ち消した新しい決定がページに関わるかは、docv には分からないため","- 本文では、ADR と PDR を案内しない","","## 結果","","- ページの読者は、決定の経緯を読まずに、今の決まりだけを読める","- 決まりを変える人は、ページの末尾から関わる決定を辿れ、決定のページからは、それが効いているページを辿れる","- 決定が打ち消されると、check の warning で、指しているページに気づける","- check に warning ができる。warning だけなら、終了コードは 0 にする","","## 見直す条件","","- ページの YAML front matter の `adr` と `pdr` が、1 つのプロジェクトで 10 を超えるページで、打ち消された決定を指したまま残っているとき","  - warning では直されないという合図になる","","## 選ばなかった案","","| 案                                         | 選ばなかった理由                                                       |","| ------------------------------------------ | ---------------------------------------------------------------------- |","| 決定の側に、関わるページを書く             | 決定は書き換えないが、ページは移ったり分かれたりする                   |","| 本文のリンクのまま、check で古さを確かめる | 読者に要らない経緯が本文に残る。どこまでが案内かを機械では決められない |","| `adr` と `pdr` を 1 つの項目にまとめる     | ADR と PDR は、同じ id でも別の決定                                    |"]},{"path":"docv/pdr/review-by-reader.md","href":"PDR/コマンド/docvreview-guideのレビューで、ページの読者に要ることだけを残す.html","tags":[],"lines":["---","group: コマンド","date: 2026-11-19","supersedes: [review-guide]","---","","# docv review-guide のレビューで、ページの読者に要ることだけを残す","","## 背景","","`docv review-guide` のレビューは、ドキュメントの今の姿と決まり、その理由、境目（やらないこと）を残し、それ以外を除くことを目的にしていた。","","この目的では、人間が読むページに入り込んだ、コードを直す人に向けた注意を除けなかった。たとえば、デプロイ手順のページに「デプロイの仕組みを直すときの決まり」の章ができる。決まりの理由、境目、実装の決まり、ADR への参照は、削るべきでないものとして守られていた。","","YAML front matter に、読む人、読む場面、書かないものの項目を足しても防げない。どのページでも、同じ決まりの言い直しになるためである。","","レビューは、ドキュメントだけを読んで行っていた。コードのコメントやエージェントの指示ファイルと同じことが書いてあっても、気づけなかった。手順のページに、戻せないことや、戻している間の振る舞いが書いていなくても、指摘する観点がなかった。","","## 決めたこと","","レビューでは、どのページも、そのページの読者に要ることだけを残す。読者に要るのは、読者の行動を変えることか、読者が自分では知れないこと。","","| 分けたもの                                                                                 | 置き場所                                                                        | 調整できるか                |","| ------------------------------------------------------------------------------------------ | ------------------------------------------------------------------------------- | --------------------------- |","| どのプロジェクトでも守らせる観点（今の姿、置き場所と形）                                   | `docv review-guide` の出力と、HTML の Review Guide のページ。バイナリに埋め込む | 直せない。docv の版で決まる |","| 手順、Doc ガイドの基準の種類ごとの直し方、削るべきでないもの、判断に使わないもの、報告の形 | 同上                                                                            | 直せない。docv の版で決まる |","| 判断の基準（何を書き、何を書かないか、どこに置き、どう書くか）                             | Doc ガイド                                                                      | プロジェクトで直せる        |","| 打ち消されていない ADR と PDR の一覧と、`docv_exclude`                                     | `docv review-guide` が、実行するたびにファイルから作る                          | 書くものではない            |","| Slot と Free ファイルの一覧（パス、ミッション、タグ、置いていない Slot も）                | `docv list` が、実行するたびにファイルから作る。手順の中で実行させる            | 書くものではない            |","","### 観点の分け方","","- review-guide の観点は、どのプロジェクトでも守らせるものだけにする","  - 今の姿: 内容の矛盾、決定との矛盾、図や概要のずれ、作業の報告、経緯、予定と課題、手順の足りないもの","  - 置き場所と形: ミッションに合うか、Slot と Free ファイルの分け方、内容の重複、ページの冒頭でのほかの Slot の案内、本文での ADR と PDR の案内、雛形の形","- それ以外の基準は Doc ガイドに置き、review-guide では、基準の種類ごとの直し方だけを決める","  - 種類は、書かないもの、ドキュメントの外に置くもの、置き場所、書き方","  - 読者が自分で知れることを消す基準と、読者の違うことをドキュメントの外へ移す基準は、Doc ガイドの雛形に置く","- Doc ガイドが観点と食い違うときは、観点に従う","- 決まりの理由、境目、実装の決まりは、読者に要るときだけ、削るべきでないものとして守る","- 人間が「このままでいい」と答えた指摘のうち、Doc ガイドの基準によるものだけ、その判断を一般化した 1 行を、Doc ガイドに足す案として示す","  - 基準を丸ごと外す 1 行にはしない","  - 守らせる観点の指摘は、Doc ガイドでは外せない","","### 手順","","- 初めに、ドキュメントだけで見るか、コードやインフラの定義も調べるかを人間に確かめる","  - 頼むときに言われていれば、聞かない","- 手順のページは読者としてなぞり、戻せないこと、戻している間の振る舞い、気づけないことが書いてあるかを見る","  - 足りなければ、書き足さずに、問いとして人間に出す","- 直すときは、消す・移すを先にし、割る・畳むを後にする","  - 消せるものを消すと、割るものや畳むものはほとんど残らないため","- Slot と Free ファイルの一覧は、`docv review-guide` では出さず、`docv list` を実行させる","  - 同じ一覧を、2 つのコマンドで作らないため","","### 前の決定から変えないこと","","- review-guide は指摘を出さない","  - 指摘するのは、出力を受け取った AI Agent である","- レビューの対象は Slot と Free ファイルにし、ADR と PDR は対象にしない","  - 書き換えない記録で、ふさわしいかは書くときに決めたほうが早いため","- 一覧に出す ADR と PDR は、打ち消されていないものだけにする","  - 打ち消された決定を今の決定として読み、誤った食い違いを指摘させないため","- 決定との矛盾は揃えず、人間に確かめる","  - 決定を変えるには、新しい ADR か PDR が要るため","- 観点ごとに直し方を決め、AI Agent はその中から選ぶ","  - 決めていないと、AI Agent は書き足す直し方を選びがちなため","- ドキュメントのどこにも書いていない情報は、書き足さない","  - 例外は、決定との矛盾で新しい ADR か PDR を書くことだけ","- レビューの結果はファイルに書かず、直すのは人間が選んでからにする","  - レビューの報告が、新しい作業の報告として溜まらないようにするため","- 一覧に見出しと行数は出さない","  - 対象はすべて読ませ、大きさでは判断させないため","- HTML のサイドバーに Review Guide のページを置き、review-guide と同じ手順を出す。一覧は出さない","  - build した時点の一覧はずれていき、HTML を git で管理していると、ファイルを足すたびに差分が出るため","- Doc ガイドの雛形には、手順は書かず、レビューを提案するきっかけだけを書く","","## 結果","","- レビューで、人間が読むページから、コードを直す人に向けた注意や、コードとコメントの写しが消える","  - 消えた理由や決まりは、その値の隣のコメントなど、変える人が読む場所へ移る","- コードやインフラの定義も調べるレビューは、ドキュメントだけのレビューより時間がかかる","- 手順のページの足りないことは、問いとして出るだけで、答えて書き足すかは人間が決める","- 読者に要るかの判断は AI Agent に任せるので、レビューごとにぶれる","  - Doc ガイドの基準による指摘は、人間が断ると、Doc ガイドに足した 1 行で次のレビューから出なくなる","  - 守らせる観点の指摘は、断っても次のレビューで出る","- プロジェクトは、Doc ガイドを直して、守らせる観点の外の基準を足したり緩めたりできる","- すでに Doc ガイドを作ったプロジェクトには、雛形に足した基準が入らない","  - Doc ガイドは、docv の版を上げても書き換えないため","  - 版を上げるときに、update-guide で案内する","","## 見直す条件","","- 「このままでいい」と答えて Doc ガイドに足した 1 行が、書かないものかドキュメントの外に置くものの基準に当たるものだけで 5 行を超えたとき","  - 読者で見る基準が、プロジェクトの考えと合っていないという合図になる","- 守らせる観点の同じ指摘に、1 つのプロジェクトで 3 回続けて「このままでいい」と答えたとき","  - その観点を、docv で守らせなくてよいという合図になる","- review-guide の出力を書き写し、観点を直したファイルをプロジェクトに置く利用者が出たとき","  - 観点もプロジェクトで調整したいという合図になる","","## 選ばなかった案","","| 案                                                                             | 選ばなかった理由                                                                                        |","| ------------------------------------------------------------------------------ | ------------------------------------------------------------------------------------------------------- |","| YAML front matter に、読む人、読む場面、書かないものの項目を足す               | どのページでも、同じ決まりの言い直しになる                                                              |","| 調べる範囲を選ぶオプション（`--full-scan` など）を作る                         | 人間に聞く文 1 つで済み、HTML の Review Guide のページの手順と同じものを出せる                          |","| 形の指標（入れ子の深さ、項目の文の数など）を機械で測って指摘する               | 形の崩れは症状で、消せるものを消すと、ほとんど残らない                                                  |","| 手順のページに足りないことを、AI Agent が書き足す                              | ドキュメントのどこにも書いていない情報を、推し量って書くことになる                                      |","| 今までどおり、理由、境目、実装の決まりを、読者を問わず削るべきでないものにする | 人間が読むページに、コードを直す人に向けた注意が残り続ける                                              |","| すべての観点を review-guide に置き、Doc ガイドと食い違えば Doc ガイドに従う    | どの観点をプロジェクトで変えてよいかが分からない。docv が守らせるべき観点まで、Doc ガイドで外せてしまう |","","## 参考","","- [Doc ガイド](../slot/guide/doc-guide.md)","- [利用マニュアル](../slot/service/manual.md)"]},{"path":"docv/free/schema/config.md","href":"プロジェクト詳細/docv/free/schema/config.html","tags":[["スキーマ",0]],"lines":["---","mission: docv.yaml の項目と、それぞれの形","tags: [スキーマ]","---","","# `docv.yaml` のスキーマ","","```json","{","  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",","  \"title\": \"docv.yaml\",","  \"description\": \"docv の設定ファイル。ツールの設定と、プロジェクト全体で共有する語彙を書く。ファイルごとの設定は YAML front matter に書く。項目の意味は `docv/slot/service/service/config.md` を参照。\",","  \"type\": \"object\",","  \"additionalProperties\": false,","  \"properties\": {","    \"docv_version\": {","      \"description\": \"ドキュメントを合わせた docv の版（`1.8.0` の形）。docv の版と違えば、docv check が error にする。docv を更新したら、`docv update-guide --from \u003cこの版>` で変わったことと対応を確かめ、対応してから書き換える。\",","      \"type\": \"string\",","      \"pattern\": \"^[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\"","    },","    \"title\": {","      \"description\": \"HTML とインデックスに出すプロジェクト名。省略するとルートのディレクトリ名。\",","      \"type\": \"string\",","      \"minLength\": 1","    },","    \"dir\": {","      \"description\": \"docv が読み書きするディレクトリ。どちらもルートからの相対パスで、ルートは書けない。`output` は、`document_root` と同じにも、その中にもできない。`document_root` も、`output` の中にはできない。\",","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"document_root\": {","          \"description\": \"ドキュメントを置くディレクトリ。この下に、`free/`（Free ファイル）、`slot/`（Slot ファイル）、`adr/`、`pdr/` と、docv build が作るインデックスの `README.md` を置く。直下にほかのものは置けない。\",","          \"type\": \"string\",","          \"minLength\": 1,","          \"default\": \"docv\"","        },","        \"output\": {","          \"description\": \"docv build の出力先。この下の `html/` に HTML を出す。AI Agent が `document_root` を読むときに同じ内容が倍入らないように、`document_root` の外に置く。\",","          \"type\": \"string\",","          \"minLength\": 1,","          \"default\": \"output/docv\"","        }","      }","    },","    \"docv_exclude\": {","      \"description\": \"docv が読まないファイルの glob。ルートからの相対パス。当てはまるファイルは、check（置き場所の検査も含む）、fix、整形、textlint、HTML、検索、インデックスのどれの対象にもならない。メモや下書きの置き場所に使う。\",","      \"type\": \"array\",","      \"items\": {","        \"type\": \"string\",","        \"minLength\": 1","      }","    },","    \"tags\": {","      \"description\": \"タグの一覧。YAML front matter の `tags` には、ここにあるタグだけを書ける。\",","      \"type\": \"array\",","      \"items\": {","        \"type\": \"object\",","        \"additionalProperties\": false,","        \"required\": [","          \"name\",","          \"color\"","        ],","        \"properties\": {","          \"name\": {","            \"type\": \"string\",","            \"minLength\": 1","          },","          \"color\": {","            \"description\": \"HTML でのタグの色。\",","            \"enum\": [","              \"blue\",","              \"green\",","              \"yellow\",","              \"red\",","              \"purple\",","              \"orange\",","              \"teal\",","              \"pink\"","            ]","          }","        }","      }","    },","    \"format\": {","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"enabled\": {","          \"description\": \"check で、整形が要るファイルを error にするか。\",","          \"type\": \"boolean\",","          \"default\": false","        }","      }","    },","    \"lint\": {","      \"description\": \"check の規則。項目の意味は `docv/slot/service/service/config.md` を参照。\",","      \"type\": \"object\",","      \"additionalProperties\": false,","      \"properties\": {","        \"bold\": {","          \"description\": \"太字を使ってよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"italic\": {","          \"description\": \"斜体を使ってよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"dollar\": {","          \"description\": \"コードの外の 1 行に `$` を 2 つ以上書いてよいか。\",","          \"enum\": [","            \"allow\",","            \"deny\"","          ],","          \"default\": \"allow\"","        },","        \"textlint\": {","          \"description\": \"textlint で文章を校正するか。使うルールは docv が決める。\",","          \"enum\": [","            \"enable\",","            \"disable\"","          ],","          \"default\": \"disable\"","        }","      }","    }","  }","}","```"]}];</script>
