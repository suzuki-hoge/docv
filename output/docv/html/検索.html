新しい ADR を書き、その `supersedes` で過去の決定の id を指す","- HTML では、`group` ごとに決定のつながりを図にする","","```markdown","---","group: 言語","date: 2026-03-01","supersedes: [ go ]","---","","# Rust で書く","","## 背景","","配布するバイナリを 1 つにしたい。利用者の手元に、言語の実行環境を求めたくない","","## 決めたこと","","CLI は Rust で書き、単一のバイナリにして配る。CLI の外で動く道具（textlint など）は、この決定の範囲に含めない","","## 決めないこと","","バイナリをどこで配るかは決めない。リリースの Slot で決める","","## 結果","","利用者は、言語の実行環境なしで使える。開発者は、Rust の環境を用意する","","## 選ばなかった案","","| 案             | 選ばなかった理由             |","| -------------- | ---------------------------- |","| Node.js で書く | 利用者の手元に実行環境が要る |","| Zig で書く     | 情報が少ない                 |","","## 参考","","- [技術スタック](../system/stack.yaml)","```","","### `group`","","任意","","決定のまとまりの名前","省略すると「その他」","","### `date`","","必須 / YYYY-MM-DD","","決めた日","決定を並べる順に使う","","### `supersedes`","","任意 / リスト形式","","打ち消す過去の決定の id","","## 5. PDR","","PDR（Product Decision Record）は、プロダクトやサービスの仕様の変更 1 つを、その理由や見直す条件と一緒に残す記録。料金、プラン、提供する機能の範囲、対象とする利用者などを足す・変える・やめるときに書く。なぜ今の仕様になったのかを将来も分かるようにするための履歴なので、案を比べて選んだ決定に限らない","","- `docv/pdr/\u003cid>.md` に、変更 1 つを 1 ファイルで置く","- 画像は `docv/pdr/\u003cid>_\u003c画像の名前>.\u003c拡張子>` に置き、`docv/pdr/` の中の画像だけを使う","- ファイルの作り方、YAML front matter の項目、書き換えないこと、HTML の図は ADR と同じ","- `supersedes` は PDR だけを指す。ADR と PDR は、同じ id でも別の決定","- 本文の章は、ADR の章の `## 結果` の後に `## 見直す条件` を足し、`## 選ばなかった案` を任意にしたもの","    - `## 背景`: 決める必要が生じた課題と、そのときの利用者、市場、事業の状況","    - `## 決めたこと`: 決めたことと、その案を選んだ理由。決めたことが当てはまる範囲（対象の利用者、プラン、機能など）","    - `## 決めないこと`（任意）: この PDR では決めないことと、それをどこで決めるか","    - `## 結果`: 利用者と事業に起きると見込むこと。引き受けること（できなくなること、後で考えること）も書く","    - `## 見直す条件`: どんな状況になったら、この決定を見直すか。数や時期など、起きたかどうかを確かめられる形で書く","    - `## 選ばなかった案`（任意）: 比べた案があれば、それぞれを選ばなかった理由","    - `## 参考`（任意）: 根拠にしたファイルや資料へのリンク","- 見直す条件に当たっても書き換えない。決定を変えるなら、新しい PDR を書き、その `supersedes` で過去の決定の id を指す","","```markdown","---","group: 料金","date: 2026-04-01","supersedes: [ free-only ]","---","","# 注文の多い店舗に有料のプランを求める","","## 背景","","無料のプランだけで提供してきた。月の注文が 1 万件を超える店舗が増え、サーバの費用が売上を上回った","","## 決めたこと","","月の注文が 1,000 件を超える店舗には、有料のプランを求める。1,000 件までは、今までどおり無料にする","","## 結果","","注文の多い店舗の一部は、解約すると見込む","","## 見直す条件","","- 有料のプランに移った店舗が、対象の店舗の半分を下回ったとき","- 2027 年 3 月の時点で、サーバの費用が売上を上回ったままのとき","","## 選ばなかった案","","| 案                       | 選ばなかった理由                 |","| ------------------------ | -------------------------------- |","| すべての店舗を有料にする | 小さな店舗が使い始められなくなる |","```","","## 6. コマンド","","すべてのコマンドは `docv --help` と `docv \u003csub-command> --help` で確認する","","新たに導入する場合は `docv init` し、`docv slot gen doc-guide` でガイドラインを作り、`docv slot gen` と `docv check` で作成・調整を進める","","## 7. スキーマ ( 設定ファイル )","","設定ファイル ( `docv.yaml` ) の項目は `docv init --print` で確認する","","すべての項目が、既定の値でコメントとして載っている","","## 8. スキーマ ( docv ファイル )","","YAML の Slot は `docv slot list` で確認し、そのスキーマは `docv slot schema \u003cslot>` で確認する","","## 9. ルール、ガイドライン、設定","","docv の決まりは、次の 3 つに分かれる","","- ルール: docv の仕組みが決める決まり。Slot と `docv.yaml` のスキーマ、YAML front matter の key、check が確かめることなど。利用側は変えられない。この概要と `docv slot schema \u003cslot>` で確認する","- ガイドライン: ドキュメントを書くときの方針。`docv slot gen doc-guide` で Doc ガイド（`docv/slot/guide/doc-guide.md`）に雛形を作り、プロジェクトに合わせて自由に直す","- 設定: `docv.yaml` で切り替えること。check のルールや textlint を使うか、出力を git で管理するかなど。`docv init --print` で確認する","","## 10. docv の更新","","`docv.yaml` の `docv_version` に、ドキュメントを合わせた docv の版を書く","","- docv の版と違えば、パッチの版の違いでも `docv check` が error にする","- docv を更新したら、`docv update-guide --from \u003cdocv_version>` で版ごとの変更点と対応を確かめ、対応する","- 対応が終わったら、`docv_version` と、`docv.yaml` と YAML の Slot の 1 行目にあるスキーマの URL の版を、docv の版にする","- `docv_version` が docv の版より新しければ、docv を更新する"]},{"path":"docv/slot/service/service/slot.md","href":"サービス/サービス仕様/Slot.html","tags":[],"lines":["---","order: 2","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# Slot","","どのプロジェクトにも要るドキュメントを、docv が決めたミッションと形で書くファイルの規格。Slot を置く理由は [概要](desc.md) のページに、HTML の全体は [ビジュアライズ](html.md) のページに書く。","","---","","## 1. 置き場所と書き方","","- Slot ファイルは、`docv.yaml` の `dir.document_root`（既定は `docv`）の下の `slot/` に、`\u003cまとまり>/\u003cSlot>.\u003c拡張子>` の名前で置く。まとまりのディレクトリは `service`（サービス）、`system`（システム）、`guide`（開発者向けガイド）、`operation`（運用）。Free ファイルは `free/` に置く（[設定ファイル](config.md) のページの「配置」の章）","- 拡張子は Slot ごとに決まる。YAML の Slot は決まった項目で書き、md の Slot は中身の形を決めず、そのまま HTML に出す","- サービス仕様、システム仕様、開発コマンド、アーキテクチャ、設計・実装、テスト方針、インフラと環境だけは、ページに分けて `\u003cまとまり>/\u003cSlot>/` に置ける（「ページ分け」の章）","- ADR と PDR は、`slot/` ではなく、`document_root` の下の `adr/` と `pdr/` に置く（[ADR](adr.md) と [PDR](pdr.md) のページ）","- `slot/` の中でも、除外に当たるファイル（[設定ファイル](config.md) のページの「docv が読むファイル」の章）と、名前がドットで始まるファイルとディレクトリ（`.DS_Store` など）は読まない。画像（[Free](free.md) のページの「画像」の章）は、Slot の隣に `{Slot の名前}_{画像の名前}.{拡張子}` の名前で置ける。ページに分けた Slot のページの隣には、`{ページの名前}_{画像の名前}.{拡張子}` で置ける。それ以外で Slot の名前でないファイルは、check が slot-unknown の error にする","- Slot を置くかどうかは任意。プロジェクトに当てはまらない Slot は作らない（例: 利用者の手元に入れるものがなければ、インストールの Slot はいらない）","- Slot のミッションに当たる詳しいことも、Slot の中に書く。Free ファイルへのリンクで済ませない","- ファイルの中のパスは、すべてルートからの相対パスで書く。md の Slot の中のリンクは、ほかの Markdown と同じく、ファイルの場所からの相対パスで書く","- YAML の文字列の項目には Markdown を書ける","- `docv slot gen \u003cslot>` で、Slot ファイルを決まったパスに作れる。YAML の Slot には項目のサンプルを書き、md の Slot には YAML front matter の `mission` だけを書く（`docv slot list` で一覧とミッションを出す）","","---","","## 2. 一覧","","HTML には、この表の順に、まとまりごとに並べる。","","| ファイル                      | Slot           | まとまり         | ミッション                                                                                     |","| ----------------------------- | -------------- | ---------------- | ---------------------------------------------------------------------------------------------- |","| `service/overview.md`         | サービス概要   | サービス         | 利用者に向けた、これが何で、誰の何を解決し、何ができるかの説明                                 |","| `service/service.md`          | サービス仕様   | サービス         | 外から見た機能と、それぞれの振る舞いと決まり                                                   |","| `service/manual.md`           | 利用マニュアル | サービス         | 利用者の使い方（CLI のコマンド、GUI の操作など）                                               |","| `service/install.yaml`        | インストール   | サービス         | 利用者がこれを入れる手順                                                                       |","| `service/words.yaml`          | 用語集         | サービス         | このプロジェクトの言葉の意味                                                                   |","| `system/system-overview.md`   | システム概要   | システム         | 開発者に向けた、システムを作る部品と、そのつながりの全体像                                     |","| `system/system.md`            | システム仕様   | システム         | 部品ごとの振る舞いと、部品の間の流れと、部品をまたいで守る決まり                               |","| `system/stack.yaml`           | 技術スタック   | システム         | 作るのに使っている言語、ライブラリ、サービス                                                   |","| `system/api.md`               | API 仕様書     | システム         | API の一覧と、それぞれが受け取るものと返すもの                                                 |","| `system/db.md`                | DB 仕様書      | システム         | 保存しているデータと、その保存先と形                                                           |","| `guide/setup.yaml`            | 環境構築       | 開発者向けガイド | 開発を始めるのに用意するものと、実行するコマンド                                               |","| `guide/develop.yaml`          | 開発コマンド   | 開発者向けガイド | テストやビルドなど、開発者が実行するコマンド                                                   |","| `guide/architecture.md`       | アーキテクチャ | 開発者向けガイド | システム全体で採る方式と決まり（部品の分け方、通信の方式、非同期処理の実現方法など）           |","| `guide/design.md`             | 設計・実装     | 開発者向けガイド | コードを書くときに従う決まり（フレームワークの使い方、ディレクトリやコーディングの決まりなど） |","| `guide/testing.md`            | テスト方針     | 開発者向けガイド | テストの範囲と方法（自動テストの範囲、E2E テスト、手動テストについてなど）                     |","| `guide/env.yaml`              | 環境変数       | 開発者向けガイド | システムを動かすのに要る環境変数と、それぞれを設定している場所                                 |","| `guide/doc-guide.md`          | Doc ガイド     | 開発者向けガイド | このプロジェクトのドキュメントの置き場所と書き方                                               |","| `operation/infrastructure.md` | インフラと環境 | 運用             | 環境（本番、ステージング、開発など）の一覧と、それぞれの用途                                   |","| `operation/deploy.md`         | デプロイ       | 運用             | 作ったものを環境に反映する手順                                                                 |","| `operation/release.md`        | リリース       | 運用             | 版の決め方と、利用者への届け方                                                                 |","| `operation/cost.yaml`         | 費用           | 運用             | かかっている費用と、費用を理由にやっていないこと                                               |","","- Slot の名前に近いパスで置くと、check が slot-unknown で正しいパスを示す。たとえば、まとまりのディレクトリが違う `words.yaml`、番号を付けた `service/03-words.yaml`、拡張子が違う `service/service.yaml`","- 利用マニュアル（manual）と開発コマンド（develop）を分けるのは、使う人と目的が違うため。利用マニュアルは、リポジトリが CLI や GUI のときの、利用者向けの使い方","- サービス概要には、これは何で、何に使えるかを、利用者に向けて書く。サービス仕様には、外から見た機能と、それぞれがどう振る舞うかを詳しく書く。実装をそっくり差し替えても変わらないことが、サービス仕様になる","- システム概要には、どんな部品からなり、どうつながっているかを、開発者に向けて図で書く。システム仕様には、部品ごとの振る舞いと、部品をまたいで守る決まりを詳しく書く。部品を作る言語やライブラリは、技術スタックに書く","- アーキテクチャには、システム全体で採る方式を書く。どんな部品がありどうつながっているかはシステム概要に、使っている製品やライブラリの名前は技術スタックに書く。たとえば、重い処理をキューに積んでワーカーで非同期に行う方式はアーキテクチャに、そのキューとワーカーの部品はシステム概要に、キューの製品の名前は技術スタックに書く","- 設計・実装には、コードを書くときに従う決まりを書く。今のコードの作りは書かない。コードを読んでも、守るべき決まりか、たまたまそうなっているかは分からないため。ディレクトリの決まりも、ここに書く","- テスト方針には、何をどのテストで確かめるかを書く。テストを実行するコマンドは、開発コマンドに書く","- インフラと環境には、ある環境だけでなく、ない環境も書く（例: ステージングと本番があり、開発サーバーはない）","- デプロイは環境に反映すること、リリースは利用者に届けることで、どちらかしかないプロジェクトもある（例: サーバーを持たない CLI はリリースだけ）。どちらも、環境ごとの違い、承認、切り戻しなど、手順の形に収まらないことを書くので md にする","","---","","## 3. YAML の Slot の項目","","- 項目の形と意味は、Slot ごとのスキーマ（JSON Schema）で決める。`docv slot schema \u003cslot>` で出す。元のファイルは `assets/schema/\u003cID>.schema.json` で、`docv/free/schema/` に写しを置く","- `docv slot gen` は、YAML の Slot の 1 行目に、yaml-language-server の書式でスキーマの URL を書く。URL は、実行した CLI の版のタグの `assets/schema/` を指す。エディタで項目の補完と検証が効く。URL の版は `docv.yaml` の `docv_version` と揃える（[設定ファイル](config.md) の「docv の版」の章）","- 名前が `_markdown` で終わる項目は Markdown。値は、1 行でも必ず `|` のブロックで書く。`|-`、`|+`、字下げの数を付けた `|2` などは使わない。それ以外の文字列の項目は、Markdown として扱わず、1 行で書く","- Markdown の項目の中のリンクは、ルートからの相対パスで書く","- どの YAML の Slot にも、`appendix_markdown` を書ける。項目に収まらない補足を書く","","```yaml","groups:","  - name: ファイルの種類","    items:","      - en: Slot","        desc_markdown: |","          どのプロジェクトにも要るドキュメントを書くファイル。`docv/slot/` に置く","```","","---","","## 4. md の Slot","","- 中身の形は決めない","- YAML front matter には `mission` だけを書き、`docv slot list` のミッションと同じ文にする。ミッションは docv が決めるもので、プロジェクトでは変えない。ないか違えば、check が slot-mission の error にする。docv の版を上げてミッションが変わったときも、check で気づいて直す。ファイルを開けば、何を書く Slot かが分かるようにするため","- `mission` がないか違っても、HTML には本文を出す","- `docv slot gen` は、YAML front matter の `mission` だけを書いたファイルを作り、中身の形は自由だと表示する。Doc ガイド（`guide/doc-guide.md`）だけは、docv が勧めるガイドラインを書いた雛形を作る。雛形にも `mission` を書いてある。作った雛形はプロジェクトのもので、自由に直してよい。docv の版を上げても書き換えない","","---","","## 5. ページ分け","","サービス仕様、システム仕様、開発コマンド、アーキテクチャ、設計・実装、テスト方針、インフラと環境は、ページに分けられる。1 つのページが長くならないようにするため。読む人ごとに仕様が分かれるサービス（利用者向けの機能と管理者向けの機能など）、部品の多いシステム（画面、サーバ、バッチなど）、部品ごとに開発のコマンドや決まりや環境が違うプロジェクトで分ける。","","| Slot           | 1 つのファイル                | ページのディレクトリ        |","| -------------- | ----------------------------- | --------------------------- |","| サービス仕様   | `service/service.md`          | `service/service/`          |","| システム仕様   | `system/system.md`            | `system/system/`            |","| 開発コマンド   | `guide/develop.yaml`          | `guide/develop/`            |","| アーキテクチャ | `guide/architecture.md`       | `guide/architecture/`       |","| 設計・実装     | `guide/design.md`             | `guide/design/`             |","| テスト方針     | `guide/testing.md`            | `guide/testing/`            |","| インフラと環境 | `operation/infrastructure.md` | `operation/infrastructure/` |","","- 分けるときは、1 つのファイルの代わりに、ページのディレクトリの直下に 1 ページ 1 つのファイルで置く。拡張子は、分けないときと同じ。ファイル名は自由。両方に置くと check の error になる","- どのページにも、並びの `order`（整数）とページの名前を書く。ページは `order` の順に並べる。`order` もページの名前も、同じ Slot のページどうしで重ねない。ほかの Slot のページとは比べない","- 分けないときは、今までどおり 1 つのファイルに書く","- `docv slot gen` は、1 つのファイルを作り、分けるときの置き場所も表示する。ページがあるときは、1 つのファイルを作らずに error で終わる。ページは手で置く","","md のページ（開発コマンドのほかの Slot のページ）は、YAML front matter に `order` と `mission` を書く。`mission` は、分けないときと同じく、その Slot のミッションと同じ文にする。本文の h1 が、ページの名前になる。","","```markdown","---","order: 2","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# 管理者向け機能","```","","YAML のページ（開発コマンド）は、分けないときの項目に、`order` と、ページの名前の `title` を足す。スキーマは分けないときと同じで、`order` と `title` は、どちらも書くか、どちらも書かない。分けないときのファイルには、どちらも書かない。","","```yaml","order: 1","title: Web 画面","steps:","  - id: test","    name: テストを実行する","    items:","      body_markdown: |","        npm test","```","","---","","## 6. check","","| ID                  | 内容                                                                                                                       |","| ------------------- | -------------------------------------------------------------------------------------------------------------------------- |","| slot-unknown        | `slot/` に、Slot の名前でも画像でもないファイルがある                                                                      |","| slot-invalid        | YAML の Slot の形に合わない。知らない項目、手順の `id` や `os` の重なり、`os` のない `item`、`ja` も `en` もない用語も含む |","|                     | 分けたページの形に合わない。`order` やページの名前（h1 か `title`）がない、知らない項目、同じ Slot のページどうしの重なり  |","|                     | md の Slot の YAML front matter に、知らない項目がある。閉じる `---` がない                                                |","|                     | 同じ Slot が、1 つのファイル（`service/service.md` など）と、ページのディレクトリ（`service/service/` など）の両方にある   |","|                     | 分けないときの開発コマンド（`guide/develop.yaml`）に、`order` か `title` がある                                            |","| slot-mission        | md の Slot の YAML front matter に `mission` がないか、`docv slot list` のミッションと違う                                 |","| slot-path-missing   | パスの先がない                                                                                                             |","| slot-markdown-style | `_markdown` で終わる項目を、`\\|` のブロックで書いていない                                                                  |","| slot-text-multiline | `_markdown` で終わらない文字列の項目が、複数行になっている                                                                 |","","- md の Slot には、YAML front matter のほかは、Free ファイルと同じ検査（[Free](free.md) のページの「check のルール」の章）をかける","- `slot/` の中の画像には、Free ファイルの画像と同じ検査（image-owner）をかける","- YAML の Slot の Markdown の項目には、リンク、書式の規則、整形、textlint の検査をかける。見出しの検査はかけない。項目の中に h1 はなく、HTML では見出しの段を付け直すため。指摘の行番号は、YAML の行番号で出す"]},{"path":"docv/slot/service/service/free.md","href":"サービス/サービス仕様/Free.html","tags":[],"lines":["---","order: 3","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# Free","","docv が管理する Free ファイル（`docv.yaml` の `dir.document_root` の下の `free/` にある Markdown）のルールと、ドキュメントで使う画像のルール。何をどう書くかはガイドライン（Slot の Doc ガイド、`guide/doc-guide.md`）で、プロジェクトが決める。Slot のルールは [Slot](slot.md)、ADR と PDR のルールは [ADR](adr.md) と [PDR](pdr.md)、`docv.yaml` は [設定ファイル](config.md) のページに書く。","","---","","## 1. YAML front matter","","| key       | 必須 | 中身                                                 |","| --------- | ---- | ---------------------------------------------------- |","| `mission` | 必須 | ミッション。このファイルを読むと何が分かるか（1 文） |","| `tags`    | 任意 | タグの配列（「タグ」の章）                           |","","```yaml","---","mission: 注文を確定するタイミングと、失敗したときの扱い","tags: [仕様, 注文]","---","```","","- `mission` は 1 行で書く","- ファイルごとの設定は、すべて YAML front matter に書き、`docv.yaml` には書かない。ファイルを動かしても設定がずれず、AI Agent はファイルを読むだけで、そのファイルの扱いが分かる","- docv が知らない key は、そのまま残し、check もしない。作成者の記録（`created` / `updated` など）のように、プロジェクトが決めた key を書いてよい","- HTML は、`mission` をファイルの説明として表示する","","---","","## 2. タグ","","- Free ファイルの分類は、YAML front matter の `tags` に書くタグで行う。1 つのファイルにいくつでも付けられる","- docv はタグの意味を決めない。どんなタグを使うかは、プロジェクトが決める","- 使うタグは、すべて `docv.yaml` の `tags` に書く。`tags` にないタグを付けると、check が error にする","- `tags` には、タグごとに名前（`name`）と色（`color`）を書く。色は HTML でタグを見分けるためのもので、blue、green、yellow、red、purple、orange、teal、pink から選ぶ","","```yaml","tags:","  - name: 仕様","    color: blue","  - name: 計画","    color: green","```","","---","","## 3. check のルール","","`docv check` が Free ファイルで確かめるルール。`docv.yaml` で使うと決めたときだけ確かめるもの（太字などの書式の規則、整形、textlint）は [設定ファイル](config.md) のページに書く。","","### YAML front matter","","| ID                  | 内容                                                       |","| ------------------- | ---------------------------------------------------------- |","| frontmatter-invalid | YAML front matter が読めない。`mission`、`tags` の型が違う |","| mission-missing     | `mission` がない                                           |","| mission-multiline   | `mission` が複数行                                         |","| tag-unknown         | `docv.yaml` の `tags` にないタグがある                     |","","### 構造とリンク","","| ID             | 内容                                                                     |","| -------------- | ------------------------------------------------------------------------ |","| title-count    | h1 が 1 つでない                                                         |","| heading-number | 章番号で始まる h2 があるのに、h2 が `1. ` から順に章番号で始まっていない |","| link-broken    | ルートの中を指す相対リンクの先にファイルがない                           |","| link-anchor    | リンクのアンカー（`#` 以降）が指す見出しが、リンク先の Markdown にない   |","","- 章番号は、h2 のどれかが `1. ` のような章番号で始まっているファイルでだけ確かめる。章番号を使わないファイルでは確かめない","- アンカーは、HTML の見出しと同じく GitHub と同じ形で作る。同じ見出しが続けば `-1`、`-2` を付ける。`#` だけのページ内リンクは、そのファイルの見出しと比べる。Markdown でないファイルへのリンクのアンカーは確かめない","","---","","## 4. 画像","","Free ファイル、Slot ファイル、ADR、PDR で使う画像の置き場所と名前。","","- 画像は、使うファイルと同じディレクトリに置く。共通の画像のディレクトリは作らない","- 名前は `{使うファイルの名前}_{画像の名前}.{拡張子}` にする。使うファイルの名前は、拡張子を除いた名前。たとえば、`order.md` で使う流れの図は `order_flow.svg`。名前の順に並べると、画像が使うファイルの隣に来る","- 複数のページで使う画像は、主になるページの隣に置き、ほかのページからはそのパスを参照する","- ADR と PDR は、それぞれのディレクトリ（`adr/`、`pdr/`）の中の画像だけを参照できる（[ADR](adr.md) のページの「check」の章）。それ単体で完結することに価値があり、最新のドキュメントの内容に過去の決定が左右されないようにするため","- 画像として扱うのは、拡張子が png、jpg、jpeg、gif、svg、webp のファイル","","| ID          | 内容                                                                                                                                                                           |","| ----------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |","| image-owner | `free/`、`slot/`、`adr/`、`pdr/` の下の画像に、持ち主がない。持ち主は、同じディレクトリにある、名前（拡張子を除く）が画像の名前の `_` より前と同じ Markdown か YAML のファイル |","","- 画像の名前に `_` がいくつかあるときは、どの `_` で区切っても、持ち主が見つかればよい。使うファイルの名前に `_` が入っていても、名前の付け方を変えずに済むため"]},{"path":"docv/slot/service/service/adr.md","href":"サービス/サービス仕様/ADR.html","tags":[],"lines":["---","order: 4","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# ADR","","ADR（Architecture Decision Record）は、技術の決定 1 つを、背景、結果、選ばなかった案と一緒に残す記録。Free ファイルと Slot には今の姿だけを書き、どう決めてきたかは ADR と PDR に残す。プロダクトやサービスの決定は [PDR](pdr.md) に残す。docv が形を決めるファイルの 1 つ。","","---","","## 1. 置き場所と書き方","","- `dir.document_root`（既定は `docv`）の下の `adr/` に、決定 1 つを 1 つの Markdown で置く。ファイル名は `\u003cid>.md` で、`.md` を除いた名前が決定を指す id になる","- 画像は、`adr/` の中に `{id}_{画像の名前}.{拡張子}` の名前で置き、`adr/` の中の画像だけを参照する。外の画像を使いたいときは、写しを置く。決定がそれだけで完結し、ほかのドキュメントを直しても、過去の決定が変わらないようにするため","- システムが使う項目（`group`、`date`、`supersedes`）は YAML front matter に書く。決定の中身は本文に書き、本文の h1 を題にする","- 状態（採用、却下など）は持たない。ADR に残すのは決めたことだけで、打ち消されたかどうかは、新しい決定の `supersedes` から指されているかでわかる。打ち消されていない決定が、今の決定","- 本文は、決まった章で書く（「本文の章」の章）","- 決めた後は書き換えない。決定を変えるときは、新しい ADR を書き、その `supersedes` から過去の決定の id を指す（未来から過去を参照する）","- 過去の決定から新しい決定へのつながりは、docv が `supersedes` を逆にたどって組み立てる。過去の ADR には書き足さない","- 用語を変えても、過去の ADR は書き換えない。過去の ADR が今の用語で読めなくなることは許す。用語集の Slot には今の用語だけを書き、昔の用語との対応は残さない","","---","","## 2. YAML front matter の項目","","| 項目         | 必須 | 中身                                                                                    |","| ------------ | ---- | --------------------------------------------------------------------------------------- |","| `group`      | 任意 | まとまりの名前。同じ `group` の決定を、HTML で 1 つの図にまとめる。省略すると「その他」 |","| `date`       | 必須 | 決めた日（YYYY-MM-DD）。決定を並べる順と、`supersedes` が過去を指しているかに使う       |","| `supersedes` | 任意 | 打ち消す過去の決定の id の配列                                                          |","","---","","## 3. 本文の章","","本文は、h1 の題の下に、次の章をこの順に h2 で書く。任意の章は、書くことがなければ置かない。","","| 章             | 必須 | 書くこと                                                                               |","| -------------- | ---- | -------------------------------------------------------------------------------------- |","| 背景           | 必須 | 決める必要が生じた課題と、そのときの制約や前提                                         |","| 決めたこと     | 必須 | 決めたことと、その案を選んだ理由。決めたことが当てはまる範囲                           |","| 決めないこと   | 任意 | この ADR では決めないことと、それをどこで決めるか                                      |","| 結果           | 必須 | 決めたことで変わること。引き受けること（できなくなること、後で考えること）も書く       |","| 選ばなかった案 | 必須 | 比べた案と、それぞれを選ばなかった理由                                                 |","| 参考           | 任意 | 根拠にしたファイルや資料へのリンク。ADR だけで読めるように、本文の根拠をここにまとめる |","","- 章の形は check で確かめない。章を揃えるのは、ADR を読む人と AI Agent が、どの ADR も同じ順で読めるようにするため","","```markdown","---","group: 言語","date: 2026-03-01","supersedes: [go]","---","","# Rust で書く","","## 背景","","配布するバイナリを 1 つにしたい。利用者の手元に、言語の実行環境を求めたくない。","","## 決めたこと","","CLI は Rust で書き、単一のバイナリにして配る。CLI の外で動く道具（textlint など）は、この決定の範囲に含めない。","","## 決めないこと","","バイナリをどこで配るかは決めない。リリースの Slot で決める。","","## 結果","","利用者は、言語の実行環境なしで使える。開発者は、Rust の環境を用意する。","","## 選ばなかった案","","| 案             | 選ばなかった理由             |","| -------------- | ---------------------------- |","| Node.js で書く | 利用者の手元に実行環境が要る |","| Zig で書く     | 情報が少ない                 |","","## 参考","","- [技術スタック](../system/stack.yaml)","```","","---","","## 4. check","","| ID              | 内容                                                                                         |","| --------------- | -------------------------------------------------------------------------------------------- |","| adr-invalid     | YAML front matter が ADR の形に合わない（知らない項目、`date` の形も含む）。本文に h1 がない |","| adr-unknown-ref | `supersedes` の先の ADR がない。または、その決定より後の決定を指している                     |","| adr-image       | 本文の画像が、`adr/` の外のファイルか URL を指している                                       |","","- 本文には、YAML front matter のほかは、Free ファイルと同じ検査（[Free](free.md) のページの「check のルール」の章）をかける","- `adr/` の中の画像には、Free ファイルの画像と同じ検査（[Free](free.md) のページの「画像」の章の image-owner）をかける","","---","","## 5. AI Agent","","- AI Agent が ADR を読むのは、決めた理由を聞かれたときだけ。今の姿は Free ファイルと Slot を読む"]},{"path":"docv/slot/service/service/pdr.md","href":"サービス/サービス仕様/PDR.html","tags":[],"lines":["---","order: 5","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# PDR","","PDR（Product Decision Record）は、プロダクトやサービスの仕様の変更 1 つを、その理由や見直す条件と一緒に残す記録。料金、プラン、提供する機能の範囲、対象とする利用者などを足す・変える・やめるときに書く。なぜ今の仕様になったのかを将来も分かるようにするための履歴なので、案を比べて選んだ決定に限らない。技術の決定は [ADR](adr.md) に残す。","","置き場所、YAML front matter、決めた後に書き換えないこと、HTML の作りは ADR と同じ。このページには、ADR と違うところを書く。","","---","","## 1. 置き場所と書き方","","- `dir.document_root`（既定は `docv`）の下の `pdr/` に、変更 1 つを 1 つの Markdown で置く","- 画像は、`pdr/` の中に `{id}_{画像の名前}.{拡張子}` の名前で置き、`pdr/` の中の画像だけを参照する。ADR の画像も参照しない","- ファイル名と id、YAML front matter の項目（`group`、`date`、`supersedes`）、状態を持たないこと、決めた後に書き換えないことは、[ADR](adr.md) と同じ","- `supersedes` は、PDR だけを指す。ADR と PDR は、同じ id でも別の決定。PDR から ADR に触れるときは、本文のリンクで示す","","---","","## 2. 本文の章","","本文は、h1 の題の下に、次の章をこの順に h2 で書く。任意の章は、書くことがなければ置かない。ADR の章に見直す条件を足し、選ばなかった案を任意にした形。","","| 章             | 必須 | 書くこと                                                                                       |","| -------------- | ---- | ---------------------------------------------------------------------------------------------- |","| 背景           | 必須 | 決める必要が生じた課題と、そのときの利用者、市場、事業の状況                                   |","| 決めたこと     | 必須 | 決めたことと、その案を選んだ理由。決めたことが当てはまる範囲（対象の利用者、プラン、機能など） |","| 決めないこと   | 任意 | この PDR では決めないことと、それをどこで決めるか                                              |","| 結果           | 必須 | 利用者と事業に起きると見込むこと。引き受けること（できなくなること、後で考えること）も書く     |","| 見直す条件     | 必須 | どんな状況になったら、この決定を見直すか。数や時期など、起きたかどうかを確かめられる形で書く   |","| 選ばなかった案 | 任意 | 比べた案があれば、それぞれを選ばなかった理由                                                   |","| 参考           | 任意 | 根拠にしたファイルや資料へのリンク。PDR だけで読めるように、本文の根拠をここにまとめる         |","","- 選ばなかった案を任意にするのは、PDR が仕様の変更の履歴で、案を比べずに決める変更（機能をやめるなど）も残すため","- 見直す条件は、必ず書く。プロダクトやサービスの決定は、利用者や市場が変わると正しさが変わる。決めたときに見込んだことが外れたと、後から気づけるようにするため","- 見直す条件に当たっても、PDR は書き換えない。見直して決定を変えるなら、新しい PDR を書き、その `supersedes` から指す","- 章の形は check で確かめない","","```markdown","---","group: 料金","date: 2026-04-01","supersedes: [free-only]","---","","# 注文の多い店舗に有料のプランを求める","","## 背景","","無料のプランだけで提供してきた。月の注文が 1 万件を超える店舗が増え、サーバの費用が売上を上回った。","","## 決めたこと","","月の注文が 1,000 件を超える店舗には、有料のプランを求める。1,000 件までは、今までどおり無料にする。","","## 決めないこと","","有料のプランの金額は決めない。サービス仕様の料金の章で決める。","","## 結果","","注文の多い店舗の一部は、解約すると見込む。注文の少ない店舗は、今までどおり無料で使える。","","## 見直す条件","","- 有料のプランに移った店舗が、対象の店舗の半分を下回ったとき","- 2027 年 3 月の時点で、サーバの費用が売上を上回ったままのとき","","## 選ばなかった案","","| 案                       | 選ばなかった理由                 |","| ------------------------ | -------------------------------- |","| すべての店舗を有料にする | 小さな店舗が使い始められなくなる |","| 店舗の画面に広告を出す   | 注文を受ける画面が狭くなる       |","","## 参考","","- [サービス仕様](../service/service.md)","```","","---","","## 3. check","","| ID              | 内容                                                                                         |","| --------------- | -------------------------------------------------------------------------------------------- |","| pdr-invalid     | YAML front matter が PDR の形に合わない（知らない項目、`date` の形も含む）。本文に h1 がない |","| pdr-unknown-ref | `supersedes` の先の PDR がない。または、その決定より後の決定を指している                     |","| pdr-image       | 本文の画像が、`pdr/` の外のファイルか URL を指している                                       |","","- 本文には、YAML front matter のほかは、Free ファイルと同じ検査（[Free](free.md) のページの「check のルール」の章）をかける","- `pdr/` の中の画像には、Free ファイルの画像と同じ検査（[Free](free.md) のページの「画像」の章の image-owner）をかける","","---","","## 4. AI Agent","","- AI Agent が PDR を読むのは、決めた理由を聞かれたときと、見直す条件に当たるかを確かめるときだけ。今の姿は Free ファイルと Slot を読む"]},{"path":"docv/slot/service/service/config.md","href":"サービス/サービス仕様/設定ファイル.html","tags":[],"lines":["---","order: 6","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# 設定ファイル","","リポジトリのルートに置く設定ファイル（`docv.yaml`）。型は [`assets/schema/docv.schema.json`](../../../../assets/schema/docv.schema.json) が正本。最初の章で項目を一覧にし、続く章で、一覧に書ききれない解釈の決まりと、`docv.yaml` で使うと決めたときだけ動く道具（書式の規則、textlint、整形）を書く。","","---","","## 1. 例","","```yaml","# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-hoge/docv/v2.0.0/assets/schema/docv.schema.json","docv_version: 2.0.0","title: shop-app","","dir:","  document_root: docv","  output: output/docv","docv_exclude:","  - docv/free/tmp/**","generate:","  image: true","","tags:","  - name: 仕様","    color: blue","  - name: 手順","    color: green","  - name: 規約","    color: yellow","","lint:","  bold: deny","  textlint: enable","format:","  enabled: true","```","","| 項目                | 必須 | 既定          | 意味                                                                                                       |","| ------------------- | ---- | ------------- | ---------------------------------------------------------------------------------------------------------- |","| `docv_version`      |      |               | ドキュメントを合わせた docv の版。docv の版と違えば、check が error にする（「docv の版」の章）            |","| `title`             |      | ルートの名前  | HTML に出すプロジェクト名                                                                                  |","| `dir.document_root` |      | `docv`        | ドキュメントを置くディレクトリ。この下の配置は docv が決める（「配置」の章）                               |","| `dir.output`        |      | `output/docv` | docv build の出力先。この下に `html/` と `image/` を作る（「配置」の章）                                   |","| `docv_exclude`      |      |               | docv が読まないファイルの glob の配列（「docv が読むファイル」の章）                                       |","| `generate.image`    |      | false         | docv build で、YAML の Slot のページを JPG にするか。JPG を作るには Chrome が要る                          |","| `tags`              |      |               | 使うタグの一覧。タグごとに `name` と、HTML の色の `color` を書く（[Free](free.md) のページの「タグ」の章） |","| `lint.bold`         |      | allow         | 太字を使ってよいか（「書式の規則」の章）                                                                   |","| `lint.italic`       |      | allow         | 斜体を使ってよいか（「書式の規則」の章）                                                                   |","| `lint.dollar`       |      | allow         | コードの外の 1 行に `$` を 2 つ以上書いてよいか（「書式の規則」の章）                                      |","| `lint.textlint`     |      | disable       | textlint で文章を校正するか（「textlint」の章）                                                            |","| `format.enabled`    |      | false         | check で、整形が要るファイルを error にするか（「整形との連動」の章）                                      |","","---","","## 2. 書くことと書かないこと","","- `docv.yaml` には、ツールの設定（`lint`、整形、出力）と、プロジェクト全体で共有する語彙（ドキュメントの置き場所、docv が読まないファイル、タグの一覧）だけを書く","- ファイルごとの設定（ミッション、タグ）は、そのファイルの YAML front matter に書く（[Free](free.md) のページの「YAML front matter」の章）","","---","","## 3. 配置","","`dir.document_root` と `dir.output` の下の配置は docv が決め、設定では変えない。AI Agent が、設定を読まなくても、どこに何を置くかが分かるようにするため。","","```","README.md            # 管理外。HTML では README のページにする。docv/README.md へリンクする","docv/                # dir.document_root","  README.md          # docv build が作るインデックス","  free/              # Free ファイル","    order.md         # 分類はディレクトリではなくタグで行う","    order_flow.svg   # order.md で使う画像","    tmp/             # メモを置く。docv_exclude に入れる","  slot/              # Slot ファイル","    service/         # サービス。ほかに system/、guide/、operation/","      service.md","  adr/               # ADR","  pdr/               # PDR","output/docv/         # dir.output","  html/              # HTML","  image/             # JPG。generate.image が true のときだけ作る","```","","- `document_root` の直下には、`README.md`、`free/`、`slot/`、`adr/`、`pdr/` だけを置ける。ほかのファイルとディレクトリは、check が root-unknown の error にする。名前がドットで始まるもの、`.gitignore` に書かれたもの、`docv_exclude` に当てはまるものは除く","- `free/` と `slot/` を分けるのは、プロジェクトがミッションと形を決める Free ファイルと、docv が決める Slot ファイルを、置き場所で見分けられるようにするため","- 画像は、使うファイルと同じディレクトリに、`{使うファイルの名前}_{画像の名前}.{拡張子}` の名前で置く（[Free](free.md) のページの「画像」の章）","- `dir.document_root` と `dir.output` は、ルートからの相対パスで書く。どちらもルートは書けない","- `dir.output` は、`dir.document_root` と同じにも、その中にもできない。AI Agent が `document_root` を読むと、HTML に写した同じ内容がほぼ倍入るため","- `dir.document_root` は、`dir.output` の中にできない。build は出力先を作り直すので、ドキュメントを消してしまうため","- 違反すると、`docv.yaml` が正しくないとして、check、fix、build などの `docv.yaml` を読むコマンドが、何もせずに終了コード 2 で終わる。エラーには、置けない理由も出す","- docv build の出力を git で管理するかは、プロジェクトの `.gitignore` で決める。docv は `.gitignore` を書かない","","---","","## 4. docv が読むファイル","","- `free/` の下の `.md` のファイルが、管理対象（Free ファイル）になる。check、fix、HTML の対象になる","- `document_root` と `dir.output` の外にある `.md` のファイルは、管理外になる。中身は見ない","- `docv_exclude` に当てはまるファイルは、docv が読まない。check（root-unknown や slot-unknown などの置き場所の検査も含む）、fix、整形、textlint、HTML、検索、インデックスのどれの対象にもならない。メモや下書きの置き場所に使う","- `.gitignore` に書かれたファイルと、`dir.output` の中は、`docv_exclude` に書かなくても常に除く","- パスと glob は、すべてルートからの相対パスで書く。`*` は `/` をまたがず、`**` はまたぐ","","---","","## 5. 書式の規則（`lint.bold`、`lint.italic`、`lint.dollar`）","","太字などを使ってよいかを、プロジェクトごとに決める。`deny` にした書き方を、管理対象のファイルで error にする。","","| キー     | ルール ID    | `deny` のとき確かめること                                                                   |","| -------- | ------------ | ------------------------------------------------------------------------------------------- |","| `bold`   | style-bold   | 太字（`**`、`__`）を使っていない                                                            |","| `italic` | style-italic | 斜体（`*`、`_`）を使っていない                                                              |","| `dollar` | style-dollar | コードの外の 1 行に `$` が 2 つ以上ない。GitHub は `$` で挟んだ部分を数式として表示するため |","","- 既定はどれも `allow`（確かめない）","- コードブロックとインラインコードの中は見ない","- 章番号は、設定によらず常に確かめる（[Free](free.md) のページの「check のルール」の章）","- 管理対象のファイルのほか、md の Slot、ADR、PDR、YAML の Slot の Markdown の項目にもかける","","---","","## 6. textlint（`lint.textlint`）","","文章の校正に textlint を使う仕組み。AI Agent が書く文章のぶれをなくすのが目的なので、使うルールとその値は docv が決める。利用者は、使うかどうか（`enable`、`disable`）だけを決める。","","- 既定では使わない。`enable` にしたときだけ、`docv check` が textlint をかけ、`docv fix` が自動修正できるところを直す。かけるのは、管理対象のファイル、md の Slot、ADR、PDR と、YAML の Slot の Markdown の項目","- YAML の Slot の Markdown の項目には、`ja-no-mixed-period`（文末を「。」で終える）をかけない。項目の多くは HTML で表のセルに出す短い説明で、textlint が段落として扱わない Free ファイルの表のセルと、扱いを揃えるため","- textlint は Node.js で動くので、使うときだけ Node.js（npx）が必要になる。`enable` なのに Node.js が見つからないときは、終了コード 2 で終わる","- 結果は、ほかのルールと同じ形の error で出す。ルール ID は `textlint/\u003cプリセット>/\u003cルール>`（例: textlint/ja-technical-writing/sentence-length）。下の表では、プリセットごとにルールの名前だけを書く","- `--no-textlint` で、textlint だけを飛ばせる","- プロジェクトに `package.json` はいらない。初めて実行するときは、textlint を取ってくるのにネットワークが必要","- 使うルールとその値は、docv の版ごとに固定する。同じ docv なら同じ結果になる","- docv が textlint をどう動かすかは、[システム仕様](../../system/system.md) の「textlint とのやりとり」の章に書く","","### 検査項目","","#### ja-technical-writing","","| ルール                               | 確かめること                             |","| ------------------------------------ | ---------------------------------------- |","| `sentence-length`                    | 一文を 100 文字以内にする                |","| `max-comma`                          | 一文のカンマ（,）を 3 つまでにする       |","| `max-ten`                            | 一文の読点（、）を 3 つまでにする        |","| `no-mix-dearu-desumasu`              | 「である」と「ですます」を混ぜない       |","| `ja-no-mixed-period`                 | 文末を「。」で終える                     |","| `arabic-kanji-numbers`               | 算用数字と漢数字を使い分ける             |","| `no-doubled-conjunction`             | 同じ接続詞を続けない                     |","| `no-doubled-conjunctive-particle-ga` | 逆接の「が」を一文に 2 回使わない        |","| `no-double-negative-ja`              | 二重否定を使わない                       |","| `no-doubled-joshi`                   | 同じ助詞を続けない                       |","| `no-dropping-the-ra`                 | ら抜き言葉を使わない                     |","| `no-nfd`                             | UTF8-MAC の濁点を使わない                |","| `no-zero-width-spaces`               | ゼロ幅スペースを使わない                 |","| `ja-no-abusage`                      | よくある誤用を避ける                     |","| `ja-no-redundant-expression`         | 冗長な表現を避ける                       |","| `ja-unnatural-alphabet`              | 入力ミスで紛れたアルファベットを残さない |","| `no-unmatched-pair`                  | 括弧を対にする                           |","","#### ja-spacing","","| ルール                                 | 確かめること                                      |","| -------------------------------------- | ------------------------------------------------- |","| `ja-space-between-half-and-full-width` | 半角の文字と全角の文字の間にスペースを入れる      |","| `ja-space-around-code`                 | インラインコードの前後にスペースを入れる          |","| `ja-space-around-link`                 | リンクの前後にスペースを入れる                    |","| `ja-space-around-emphasis`             | 斜体の前後にスペースを入れる                      |","| `ja-space-around-strong`               | 太字の前後にスペースを入れる                      |","| `ja-no-space-around-parentheses`       | 全角の括弧と [ ] の内側と外側にスペースを入れない |","","### 非検査項目","","docv は、次のルールを使わない。","","#### ja-technical-writing","","| ルール                         | 確かめないこと                 |","| ------------------------------ | ------------------------------ |","| `max-kanji-continuous-len`     | 漢字が続く長さ                 |","| `no-invalid-control-character` | 制御文字                       |","| `no-exclamation-question-mark` | 感嘆符と疑問符を使うこと       |","| `no-hankaku-kana`              | 半角カナ                       |","| `ja-no-weak-phrase`            | 「かもしれない」などの弱い表現 |","| `ja-no-successive-word`        | 同じ語の連続                   |","","#### ja-spacing","","| ルール                                            | 確かめないこと                 |","| ------------------------------------------------- | ------------------------------ |","| `ja-no-space-around-slash`                        | スラッシュの前後のスペース     |","| `ja-no-space-between-full-width`                  | 全角の文字どうしの間のスペース |","| `ja-nakaguro-or-halfwidth-space-between-katakana` | カタカナ語の区切りの文字       |","| `ja-space-after-exclamation`                      | 文末の感嘆符の後のスペース     |","| `ja-space-after-question`                         | 文末の疑問符の後のスペース     |","","---","","## 7. 整形との連動（`format.enabled`）","","整形の形は docv が決め、設定では変えない。設定で決めるのは、check を整形と連動させるかだけ。整形は、管理対象のファイル、md の Slot、ADR、PDR と、YAML の Slot の Markdown の項目にかける。YAML の Slot は、Markdown の項目の中身を整形し、字下げを付け直して書き戻す。`docv.yaml` と YAML の Slot の末尾の改行は、1 つに整える。","","- 表は、列ごとに縦の線の位置を揃える。幅は、全角の文字（Unicode の East Asian Width が W か F の文字）を 2、それ以外の文字を 1 と数える","- エディタの表の揃え方は、この数え方と違うことがある。手で揃えず、`docv fix` の結果を正とする","- 整形の形は docv の版ごとに固定する。同じ docv なら、同じ入力から同じ結果になる","","| コマンド     | `format.enabled` が true のときの動き                             |","| ------------ | ----------------------------------------------------------------- |","| `docv check` | 整形が必要なファイルを、ルール ID format-diff の error として出す |","","- format-diff には、整形した結果と最初に違う行を出す","- false でも、`docv fix` を直接実行すれば整形できる","","---","","## 8. スキーマの参照","","- `docv.yaml` の先頭に、yaml-language-server の書式でスキーマの URL を書くと、エディタで補完と検証が効く","- URL には docv の版を含める。`docv init` は、実行した CLI の版の URL を書く。URL の版は `docv_version` と揃える（「docv の版」の章）","- `docv init --print` で、すべての項目を既定の値でコメントにした `docv.yaml` を出す。スキーマの写しは `docv/free/schema/config.md` に置く","","---","","## 9. docv の版（`docv_version`）","","`docv_version` には、ドキュメントを合わせた docv の版を書く。docv を更新した後で、前の版から変わったことに気づき、`docv update-guide` に渡す版が分かるようにするため。","","- `docv init` は、実行した CLI の版を書く","- check は、`docv_version` を docv の版と比べ、違えば error にする。パッチの版の違いも error にする。対応の要る変更は、パッチの版にも入ることがあるため","- `docv.yaml` と YAML の Slot の 1 行目に docv のスキーマの URL があれば、check は、URL の版を `docv_version` と比べる。エディタが、古い版のスキーマで補完と検証をしないようにするため","- ローカルのパスなど、版のタグを指す URL でないものは比べない。`docv_version` がないときも比べず、先に `docv_version` を直させる","- `docv.yaml` がスキーマに合わず読めないときも、`docv_version` が docv の版と違えば、エラーに update-guide の案内を添える。古い版の `docv.yaml` が読めず、案内まで届かないことがないようにするため","- `docv_version` とスキーマの URL は、docv では書き換えない。update-guide の対応を終えたかは、docv には分からないため","","| ID             | 内容                                                                                                                                                                                                                    |","| -------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| docv-version   | `docv_version` がないか、docv の版と違う。古ければ `docv update-guide --from \u003cdocv_version>` を、新しければ docv の更新を案内する。ないときは、`docv.yaml` の 1 行目のスキーマの URL から、使っていた版を推して案内する |","| schema-version | `docv.yaml` か YAML の Slot の 1 行目にあるスキーマの URL の版が、`docv_version` と違う                                                                                                                                 |"]},{"path":"docv/slot/service/service/cli.md","href":"サービス/サービス仕様/コマンド.html","tags":[],"lines":["---","order: 7","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# コマンド","","どのコマンドにも共通する決まり。コマンドごとの使い方は、[利用マニュアル](../manual.md)。","","---","","## 1. ルートと出力","","- docv ルートで実行するコマンド（利用マニュアルのコマンド一覧）は、カレントディレクトリをルートにし、そこにある `docv.yaml` を読む。親のディレクトリは探さない","- 結果は標準出力に、エラーは標準エラーに出す","","---","","## 2. ファイルを書くコマンド","","| コマンド | 書くもの                                                                                                                                                                                                                      |","| -------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| init     | `docv.yaml` だけ。`--print` のときは書かない                                                                                                                                                                                  |","| slot gen | 指定した Slot ファイルだけ。`--print` のときは書かない                                                                                                                                                                        |","| fix      | 管理対象のファイル、md の Slot、ADR、PDR、YAML の Slot だけ。整形と textlint の自動修正だけをする。YAML の Slot は、Markdown の項目の中身だけを直す。`docv.yaml` と YAML の Slot は、末尾の改行も整える                       |","| build    | `dir.output` の下の `html/` と `image/` の中と、`document_root` の直下の `README.md` だけ。出力先は、目印の `.docv` を残して中を消し、作り直す。`generate.image` が false のときと、`--no-image` のときは `image/` に触れない |","","- ほかのコマンドは、ファイルを書かない","- `CLAUDE.md`、リポジトリのルートの `.gitignore`、hook の設定は、どのコマンドも書かない","- build は、出力先に `.docv`（docv が作った目印）がなく、空でもないときは、何も書かずにエラーで終わる。`dir.output` を間違えて既存のディレクトリを指しても消さないため","- build は、すでにある `document_root` の `README.md` の 1 行目に docv の印のコメントがないときも、何も書かずにエラーで終わる。手で書いた同じ名前のファイルを消さないため","","---","","## 3. 終了コード","","| コード | 意味                                                                                         |","| ------ | -------------------------------------------------------------------------------------------- |","| 0      | 成功。check で指摘が 1 件もない                                                              |","| 1      | check で指摘（error）が 1 件以上ある。fix で直せないファイルがある。open に対応していない OS |","| 2      | `docv.yaml` がスキーマに合わない、引数が正しくない、など実行できない                         |","","---","","## 4. 言語","","CLI のメッセージ、ヘルプ、docv の概要、テンプレは、日本語だけで書く。切り替えはできない。英語に訳した版を持つと、同じことを 2 か所で揃え続けることになるため。"]},{"path":"docv/slot/service/service/html.md","href":"サービス/サービス仕様/ビジュアライズ.html","tags":[],"lines":["---","order: 8","mission: 外から見た機能と、それぞれの振る舞いと決まり","---","","# ビジュアライズ","","`docv build` が作る HTML、JPG、インデックスの作り。HTML は `dir.output` の下の `html/` に、JPG は `image/` に、インデックスは `document_root` の直下の `README.md` に書く。以下、出力先は `html/` を指す。","","---","","## 1. HTML の作り","","- CSS と JS は、出力先の直下の `docv.css` と `docv.js` に書き、各ページから相対パスで読む。ページの中には書かない。出力先をコミットするリポジトリで、CSS や JS を変えたときの差分を 1 ファイルに収めるため。外部の CDN は使わない。file:// で開いても、ホスティングしても見られる。画像は元のファイルを読むので、ホスティングするときは、画像を置いた `document_root` も含めて公開する","- JS は、決定のページのカーソルキーでの移動、Free のページのタグのトグル、検索のページ、元のファイルのパスのコピーにだけ使う。JS が動かなくても、すべての中身は読め、リンクから辿れる。コピーのボタンは JS が動くときだけ出し、JPG には写さない。OS ごとの手順のタブは、JS を使わず CSS で切り替える。ページに分けた Slot のタブは、ページへのリンクにする","- 出力するファイルとディレクトリの名前からは、空白を除く。Slot、ページに分けた Slot、ADR、PDR、Free ファイルのページと JPG のどれも同じ。たとえば、Doc ガイドのページは `開発者向けガイド/Docガイド.html`、題が「Go にする」の決定は `ADR/\u003cgroup>/Goにする.html` になる。CLI や git で、引用符なしでパスを扱えるようにするため。Free ファイルのページは、元のパスのディレクトリの名前からも空白を除く","- すべてのページの左に、README とトップの 7 ページへのサイドバーを、右に、そのページの h2 と h3 の目次を置く。見出しのないページでは、目次の代わりに同じ幅の空きを置き、ページを移っても本文の位置を変えない。幅の狭い画面では、左のサイドバーを本文の上に置き、項目を折り返して並べる。印刷の表示（JPG）では、どちらのサイドバーも出さない","- サイドバーには、次の 3 つの段の順に項目を並べ、段の間に横線を引く。項目の名前は、サイドバーの幅で折り返さないように短くする。README は、そのページがあるときだけ出す。ADR と PDR は、決定があるときだけ出す","  - ドキュメント: README、Slot、Free、ADR、PDR","  - docv が作るもの: Index、Config","  - Search","- 左のサイドバーの一番下に、作った docv の版を `Generated by docv \u003c版>` の形で出す。どの版の docv で作ったページかを、見て分かるようにするため","- トップの 7 ページは、サイドバーと同じページの名前を h1 にする。ただし ADR の h1 は Architecture Decision Record、PDR の h1 は Product Decision Record で、略さずに書く。サイドバーは幅へ収まるよう略すが、ページでは何の記録かを読んで分かるようにするため","- トップのページの HTML のファイルの名前は、Slot が `index.html`、Free が `プロジェクト詳細.html`、ADR が `ADR.html`、PDR が `PDR.html`。Index、Config、Search は、`インデックス.html`、`現在の設定.html`、`検索.html`","- Slot、ADR、PDR、Free ファイルのページの h1 の上に、元のファイルのルートからのパスを小さく出し、横にパスをクリップボードにコピーするボタンを置く。ページを見て編集したくなったときに、元のファイルを見つけられるように。JPG にもパスは写す","- 検索のページは、Slot ファイル、ADR、PDR、Free ファイルの中身を行ごとに並べた索引を、`docv.js` ではなく検索のページの中に書く。入力した文字列をそのまま含む行を探し、入力欄の下に、ファイルごとにパス、タグ、ヒットした行の前後 2 行を並べる。プレビューの長い行は、折り返さずに横へスクロールする。入力欄は、JS が動くときだけ出す","- フェンスのコードブロックは、フェンスに書いた言語（`yaml` など）に合わせて、build のときに色を付ける。色は HTML の中に埋め込み、JS は使わない。言語がないか、docv が知らない言語なら、色を付けずに出す","- リンクは、README、Free ファイル、Slot ファイル、ADR、PDR のページにだけ、出力先の中の相対パスで張る（ツリー、Slot ファイルや Free ファイルの本文の中のリンク）。file:// で開けば file:// のまま、ホスティングすればその中で辿れる。`docv.yaml` へのリンクは、現在の設定のページに向ける。HTML は clone したリポジトリで見るので、ほかのファイル（コード、管理外のファイルなど）はエディタで開けばよく、リンクにせず文字だけを出す","- 本文の中の http:// と https:// で始まる URL は、`[文字](URL)` の形で書いていなくてもリンクにする。URL は、空白、`\u003c`、`>`、ASCII でない文字の前で終わり、末尾の句読点と、対になっていない `)` は含めない。日本語の文と続けて書いても、後ろの文を URL に含めないため。リンク、画像、コードの中の URL は変えない","- 画像は、元のファイルを出力先から辿れる相対パスで読み、出力先にはコピーしない。出力先をコミットするリポジトリで、同じ画像を 2 か所に持たないため","- 表のセルの中のインラインコードは、折り返さない。コマンドやパスが途中で切れないようにするため","- 表が横にはみ出すときは、ページごと広げず、表の中だけを横にスクロールさせる","- 本文の中のリンクには下線を付け、色だけでリンクを示さない。キーボードで移ったときは、どこにいるかを枠で示す","","---","","## 2. README のページ","","- ルートの `README.md` を、`README.html` のページにする。`README.md` がないか、`docv_exclude` に当てはまるときは作らない","- `README.md` の h1 をページの h1 にし、本文の見出しは h2 から始まるように段を付け直す。見出しには、GitHub と同じ形のアンカーを付ける","- `README.md` は管理外のままにする。check と fix はかけず、検索の索引にも入れない","- README のページは JPG にしない。Markdown なので、GitHub でそのまま見られる","","---","","## 3. Slot のページ","","- Slot は 1 つずつ独立したページ（`\u003cまとまり>/\u003cSlot>.html`）にする。`index.html`（Slot）には、まとまりの見出しの下に、[Slot](slot.md) のページの「一覧」の章の順で、すべての Slot のカードを横に並べる。画面の幅に収まらなければ折り返す。紙面を縦に使いすぎず、画像にしてもすべてのカードが写るため。置いていない Slot のカードは、グレーにし、破線の枠と「未作成」の文字を付けて、リンクにしない。どのミッションのドキュメントがないかを、色だけに頼らずに見せるため。ページに分けられる Slot のカードには、「未作成」と同じ位置に、ページの数を `3 tabs` の形で出す。分けていないか、1 ページだけなら `1 tab`。開く前に、ページに分けられる Slot かと、ページの数が分かるようにするため。カードの幅は固定し、画面の幅に合わせない。幅は、いちばん長い Slot の名前（7 文字）が折り返さない大きさ","- Slot のカードと、Slot のページの見出しには、Slot ごとのアイコンを付ける。アイコンは、docv が Slot ごとに持つ線画の SVG で、外部の素材を使わない","- Slot のページには、Slot の名前の見出しを出す。Slot のミッションは HTML には出さない。ミッションは、AI Agent がどの Slot に書くかを決める手がかりにする","- 折りたたみは使わない。`details` も、Markdown の中の `\u003cdetails>` も、開いて出す。画像にしても、すべての中身が読めるようにするため","- 開閉するのは、OS ごとの手順のタブだけ。手順の中身が 1 つならタブにせず、複数なら書いた順にタブを並べる。JPG では、すべての OS の手順を並べて写す","- ページに分けた Slot は、ページを 1 つずつ `\u003cまとまり>/\u003cSlot>/\u003cページの名前>.html`（`サービス/サービス仕様/管理者向け機能.html` など）にする。ページの名前は、md のページは h1、YAML のページは `title`。Slot の名前の見出しの下に、すべてのページへのリンクを `order` の順にタブとして並べ、開いているページのタブに印を付ける。タブの下の中身は、分けないときの Slot と同じ形で出す。カードは、先頭のページを開く","- 用語集は、まとまりごとに `name` を h2 にし、`items` を「日本語 | 英語 | 意味」の表にする","- 見た目に凝らない。中身は、見出し、段落、箇条書き、表だけで出す","- 見出しは、ページの先頭の h1（Slot の名前）が 1 つだけで、その下に h2 を並べる。段は飛ばさない（h1 の次に h3 や h4 を置かない）","  - Markdown（md の Slot、`appendix_markdown`、`details`、手順の中身）の見出しは、置く場所に合わせて段を付け直す。md の Slot と `appendix_markdown` は h2 から、`details` と開発コマンドの中身は h3 から、インストールと環境構築の手順の中身は h4 から","- 手順（インストール、環境構築）は、「手順」の h2 の下に、項目ごとに h3 を並べる","- 開発コマンドは、順番のない項目なので、先頭に目次（項目へのページ内リンク）を置き、各項目を h2 で始める","- YAML の Slot の `appendix_markdown` は、スキーマで決めた項目のあとに続けて出す","- md の Slot の見出しには、Free ファイルのページと同じく、GitHub と同じ形のアンカーを付ける。`[docv init](#docv-init)` のようなページ内リンクが HTML でも GitHub でも飛べる","- md の Slot のページは JPG にしない。md は GitHub でそのままプレビューできるため","","---","","## 4. ADR と PDR のページ","","ADR と PDR は、同じ作りのページにする。違うのは、一覧のページ（`ADR.html` と `PDR.html`）、決定のページの置き場所（`ADR/` と `PDR/`）、題に付けるアイコンだけ。","","- `ADR.html` と `PDR.html` に、`group` ごとに h2 を置き、決定のつながりを、過去から未来へ左から右に箱と矢印で並べる。打ち消された決定の箱は、破線で薄く出す","- 箱の幅はそろえ、題は箱の中で折り返す。つながりは 1 列に並べ、並びきらないときは、その列を横にスクロールする","- つながりのない決定は、1 列に 1 つずつ並べず、まとまりのつながりの後ろに、箱を折り返して並べる。決定が増えても、ページが縦に伸びすぎないため","- 箱は決定のカードで、クリックすると決定 1 つのページ（`ADR/\u003cgroup>/\u003ctitle>.html` か `PDR/\u003cgroup>/\u003ctitle>.html`）を開く。決定 1 つを 1 ページにする","- 決定のページには、題を h1 にし、本文を出す。本文の見出しは h2 から始まるように段を付け直す。id と日付は出さない","- 打ち消された決定のページには、h1 の下に、打ち消されたことと、打ち消した新しい決定へのリンクを出す。下のカードまで読まなくても分かるように","- ADR と PDR のページは JPG にしない。どちらも Markdown なので、GitHub でそのまま見られる","- 決定のページの下に、前後の決定をカードで出す。打ち消した過去の決定は「← 過去の決定」の見出しを付けて左に、この決定を打ち消した新しい決定は「新しい決定 →」の見出しを付けて右に置く。新しい決定へのつながりは、生成するときに `supersedes` を逆にたどって組み立てる","- カーソルキーの ← と → で、前後の決定のページに移れる。前後に決定が複数あるときは、先頭のカードのページに移る。移れることは、カードの下に書く","","```","言語","+-----------+   +-------------+","| Go にする | → | Rust にする |","+-----------+   +-------------+","+--------------+  +---------------+","| React にする |  | Python も使う |","+--------------+  +---------------+","```","","---","","## 5. 現在の設定のページ","","`docv build` は、HTML の「現在の設定」のページに、`docv.yaml` のすべての項目と今の値を 1 つの表で並べる。何を設定でき、どれが効いているかを、スキーマを読まずに見るためのページ。","","- ページの名前の h1 の下に、項目の表を「docv.yaml」の h2 で置く","- 項目は、`dir.output` のように、キーを `.` でつないだ名前で出す。並びは、スキーマの順","- 書いていない項目は、既定の値で出す。値のない項目は `-` を出す","- 配列の項目は、要素を箇条書きにする","- 選ぶ項目（true か false、allow か deny など）は、候補を横に並べ、選んでいる候補に色を付ける","- 表の後に、textlint の検査項目と非検査項目（[設定ファイル](config.md) のページの「textlint」の章）を、それぞれ表で並べる","- Slot ファイルや Free ファイルから `docv.yaml` へのリンクは、HTML ではこのページに向ける","","---","","## 6. 毎回同じ出力にする決まり","","- 生成日時、実行したマシンのパス、乱数を出力に入れない","- 並び順を固定する。Slot は規格の順（ページに分けた Slot のページは `order` とパスの順）、Free ファイルはディレクトリのツリーの順、Slot の中の項目は書いた順にする。ADR と PDR は日付と id の順。検索の索引は、Slot ファイル、ADR、PDR、Free ファイルの順","- 入力（管理対象のファイル、`README.md`、Slot、ADR、PDR、`docv.yaml`、docv の版）が同じなら、HTML、`docv.css`、`docv.js`、インデックスはバイト単位で同じになる","- JPG は、同じマシン・同じ Chrome・同じフォントなら同じになる。違うマシンで同じにすることはしない。チームで JPG を共有するなら、GitHub Actions などの決まった環境で作る","","---","","## 7. JPG","","- `generate.image` が true のときだけ、build の最後に作る。`--no-image` を付けると作らない","- YAML の Slot のページを 1 枚ずつ、`dir.output` の下の `image/` に `\u003cまとまり>/\u003cSlot>.jpg` の名前で置く。ページに分けた YAML の Slot は、ページを 1 枚ずつ `\u003cまとまり>/\u003cSlot>/\u003cページの名前>.jpg` の名前で置く","- 幅は 1280 CSS ピクセル、画質は 80。印刷の表示で、ページ全体を 1 枚に写す","- Chrome は、環境変数 DOCV_CHROME、OS ごとの標準のインストール先、PATH にある chrome と chromium の順に探す。見つからなければ error で終わる","","---","","## 8. インデックス","","build は、毎回 `document_root` の直下に `README.md` を書く。GitHub でリポジトリを開いた人が、clone しなくても Slot ファイルを読めるようにするためのリンク集。名前を `README.md` にするのは、GitHub で `document_root` を開くと、一覧の下に表示されるため。ルートの README からリンクして使う。","","- Slot を、HTML の Slot のページ（`index.html`）と同じく、まとまりごとに規格の順で、リンクの箇条書きにして並べる。ページに分けた Slot は、Slot の名前の下に、ページを `order` の順に入れ子で並べる。置いていない Slot は出さない","- md の Slot は、元のファイルへリンクする。GitHub で Markdown のまま読めるため。ファイルがシンボリックリンクなら、ルートの中にある先のファイルへリンクする。GitHub は、シンボリックリンクを開いても先の中身を出さないため","- YAML の Slot は、`generate.image` が true なら JPG へリンクし、false なら出さない。分けたページも同じで、ページごとの JPG へリンクする。JPG へリンクするかは `generate.image` で決め、`--no-image` を付けても同じインデックスにする","- Free ファイル、ADR、PDR は、それぞれの章に、置いているディレクトリへのリンクだけを出す。どれも詳細やプロジェクト固有の情報で、知りたくなった人は clone すると考えるため。検索とタグでの絞り込みは Free のページで、ADR と PDR のつながりの図はそれぞれのページで見られると、`docv open` と、そのページのルートからのパスで案内する","- リンクは、`README.md` の場所からの相対パスで、`[名前](\u003cパス>)` の形で書く。パスに空白や日本語が入っても、GitHub で辿れるようにするため","- 1 行目に、docv が作ったことを示すコメントを書く。build は、このコメントで始まらない `README.md` を書き換えない（[コマンド](cli.md) のページの「ファイルを書くコマンド」の章）","- 末尾に、作った docv の版を `Generated by docv \u003c版>` の形で書く。GitHub で見ても、docv が作ったファイルであり、手で直すものではないと分かるようにするため","- インデックスが古いままかは、check で確かめない。Slot を変えたら build で作り直す","- エイリアス（シンボリックリンク）やコピーを並べたディレクトリは作らない。GitHub はシンボリックリンクの先を出さず、コピーは同じ中身を 2 か所で持つことになり、md の中の相対リンクも壊れるため","- HTML にも、インデックスと同じ並びの Index のページを作る。リンクは、md や JPG ではなく、HTML のページに向ける。YAML の Slot は、`generate.image` によらず、すべて並べる。Free ファイル、ADR、PDR は、それぞれの一覧のページへリンクする"]},{"path":"docv/slot/service/manual.md","href":"サービス/利用マニュアル.html","tags":[],"lines":["---","mission: 利用者の使い方（CLI のコマンド、GUI の操作など）","---","","# 利用マニュアル","","## コマンド一覧","","| コマンド                                                   | 説明                                    | 実行ディレクトリ |","| ---------------------------------------------------------- | --------------------------------------- | ---------------- |","| [`docv init`](#docv-init)                                  | `docv.yaml` を作る                      | 任意             |","| [`docv desc`](#docv-desc)                                  | docv の概要を出す                       | 任意             |","| [`docv update-guide --from \u003cversion>`](#docv-update-guide) | docv を更新したときの変更点と対応を出す | 任意             |","| [`docv check [path...]`](#docv-check)                      | 管理対象のチェックを行う                | docv ルート      |","| [`docv fix [path...]`](#docv-fix)                          | 管理対象のフォーマットとリントを行う    | docv ルート      |","| [`docv build`](#docv-build)                                | 人間向けの HTML を作る                  | docv ルート      |","| [`docv open`](#docv-open)                                  | 作った HTML をブラウザで開く            | docv ルート      |","| [`docv slot list`](#docv-slot-list)                        | Slot の一覧を出す                       | 任意             |","| [`docv slot schema \u003cslot>`](#docv-slot-schema)             | YAML の Slot のスキーマを出す           | 任意             |","| [`docv slot gen \u003cslot>`](#docv-slot-gen)                   | Slot ファイルを、決まったパスに作る     | docv ルート      |","","docv ルート: `docv.yaml` のあるディレクトリ。","","## コマンド詳細","","### docv init","","`docv.yaml` を作る。","","| オプション | 意味                                   |","| ---------- | -------------------------------------- |","| `--print`  | `docv.yaml` を作らずに、書く中身を出す |","| `--force`  | `docv.yaml` がすでにあっても書き直す   |","","### docv desc","","docv の概要を表示する。","","AI Agent にはこれを入力にして進めさせる。","","### docv update-guide","","docv を更新したときに、版ごとの変更点と対応を表示する。","","| オプション         | 意味                                                                                   |","| ------------------ | -------------------------------------------------------------------------------------- |","| `--from \u003cversion>` | 更新する前に使っていた docv の版。`docv.yaml` の `docv_version` を渡す。省略はできない |","","- `--from` の版より後の版から、今の docv の版までを、古い版から順に出す。対応のない版も出す","- 変更 1 つを 1 行にし、何が変わったかと、それへの対応を書く。対応は、要るもの、選ぶもの、要らないものがある","- どの行も 100 文字以内にする。横に長いと読みにくいため","- 最後に、`docv_version` と、`docv.yaml` と YAML の Slot の 1 行目にあるスキーマの URL の版を上げるよう案内する","- `--from` には `1.4.0` の形のほか、`v1.4.0` の形も書ける。最初の版（1.0.0）より前か、今の docv の版より新しければ、終了コード 2 で終わる","- docv を更新した後は、`docv check` が `docv_version` の違いを指摘し、`--from` に渡す版を案内する（[設定ファイル](service/config.md) の「docv の版」の章）","","```sh","docv update-guide --from 1.4.0","```","","docv 1.5.0 で実行したときの出力は次のとおり（変更の一部を省いた）。","","```","1.5.0 変更点","- 開発コマンドとインフラと環境のページ分けを追加: 長いなら、docv desc の「ページ分け」に従って分けられる。開発コマンドのページには order と title を書く","- インストールと環境構築の手順を、h3 の見出しで出すように変更: 対応は要らない","","対応が終わったら、docv.yaml の docv_version を 1.5.0 にする","docv.yaml と YAML の Slot の 1 行目にあるスキーマの URL の版も、v1.5.0 にする","最後に docv check で、残りがないかを確かめる","```","","### docv check","","ドキュメントファイルを検査する。","","| オプション      | 意味                                                                         |","| --------------- | ---------------------------------------------------------------------------- |","| `--no-textlint` | textlint だけを飛ばす ( 設定で textlint を有効化している場合のみ意味がある ) |","","```sh","docv check","docv check docv/free/spec/order.md","```","","対象ファイルと主な検査内容は次のとおり。","","| 検査内容                                  | Slot ( md ) | Slot ( yaml )          | Free ( md ) | ADR / PDR ( md ) |","| ----------------------------------------- | ----------- | ---------------------- | ----------- | ---------------- |","| YAML front matter およびタグ              | ✅          |                        | ✅          | ✅               |","| ドキュメントのリンク切れ                  | ✅          | ✅ ( markdown 部のみ ) | ✅          | ✅               |","| 見出しの数と章番号                        | ✅          |                        | ✅          | ✅               |","| Slot ファイルの名前とスキーマ             | ✅          | ✅                     |             |                  |","| 太字、斜体、ドルマークの利用 ( 設定次第 ) | ✅          | ✅ ( markdown 部のみ ) | ✅          | ✅               |","| format ( 設定次第 )                       | ✅          | ✅ ( markdown 部のみ ) | ✅          | ✅               |","| textlint ( 設定次第 )                     | ✅          | ✅ ( markdown 部のみ ) | ✅          | ✅               |","","Slot ( md ) の YAML front matter は、`mission` が `docv slot list` のミッションと同じかを検査する。ページに分けた Slot は、`order` とページの名前（md は h1、YAML は `title`）があるかと、同じ Slot のページどうしの重なりも検査する。","","Slot ( yaml ) の markdown 部は、名前が `_markdown` で終わる項目。値は `|` のブロックで書く。`|` で書いていない項目と、それ以外の項目を複数行で書いたものは、スキーマの検査で error にする。","","あわせて、`docv.yaml` の `docv_version` を docv の版と比べる。`docv.yaml` と YAML の Slot の 1 行目にあるスキーマの URL の版も、`docv_version` と比べる（[設定ファイル](service/config.md) の「docv の版」の章）。","","パスを渡しても、検査するファイルが絞られるだけで、検査内容は変わらない。","","現在の設定は [現在の設定](../../../docv.yaml) を参照。","","### docv fix","","ドキュメントファイルの自動修正できるところを変更する。","","修正内容は次のとおり。","","- format ( 設定次第 )","- textlint が自動修正できる箇所 ( 設定次第 )","","### docv build","","人間向けの HTML を生成する。","","- 出力先は `docv.yaml` の `dir.output` の下の `html/`","- `docv.yaml` で `generate.image` を true にすると、YAML の Slot のページを JPG にして `dir.output` の下の `image/` に出す","  - 要 Google Chrome または Chromium","  - JPG はマシンのフォントで変わる。チームで共有するなら、GitHub Actions などの決まった環境で作る","- `document_root` の直下に、Slot ファイルへのリンクを並べたインデックス（`README.md`）を毎回書く","  - ルートの README からリンクすると、GitHub でリポジトリを開いた人が、clone しなくても Slot ファイルを読める","  - YAML の Slot は JPG へリンクするので、`generate.image` を true にし、JPG を git で管理する","","| オプション   | 意味                                                                        |","| ------------ | --------------------------------------------------------------------------- |","| `--no-image` | `generate.image` が true でも JPG を作らない。HTML とインデックスだけを作る |","","### docv open","","`docv build` が `dir.output` の下の `html/` に作った Slot のページ（`index.html`）を、既定のブラウザで開く。","","- macOS は `open`、Windows は `explorer` で開く","- ほかの OS には対応しない。対応していないと表示し、終了コード 1 で終わる","- まだ `docv build` していなければ、何も開かずにエラーで終わる","","### docv slot list","","Slot の名前、作るファイル、ミッションの一覧を表示する。","","### docv slot gen","","Slot ファイルを、決まったパスに作る。","","YAML の Slot には、1 行目にスキーマの URL を書く。yaml-language-server に対応したエディタ（VS Code の YAML の拡張など）で、項目の補完と検証が効く。","","md の Slot には、YAML front matter の `mission` にミッションを書く。","","| オプション | 意味                                    |","| ---------- | --------------------------------------- |","| `--print`  | Slot ファイルを作らずに、書く中身を出す |","| `--force`  | Slot ファイルがすでにあっても書き直す   |","","```sh","docv slot gen manual               # docv/slot/service/manual.md を作る","docv slot gen doc-guide            # docv/slot/guide/doc-guide.md に、ガイドラインの雛形を作る","docv slot gen doc-guide --print    # 運用中のファイルと雛形を見比べる","```","","Slot をページに分けるときは、`docv/slot/service/service/` などのページのディレクトリの下にページを手で置く（[ページ分け](service/desc.md#ページ分け)）。ページがあるときは、`docv slot gen service` などは、1 つのファイルを作らずにエラーで終わる。","","### docv slot schema","","YAML の Slot のスキーマ（JSON Schema）を表示する。","","```sh","docv slot schema words # 用語集のスキーマを表示","```","","## スキーマ一覧","","- [`docv.yaml`](../../free/schema/config.md)","- [インストール](../../free/schema/install.md)","- [用語集](../../free/schema/words.md)","- [技術スタック](../../free/schema/stack.md)","- [環境構築](../../free/schema/setup.md)","- [環境変数](../../free/schema/env.md)","- [開発コマンド](../../free/schema/develop.md)","- [費用](../../free/schema/cost.md)"]},{"path":"docv/slot/service/install.yaml","href":"サービス/インストール.html","tags":[],"lines":["# yaml-language-server: $schema=../../../assets/schema/install.schema.json","requirements:","  - name: Node.js","    purpose_markdown: |","      textlint を使うときだけ要る。`docv check --no-textlint` なら要らない","    url: https://nodejs.org/","  - name: Google Chrome","    purpose_markdown: |","      JPG を作るときだけ要る","steps:","  - id: cargo","    name: GitHub のソースから入れる（Rust が必要）","    items:","      body_markdown: |","        ```sh","        cargo install --git https://github.com/suzuki-hoge/docv","        ```","  - id: local","    name: 手元のソースから入れる（Rust が必要）","    items:","      body_markdown: |","        クローンしたリポジトリや、手を入れている作業中のソースから入れる。リポジトリのルートで実行する。","","        ```sh","        make install","        ```","","        `~/.cargo/bin/docv` に入る。ソースを変えたら、もう一度実行すると入れ直せる。"]},{"path":"docv/slot/service/words.yaml","href":"サービス/用語集.html","tags":[],"lines":["# yaml-language-server: $schema=../../../assets/schema/words.schema.json","groups:","  - name: ファイルの種類","    items:","      - en: Slot","        desc_markdown: |","          どのプロジェクトにも要るドキュメントを書くファイル（Slot ファイル）。docv がミッションと形を決める。`docv.yaml` の `dir.document_root` の下の `slot/`（既定は `docv/slot/`）に、`\u003cまとまり>/\u003cID>.\u003c拡張子>` の名前で置く。21 の Slot がある","      - en: Free","        desc_markdown: |","          プロジェクトがミッションと形を決める Markdown のファイル（Free ファイル）。AI Agent が読み書きし、詳細を記録する。`dir.document_root` の下の `free/`（既定は `docv/free/`）に置く","      - en: ADR","        desc_markdown: |","          Architecture Decision Record。技術の決定 1 つを、背景、選ばなかった案と一緒に残す記録。`docv/adr/` に 1 つの Markdown で置き、決めた後は書き換えない","      - en: PDR","        desc_markdown: |","          Product Decision Record。プロダクトやサービスの仕様の変更 1 つを、その理由、見直す条件と一緒に残す記録。`docv/pdr/` に 1 つの Markdown で置き、決めた後は書き換えない","  - name: 決まりの種類","    items:","      - ja: ルール","        en: Rule","        desc_markdown: |","          docv の仕組みが決める決まり。Slot と `docv.yaml` のスキーマ、YAML front matter の key、check が確かめることなど。利用側は変えられず、`docv desc` と `docv slot schema` で見る","      - ja: ガイドライン","        en: Guideline","        desc_markdown: |","          利用側がドキュメントを書くときの方針。調整の余地があり、利用側が自由に直す。Slot の Doc ガイドに書き、`docv slot gen doc-guide` で雛形を作る","      - ja: 設定","        en: Config","        desc_markdown: |","          `docv.yaml` で切り替えること。check のルールや textlint を使うか、出力を git で管理するかなど。`docv init --print` で見る","  - name: ファイルの分類","    items:","      - ja: 管理対象","        desc_markdown: |","          `dir.document_root` の下の `free/` にある Markdown。YAML front matter に `mission` が要り、check の対象になる","      - ja: 管理外","        desc_markdown: |","          `dir.document_root` と `dir.output` の外にある Markdown。docv は中身を見ない","  - name: 書き方","    items:","      - ja: ミッション","        en: Mission","        desc_markdown: |","          そのファイルを読むと何が分かるか。Slot のミッションは docv が決め、Free ファイルのミッションは YAML front matter の `mission` に 1 文で書く。中身は、ミッションに収まることだけにする","      - ja: タグ","        en: Tags","        desc_markdown: |","          Free ファイルに付ける分類。1 つのファイルに任意の数を付けられ、タグにルールを付けられる"]},{"path":"docv/slot/system/system-overview.md","href":"システム/システム概要.html","tags":[],"lines":["---","mission: 開発者に向けた、システムを作る部品と、そのつながりの全体像","---","","# システム概要","","docv は、利用者のリポジトリの中で動く単一の CLI で、サーバーを持たない。リポジトリのドキュメントを読み、検査と整形をし、人間が見る HTML を作る。外の道具は、使うと決めたときだけ呼ぶ。","","![部品とつながり](system-overview_parts.svg)","","| 部品                     | 役割                                                                                                                                                                                                                                                                     |","| ------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |","| docv（CLI）              | ドキュメントを検査し、整形し、HTML を作る。決まり、雛形、HTML の部品を埋め込み、1 つのバイナリにする                                                                                                                                                                     |","| リポジトリのドキュメント | `docv.yaml`、Slot ファイル、Free ファイル、ADR、PDR。AI Agent と人間が書き、docv が読む。fix は書き直す                                                                                                                                                                  |","| textlint                 | 日本語の文章を検査する。`docv.yaml` で使うと決めたときだけ、check と fix が npx で呼ぶ                                                                                                                                                                                   |","| Chrome                   | HTML のページを JPG にする。`docv.yaml` の `generate.image` が true のときだけ、build が動かす                                                                                                                                                                           |","| HTML、JPG                | build の出力。人間が全体像を掴むために見る。HTML はローカルで開き、検索したりリンクを辿れる。JPG は git で管理すれば GitHub で見られ、clone しなくても概要を把握できる。GitHub で Slot ファイルと JPG を辿る入り口のインデックス（`document_root` の `README.md`）も書く |","| GitHub                   | ソースを置き、スキーマを版のタグごとに公開する。利用者は、ソースから cargo で docv を入れる。YAML の Slot と `docv.yaml` の 1 行目が、スキーマを指す                                                                                                                     |","","部品ごとの振る舞いと、部品をまたいで守る決まりは、[システム仕様](system.md)。使っている言語とライブラリは、[技術スタック](stack.yaml)。"]},{"path":"docv/slot/system/system.md","href":"システム/システム仕様.html","tags":[],"lines":["---","mission: 部品ごとの振る舞いと、部品の間の流れと、部品をまたいで守る決まり","---","","# システム仕様","","部品の全体像は、[システム概要](system-overview.md)。コマンドから見た振る舞いは、サービス仕様に書く。読み書きするファイルと終了コードは [コマンド](../service/service/cli.md)、HTML と JPG は [ビジュアライズ](../service/service/html.md) のページ。","","## 処理の流れ","","1. `docv.yaml` を読み、スキーマで確かめる。init、desc、update-guide、slot list、slot schema と、`--print` を付けた slot gen は、`docv.yaml` を読まない","2. ルート以下のファイルを分類し、Slot、ADR、PDR、Free ファイルを読む","3. コマンドに応じて、次の部品を使う","","| コマンド | 使う部品                                                                                                                                                            |","| -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| check    | 埋め込んだスキーマと決まりで確かめる。`lint.textlint` が enable なら、npx で textlint を呼ぶ                                                                        |","| fix      | `lint.textlint` が enable なら、textlint に自動修正させる。続けて、埋め込んだ整形の道具で整形し、書き戻す                                                           |","| build    | HTML を `dir.output` の下の `html/` に書き、インデックスを `document_root` の `README.md` に書く。そのあと、`generate.image` が true なら、Chrome に JPG を撮らせる |","","## バイナリに埋め込むもの","","Rust で書いた単一のバイナリにし、次のものを埋め込む。","","- Slot のテンプレ（`assets/template/`。YAML の Slot の項目のサンプルと、ドキュメントのガイドラインの雛形）","- YAML の Slot と `docv.yaml` のスキーマ（`assets/schema/`）","- docv の概要（`docv desc` が出す `assets/desc.md`）。サービス仕様の 1 ページ目（`docv/slot/service/service/desc.md`）は、このファイルへのシンボリックリンク","- 版ごとの変更点と対応（`docv update-guide` が出す `assets/update-guide.yaml`）。手元の docv の版と、出す内容を一致させるため","- HTML の CSS（`assets/docv.css`）と JS（`assets/docv.js`）。build が、出力先の直下にそのまま書く","- Markdown の整形に使う dprint-plugin-markdown","- コードブロックの色付けに使う syntect と、その構文の定義とテーマ","","textlint を使うときだけ Node.js が、JPG を作るときだけ Chrome が要る。どちらもバイナリには入れない。","","## スキーマの公開","","`docv.yaml` と YAML の Slot の JSON Schema（`assets/schema/`）は、埋め込むほかにリポジトリでも公開する。`docv init` と `docv slot gen` は、ファイルの 1 行目に、版のタグを含む URL を書いて参照させる。新しい版の docv が書く URL は、その版のタグを push するまで開けない。","","## textlint とのやりとり","","check と fix は、`lint.textlint` が enable のときだけ textlint を動かす。textlint と 2 つのプリセット（ja-technical-writing、ja-spacing）は、npx で取ってくる。それぞれの版は、docv の版ごとに決める。","","- 設定ファイルは docv が作り、OS のキャッシュのディレクトリに書く。プリセットの既定に頼らず、使わないルールも含めて、すべての値を書く","- YAML の Slot の Markdown の項目は、OS のキャッシュのディレクトリに一時的なファイルとして書いて渡し、使い終わったら消す","- リポジトリには、ファイルを作らない","- 終了コード 1 は指摘として読み、それより大きい終了コードは失敗として扱う","","## Chrome とのやりとり","","build は、ローカルの Chrome をヘッドレスで起動し、DevTools Protocol で出力先の HTML を開いて撮る。印刷の表示にし、ページの高さに画面を合わせて、Slot のページを 1 枚ずつ撮る。","","Chrome が見つからないときや、DevTools に接続できないときは、error で終わる。HTML は、それまでに書き終えている。"]},{"path":"docv/slot/system/stack.yaml","href":"システム/技術スタック.html","tags":[],"lines":["# yaml-language-server: $schema=../../../assets/schema/stack.schema.json","stack:","  - group: 言語","    items:","      - name: Rust","        version: 2024 edition","        purpose_markdown: |","          CLI 本体。単一のバイナリにする","        url: https://www.rust-lang.org/","  - group: 埋め込むもの","    items:","      - name: dprint-plugin-markdown","        version: 0.26.0","        purpose_markdown: |","          Markdown の整形（docv fix）。Rust のライブラリとしてバイナリに埋め込む。Prettier と違って Node.js がいらず、docv の版で整形の結果が固定される","      - name: syntect","        version: 5.3.0","        purpose_markdown: |","          HTML のコードブロックの色付け（docv build）。構文の定義とテーマごとバイナリに埋め込む","  - group: 実行時に使うもの","    items:","      - name: Node.js（npx）","        purpose_markdown: |","          textlint を使うときだけ要る","      - name: textlint","        version: 15.8.0","        purpose_markdown: |","          日本語の文章の検査。docv の版ごとに版を固定し、npx で取ってくる","      - name: Google Chrome","        purpose_markdown: |","          JPG を作るときだけ要る","  - group: 配布","    items:","      - name: GitHub","        purpose_markdown: |","          ソースと、版のタグごとのスキーマを置く。利用者は `cargo install --git` でソースから入れる"]},{"path":"docv/slot/guide/setup.yaml","href":"開発者向けガイド/環境構築.html","tags":[],"lines":["# yaml-language-server: $schema=../../../assets/schema/setup.schema.json","requirements:","  - name: Rust","    version: stable（2024 edition が使えるもの）","    purpose_markdown: |","      ビルドとテスト","    url: https://rustup.rs/","  - name: Node.js","    purpose_markdown: |","      make fix で textlint をかける","  - name: Google Chrome","    purpose_markdown: |","      make fix で JPG を作る","steps:","  - id: install","    name: ビルドして手元に入れる","    items:","      body_markdown: |","        ```sh","        make install","        ```","","        このリポジトリのドキュメントは docv 自身で管理している。コードかドキュメントを変えたら、開発コマンドの `make fix` で確かめる。"]},{"path":"docv/slot/guide/develop.yaml","href":"開発者向けガイド/開発コマンド.html","tags":[],"lines":["# yaml-language-server: $schema=../../../assets/schema/develop.schema.json","steps:","  - id: fix","    name: 変えたら整えて確かめる","    items:","      body_markdown: |","        コードかドキュメントを変えたら、コミットの前に実行する。指摘が 1 件でもあれば止まる。","","        ```sh","        make fix","        ```","","        - コードを `cargo fmt` で整え、`cargo clippy` と `cargo test` を通す","        - `make check-doc-guide` で docv を install し、Doc ガイドの雛形を整えて確かめる。以降は、install した docv で実行する","        - このリポジトリのドキュメントを `docv fix` で整え、`docv check` を通す","        - `docv build` で、HTML を `output/docv/html/` に、JPG を `output/docv/image/` に、インデックスを `docv/README.md` に作り直す。どれもコミットする。GitHub で `docv/README.md` から JPG を辿れるようにし、clone してすぐ `docv open` で HTML を見られるようにするため","","        textlint を使うので Node.js が、JPG を作るので Chrome が要る。","  - id: check-doc-guide","    name: Doc ガイドの雛形を整えて確かめる","    items:","      body_markdown: |","        docv を install してから、雛形（`assets/template/doc-guide.md`）を一時ディレクトリに書き出して `docv fix` する。雛形は管理対象の外にあるため。変わったら雛形に書き戻して install し直し、`docv check` を通す。`make fix` も、途中でこれを実行する。","","        ```sh","        make check-doc-guide","        ```","  - id: install","    name: 手元の docv を新しくする","    items:","      body_markdown: |","        ```sh","        make install","        ```","  - id: install-tag","    name: 任意の版の docv を入れる","    items:","      body_markdown: |","        版のタグを指定して、GitHub のソースから入れる。前の版の動きを確かめるときに使う。","","        ```sh","        cargo install --git https://github.com/suzuki-hoge/docv --tag v1.7.0","        ```","","        `make install` で入れた docv は置き換わる。手元のソースに戻すときは、もう一度 `make install` を実行する。"]},{"path":"docv/slot/guide/env.yaml","href":"開発者向けガイド/環境変数.html","tags":[],"lines":["# yaml-language-server: $schema=../../../assets/schema/env.schema.json","envs:","  - key: DOCV_CHROME","    desc_markdown: |","      JPG を撮るときに使う Chrome の実行ファイルのパス。なければ、OS ごとの標準のインストール先と PATH から探す","    secret: false","    local_from_markdown: |","      シェルの環境変数","    release_from_markdown: |","      使わない（リリースのビルドでは JPG を撮らない）"]},{"path":"docv/slot/guide/doc-guide.md","href":"開発者向けガイド/Docガイド.html","tags":[],"lines":["---","mission: このプロジェクトのドキュメントの置き場所と書き方","---","","# Doc ガイド","","このプロジェクトのドキュメントを書く・直すときの方針。人間と AI Agent の両方が従う。","","本ファイルは `docv slot gen doc-guide` が作った雛形で、プロジェクトに合わせて調整し利用する。","","`docv desc` で定義されるルール、設定、ガイドラインのうち、このページはガイドラインについての指示ファイルである。","","## どこに何を書くか","","| 書く内容                                                          | 書く場所                                                                                                            |","| ----------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------- |","| およそ普遍的に必要と思われること\u003cbr>Slot のミッションに当たること | Slot ファイル                                                                                                       |","| それ以外のプロジェクト固有の詳細情報                              | Free ファイル\u003cbr>`mission` 属性で AI Agent が一貫した用途で加筆できる目印にする                                     |","| 技術の意思決定や経緯、背景、取らなかった選択など                  | ADR（Architecture Decision Record）                                                                                 |","| プロダクトやサービスの仕様の変更と、その理由や経緯                | PDR（Product Decision Record）                                                                                      |","| タスクごとの詳細調査や議論                                        | GitHub Issue                                                                                                        |","| 作業予定                                                          | `docv/free/plan/`\u003cbr>解決して消すことが前提\u003cbr>いかなるファイルからもここの具体ファイルにリンク・言及してはならない |","| まとまっていない意思決定やメモ                                    | `docv/free/tmp/`\u003cbr>解決して消すことが前提\u003cbr>いかなるファイルからもここの具体ファイルにリンク・言及してはならない  |","","## 言葉の使い分け","","docv の文脈においては、あいまいな「仕様」という言葉を避け次のように定義している。どのファイルになにを書くべきかの拠り所にすること。","","| 言葉           | 指すもの                                                                                                                                                                 | 書く場所                                                                                                                                                       |","| -------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | -------------------------------------------------------------------------------------------------------------------------------------------------------------- |","| サービス説明   | docv をなにも知らない利用者へ伝える最初の説明                                                                                                                            | サービス概要                                                                                                                                                   |","| サービス仕様   | 外から見た機能、振る舞い、決まり。実装をそっくり差し替えても変わらないこと\u003cbr>利用者、AI Agent、開発者が読む                                                             | 要点はサービス仕様の 1 ページ目（`docv desc`）\u003cbr>詳しいことは 2 ページ目以降                                                                                  |","| システム構成   | 部品（CLI、リポジトリのドキュメント、textlint、Chrome、出力など）の構成と役割、部品の間の流れ、どの処理をどの部品で行うか\u003cbr>開発者が判断を下すときに読む                | 全体像はシステム概要。SVG で描く\u003cbr>部品ごとの詳しいことはシステム仕様                                                                                         |","| アーキテクチャ | システム全体で採る方式と決まり（部品の分け方、通信の方式、非同期処理の実現方法など）\u003cbr>部品を足したり、つなぎ方を変えたりするときに読む                                 | アーキテクチャ\u003cbr>その方式を選んだ理由は ADR                                                                                                                   |","| サービスエラー | 利用者が書いたドキュメントや渡した引数が原因で起きるエラー\u003cbr>例: check の指摘、`docv.yaml` の誤り、終了コード                                                           | サービス仕様の 2 ページ目以降                                                                                                                                  |","| システムエラー | 環境や外の道具が原因で起きるエラーと、その扱い\u003cbr>例: Chrome が見つからない、Chrome とのやりとりが途切れる                                                               | システム仕様                                                                                                                                                   |","| 実装の決まり   | コードを書くときに従う決まり。コードを読んでも、守るべき決まりか、たまたまそうなっているかが分からないこと（フレームワークの使い方、ディレクトリやコーディングの決まり） | 設計・実装                                                                                                                                                     |","| 実装           | 1 つの部品の中の今の作りで、コードを読めば分かること（関数やモジュールの分け方、処理の手順）                                                                             | 書かない\u003cbr>原則として必要とするのは AI Agent であり、それにとってはコードから自明であるため                                                                   |","| 設計           | 何かを判断し決めること。ドキュメントの種類ではない                                                                                                                       | 決めたいことは `docv/free/tmp/` や GitHub Issue\u003cbr>決めた結果はミッションに沿うファイル（コードを書くときに従う決まりは設計・実装）\u003cbr>経緯や廃案は ADR か PDR |","","サービス仕様、システム仕様、開発コマンド、アーキテクチャ、設計・実装、テスト方針、インフラと環境は、複数ページに分割できる。明確な分割点は docv では指定しないが、およそ次のような観点でページが肥大化しすぎないよう分割するといい。","","- 読み手の違う情報がページに混在している","- 読むタイミングの違う情報がページに混在している","- 異なるコンポーネントや異なる機能の情報がページに混在している","","サービス仕様の 1 ページ目は、`docv desc` と同じ `desc.md`（`assets/desc.md` へのシンボリックリンク）にする。`docv desc` と一致させるため、このページは 1 ファイルのまま保ち、AI Agent が最初に読む要点だけを書く。詳しいことは 2 ページ目以降に書く。","","### 書き分けの例","","| 種類     | サービス仕様                                    | システム仕様                                         |","| -------- | ----------------------------------------------- | ---------------------------------------------------- |","| 出力     | HTML のページの作りと、毎回同じ出力にする決まり | Chrome を動かして JPG を撮る流れ                     |","| エラー   | check の指摘と終了コード                        | 外の道具が見つからないときや、やりとりが途切れたとき |","| スキーマ | YAML の Slot と `docv.yaml` の項目              | スキーマを埋め込み、版のタグの URL で公開すること    |","| 外の道具 | textlint で確かめる項目と、使うかどうかの設定   | どのコマンドが、どの道具を、いつ呼ぶか               |","","## 望ましいドキュメント","","- 概要と詳細が適切に分類されている","  - 概要は要点がまとまっていて、詳細は `\u003cdetails>` で折りたたみ必要なときのみ視認できるようになっている","- 現在の情報が整理されている","- 用語集の単語に沿って書かれている","- 事実と予定・課題管理を混ぜない","","## 望ましくないドキュメント","","- `mission` の示す内容が一意になっていない / ひとつのファイルに複数の内容を混ぜている","- 過去の情報がすべて羅列されている → 今現在知らなくていいことは随時削除し、必要な経緯は ADR か PDR に移す","- 同じ内容が複数の箇所に書いてある","- 実装が書いてあり、コードを変えるたびに直す必要がある","- Slot のミッションに当たる内容が、Free ファイルに置かれている","- コードの行番号やドキュメントの章番号など、頻繁に変更される情報に依存している","","## ADR と PDR の作成基準","","ADR と PDR は、長く読み返される記録である。今の姿は Slot と Free ファイルに書き、ADR と PDR には、なぜそうなったかを残す。置き場所と章立ては `docv desc` の「ADR」と「PDR」に従う。","","| 記録 | 残すもの                                                 | 目的                                                                                                                                     |","| ---- | -------------------------------------------------------- | ---------------------------------------------------------------------------------------------------------------------------------------- |","| ADR  | 技術の決定                                               | なぜその技術や構成を選んだのかを残し、後から変えるときの判断に使う                                                                       |","| PDR  | プロダクトやサービスの仕様の変更（足す、変える、やめる） | なぜ今の仕様になったのかを、将来も分かるようにする。仕様を変えるときや、見送った案がまた出たときに、当時の理由と前提を確かめられるように |","","### ADR に書くもの","","次のどちらにも当たる技術の決定を書く。","","- 複数の案を比べて選んだ決定で、選んだ理由が今のドキュメントやコードからは読み取れない","- 長く効き、後から変えるのに手間がかかる。たとえば、使う言語、IaC の道具、部品の分け方、API の形、データの持ち方","","### PDR に書くもの","","PDR は、仕様がどう変わってきたかの履歴である。案を比べて選んだ決定に限らない。仕様を足す・変える・やめるとき、その理由が今のドキュメントからは読み取れないなら書く。","","- 料金、プラン、提供する機能の範囲、対象とする利用者、サポートの方針などの変更","- やらないと決めたこと、やめたこと。後から同じ案が出たときに、なぜやらないのかを示せるように","","### 書かないもの","","| 記録 | 書かないこと                                                                         | 代わりに書く場所                                   |","| ---- | ------------------------------------------------------------------------------------ | -------------------------------------------------- |","| ADR  | バグ修正や考慮漏れの手当てなど、今の決定を変えずに直したこと                         | 書かない\u003cbr>理由を残したいときはコミットメッセージ |","| ADR  | 比べた案がなく、理由を残すまでもない決定                                             | 書かない                                           |","| 両方 | 決定に従って選ぶ細部（関数名、環境変数名、ライブラリの細かな使い方、画面の文言など） | 書かない\u003cbr>コードから読める                       |","| 両方 | 移行の計画、進み具合、タスクの一覧、期間を区切った施策など、短い間に状態が変わること | `docv/free/plan/` や GitHub Issue                  |","","### 書き方","","- 1 つの記録には、決定か変更を 1 つだけ書く","- 技術とプロダクトの両方にまたがるときは、仕様の変更を PDR に、それを実現する技術の決定を ADR に分けて書き、「参考」の章で互いにつなぐ","- その記録だけで読めるように書く。会議や口頭でしか確かめていないことを根拠にしない。根拠は、後から確かめられるファイルや資料へのリンクにし、「参考」の章にまとめる","- 決めたことは、実装の自由を奪わない粒度で書く。細かさは「決めたことを守ったまま細部を差し替えたとき、本文を書き換える必要があるか」で確かめる。必要なら、その細部は書かない","- PDR の見直す条件は、当たったかどうかを後から判断できるように書く。「利用者が増えたら」のような、いつ当たったか分からない書き方をしない","- 決めた理由を、Issue や PR の番号に預けない。番号だけでは、記録を読んでも理由が分からない","","## タグ","","Free ファイルにはタグをつけ、ディレクトリを細かく設計せずにタグで分類する。いちばんの目的は、ディレクトリの構造によるドキュメントの管理が破綻しやすいことを避けるため。往々にして複数の属性を持つファイルがあり、ディレクトリで分けると置き場所が定まらない。タグで分類すると、HTML で絞り込んで閲覧しやすくもなる。","","| タグ     | 書くこと                                                                 |","| -------- | ------------------------------------------------------------------------ |","| スキーマ | `docv.yaml` と YAML の Slot の JSON Schema の写し（`docv/free/schema/`） |","","## AI Agent への指示","","- セッション開始時に `docv desc` を実行し、本ファイルの指示に従いドキュメント管理をすること","- Slot ファイルのスキーマは `docv slot` 系コマンドで確認すること","- ドキュメント変更時は `docv fix` を通すこと","- ドキュメントを書き足すときは、増えた情報を適切な量で反映すること","- 実装は、指示がない限り書かないこと","- Free ファイルを足す前に、その mission がどれかの Slot のミッションに当たらないかを確かめること。当たるなら、その Slot に書き、長くなるならページに分けること","- Free ファイルに spec/ や architecture/ のような、Slot の代わりになるディレクトリができそうになったら、Slot のページ（タブ）の分け方を見直すこと","- 既存の文書を
